[profile.default]
# Print a slow warning after period, terminate unit-test after 4x period.
slow-timeout = { period = "5s", terminate-after = 4 }
status-level = "leak"

[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# The default is to use the amount of cores on the host,
# which is not a good fit for mobile ohos devices.
# `test-threads` can't be overridden per platform, so a test group limits concurrency instead.
[test-groups]
ohos-device = { max-threads = 4 }

[[profile.default.overrides]]
platform = 'cfg(target_env = "ohos")'
test-group = 'ohos-device'
# Exclude tests which fail due to relying on files being present at a specific path.
# This should be shrunk over-time, by fixing the tests, e.g. by prefering include_bytes.
default-filter = '''
not (
    (package(servo-fonts) & (
        binary(=font) |
        binary(=font_context) |
        binary(=font_template)
    )) |
    (package(servo-net-traits) & binary(=mime_classifier)
    ) |
    (package(servo-net) & (
        test(=fetch::test_file) |
        test(=file_loader::load_htm) |
        test(=filemanager_thread::test_filemanager)
    )) |
    (package(servo-url) & test(=test_file_urls_are_potentially_trustworthy))
)
'''
