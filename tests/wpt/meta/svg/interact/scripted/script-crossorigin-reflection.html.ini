[script-crossorigin-reflection.html]
  [missing crossorigin reflects as null]
    expected: FAIL

  [crossorigin="" reflects as "anonymous"]
    expected: FAIL

  [crossorigin="anonymous" reflects as "anonymous"]
    expected: FAIL

  [crossorigin="use-credentials" reflects as "use-credentials"]
    expected: FAIL

  [crossorigin="USE-CREDENTIALS" reflects as "use-credentials"]
    expected: FAIL

  [crossorigin="invalid" reflects as "anonymous"]
    expected: FAIL

  [setting crossOrigin sets the content attribute]
    expected: FAIL

  [setting crossOrigin to null removes the content attribute]
    expected: FAIL
