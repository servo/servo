[agent-cluster.tentative.https.html]
  expected: TIMEOUT
  [A document without a policy and a same-origin frame with one cannot access each other]
    expected: FAIL

  [A document with a policy cannot access a same-origin frame without one]
    expected: FAIL

  [An about:blank frame created by a document with a policy inherits it and can be accessed]
    expected: FAIL

  [Navigating the initial about:blank document of a popup to a same-origin document with a policy does not reuse its Window]
    expected: FAIL

  [A document without a policy and a same-origin popup with one cannot access each other]
    expected: FAIL

  [A document with a policy is in an origin-keyed agent cluster]
    expected: FAIL

  [A document without a policy cannot run a javascript: URL in a same-origin frame with one]
    expected: FAIL

  [A navigate event in a same-origin frame without a policy does not expose a link of a document with one as its sourceElement]
    expected: TIMEOUT

  [A navigate event in a same-origin frame without a policy exposes a link of a document without one as its sourceElement]
    expected: NOTRUN

  [A fragment navigation during a reload of a same-origin frame with a policy does not move the reloaded document into another agent cluster]
    expected: NOTRUN

  [Posting a WebAssembly.Module to a same-origin frame without a policy succeeds]
    expected: NOTRUN

  [Posting a WebAssembly.Module to a same-origin frame with a policy fails]
    expected: NOTRUN

  [A frame with a policy that is same origin with a cross-origin isolated top-level document is in its agent cluster]
    expected: NOTRUN

  [A frame with a policy that is cross origin with a cross-origin isolated top-level document is not in the agent cluster of same-origin documents without one]
    expected: NOTRUN
