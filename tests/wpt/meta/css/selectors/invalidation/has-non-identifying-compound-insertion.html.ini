[has-non-identifying-compound-insertion.html]
  [insert and remove a div matched by the type-only compound in :has(div + .a)]
    expected: FAIL

  [insert and remove a div matched by the type-only compound in :has(div ~ .a)]
    expected: FAIL

  [insert and remove a div matched by the :not() compound in :has(:not(.x) + .a)]
    expected: FAIL

  [insert and remove a div matched by the type-only compound in :has(> div + .a)]
    expected: FAIL

  [insert and remove a div matched by the type-only compound in :has(div + .a + .b)]
