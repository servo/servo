[aspect-ratio-calc-negative.html]
  [@container (aspect-ratio > calc(1))]
    expected: FAIL

  [@container (min-aspect-ratio: calc(-1)/2)]
    expected: FAIL

  [@container not (max-aspect-ratio: calc(-1)/2)]
    expected: FAIL

  [@container (aspect-ratio > calc(-1))]
    expected: FAIL

  [@container not (aspect-ratio < calc(-1))]
    expected: FAIL
