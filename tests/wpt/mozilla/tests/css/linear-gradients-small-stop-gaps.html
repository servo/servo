<!DOCTYPE html>

<head>

<!-- Tests that linear gradient with small color stop gaps work. -->
<style>
section {
    display: block;

    border: solid black 1px;

    display: block;

    background-color: black;
}
#d {
    display: block;
    margin: 0%;
    width: 100%;
    height: 4px;
    background-color: white;
}
#e {
    display: block;
    margin: 0%;
    width: 100%;
    height: 2px;
    background-color: black;
}

</head>
<body>
<section>
    <div id=a></div>
    <div id=b></div>
    <div id=c></div>
