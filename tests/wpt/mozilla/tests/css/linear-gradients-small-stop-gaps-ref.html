section {
    display: block;
    width: 100px;

    background-image: linear-gradient(

        white 1px, white 3px,
        black 3px, black 6px,
        white 6px, white 10px,
        black 10px, black 12px,
        white 12px, white 15px
    );
}
</style>
</head>
