<!doctype html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<section>
  <header id="header">
    <div id="div">
      <h1 id="h1">This is an h1</h1>
      <p id="p">This is a paragraph</p>
    </div>
  </header>
  <article id="article"><h2 id="h2">This is an h2</h2></article>
</section>

<script>
  setup({ explicit_done: true });
  window.onload = () => {
    test((t) => {
      ServoTestUtils.ensureAccessibilityActive();
      let initial = ServoTestUtils.forceAccessibilityUpdate();

      assert_equals(initial.nodesUpdatedFromDom, 24, "nodesUpdatedFromDom");
      assert_equals(initial.nodesUpdatedFromTree, 24, "nodesUpdatedFromTree");
      assert_equals(initial.nodesInTreeUpdate, 24, "nodesInTreeUpdate");

      article.moveBefore(div, h2);
      article.moveBefore(h1, div);
      p.remove();
      header.remove();

      let update = ServoTestUtils.forceAccessibilityUpdate();

      // Updated nodes:
      // - <section> (div1 removed)
      // - div2 (<p> and <h1> removed)
      // - div3 (new children)
      assert_equals(update.nodesUpdatedFromDom, 3, "nodesUpdatedFromDom");

      // <html>, <body>, <section>, <article>, <div>
      assert_equals(update.nodesUpdatedFromTree, 5, "nodesUpdatedFromTree");

      // Changed nodes:
      // - <section>, children changed
      // - <article>, children changed
      // - <div>, children changed
      assert_equals(update.nodesInTreeUpdate, 3, "nodesInTreeUpdate");
    }, "");

    done();
  };
</script>
