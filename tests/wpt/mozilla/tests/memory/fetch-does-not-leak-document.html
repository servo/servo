<!DOCTYPE html>
<title>Document objects for added and removed iframes are collected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/leak-helpers.js"></script>
<body>
    <script>
    promise_test(async () => {
      assert_true(await createAndDestroyIframeWithHTML("<script>window.simple = \"true\"<\/script>"));
    }, "A simple <iframe> creation does not leak the Document");
    promise_test(async () => {
      assert_true(await createAndDestroyIframeWithHTML("<script>fetch(\"data:text/plain,simple\").then(response => response.text());<\/script>"));
    }, "An <iframe> that launches a simple fetch does not leak the Document");
    promise_test(async () => {
      assert_true(await createAndDestroyIframeWithHTML("<script>fetch(\"/fetch/api/resources/infinite-slow-response.py\");<\/script>"));
    }, "An <iframe> with an in-progress fetch does not leak the Document");
    </script>
</body>
