<!DOCTYPE html>
<title>Document objects for added and removed iframes that use XRSystem are collected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/leak-helpers.js"></script>
<body>
    <script>
      const tests = [
          "<script>navigator.xr.ondevicechange = () => {}; window.parent.postMessage('xrReady');<\/script>",
          "<script type=\"module\">await navigator.xr.isSessionSupported(\"inline\"); window.parent.postMessage('xrReady');<\/script>"
      ];

      for (const test of tests) {
          promise_test(async () => {
            assert_true(await createAndDestroyIframeWithHTML(test, "xrReady", 500));
          }, `'${test}' does not leak the document`);
      }
    </script>
</body>
