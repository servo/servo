<!DOCTYPE html>
<title>Document objects for added and removed iframes using modules are collected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/leak-helpers.js"></script>
<body>
    <script>
      let tests = [
        "<script type=\"module\">window.moduleLoaded = \"true\";<\/script>",
        "<script type=\"module\">import \"./resources/set-global-module.js\";<\/script>",
        "<script type=\"module\">import(\"./resources/set-global-module.js\");<\/script>",
        "<script type=\"module\" src=\"resources/set-global-module.js\"><\/script>",
        "<script type=\"module\" src=\"/common/slow.py?delay=60000\"><\/script>",,
        "<script type=\"module\">import \"/common/slow.py?delay=60000\";<\/script>",
        "<script type=\"module\">import(\"/common/slow.py?delay=60000\");<\/script>",
      ];

      for (const test of tests) {
          promise_test(async () => {
            assert_true(await createAndDestroyIframeWithHTML(test));
          }, `'${test}' does not leak the document`);
      }
    </script>
</body>
