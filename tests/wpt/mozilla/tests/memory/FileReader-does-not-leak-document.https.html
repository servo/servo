<!DOCTYPE html>
<title>Document objects for added and removed iframes that use FileReader are collected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/leak-helpers.js"></script>
<body>
    <script>
      const tests = [
          "<script>new FileReader().readAsArrayBuffer(new Blob([\"content\"]));<\/script>",
          "<script>window.reader = new FileReader(); window.reader.readAsArrayBuffer(new Blob([\"content\"]));<\/script>"
      ];

      for (const test of tests) {
          promise_test(async () => {
            assert_true(await createAndDestroyIframeWithHTML(test));
          }, `'${test}' does not leak the document`);
      }
    </script>
</body>
