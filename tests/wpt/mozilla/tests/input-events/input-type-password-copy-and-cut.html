<!DOCTYPE html>
<meta charset="utf-8" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/editing/include/editor-test-utils.js"></script>
<input id="copy" value="X" />
<input id="target" type="password" value="stuff" />
<script>
  promise_test(async () => {
    const copy = document.getElementById("copy");
    copy.focus();
    copy.select();
    let utils = new EditorTestUtils(copy);
    await utils.sendCopyShortcutKey();
    const target = document.getElementById("target");
    target.focus();
    target.select();
    utils = new EditorTestUtils(target);
    await utils.sendCopyShortcutKey();
    await utils.sendArrowRightKey();
    await utils.sendPasteShortcutKey();
    assert_equals(target.value, "stuffX", "Nothing new is copied to clipboard");
    await utils.sendSelectAllShortcutKey();
    await utils.sendCutShortcutKey();
    assert_equals(target.value, "stuffX", "Nothing is cut, so nothing is deleted");
    await utils.sendArrowRightKey();
    await utils.sendPasteShortcutKey();
    assert_equals(target.value, "stuffXX", "Nothing is cut, so nothing new is pasted");
  }, "Copying and cutting does nothing to an input type=password");
</script>
