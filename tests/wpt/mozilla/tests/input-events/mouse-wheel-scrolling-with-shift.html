<!doctype html>
<meta charset="utf-8">
<title>Scroll via the mouse wheel with shift pressed scroll horizontally</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<style>
  #scroller {
    height: 200px;
    overflow: scroll;
    width: 200px;
  }

  #contents {
    height: 600px;
    width: 600px;
  }
</style>

<div id="scroller"><div id="contents"></div></div>

<script>
promise_test(async () => {
  scroller.scrollTo(0, 0);
  await new test_driver.Actions()
    .scroll(50, 50, 0, 100, {origin: scroller})
    .send();
  assert_equals(scroller.scrollLeft, 0);
  assert_greater_than(scroller.scrollTop, 0);
}, "Scrolling via wheel swaps the scrolling axes");

promise_test(async () => {
  scroller.scrollTo(0, 0);
  const shiftKey = "\uE008";
  await new test_driver.Actions()
    .scroll(50, 50, 0, 0, {origin: scroller})
    .keyDown(shiftKey)
    .scroll(50, 50, 0, 100, {origin: scroller})
    .keyUp(shiftKey)
    .send();
  assert_greater_than(scroller.scrollLeft, 0);
  assert_equals(scroller.scrollTop, 0);
}, "Shift + mouse wheel swaps the scrolling axes");
</script>
