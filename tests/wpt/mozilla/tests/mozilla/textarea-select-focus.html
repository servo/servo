<!doctype html>
<meta charset="utf-8">
<title>Calling `select()` on textarea elements should also focus them</title>
<meta ref="help" src="https://github.com/servo/servo/issues/47753">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<textarea>Hello</textarea>

<script>
test(() => {
  const textarea = document.querySelector("textarea");
  assert_not_equals(document.activeElement, textarea);
  textarea.select();
  assert_equals(document.activeElement, textarea);
});
</script>
