<!DOCTYPE html>
<title>Creating a FontFace close to the recursion limit should not crash</title>
<script>
  function recurse(source) {
    try {
      recurse(source);
    } catch (e) {}
    try {
      new FontFace("test", source);
    } catch (e) {}
  }
  // An invalid source and a valid one take different paths in the constructor.
  recurse("x");
  recurse("url(font.ttf)");
</script>
