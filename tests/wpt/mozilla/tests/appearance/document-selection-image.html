<!DOCTYPE html>
<html>
<head>
    <title>Document selection should show images as selected</title>
    <link rel="match" href="document-selection-image-ref.html">
</head>

<style>
  ::selection {
    background: rgb(0, 255, 0);
  }
</style>

<div id="target">
    <!-- This data URL is a fully transparent image. -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="display: block; width: 100px; height: 100px;">
</div>

<script>
    document.getSelection().selectAllChildren(target);
</script>
