<!DOCTYPE html>
<html>
<head>
    <title>Document selection should not show canvas as selected</title>
</head>

<div id="target">
    <canvas id="canvas" width="100" height="100" style="display: block; width: 100px; height: 100px;"></canvas>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(0, 0, 100, 100);
</script>
</html>
