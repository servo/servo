<!DOCTYPE html>
<html>
<head>
    <title>Input Range Elements Could be Shown Properly</title>
</head>
<body>
Display of the input range should match the display generated by the CSS reference for different values.
<style>
/* Minimal stylesheet to mimic the appearence of the input range specific to Servo.
 * This stylesheet is expected to be modified following the development of the
 * Shadow DOM input range in Servo.
 */

#input {
  margin-inline: 8px;
  height: 16px;
  width: 100px;
  display: inline-block;
  position: relative;
  background: none;
  border: none;
}

#slider-track,
#slider-fill,
#slider-thumb {
   /* All slider elements are centered vertically and use the default cursor. */
   top: 50%;
   transform: translateY(-50%);
   position: absolute;
   cursor: default;
}

#slider-track,
#slider-fill {
    border-radius: 5px;
    border-width: 1px;
    border-style: solid;
}

#slider-track {
   width: 100%;
   height: 6px;
   box-sizing: border-box;
   background-color: ButtonFace;
   border-color: ButtonBorder;
}


#slider-fill {
   height: 6px;
   box-sizing: border-box;
   background-color: #007aff;
   border-color: #007aff;
}

#slider-thumb {
  height: 100%;
  width: 16px;
  box-sizing: border-box;
  border-radius: 50%;
  background: #007aff;
  inset-inline-start: calc(var(--progress) * 100%);
  transform: translateX(calc(var(--progress) * -100%)) translateY(-50%);
}

</style>
<div>
    <div id="input">
        <div id="slider-track">
            <div id="slider-fill" style="width: 0%;"></div>
        </div>
        <div id="slider-thumb" style="--progress: 0;"></div>
    </div>
</div>
<div>
    <div id="input">
        <div id="slider-track">
            <div id="slider-fill" style="width: 50%;"></div>
        </div>
        <div id="slider-thumb" style="--progress: 0.5;"></div>
    </div>
</div>
<div>
    <div id="input">
        <div id="slider-track">
            <div id="slider-fill" style="width: 100%;"></div>
        </div>
        <div id="slider-thumb" style="--progress: 1;"></div>
    </div>
</div>
</body>
</html>
