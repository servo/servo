<!DOCTYPE html>
<html>
<head>
    <title>Progress Elements With Determinate Value Could be Shown Properly</title>
</head>
<body>
Display of the determinate progress element should match the display generated by the CSS reference for different values.
<style>
/* Minimal stylesheet to mimic the appearence of the progress specific to Servo.
 * This stylesheet is expected to be modified following the development of the
 * Shadow DOM of <progress> in Servo.
 */

#progress {
  display: inline-block;
  width: 200px;
  height: 6px;
  border-radius: 3px;
  border: 1px solid rgba(0, 0, 0, 0.5);
}

#-moz-progress-bar {
    display: block;
    height: 100%;
    background-color: #7a3;
}

</style>
<div>
    <div id="progress">
        <div id="-moz-progress-bar" style="width: 0%;"></div>
    </div>
</div>
<div>
    <div id="progress">
        <div id="-moz-progress-bar" style="width: 50%;"></div>
    </div>
</div>
<div>
    <div id="progress">
        <div id="-moz-progress-bar" style="width: 100%;"></div>
    </div>
</div>
</body>
</html>
