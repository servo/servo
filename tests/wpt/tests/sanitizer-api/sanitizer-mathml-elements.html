<script>
function test_safe(testcase, index, category) {
  test(_ => {
    const div = document.createElement("div");
    div.setHTML(testcase.data);
    assert_testcase(div, testcase);
  }, `Element.setHTML [${category}] #${index}, "${testcase.data}"`);

  test(_ => {
    const div = document.createElement("div");
    const shadowRoot = div.attachShadow({ mode: "open" });
    shadowRoot.setHTML(testcase.data);
    assert_testcase(shadowRoot, testcase);
  }, `ShadowRoot.setHTML [${category}] #${index}, "${testcase.data}"`);

  test(_ => {
    assert_testcase(
      Document.parseHTML("<body>" + testcase.data).body, testcase);
  }, `Document.parseHTML [${category}] #${index}, "${testcase.data}"`);
}

function test_unsafe(testcase, index, category) {
  test(_ => {
    const div = document.createElement("div");
    div.setHTMLUnsafe(testcase.data);
    assert_testcase(div, testcase);
  }, `Element.setHTMLUnsafe [${category}] #${index}, "${testcase.data}"`);

  test(_ => {
    const div = document.createElement("div");
    const shadowRoot = div.attachShadow({ mode: "open" });
    shadowRoot.setHTMLUnsafe(testcase.data);
    assert_testcase(shadowRoot, testcase);
  }, `ShadowRoot.setHTMLUnsafe [${category}] #${index}, "${testcase.data}"`);

  test(_ => {
    assert_testcase(
      Document.parseHTMLUnsafe("<body>" + testcase.data).body, testcase);
  }, `Document.parseHTMLUnsafe [${category}] #${index}, "${testcase.data}"`);
}

const allCases = parse_html5lib_testcases(document.getElementById("all").textContent);
const safeCases = parse_html5lib_testcases(document.getElementById("safe").textContent);
const unsafeCases = parse_html5lib_testcases(document.getElementById("unsafe").textContent);

allCases.forEach((tc, idx) => {
  test_safe(tc, idx, "all");
  test_unsafe(tc, idx, "all");
});

safeCases.forEach((tc, idx) => {
  test_safe(tc, idx, "safe");
});

unsafeCases.forEach((tc, idx) => {
  test_unsafe(tc, idx, "unsafe");
});
</script>
