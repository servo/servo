<!doctype html>
<html>
  <head>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/trusted-types/support/csp-violations.js"></script>
  </head>
  <body>
    <div id="container"></div>
    <script>
      const container = document.querySelector("#container");

      function createTarget(target_type, t) {
        const target = document.createElement("div");
        container.append(target);
        t.add_cleanup(() => target.remove());
        switch (target_type) {
          case "Element":
            return target;
          case "ShadowRoot":
            return target.attachShadow({ mode: "open" });
        }
      }

      // 1. Tests BEFORE default policy is created:
      promise_test(async (t) => {
        const node = createTarget("Element", t);
        const violation = await trusted_type_violation_without_exception_for(() => {
          node.setHTMLUnsafe("<span id='report-span'></span>");
        });
        assert_equals(violation.effectiveDirective, "require-trusted-types-for");
        assert_equals(violation.disposition, "report");
        assert_not_equals(node.querySelector("#report-span"), null);
      }, "Element.setHTMLUnsafe: without default policy, report-only does not throw and reports violation");

      promise_test(async (t) => {
        const node = createTarget("Element", t);
        const violation = await trusted_type_violation_without_exception_for(() => {
          node.innerHTML = "<span id='report-span'></span>";
        });
        assert_equals(violation.effectiveDirective, "require-trusted-types-for");
        assert_equals(violation.disposition, "report");
        assert_not_equals(node.querySelector("#report-span"), null);
      }, "Element.innerHTML: without default policy, report-only does not throw and reports violation");

      promise_test(async (t) => {
        let doc;
        const violation = await trusted_type_violation_without_exception_for(() => {
          doc = Document.parseHTMLUnsafe("<span id='report-span'></span>");
        });
        assert_equals(violation.effectiveDirective, "require-trusted-types-for");
        assert_equals(violation.disposition, "report");
        assert_not_equals(doc.querySelector("#report-span"), null);
      }, "Document.parseHTMLUnsafe: without default policy, report-only does not throw and reports violation");

      // 2. Now create the default policy and a test policy:
      let createParserOptions = (options, type, sink) => options;
      let createHTML = (html, ...args) => html;

      const testPolicy = trustedTypes.createPolicy("test-policy", {
        createHTML: (html) => html,
        createParserOptions: (options) => options,
      });

      // 3. Tests WITH default policy:
      // When createParserOptions provides a sanitizer, plain strings satisfy Trusted Types and NO violation is reported.
      promise_test(async (t) => {
        trustedTypes.createPolicy("default", {
          createHTML: (html, ...args) => createHTML(html, ...args),
          createParserOptions: (options, ...args) => createParserOptions(options, ...args),
        });
        const node = createTarget("Element", t);
        createParserOptions = (options) => ({
          ...options,
          sanitizer: { removeElements: ["span"] },
        });
        await no_trusted_type_violation_for(() => {
          node.setHTMLUnsafe("<div id='allowed'><span id='forbidden'></span></div>");
        });
        assert_equals(node.querySelector("#forbidden"), null, "Sanitizer must remove forbidden");
        assert_not_equals(node.querySelector("#allowed"), null, "Allowed element must remain");
      }, "Element.setHTMLUnsafe: default policy createParserOptions with sanitizer does not report violation");

      promise_test(async (t) => {
        const node = createTarget("Element", t);
        createParserOptions = (options) => ({
          ...options,
          sanitizer: { removeElements: ["span"] },
        });
        await no_trusted_type_violation_for(() => {
          node.innerHTML = "<div id='allowed'><span id='forbidden'></span></div>";
        });
        assert_equals(node.querySelector("#forbidden"), null);
        assert_not_equals(node.querySelector("#allowed"), null);
      }, "Element.innerHTML: default policy createParserOptions with sanitizer does not report violation");

      promise_test(async (t) => {
        createParserOptions = (options) => ({
          ...options,
          sanitizer: { removeElements: ["span"] },
        });
        let doc;
        await no_trusted_type_violation_for(() => {
          doc = Document.parseHTMLUnsafe("<div id='allowed'><span id='forbidden'></span></div>");
        });
        assert_equals(doc.querySelector("#forbidden"), null);
        assert_not_equals(doc.querySelector("#allowed"), null);
      }, "Document.parseHTMLUnsafe: default policy createParserOptions with sanitizer does not report violation");

      promise_test(async (t) => {
        const node = createTarget("Element", t);
        createParserOptions = (options) => ({});
        await no_trusted_type_violation_for(() => {
          node.setHTMLUnsafe("<div id='allowed'><span id='allowed-child'></span></div>");
        });
        assert_not_equals(node.querySelector("#allowed"), null);
        assert_not_equals(node.querySelector("#allowed-child"), null);
      }, "Element.setHTMLUnsafe: default policy createParserOptions without sanitizer does not report violation");

      promise_test(async (t) => {
        const node = createTarget("Element", t);
        await no_trusted_type_violation_for(() => {
          node.setHTMLUnsafe(
            "<div id='allowed'><span id='allowed-child'></span></div>",
            testPolicy.createParserOptions({}),
          );
        });
        assert_not_equals(node.querySelector("#allowed"), null);
        assert_not_equals(node.querySelector("#allowed-child"), null);
      }, "Element.setHTMLUnsafe: caller-provided TrustedHTMLParserOptions without sanitizer does not report violation");

      // When createParserOptions returns null/undefined:
      // In enforcement mode it would throw TypeError, but in report-only mode it must NOT throw and report a violation.
      for (const value of [null, undefined]) {
        promise_test(async (t) => {
          const node = createTarget("Element", t);
          createParserOptions = () => value;
          createHTML = (html) => html;

          const violation = await trusted_type_violation_without_exception_for(() => {
            node.setHTMLUnsafe("<span id='report-span'></span>");
          });
          assert_equals(violation.effectiveDirective, "require-trusted-types-for");
          assert_equals(violation.disposition, "report");
          assert_not_equals(node.querySelector("#report-span"), null);
        }, `Element.setHTMLUnsafe: default createParserOptions returning ${JSON.stringify(value)} does not throw in report-only mode and reports violation`);

        promise_test(async (t) => {
          const node = createTarget("Element", t);
          createParserOptions = () => value;

          const trustedHTML = testPolicy.createHTML("<span id='report-span'></span>");
          const violation = await trusted_type_violation_without_exception_for(() => {
            node.setHTMLUnsafe(trustedHTML);
          });
          assert_equals(violation.effectiveDirective, "require-trusted-types-for");
          assert_equals(violation.disposition, "report");
          assert_not_equals(node.querySelector("#report-span"), null);
        }, `Element.setHTMLUnsafe: default createParserOptions returning ${JSON.stringify(value)} with TrustedHTML does not throw in report-only mode and reports violation`);

        promise_test(async (t) => {
          const node = createTarget("Element", t);
          createParserOptions = () => value;

          const trustedHTML = testPolicy.createHTML("<span id='report-span'></span>");
          const violation = await trusted_type_violation_without_exception_for(() => {
            node.innerHTML = trustedHTML;
          });
          assert_equals(violation.effectiveDirective, "require-trusted-types-for");
          assert_equals(violation.disposition, "report");
          assert_not_equals(node.querySelector("#report-span"), null);
        }, `Element.innerHTML: default createParserOptions returning ${JSON.stringify(value)} with TrustedHTML does not throw in report-only mode and reports violation`);

        promise_test(async (t) => {
          createParserOptions = () => value;

          const trustedHTML = testPolicy.createHTML("<span id='report-span'></span>");
          let doc;
          const violation = await trusted_type_violation_without_exception_for(() => {
            doc = Document.parseHTMLUnsafe(trustedHTML);
          });
          assert_equals(violation.effectiveDirective, "require-trusted-types-for");
          assert_equals(violation.disposition, "report");
          assert_not_equals(doc.querySelector("#report-span"), null);
        }, `Document.parseHTMLUnsafe: default createParserOptions returning ${JSON.stringify(value)} with TrustedHTML does not throw in report-only mode and reports violation`);

        for (const htmlValue of [null, undefined]) {
          promise_test(async (t) => {
            const node = createTarget("Element", t);
            createParserOptions = () => value;
            createHTML = () => htmlValue;

            const { violations, exception } = await trusted_type_violations_and_exception_for(() => {
              node.setHTMLUnsafe("<span id='report-span'></span>");
            });
            assert_equals(exception, null, "no exception thrown");
            assert_equals(violations.length, 2, "two violations reported (one for createParserOptions, one for createHTML)");
            assert_equals(violations[0].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[0].disposition, "report");
            assert_equals(violations[0].sample, "Element setHTMLUnsafe|");
            assert_equals(violations[1].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[1].disposition, "report");
            assert_equals(violations[1].sample, "Element setHTMLUnsafe|<span id='report-span'></span>");
            assert_not_equals(node.querySelector("#report-span"), null);
          }, `Element.setHTMLUnsafe: default createParserOptions returning ${JSON.stringify(value)} and createHTML returning ${JSON.stringify(htmlValue)} reports two violations in report-only mode`);

          promise_test(async (t) => {
            const node = createTarget("Element", t);
            createParserOptions = () => value;
            createHTML = () => htmlValue;

            const { violations, exception } = await trusted_type_violations_and_exception_for(() => {
              node.innerHTML = "<span id='report-span'></span>";
            });
            assert_equals(exception, null, "no exception thrown");
            assert_equals(violations.length, 2, "two violations reported (one for createParserOptions, one for createHTML)");
            assert_equals(violations[0].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[0].disposition, "report");
            assert_equals(violations[0].sample, "Element innerHTML|");
            assert_equals(violations[1].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[1].disposition, "report");
            assert_equals(violations[1].sample, "Element innerHTML|<span id='report-span'></span>");
            assert_not_equals(node.querySelector("#report-span"), null);
          }, `Element.innerHTML: default createParserOptions returning ${JSON.stringify(value)} and createHTML returning ${JSON.stringify(htmlValue)} reports two violations in report-only mode`);

          promise_test(async (t) => {
            createParserOptions = () => value;
            createHTML = () => htmlValue;

            let doc;
            const { violations, exception } = await trusted_type_violations_and_exception_for(() => {
              doc = Document.parseHTMLUnsafe("<span id='report-span'></span>");
            });
            assert_equals(exception, null, "no exception thrown");
            assert_equals(violations.length, 2, "two violations reported (one for createParserOptions, one for createHTML)");
            assert_equals(violations[0].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[0].disposition, "report");
            assert_equals(violations[0].sample, "Document parseHTMLUnsafe|");
            assert_equals(violations[1].effectiveDirective, "require-trusted-types-for");
            assert_equals(violations[1].disposition, "report");
            assert_equals(violations[1].sample, "Document parseHTMLUnsafe|<span id='report-span'></span>");
            assert_not_equals(doc.querySelector("#report-span"), null);
          }, `Document.parseHTMLUnsafe: default createParserOptions returning ${JSON.stringify(value)} and createHTML returning ${JSON.stringify(htmlValue)} reports two violations in report-only mode`);
        }
      }

      // Script exceptions inside createParserOptions are still rethrown even in report-only mode
      promise_test(async (t) => {
        const node = createTarget("Element", t);
        createParserOptions = () => {
          throw new Error("createParserOptions JS error");
        };
        assert_throws_js(Error, () => {
          node.setHTMLUnsafe("<span></span>");
        });
      }, "Element.setHTMLUnsafe: JS exception in createParserOptions is rethrown in report-only mode");
    </script>
  </body>
</html>
