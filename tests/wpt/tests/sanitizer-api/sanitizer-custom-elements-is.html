<!DOCTYPE html>
<html>
<head>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>

let constructor_called = false;
let connectedCallback_called = false;

class FooBarElement extends HTMLDivElement {
  constructor() {
    super();
    constructor_called = true;
  }

  connectedCallback() {
    connectedCallback_called = true;
  }
}

customElements.define("foo-bar", FooBarElement, { extends: "div" });

function assert_removed(sanitizer) {
  constructor_called = connectedCallback_called = false;

  let d = document.createElement("div");
  document.body.append(d);
  d.setHTML(`<div is="foo-bar">hello</div>`, { sanitizer } );
  assert_equals(d.innerHTML, `<div>hello</div>`);
  assert_false(d.firstChild.hasAttribute("is"));
  assert_true(d.firstChild.matches(":defined"));

  assert_false(constructor_called);
  assert_false(connectedCallback_called);

  d.remove();
}

test(t => {
  assert_removed("default");
}, "The is= attribute is removed by the default sanitizer config.");

test(t => {
  assert_removed({ removeAttributes: ["is"] });
}, "The is= attribute is removed by the global removeAttributes");

test(t => {
  assert_removed({ elements: [{ name: "div", removeAttributes: ["is"] }], removeAttributes: [] });
}, "The is= attribute is removed by the local removeAttributes");

test(t => {
  assert_removed({ elements: [{ name: "div", attributes: [] }], attributes: [] });
}, "The is= attribute is removed by the local missing attributes");

function assert_kept(sanitizer) {
  constructor_called = connectedCallback_called = false;

  let d = document.createElement("div");
  document.body.append(d);
  d.setHTML(`<div is="foo-bar">hello</div>`, { sanitizer });
  assert_equals(d.innerHTML, `<div is="foo-bar">hello</div>`);
  assert_true(d.firstChild.hasAttribute("is"));
  assert_true(d.firstChild.matches(":defined"));

  // "is" is re-created even after removing the attribute.
  d.firstChild.removeAttribute("is");
  assert_equals(d.innerHTML, `<div is="foo-bar">hello</div>`);

  assert_true(constructor_called);
  assert_true(connectedCallback_called);

  d.remove();
}

test(t => {
  assert_kept({ })
}, "The is= attribute is kept when allowed with an empty config.");

test(t => {
  assert_kept({ attributes: ["is"] })
}, "The is= attribute is kept when allowed by global attributes.");

test(t => {
  assert_kept({ removeAttributes: [] })
}, "The is= attribute is kept when allowed by global removeAttributes.");

test(t => {
  assert_kept({ elements: [{ name: "div", attributes: ["is"] }], attributes: [] });
}, "The is= attribute is kept when allowed by local attributes.");


function assert_removed_parseHTML(sanitizer, element) {
  constructor_called = connectedCallback_called = false;

  // To have meaningful test results with parseHTML, we need to always allow
  // "html" and "body". But since those might also be in the config, we need
  // to be a bit careful in when to allow them.
  if (sanitizer && sanitizer.elements && sanitizer.elements[0].name != "html")
    sanitizer.elements.push("html");
  if (sanitizer && sanitizer.elements && sanitizer.elements[0].name != "body")
    sanitizer.elements.push("body");

  const doc = Document.parseHTML(`<${element} is="foo-bar">hello</${element}>`, { sanitizer } );
  assert_equals(doc.body.innerText, `hello`);
  assert_equals(doc.getElementsByTagName(element).length, 1);
  const parsed_element = doc.getElementsByTagName(element)[0];
  assert_false(parsed_element.hasAttribute("is"));
  assert_true(parsed_element.matches(":defined"));

  assert_false(constructor_called);
  assert_false(connectedCallback_called);
}

for (element of ["html", "body", "div"]) {
  test(t => {
    assert_removed_parseHTML("default", element);
}, `parseHTML removes ${element} is= attribute with the default sanitizer config.`);

  test(t => {
    assert_removed_parseHTML({ removeAttributes: ["is"] }, element);
  }, `parseHTML removes ${element} is= attribute with global removeAttributes`);

  test(t => {
    assert_removed_parseHTML({ elements: [{ name: element, removeAttributes: ["is"] }], removeAttributes: [] }, element);
  }, `parseHTML removes ${element} is= attribute with local removeAttributes`);

  test(t => {
    assert_removed_parseHTML({ elements: [{ name: element, attributes: [] }], attributes: [] }, element);
  }, `parseHTML removes ${element} is= attribute with local allow attributes`);
}

let bold_constructed = 0;

class XBoldElement extends HTMLElement {
  constructor() {
    super();
    bold_constructed++;
  }
}

customElements.define("x-bold", XBoldElement, { extends: "b" });

const formatting_cases = [
  ["adoption agency", `<b is="x-bold">a<p>b</b>c`, `<b>a</b><p><b>b</b>c</p>`],
  ["reconstructing", `<p><b is="x-bold">a</p>b`, `<p><b>a</b></p><b>b</b>`],
];

for (const [name, markup, expected] of formatting_cases) {
  test(t => {
    bold_constructed = 0;

    let d = document.createElement("div");
    document.body.append(d);
    d.setHTML(markup, { sanitizer: { removeAttributes: ["is"] } });
    assert_equals(d.innerHTML, expected);
    assert_equals(bold_constructed, 0);

    d.remove();
  }, `Formatting elements created by ${name} don't get a removed is= attribute`);

  test(t => {
    bold_constructed = 0;

    let d = document.createElement("div");
    document.body.append(d);
    d.setHTML(markup, { sanitizer: { attributes: ["is"] } });
    const bs = d.querySelectorAll("b");
    assert_greater_than(bs.length, 0);
    for (const b of bs) {
      assert_equals(b.getAttribute("is"), "x-bold");
      assert_true(b instanceof XBoldElement);
    }
    assert_equals(bold_constructed, bs.length);

    d.remove();
  }, `Formatting elements created by ${name} keep an allowed is= attribute`);
}

for (const [markup, getElement] of [
  [`<body>hello<body is="foo-bar">`, doc => doc.body],
  [`<body>hello<html is="foo-bar">`, doc => doc.documentElement],
]) {
  test(t => {
    const doc = Document.parseHTML(markup, { sanitizer: { removeAttributes: ["is"] } });
    assert_equals(doc.body.textContent, "hello");
    assert_false(getElement(doc).hasAttribute("is"));
  }, `parseHTML doesn't merge a removed is= attribute from ${markup}`);

  test(t => {
    const doc = Document.parseHTML(markup, { sanitizer: { attributes: ["is"] } });
    assert_equals(getElement(doc).getAttribute("is"), "foo-bar");
  }, `parseHTML merges an allowed is= attribute from ${markup}`);
}

test(t => {
  constructor_called = connectedCallback_called = false;

  let host = document.createElement("div");
  document.body.append(host);
  const shadow = host.attachShadow({ mode: "open" });
  shadow.setHTML(`<div is="foo-bar">hello</div>`, { sanitizer: { removeAttributes: ["is"] } });
  assert_equals(shadow.innerHTML, `<div>hello</div>`);
  assert_false(constructor_called);
  assert_false(connectedCallback_called);

  host.remove();
}, "ShadowRoot setHTML removes the is= attribute with global removeAttributes");

test(t => {
  const doc = Document.parseHTMLUnsafe(`<div is="foo-bar">hello</div>`, { sanitizer: { removeAttributes: ["is"] } });
  assert_false(doc.querySelector("div").hasAttribute("is"));
}, "parseHTMLUnsafe removes the is= attribute with global removeAttributes");

for (const sanitizer of [
  { removeElements: ["foo-bar"], attributes: ["is"] },
  { replaceWithChildrenElements: ["foo-bar"], attributes: ["is"] },
]) {
  test(t => {
    assert_kept(sanitizer);
  }, `The is= attribute is kept when its value is in ${Object.keys(sanitizer)[0]}`);
}
</script>
</body>
</html>
