<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: filtered element with a backdrop-filter turned edge-on</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-2/#BackdropFilterProperty">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
    <link rel="match" href="filter-degenerate-layer-plane-backdrop-ref.html">
    <meta name="assert" content="An edge-on element carrying both a filter and a backdrop filter paints nothing and does not change what elements painted after it look like.">
    <!-- The filtered element is drawn from an intermediate image, so its edges can differ from the reference by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-2;totalPixels=0-400">
    <style>
      body { margin: 0; background: white; }
      .behind {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 300px;
        background: linear-gradient(to right, red, yellow);
        will-change: transform;
      }
      .edge {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 200px;
        height: 200px;
        transform: rotateY(90deg);
        backdrop-filter: invert(1);
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .edge > div {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background: orange;
        will-change: transform;
      }
      .after {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 120px;
        height: 120px;
        background: blue;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class=behind></div>
    <div class=edge><div></div></div>
    <div class=after></div>
  </body>
</html>
