<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reference for CSS Filters: filtered element under a perspective that establishes a perspective of its own</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <style>
      body { margin: 0; background: white; }
      .stage {
        position: absolute;
        top: 100px;
        left: 100px;
        perspective: 700px;
      }
      .filtered {
        width: 200px;
        height: 200px;
        background: green;
        transform: rotateY(35deg);
        perspective: 150px;
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
      }
      .face {
        position: absolute;
        top: 50px;
        left: 0;
        width: 200px;
        height: 100px;
        background: red;
        transform-style: preserve-3d;
        transform: translate3d(0, 0, 60px) rotateX(90deg);
      }
    </style>
  </head>
  <body>
    <div class=stage>
      <div class=filtered><div class=face></div></div>
    </div>
  </body>
</html>
