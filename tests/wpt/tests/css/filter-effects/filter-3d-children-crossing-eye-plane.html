<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: filtered element with children reaching up to the eye plane</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#3d-rendering-contexts">
    <link rel="match" href="filter-3d-children-crossing-eye-plane-ref.html">
    <meta name="assert" content="Children of a filtered element that reach from in front of the eye up to the eye plane are filtered and drawn without being cut short.">
    <!-- The test projects the shapes through a perspective while the reference draws them directly, so edges can differ by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-160;totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .group {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 100px;
        height: 100px;
        perspective: 100px;
        filter: drop-shadow(30px 30px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .group > div {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }
      .r { background: green; transform: translate3d(50px, 0, 50px) rotateY(90deg); }
      .l { background: orange; transform: translate3d(-50px, 0, 50px) rotateY(90deg); }
      .t { background: blue; transform: translate3d(0, -50px, 50px) rotateX(90deg); }
      .b { background: red; transform: translate3d(0, 50px, 50px) rotateX(90deg); }
    </style>
  </head>
  <body>
    <div class=group>
      <div class=r></div>
      <div class=l></div>
      <div class=t></div>
      <div class=b></div>
    </div>
  </body>
</html>
