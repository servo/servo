<title>CSS Filter reference: rounded overflow:hidden element with border inside rounded overflow:hidden ancestor</title>

.outer { overflow: hidden; border-radius: 10px; }
.inner { height: 40px; overflow: hidden; border-radius: 5px; border: 3px solid blue; }
</style>
