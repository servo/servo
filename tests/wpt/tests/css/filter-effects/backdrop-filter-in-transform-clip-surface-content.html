<!DOCTYPE html>
<title>backdrop-filter inside a transform that inherits a rounded clip and paints content</title>
<link rel="help" href="https://drafts.fxtf.org/filter-effects-2/#BackdropFilterProperty">
<link rel="match" href="backdrop-filter-in-transform-clip-surface-content-ref.html">
<!-- The wrapper is not a backdrop root, so the inner backdrop-filter has to
     read both the container's content and what the wrapper painted before it. -->
<style>
  #container {
    position: relative;
    width: 200px;
    height: 100px;
    background: blue;
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: opacity(1);
  }
  #wrapper {
    position: absolute;
    inset: 0;
    transform: translateX(-10px);
  }
  #wrapper > div {
    position: absolute;
  }
</style>
<div id="container">
  <div id="wrapper">
    <div style="left: 40px; top: 0; width: 100px; height: 100px; background: lime"></div>
    <div style="left: 60px; top: 20px; width: 100px; height: 60px; backdrop-filter: invert(1)"></div>
  </div>
</div>
