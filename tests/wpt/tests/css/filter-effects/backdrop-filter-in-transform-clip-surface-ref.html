<!DOCTYPE html>
<title>Reference: backdrop-filter inside a transform that inherits a rounded clip</title>
<!-- invert(1) of lime is exactly magenta. Everything except #inner is identical
     to the test, so the container's rounded corners rasterize the same way. -->
<style>
  #container {
    position: relative;
    width: 200px;
    height: 100px;
    background: lime;
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: opacity(1);
  }
  #wrapper {
    position: absolute;
    inset: 0;
    transform: translateX(-10px);
  }
  #inner {
    position: absolute;
    left: 50px;
    top: 20px;
    width: 100px;
    height: 60px;
  }
</style>
<div id="container">
  <div id="wrapper">
    <div id="inner" style="background: magenta"></div>
  </div>
</div>
