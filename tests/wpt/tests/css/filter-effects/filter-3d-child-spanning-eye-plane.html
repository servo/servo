<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: filtered element with a child reaching behind the eye plane</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#3d-rendering-contexts">
    <link rel="match" href="filter-3d-child-spanning-eye-plane-ref.html">
    <meta name="assert" content="A child of a filtered element that reaches behind the eye plane is drawn only where it is in front of the eye, and that part is filtered.">
    <!-- The test projects the shapes through a perspective while the reference draws them directly, so edges can differ by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-160;totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .group {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 100px;
        height: 100px;
        perspective: 100px;
        filter: drop-shadow(30px 30px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
      }
      .deep {
        position: absolute;
        top: 0;
        left: -100px;
        width: 300px;
        height: 100px;
        background: green;
        transform-style: preserve-3d;
        transform: translate3d(0, 0, 50px) rotateY(90deg);
        will-change: transform;
      }
      .flat {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 60px;
        height: 60px;
        background: blue;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class=group>
      <div class=deep></div>
      <div class=flat></div>
    </div>
  </body>
</html>
