<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: filtered element with a transparent child that has no bounds</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#3d-rendering-contexts">
    <link rel="match" href="filter-unbounded-child-in-layer-plane-ref.html">
    <meta name="assert" content="A fully transparent child that reaches through the eye plane of a filtered element contributes nothing, neither to the element nor to its drop shadow, so the visible child renders as it does without that child.">
    <!-- The filtered element is drawn from an intermediate image, so its edges can differ from the reference by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-2;totalPixels=0-300">
    <style>
      body { margin: 0; background: white; }
      .persp {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 400px;
        height: 400px;
        perspective: 300px;
      }
      .f {
        position: absolute;
        width: 400px;
        height: 400px;
        transform: rotateY(50deg);
        perspective: 100px;
        filter: drop-shadow(20px 20px black);
      }
      .detail {
        will-change: transform;
        position: absolute;
        top: 40px;
        left: 40px;
        width: 200px;
        height: 200px;
        background: repeating-linear-gradient(90deg, green 0 4px, white 4px 8px);
      }
      /* Half of this crosses behind the viewer of the .f perspective, so it projects to infinity. */
      .inf {
        will-change: transform;
        position: absolute;
        top: 0;
        left: 0;
        width: 2000px;
        height: 200px;
        background: green;
        transform: rotateY(70deg);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class=persp>
      <div class=f>
        <div class=inf></div>
        <div class=detail></div>
      </div>
    </div>
  </body>
</html>
