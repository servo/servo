<!DOCTYPE html>
<meta charset="utf-8">
<title>Filter Effects: a drop-shadow samples a descendant that is clipped out of view, inside a preserve-3d context</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
<link rel="help" href="https://drafts.csswg.org/css-transforms-2/#transform-style-property">
<link rel="match" href="drop-shadow-outsets-sample-composited-child-preserve-3d-ref.html">
<meta name="assert" content="A drop-shadow samples the whole painted content of the filtered element, including a composited descendant that an ancestor clip moves out of view, when the filtered element sits inside a transform-style: preserve-3d context.">
<style>
.clip {
    position: relative;
    overflow: hidden;
    width: 100px;
    height: 100px;
}
.context3D {
    position: relative;
    width: 100px;
    height: 100px;
    transform-style: preserve-3d;
    will-change: transform;
}
.filtered {
    position: absolute;
    top: 0;
    left: -100px;
    width: 200px;
    height: 100px;
    filter: drop-shadow(100px 0 0 green);
}
.box {
    width: 0;
    height: 0;
    border: 50px solid green;
    will-change: transform;
}
</style>
<p>Test passes if there is a filled green square below.</p>
<div class="clip">
    <div class="context3D">
        <div class="filtered">
            <div class="box"></div>
        </div>
    </div>
</div>
