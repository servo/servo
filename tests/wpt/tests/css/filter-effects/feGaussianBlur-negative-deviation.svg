<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml">
  <title>Negative stdDeviation values are treated as zero</title>
  <h:link rel="help" href="https://drafts.csswg.org/filter-effects-1/#feGaussianBlurElement"/>
  <h:link rel="help" href="https://drafts.csswg.org/filter-effects-1/#element-attrdef-fegaussianblur-stddeviation"/>
  <h:link rel="match" href="reference/feGaussianBlur-negative-deviation-ref.svg"/>
  <defs>
    <filter id="f1">
      <feGaussianBlur stdDeviation="-1" />
    </filter>
    <filter id="f2">
      <feGaussianBlur stdDeviation="-1 -1" />
    </filter>
    <filter id="f3">
      <feGaussianBlur stdDeviation="1 -1" />
    </filter>
    <filter id="f4">
      <feGaussianBlur stdDeviation="-1 1" />
    </filter>
  </defs>
  <rect x="50" y="20" width="10" height="10" fill="green" filter="url(#f1)" />
  <rect x="50" y="40" width="10" height="10" fill="green" filter="url(#f2)" />
  <rect x="50" y="60" width="10" height="10" fill="green" filter="url(#f3)" />
  <rect x="50" y="80" width="10" height="10" fill="green" filter="url(#f4)" />
</svg>
