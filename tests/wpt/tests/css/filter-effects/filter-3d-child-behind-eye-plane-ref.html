<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reference for CSS Filters: filtered element with a child behind the eye plane</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <style>
      body { margin: 0; background: white; }
      .group {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 100px;
        height: 100px;
        perspective: 100px;
        filter: drop-shadow(30px 30px 0 rgba(0, 0, 0, 0.6));
      }
      .group > div {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
      .behind { background: green; transform: translateZ(200px); }
      .front { background: blue; transform: translateZ(-100px); }
    </style>
  </head>
  <body>
    <div class=group>
      <div class=behind></div>
      <div class=front></div>
    </div>
  </body>
</html>
