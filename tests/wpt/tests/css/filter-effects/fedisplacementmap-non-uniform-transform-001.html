<!DOCTYPE html>
<title>SVG Filters: feDisplacementMap filter with a non-uniform transform</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#feDisplacementMapElement">
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#element-attrdef-fedisplacementmap-scale">
<link rel="match" href="reference/fedisplacementmap-non-uniform-transform-001-ref.html">
<meta name="assert" content="feDisplacementMap scales displacement independently along the X and Y axes under a non-uniform transform.">

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"
        color-interpolation-filters="sRGB">
        <feFlood flood-color="#ff0" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="100"
            xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <rect x="100" y="100" width="100" height="100" fill="red" />
    <g transform="scale(4,2)" filter="url(#f)">
        <rect x="75" y="100" width="25" height="50" fill="green" />
    </g>
</svg>
