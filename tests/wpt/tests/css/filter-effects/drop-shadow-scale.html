<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: drop-shadow on a scaled element</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#funcdef-filter-drop-shadow">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#transform-property">
    <link rel="match" href="drop-shadow-scale-ref.html">
    <meta name="assert" content="The shadow offset and the blur radius are scaled by the element’s transform.">
    <!-- The filtered element is drawn from an intermediate image, so its edges can differ from the reference by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-180;totalPixels=0-56000">
    <style>
      body { margin: 0; background: white; }
      div {
        position: absolute;
        left: 20px;
        top: 200px;
        width: 20px;
        height: 20px;
        overflow: hidden;
        background: green;
        transform: scale(10);
        transform-origin: bottom left;
        filter: drop-shadow(30px 10px 4px blue);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
