<!DOCTYPE html>
<title>backdrop-filter inside a transform that inherits a rounded clip</title>
<link rel="help" href="https://drafts.fxtf.org/filter-effects-2/#BackdropFilterProperty">
<link rel="match" href="backdrop-filter-in-transform-clip-surface-ref.html">
<!-- The wrapper is not a backdrop root, so the inner backdrop-filter has to
     read the container's content rather than anything the wrapper alone might
     be rendered into. -->
<style>
  #container {
    position: relative;
    width: 200px;
    height: 100px;
    background: lime;
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: opacity(1);
  }
  #wrapper {
    position: absolute;
    inset: 0;
    transform: translateX(-10px);
  }
  #inner {
    position: absolute;
    left: 50px;
    top: 20px;
    width: 100px;
    height: 60px;
  }
</style>
<div id="container">
  <div id="wrapper">
    <div id="inner" style="backdrop-filter: invert(1)"></div>
  </div>
</div>
