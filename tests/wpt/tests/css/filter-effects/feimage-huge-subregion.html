<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>feImage with a primitive subregion far larger than the filter region</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="match" href="reference/green-100x100.html">
<meta name="assert" content="An feImage whose primitive subregion is far larger than the filter region still renders the part inside the filter region.">
<script src="/common/reftest-wait.js"></script>
<script src="/common/rendering-utils.js"></script>
<script>
onload = () => waitForAtLeastOneFrame().then(takeScreenshot);
</script>
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage x="-200000" y="-200000" width="400000" height="400000" preserveAspectRatio="none" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='green'/></svg>"/>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
