<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reference for CSS Filters: invert() on a scaled element</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <style>
      body { margin: 0; background: white; }
      div {
        position: absolute;
        left: 20px;
        top: 200px;
        width: 20px;
        height: 20px;
        overflow: hidden;
        transform: scale(10);
        transform-origin: bottom left;
        will-change: transform;
        background-image:
          repeating-linear-gradient(45deg, rgba(0, 178, 178, 0.5), rgba(0, 178, 178, 0.5) 5px, transparent 0, transparent 10px),
          repeating-linear-gradient(315deg, rgba(0, 178, 178, 0.5), rgba(0, 178, 178, 0.5) 5px, transparent 0, transparent 10px);
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
