<!DOCTYPE html>
<meta charset="utf-8">
<title>feImage applies the svgView() fragment of a referenced SVG image</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="help" href="https://svgwg.org/svg2-draft/linking.html#SVGFragmentIdentifiersDefinitions">
<link rel="match" href="reference/green-100x100.html">
<meta name="assert" content="An feImage referencing an SVG image with an svgView() fragment shows that view.">
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage preserveAspectRatio="none" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='50' height='100' fill='red'/><rect x='50' width='50' height='100' fill='green'/></svg>#svgView(viewBox(50,0,50,100))"/>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
