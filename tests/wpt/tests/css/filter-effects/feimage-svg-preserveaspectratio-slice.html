<!DOCTYPE html>
<meta charset="utf-8">
<title>feImage fits a referenced SVG image with its preserveAspectRatio slice</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="help" href="https://svgwg.org/svg2-draft/embedded.html#ImageElement">
<link rel="match" href="reference/green-100x100.html">
<meta name="assert" content="An feImage's preserveAspectRatio slice scales a referenced SVG image to cover the primitive subregion, clipping the overflow.">
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage preserveAspectRatio="xMidYMid slice" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><rect width='50' height='100' fill='red'/><rect x='50' width='100' height='100' fill='green'/><rect x='150' width='50' height='100' fill='red'/></svg>"/>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
