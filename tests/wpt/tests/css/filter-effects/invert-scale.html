<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: invert() on a scaled element</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#funcdef-filter-invert">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#transform-property">
    <link rel="match" href="invert-scale-ref.html">
    <meta name="assert" content="A color filter on a scaled element is applied at the scaled resolution, so the filtered pattern stays as sharp as an unfiltered one.">
    <!-- The filtered element is drawn from an intermediate image, so much of the pattern can differ from the reference by a step or two. -->
    <meta name="fuzzy" content="maxDifference=0-2;totalPixels=0-18500">
    <style>
      body { margin: 0; background: white; }
      div {
        position: absolute;
        left: 20px;
        top: 200px;
        width: 20px;
        height: 20px;
        overflow: hidden;
        transform: scale(10);
        transform-origin: bottom left;
        filter: invert(1);
        will-change: transform;
        background-image:
          repeating-linear-gradient(45deg, rgba(255, 77, 77, 0.5), rgba(255, 77, 77, 0.5) 5px, transparent 0, transparent 10px),
          repeating-linear-gradient(315deg, rgba(255, 77, 77, 0.5), rgba(255, 77, 77, 0.5) 5px, transparent 0, transparent 10px);
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
