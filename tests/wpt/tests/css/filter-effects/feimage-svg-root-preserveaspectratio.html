<!DOCTYPE html>
<meta charset="utf-8">
<title>feImage treats the root preserveAspectRatio of a referenced SVG image as none</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="help" href="https://svgwg.org/svg2-draft/embedded.html#ImageElement">
<link rel="match" href="reference/green-100x100.html">
<meta name="assert" content="An feImage referencing an SVG image fits it like an image element does, so the SVG root's own preserveAspectRatio is ignored.">
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 50 100' preserveAspectRatio='xMaxYMid meet'><rect width='50' height='100' fill='green'/></svg>"/>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
