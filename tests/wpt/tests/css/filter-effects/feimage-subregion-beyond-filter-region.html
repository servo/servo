<!DOCTYPE html>
<meta charset="utf-8">
<title>feImage places its image in a primitive subregion that extends beyond the filter region</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="match" href="reference/green-100x100.html">
<meta name="assert" content="An feImage fits its image to the whole primitive subregion, even where the subregion extends beyond the filter region, which then clips it.">
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage x="-100" y="-100" width="300" height="300" preserveAspectRatio="none" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'><rect width='3' height='3' fill='red'/><rect x='1' y='1' width='1' height='1' fill='green'/></svg>"/>
  </filter>
  <rect width="100" height="100" fill="red"/>
  <rect width="100" height="100" filter="url(#filter)"/>
</svg>
