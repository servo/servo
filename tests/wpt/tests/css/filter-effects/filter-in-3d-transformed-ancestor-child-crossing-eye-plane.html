<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CSS Filters: filtered element under a perspective with a child crossing the eye plane</title>
    <link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
    <link rel="help" href="https://drafts.fxtf.org/filter-effects-1/#FilterProperty">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#perspective-property">
    <link rel="help" href="https://drafts.csswg.org/css-transforms-2/#3d-rendering-contexts">
    <link rel="match" href="filter-in-3d-transformed-ancestor-child-crossing-eye-plane-ref.html">
    <meta name="assert" content="A filtered element rotated under a perspective has a child crossing the eye plane of its own perspective: the part of the child in front of the eye is filtered and drawn out to the edge of the viewport, and the part behind the eye is not drawn.">
    <!-- The test projects the shapes through a perspective while the reference draws them directly, so edges can differ by about a pixel. -->
    <meta name="fuzzy" content="maxDifference=0-160;totalPixels=0-8000">
    <style>
      body { margin: 0; background: white; }
      .stage {
        position: absolute;
        top: 100px;
        left: 100px;
        perspective: 600px;
      }
      .rot {
        transform: rotateY(50deg);
        will-change: transform;
      }
      .filtered {
        width: 200px;
        height: 200px;
        background: green;
        filter: drop-shadow(20px 20px 0 rgba(0, 0, 0, 0.6));
        will-change: transform;
        perspective: 100px;
      }
      .inner {
        position: absolute;
        top: 40px;
        left: 80px;
        width: 80px;
        height: 80px;
        background: orange;
        will-change: transform;
        transform: translate3d(0, 0, 70px) rotateY(80deg);
      }
      /* Close to the horizon of the rotated plane the filter surface would grow without bound, so that part is
         given up. Past the horizon the child is drawn wrapped around, which is a separate problem. */
      .horizon {
        position: absolute;
        top: 0;
        left: 640px;
        right: 0;
        height: 600px;
        background: white;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div class=stage>
      <div class=rot>
        <div class=filtered><div class=inner></div></div>
      </div>
    </div>
    <div class=horizon></div>
  </body>
</html>
