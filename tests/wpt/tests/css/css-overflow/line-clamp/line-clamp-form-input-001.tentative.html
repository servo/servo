<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and input elements, direct clamping</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-input-001-ref.html">
<meta name="assert" content="Applying line-clamp directly to inputs leaves their internal contents unchanged.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  vertical-align: top;
}
</style>

<input class="clamp" type="text" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="search" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="password" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="email">
<input class="clamp" type="url">
<input class="clamp" type="tel">
<input class="clamp" type="number">
<input class="clamp" type="date">
<input class="clamp" type="datetime-local">
<input class="clamp" type="month">
<input class="clamp" type="week">
<input class="clamp" type="time">
<input class="clamp" type="checkbox">
<input class="clamp" type="radio">
<input class="clamp" type="range">
<input class="clamp" type="color">
<input class="clamp" type="file">
<input class="clamp" type="hidden">
