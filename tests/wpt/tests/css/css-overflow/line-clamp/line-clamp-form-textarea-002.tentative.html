<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and textarea elements, before the clamp point</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-textarea-002-ref.html">
<meta name="assert" content="A textarea element starting before an ancestor's clamp point remains visible.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  background: yellow;
}
</style>

<div class="clamp">
  <textarea cols="8" rows="3">XX
XX
XX</textarea><br>
  XX<br>
  XX<br>
  XX
</div>
