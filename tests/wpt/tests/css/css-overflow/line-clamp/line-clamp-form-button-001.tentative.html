<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and button elements, direct clamping</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-button-001-ref.html">
<meta name="assert" content="Direct clamping limits multiline button text and leaves single-line input button labels intact.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  text-align: left;
}
</style>

<input class="clamp" type="button" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="submit" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="reset" value="XX XX XX XX XX XX XX XX XX XX">
<input class="clamp" type="image" alt="XX XX XX XX XX XX XX XX XX XX">
<button class="clamp">XX<br>XX<br>XX<br>XX</button>
