<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: Images in a new stacking context after line-clamp</title>
<link rel="author" title="Andreu Botella" href="mailto:abotella@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/webkit-line-clamp-005-ref.html">
<meta name="assert" content="Images after the clamp point should be hidden, even if they create a new stacking context">
<style>
.clamp {
  line-clamp: 4;
  font: 16px / 32px serif;
  white-space: pre;
  padding: 0 4px;
  background-color: yellow;
}
.stacking-context {
  position: relative;
  z-index: 1;
}
</style>

<div class="clamp">Line 1
Line 2
Line 3
Line 4
<img class="stacking-context" src="/css/support/swatch-red.png"></div>
