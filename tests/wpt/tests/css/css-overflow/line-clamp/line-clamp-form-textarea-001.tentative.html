<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and textarea elements, direct clamping</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-textarea-001-ref.html">
<meta name="assert" content="Applying line-clamp directly to a textarea leaves its internal rows unchanged.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  background: yellow;
}
</style>

<textarea class="clamp" rows="4">XX
XX
XX
XX</textarea>
