<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: reference for input elements, at the clamp point</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  width: 240px;
  background: yellow;
}
.last-line {
  white-space: nowrap;
}
</style>

<div class="clamp">
  XX<br>
  <span class="last-line"><input size="8" value="XX XX">…</span>
</div>
