<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: reference for fieldset elements, direct clamping</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
legend {
  background-color: lightgray;
}
.clamp {
  width: 240px;
}
</style>

<fieldset class="clamp"><legend>XX<br>XX<br>XX</legend>XX<br>XX<br>XX<br>XX<br><input value="XX"></fieldset>
<fieldset class="clamp">XX<br>XX<br>XX<br>XX<br><textarea>XX</textarea></fieldset>
