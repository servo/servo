<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Reference</title>
<style>
.clamp {
  line-clamp: auto;
  max-height: 4lh;
  font: 20px / 20px monospace;
  width: 12ch;
  background: yellow;
}
.line-box-sizer {
  display: inline-block;
  width: 1ch;
  height: 1lh;
  background: orange;
}
</style>

<div class="clamp">
  Line 1 <br>
  <span class="line-box-sizer"></span>
  Line 2 <br>
  Line 3<br>
  Line 4<br>
  Line 5
</div>
