<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: reference for select elements, direct clamping</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea, optgroup {
  font: inherit;
}
.clamp {
  width: 240px;
  vertical-align: top;
}
select {
  scrollbar-width: none;
}
.hidden {
  visibility: hidden;
}
</style>

<select class="clamp"><option>XX</option><option>XX</option><option>XX</option></select>
<select class="clamp" size="3"><optgroup label="XX"><option>XX…</option><option class="hidden">XX</option><option class="hidden">XX</option></optgroup></select>
<select class="clamp" multiple><option selected>XX</option><option>XX…</option><option class="hidden">XX</option></select>
