<!DOCTYPE html>
<meta charset="UTF-8">
<title>CSS Overflow: A hidden stacking context after clamp can still have fixed pos descendants that are shown</title>
<link rel="author" title="Andreu Botella" href="mailto:abotella@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-050-ref.html">
<meta name="assert" content="A fixed positioned element after the clamp point whose containing block is not a descendant of the line-clamp container will be shown. This is the case even if the fixed pos element is contained by a hidden stacking context.">
<style>
  #clamp {
    line-clamp: 3;
    border: 1px solid black;
    background-color: yellow;
    margin: 10px;
  }
  #rel {
    position: relative;
    z-index: 1;
    display: inline-block;
    min-width: 10em;
    min-height: 3em;
    background-color: orange;
  }
  #fixed {
    position: fixed;
    top: 0;
    left: 0;
    background-color: green;
  }
</style>

<div id="clamp">
  <p>Line 1</p>
  <p>Line 2</p>
  <p>Line 3</p>
  <p>Line 4</p>
  <div id="rel">
    <div id="fixed">Fixed pos</div>
  </div>
</div>
