<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and input elements, after the clamp point</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-input-004-ref.html">
<meta name="assert" content="An input element starting after an ancestor's clamp point is hidden.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  background: yellow;
}
</style>

<div class="clamp">
  XX<br>
  XX<br>
  XX<br>
  <input size="8" value="XX XX"><br>
  XX<br>
  XX<br>
  XX
</div>
