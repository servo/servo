<link rel="match" href="/css/reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="When the block-ellipsis displaces an entire line, that line contains a strut styled according to the root inline box. It does not have struts corresponding to any other open inline boxes.">
<style>
.parent {
  height: 100px;
  width: 100px;
  background: red;
}
.clamp {
  font: 25px/25px Ahem;
  line-clamp: 3;
  width: 100px;
  color: transparent;
  background: linear-gradient(green, green) 0 0 / 100px 100px no-repeat, red;
}
.big {
  font: 50px/50px Ahem;
}
</style>

<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div class="parent">
  <div class="clamp">
    XXXX
    <span class="big">
      XX
      XXX
      X
    </span>
  </div>
</div>
