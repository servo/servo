<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp with an inline-block in a block whose inline content is all after the clamp point</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">

<div style="line-clamp: 1">
  Line 1
  <div><span style="display: inline-block"></span>Line 2</div>
</div>
