<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: a string block ellipsis in vertical writing modes</title>
<link rel="author" title="Christian Biesinger" href="mailto:cbiesinger@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#block-ellipsis">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/block-ellipsis-vertical-001-ref.html">
<meta name="assert" content="The block ellipsis is laid out and painted like the same text as content, also in vertical writing modes.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
div {
  font: 20px/1 Ahem;
  height: 12em;
  border: 1px solid;
  margin: 4px;
  float: left;
  line-clamp: 2 " (more)";
}
.rl { writing-mode: vertical-rl; }
.lr { writing-mode: vertical-lr; }
.upright { text-orientation: upright; }
</style>
<div class="rl">line one<br>line two<br>line three</div>
<div class="lr">line one<br>line two<br>line three</div>
<div class="rl upright">line one<br>line two<br>line three</div>
<div class="lr upright">line one<br>line two<br>line three</div>
