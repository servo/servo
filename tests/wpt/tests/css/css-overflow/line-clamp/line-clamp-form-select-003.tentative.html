<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and select elements, at the clamp point</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-select-003-ref.html">
<meta name="assert" content="Select elements starting at an ancestor's clamp point remain visible.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  background: yellow;
}
select {
  scrollbar-width: none;
}
</style>

<div class="clamp">
  XX<br>
  <select size="3"><option>XX</option><option>XX</option><option>XX</option></select><br>
  XX<br>
  XX<br>
  XX
</div>
