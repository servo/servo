<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: clamp containers are not monolithic</title>
<link rel="author" title="Florian Rivoal" href="https://florian.rivoal.net/">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-fragmentation-001-ref.html">
<meta name="assert" content="When placed in a fragmentation container, clamp containers fragment normally, and are not treated as monolithic.">
<style>
.col {
    columns: 3 10em;
    max-width: max-content;
    height: 4lh;
}
.clamp {
  line-clamp: 12;
  white-space: pre;
}
</style>
<p>Test passes if there are 3 columns of 4 lines each, going up to line 12, and ending with an ellipsis (“…”)
<div class=col>
<div class="clamp">Line 1
Line 2
Line 3
Line 4
Line 5
Line 6
Line 7
Line 8
Line 9
Line 10
Line 11
Line 12
Line 13
Line 14
</div>
</div>
