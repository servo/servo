<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Overflow: Invalidation test for images in a new stacking context after line-clamp</title>
<link rel="author" title="Andreu Botella" href="mailto:abotella@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/webkit-line-clamp-005-ref.html">
<meta name="assert" content="Images after the clamp point should be hidden, even if they create a new stacking context. This test checks that setting the line-clamp property dynamically causes the image to be hidden.">
<script src="/common/reftest-wait.js"></script>
<style>
.clamp {
  font: 16px / 32px serif;
  white-space: pre;
  padding: 0 4px;
  background-color: yellow;
}
.stacking-context {
  position: relative;
  z-index: 1;
}
</style>

<div class="clamp">Line 1
Line 2
Line 3
Line 4
<img class="stacking-context" src="/css/support/swatch-red.png"></div>

<script>
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelector(".clamp").style.lineClamp = 4;
      takeScreenshot();
    });
  });
</script>
