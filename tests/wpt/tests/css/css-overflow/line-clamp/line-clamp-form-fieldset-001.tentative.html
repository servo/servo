<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and fieldset elements, direct clamping</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-fieldset-001-ref.html">
<meta name="assert" content="Direct clamping skips the independent formatting contexts inside a fieldset and its legend.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
legend {
  background-color: lightgray;
}
.clamp {
  line-clamp: 2;
  width: 240px;
}
</style>

<fieldset class="clamp"><legend>XX<br>XX<br>XX</legend>XX<br>XX<br>XX<br>XX<br><input value="XX"></fieldset>
<fieldset class="clamp">XX<br>XX<br>XX<br>XX<br><textarea>XX</textarea></fieldset>
