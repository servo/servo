<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and select elements, direct clamping</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-select-001-ref.html">
<meta name="assert" content="Direct clamping limits listbox contents while leaving a single-line select intact.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea, optgroup {
  font: inherit;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  vertical-align: top;
}
select {
  scrollbar-width: none;
}
</style>

<select class="clamp"><option>XX</option><option>XX</option><option>XX</option></select>
<select class="clamp" size="3"><optgroup label="XX"><option>XX</option><option>XX</option><option>XX</option></optgroup></select>
<select class="clamp" multiple><option selected>XX</option><option>XX</option><option>XX</option></select>
