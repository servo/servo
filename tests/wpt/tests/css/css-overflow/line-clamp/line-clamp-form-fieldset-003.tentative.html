<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Overflow: line-clamp and fieldset elements, at the clamp point</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#line-clamp">
<link rel="match" href="reference/line-clamp-form-fieldset-003-ref.html">
<meta name="assert" content="A fieldset at an ancestor's clamp point remains fully visible, while following content is hidden.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body {
  font: 25px/1 Ahem;
}
input, button, select, textarea {
  font: inherit;
}
legend {
  background-color: lightgray;
}
.clamp {
  line-clamp: 2;
  width: 240px;
  background: yellow;
}
</style>

<div class="clamp">
  XX<br>
  <fieldset><legend>XX</legend>XX<br>XX<br>XX</fieldset><br>
  XX<br>
  XX<br>
  XX
</div>
