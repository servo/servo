<!DOCTYPE html>
<title>CSS Reference File: ::scroll-marker-group before the scroller</title>
<style>
  #row {
    display: flex;
  }

  #scroller, #marker {
    width: 50px;
    height: 50px;
  }

  #scroller {
    background: blue;
  }

  #marker {
    background: green;
  }
</style>
<p>Test passes if there is a blue square with a green square to the right of it.</p>
<div id="row">
  <div id="scroller"></div>
  <div id="marker"></div>
</div>
