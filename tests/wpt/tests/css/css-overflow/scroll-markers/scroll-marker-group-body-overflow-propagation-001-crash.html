<!DOCTYPE html>
<title>CSS Overflow Test: Changing the root overflow, which changes whether the body overflow propagates to the viewport, does not crash</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-5/#scroll-marker-group-property">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#overflow-propagation">
<style>
  html {
    scroll-marker-group: before;
  }

  body {
    scroll-marker-group: before;
    overflow: auto;
  }

  #item::scroll-marker {
    content: "";
  }
</style>
<div id="item"></div>
<script>
  const html = document.documentElement;
  html.offsetTop;
  // Stop propagating the body overflow to the viewport, which moves #item's
  // ::scroll-marker from the root's group to the body's group.
  html.style.overflow = "clip";
  html.offsetTop;
  // Propagate the body overflow to the viewport again.
  html.style.overflow = "visible";
</script>
