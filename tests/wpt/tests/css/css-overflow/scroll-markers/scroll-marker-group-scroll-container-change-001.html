<!DOCTYPE html>
<title>CSS Overflow Test: Becoming a scroll container adds scroll markers</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-5/#scroll-marker-group-property">
<link rel="match" href="scroll-marker-group-position-change-001-ref.html">
<style>
  #scroller {
    scroll-marker-group: after;
    overflow: visible;
    width: 50px;
    height: 50px;
    background: blue;
  }

  #item::scroll-marker {
    content: "";
    display: block;
    margin-left: 50px;
    width: 50px;
    height: 50px;
    background: green;
  }
</style>
<p>Test passes if there is a blue square with a green square below and to the right of it.</p>
<div id="scroller"><div id="item"></div></div>
<script>
  scroller.offsetTop;
  scroller.style.overflow = "hidden";
</script>
