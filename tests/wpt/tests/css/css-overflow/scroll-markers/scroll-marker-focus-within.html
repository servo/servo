<!doctype html>
<meta charset="utf-8">
<title>CSS Overflow Test: focused ::scroll-marker sets :focus-within on its ::scroll-marker-group, scroller and all the ancestors in links and tabs modes</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-5/#focus-pseudoclasses">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  body {
    margin: 0;
  }

  #scroller {
    background: red;
    width: 600px;
    height: 300px;
    overflow: auto;
    scroll-marker-group: before;
    white-space: nowrap;
  }

  #scroller:focus-within {
    background: green;
  }

  #scroller div {
    background: green;
    display: inline-block;
    width: 600px;
    height: 270px;
  }

  #scroller div:focus-within {
    background: red;
  }

  #scroller::scroll-marker-group {
    background: red;
    display: flex;
    height: 20px;
    width: 40px;
  }

  #scroller::scroll-marker-group:focus-within {
    background: green;
  }

  #scroller div::scroll-marker {
    content: "";
    width: 20px;
    height: 20px;
    background-color: red;
    display: inline-block;
  }

  #scroller div::scroll-marker:focus-within {
    background: green;
  }
</style>
<div id="scroller">
  <div id="target"></div>
  <div></div>
</div>
<script>
  promise_test(async t => {
    // 1. Links mode (default)
    let actions_promise = new test_driver.Actions()
      .pointerMove(15, 15)
      .pointerDown()
      .pointerUp()
      .send();
    await actions_promise;
    assert_equals(getComputedStyle(scroller, "::scroll-marker-group").backgroundColor, "rgb(255, 0, 0)", "unfocused ::scroll-marker does not set :focus-within on its ::scroll-marker-group in links mode");
    assert_equals(getComputedStyle(scroller).backgroundColor, "rgb(255, 0, 0)", "unfocused ::scroll-marker does not set :focus-within on its scroller in links mode");
    assert_equals(getComputedStyle(target, "::scroll-marker").backgroundColor, "rgb(255, 0, 0)", "unfocused ::scroll-marker does not set :focus-within on itself in links mode");
    assert_equals(getComputedStyle(target).backgroundColor, "rgb(0, 128, 0)", "unfocused ::scroll-marker doesn't set :focus-within on its originating element in links mode");

    // 2. Tabs mode
    document.activeElement.blur();
    scroller.style.setProperty("scroll-marker-group", "before tabs");

    actions_promise = new test_driver.Actions()
      .pointerMove(15, 15)
      .pointerDown()
      .pointerUp()
      .send();
    await actions_promise;
    assert_equals(getComputedStyle(scroller, "::scroll-marker-group").backgroundColor, "rgb(0, 128, 0)", "focused ::scroll-marker sets :focus-within on its ::scroll-marker-group in tabs mode");
    assert_equals(getComputedStyle(scroller).backgroundColor, "rgb(0, 128, 0)", "focused ::scroll-marker sets :focus-within on its scroller in tabs mode");
    assert_equals(getComputedStyle(target, "::scroll-marker").backgroundColor, "rgb(0, 128, 0)", "focused ::scroll-marker sets :focus-within on itself in tabs mode");
    assert_equals(getComputedStyle(target).backgroundColor, "rgb(0, 128, 0)", "focused ::scroll-marker doesn't set :focus-within on its originating element in tabs mode");
  }, "::scroll-marker sets :focus-within on its ancestors in tabs mode, but not in links mode");
</script>
