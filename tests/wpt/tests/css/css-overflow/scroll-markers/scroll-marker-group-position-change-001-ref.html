<!DOCTYPE html>
<title>CSS Reference File: ::scroll-marker-group after the scroller</title>
<style>
  #scroller, #marker {
    width: 50px;
    height: 50px;
  }

  #scroller {
    background: blue;
  }

  #marker {
    margin-left: 50px;
    background: green;
  }
</style>
<p>Test passes if there is a blue square with a green square below and to the right of it.</p>
<div id="scroller"></div>
<div id="marker"></div>
