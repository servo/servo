<!DOCTYPE html>
<title>CSS Overflow Test: Changing scroll-marker-group from after to before</title>
<link rel="help" href="https://drafts.csswg.org/css-overflow-5/#scroll-marker-group-property">
<link rel="match" href="scroll-marker-group-position-change-002-ref.html">
<!-- No ::scroll-marker-group rule on purpose: the group must move without
     any pseudo-element styles on the scroller. -->
<style>
  #scroller {
    scroll-marker-group: after;
    overflow: hidden;
    width: 50px;
    height: 50px;
    background: blue;
  }

  #item::scroll-marker {
    content: "";
    display: block;
    margin-left: 50px;
    width: 50px;
    height: 50px;
    background: green;
  }
</style>
<p>Test passes if there is a blue square with a green square to the right of it.</p>
<div id="scroller"><div id="item"></div></div>
<script>
  scroller.offsetTop;
  scroller.style.scrollMarkerGroup = "before";
</script>
