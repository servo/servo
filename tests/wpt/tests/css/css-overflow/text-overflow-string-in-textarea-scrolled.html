<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>text-overflow: &lt;string&gt; in a scrolled textarea</title>
<link rel="author" title="Minseong Kim" href="jja08111@gmail.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4/#text-overflow">
<link rel="match" href="text-overflow-string-in-textarea-scrolled-ref.html">
<meta name="assert" content="The text-overflow string is not rendered after the textarea is scrolled to the end.">
<style>
textarea {
  white-space: nowrap;
  text-overflow: "[...]";
}
</style>
<textarea>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</textarea>
<script>
const textarea = document.querySelector('textarea');
textarea.scrollLeft = textarea.scrollWidth;
requestAnimationFrame(() => {
  document.documentElement.classList.remove('reftest-wait');
});
</script>
</html>
