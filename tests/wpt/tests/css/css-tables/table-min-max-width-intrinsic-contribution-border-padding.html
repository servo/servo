<!DOCTYPE html>
<title>CSS Tables: a table's min-width and max-width in its intrinsic width contributions, with border and padding</title>
<link rel="help" href="https://drafts.csswg.org/css-tables-3/#used-min-width-of-table">
<link rel="help" href="https://drafts.csswg.org/css-sizing-3/#intrinsic-contribution">
<link rel="help" href="https://html.spec.whatwg.org/multipage/rendering.html#tables-2">
<meta name="assert" content="A table's min-width and max-width clamp its intrinsic width contributions in the same box-sizing as its used width, so a shrink-to-fit container is as wide as the table.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<style>
.container {
    float: left;
    clear: left;
}
.table {
    border: 10px solid;
    padding: 10px;
    border-spacing: 0;
}
td, .cell {
    padding: 0;
    font-size: 0;
}
.cell {
    display: table-cell;
}
.content {
    width: 20px;
    height: 10px;
}
.wrap {
    display: inline-block;
    width: 100px;
    height: 10px;
}
</style>
<body onload="checkLayout('.container')">
<div class="container" data-expected-width="200"><table class="table" style="min-width: 200px" data-expected-width="200"><tr><td><div class="content"></div></td></tr></table></div>
<div class="container" data-expected-width="200"><table class="table" style="max-width: 200px" data-expected-width="200"><tr><td><span class="wrap"></span> <span class="wrap"></span></td></tr></table></div>
<div class="container" data-expected-width="240"><div class="table" style="display: table; box-sizing: content-box; min-width: 200px" data-expected-width="240"><div class="cell"><div class="content"></div></div></div></div>
<div class="container" data-expected-width="200"><div class="table" style="display: table; box-sizing: border-box; min-width: 200px" data-expected-width="200"><div class="cell"><div class="content"></div></div></div></div>
<div class="container" data-expected-width="200"><div class="table" style="display: table; box-sizing: content-box; max-width: 160px" data-expected-width="200"><div class="cell"><span class="wrap"></span> <span class="wrap"></span></div></div></div>
</body>
