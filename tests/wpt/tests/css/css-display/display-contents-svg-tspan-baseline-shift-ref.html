<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Display Reference: text in a display: contents tspan is shifted with the content of the parent tspan</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<svg width="400" height="100" font-family="Ahem" font-size="20">
    <text x="10" y="60">X<tspan baseline-shift="20">XXXX</tspan>X</text>
</svg>
