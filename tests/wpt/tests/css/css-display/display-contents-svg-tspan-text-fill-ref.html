<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Display Reference: text in a display: contents tspan paints with the fill it inherits from the tspan</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<svg width="400" height="100" font-family="Ahem" font-size="20">
    <text x="10" y="40">black <tspan style="fill: green">green</tspan> black</text>
</svg>
