<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Display: text in a display: contents tspan paints with the fill it inherits from the tspan</title>
<link rel="help" href="https://drafts.csswg.org/css-display-3/#unbox-svg">
<link rel="match" href="display-contents-svg-tspan-text-fill-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<svg width="400" height="100" font-family="Ahem" font-size="20">
    <text x="10" y="40">black <tspan style="display: contents; fill: green">green</tspan> black</text>
</svg>
