<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Test Reference</title>
<style>
  :root {
    print-color-adjust: exact;
  }
  body {
    margin: 0;
  }
  div {
    position: absolute;
    width: 100px;
    height: 100px;
  }
  #corner {
    top: 0;
    left: 0;
    background: blue;
  }
  #blended {
    top: 300px;
    left: 300px;
    background: rgb(0, 128, 0);
  }
</style>
<div id="corner"></div>
<div id="blended"></div>
