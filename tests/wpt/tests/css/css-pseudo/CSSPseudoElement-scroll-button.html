<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Pseudo Test: CSSPseudoElement for ::scroll-button()</title>
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#CSSPseudoElement-interface">
<link rel="help" href="https://drafts.csswg.org/css-overflow-5/#scroll-buttons">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #scroller {
    width: 100px;
    height: 100px;
    overflow: auto;
  }

  #scroller::scroll-button(*) {
    content: "";
    display: inline-block;
    height: 10px;
    padding: 0;
    border: none;
  }

  /* Each scroll button has its own width, to tell them apart. */
  #scroller::scroll-button(block-start) { width: 10px; }
  #scroller::scroll-button(inline-start) { width: 20px; }
  #scroller::scroll-button(inline-end) { width: 30px; }
  #scroller::scroll-button(block-end) { width: 40px; }
</style>
<div id="scroller">
  <div style="width: 500px; height: 500px"></div>
</div>
<script>
  function scrollButton(direction) {
    const pseudo = scroller.pseudo(`::scroll-button(${direction})`);
    assert_true(pseudo instanceof CSSPseudoElement,
                `::scroll-button(${direction}) is a CSSPseudoElement`);
    return pseudo;
  }

  function width(pseudo) {
    return pseudo.getBoxQuads()[0].getBounds().width;
  }

  test(() => {
    const button = scrollButton("block-start");
    assert_equals(button.type, "::scroll-button");
    assert_equals(button.element, scroller);
    assert_equals(button.parent, scroller);
  }, "pseudo() returns a CSSPseudoElement for ::scroll-button()");

  test(() => {
    assert_equals(width(scrollButton("block-start")), 10, "block-start");
    assert_equals(width(scrollButton("inline-start")), 20, "inline-start");
    assert_equals(width(scrollButton("inline-end")), 30, "inline-end");
    assert_equals(width(scrollButton("block-end")), 40, "block-end");
    assert_equals(width(scrollButton("up")), 10, "up");
    assert_equals(width(scrollButton("left")), 20, "left");
    assert_equals(width(scrollButton("right")), 30, "right");
    assert_equals(width(scrollButton("down")), 40, "down");
  }, "Each direction refers to its own scroll button");

  test(() => {
    assert_equals(scrollButton("BLOCK-START"), scrollButton("block-start"),
                  "BLOCK-START");
    assert_equals(scrollButton("UP"), scrollButton("up"), "UP");
    assert_not_equals(scrollButton("up"), scrollButton("block-start"),
                      "physical and logical are distinct instances");
  }, "The direction is ASCII case-insensitive");

  const directions = [
    "block-start", "inline-start", "inline-end", "block-end",
    "up", "right", "down", "left",
  ];

  test(() => {
    for (const direction of directions) {
      assert_equals(scrollButton(direction).selectorText,
                    `::scroll-button(${direction})`, direction);
    }
    assert_equals(scrollButton("INLINE-END").selectorText,
                  "::scroll-button(inline-end)", "INLINE-END");
    assert_equals(scrollButton("UP").selectorText,
                  "::scroll-button(up)", "UP");
  }, "selectorText of ::scroll-button() retains the specified direction");

  test(t => {
    t.add_cleanup(() => {
      scroller.style.writingMode = "";
      scroller.style.direction = "";
    });
    const left = scrollButton("left");
    const blockStart = scrollButton("block-start");

    scroller.style.direction = "rtl";
    assert_equals(left.selectorText, "::scroll-button(left)");
    assert_equals(blockStart.selectorText, "::scroll-button(block-start)");
    assert_equals(width(left), 30, "left resolves to inline-end in rtl");

    scroller.style.direction = "";
    scroller.style.writingMode = "vertical-rl";
    assert_equals(left.selectorText, "::scroll-button(left)");
    assert_equals(blockStart.selectorText, "::scroll-button(block-start)");
    assert_equals(width(left), 40, "left resolves to block-end in vertical-rl");
    assert_equals(width(blockStart), 10, "block-start resolves to block-start in vertical-rl");
  }, "selectorText and target resolution across style changes");

  test(() => {
    assert_equals(scroller.pseudo("::scroll-button(*)"), null);
  }, "pseudo() returns null for ::scroll-button(*)");

  test(() => {
    const before = scroller.pseudo("::before");
    assert_equals(before.pseudo("::scroll-button(block-start)"), null);
    assert_equals(before.pseudo("::before"), null);
    assert_equals(before.pseudo("::after"), null);

    const button = scrollButton("block-start");
    assert_equals(button.pseudo("::before"), null);
    assert_equals(button.pseudo("::marker"), null);
    assert_equals(button.pseudo("::scroll-button(block-start)"), null);
  }, "Pseudo-elements don't have scroll buttons or invalid sub-pseudo-elements");

  test(() => {
    const div = document.createElement("div");
    assert_equals(div.pseudo("::scroll-button(left)").selectorText,
                  "::scroll-button(left)");
    assert_equals(div.pseudo("::scroll-button(block-start)").selectorText,
                  "::scroll-button(block-start)");
  }, "pseudo() and selectorText for ::scroll-button() of a disconnected element");
</script>
