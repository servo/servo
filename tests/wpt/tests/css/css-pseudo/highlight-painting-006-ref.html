<!doctype html>
<meta charset="utf-8">
<title>CSS Pseudo-Elements Test: Selection highlights are painted underneath shadows</title>
<link rel="author" name="Martin Robinson" href="mailto:mrobinson@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#highlight-painting">
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#painting">
<link rel="help" href="https://www.w3.org/TR/CSS22/zindex.html#painting-order">
<meta name="assert" value="Any text-shadow applying to a highlight pseudo-element is drawn over its corresponding highlight overlay background. ">

<style>
    p {
      background: green;
      width: max-content;
      text-shadow:  5px 5px 0px black;
    }
</style>

<p class="target">Selection</p>
