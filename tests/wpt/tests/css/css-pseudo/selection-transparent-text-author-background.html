<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Pseudo-Elements Test: transparent text with an author ::selection background-color follows paired defaults</title>
<link rel="author" title="Helmut Januschka" href="mailto:helmut@januschka.com">
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#paired-defaults">
<link rel="match" href="selection-transparent-text-author-background-ref.html">
<meta name="assert" content="When the originating 'color' is transparent and ::selection specifies only a background-color, paired defaults make the unspecified ::selection 'color' resolve to currentColor (transparent), so the selected text stays invisible rather than adopting the UA selection foreground color.">
<script src="support/selections.js"></script>
<style>
  #test {
    color: transparent;
    font-size: 300%;
  }
  #test::selection {
    background-color: yellow;
  }
</style>
<p>Test passes if there is a yellow box below with no visible text inside it.
<div id="test">Selected Text</div>
<script>selectNodeContents(document.getElementById("test"));</script>
