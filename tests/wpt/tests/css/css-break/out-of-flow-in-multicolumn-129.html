<!DOCTYPE html>
<title>Nested OOFs with percentage height and bottom alignment</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://issues.chromium.org/issues/40267498">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="columns:5; column-fill:auto; gap:0; width:100px; height:100px; background:red;">
  <div style="height:180px;">
    <div style="height:100px; background:green;"></div>
  </div>
  <div>
    <div style="position:relative;">
      <div style="height:320px;"></div>
      <div>
        <div style="position:absolute; bottom:0; width:100%; height:100%;">
          <div style="position:absolute; bottom:0; width:100%; height:125%; background:green;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
