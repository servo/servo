<!DOCTYPE html>
<title>
  Tests that a column flex item that expands due to fragmentation pushes down
  later items, even if its content overflows past its block end into the next
  fragmentainer.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#pagination">
<link rel="match" href="../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; columns: 2; column-gap: 0; column-fill: auto; background: red;">
  <div style="display: flex; flex-direction: column;">
    <div style="background: green;">
      <div style="height: 60px; break-inside: avoid;"></div>
      <div style="height: 60px; break-inside: avoid;"></div>
      <div style="height: 0;">
        <div style="height: 100px;"></div>
      </div>
    </div>
    <div style="height: 40px; background: green;"></div>
  </div>
</div>
