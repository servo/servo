<!DOCTYPE html>
<title>Auto-positioned percentage-height out-of-flow element in fragmented table section</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://issues.chromium.org/issues/40267498">
<link rel="match" href="../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="columns:4; column-fill:auto; gap:0; width:100px; height:100px; background:red;">
  <div style="position:relative; display:table-row-group;">
    <div style="display:table-row;">
      <div style="width:25px; height:120px; background:green;"></div>
    </div>
    <div style="position:absolute; width:100%; height:70%; background:green;"></div>
    <div style="display:table-row;">
      <div style="width:5px; height:280px;"></div>
    </div>
  </div>
</div>
