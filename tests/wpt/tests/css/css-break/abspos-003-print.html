<!DOCTYPE html>
<title>Out-of-flow positioned element after tall in-flow content positioned on the previous page. Initial containing block is OOF containing block.</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://issues.chromium.org/issues/40267498">
<link rel="match" href="abspos-003-print-ref.html">
<style>
  @page {
    size: 500px 200px;
    margin: 0;
  }
  :root {
    print-color-adjust: exact;
  }
  body {
    margin: 0;
  }
</style>
<div style="height:300px;">
  <div style="display:flow-root; height:200px; background:green;">
    <p>There should be two green pages. No red.</p>
  </div>
  <div style="height:200px; background:red;"></div>
</div>
<div style="position:absolute; top:100px; width:100%;">
  <div style="height:10px;"></div>
  <div style="contain:size; height:200px; background:green;"></div>
</div>
