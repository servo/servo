<!DOCTYPE html>
<title>Out-of-flow positioned descendant of self-collapsing block</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://issues.chromium.org/issues/40267498">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="position:relative; columns:2; column-fill:auto; gap:0; width:100px; height:100px; background:red;">
  <div style="position:absolute; width:50px; height:20px; background:green;"></div>
  <div style="margin-top:20px;">
    <div style="position:relative;">
      <div style="position:absolute; width:100%; height:180px; background:green;"></div>
    </div>
  </div>
</div>
