<!DOCTYPE html>
<title>Clipped fragmented table containing fragmented OOF</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://issues.chromium.org/issues/40267498">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="columns:2; gap:0; column-fill:auto; column-rule:solid red; width:100px; height:100px; background:red;">
  <div style="display:table; position:relative; overflow:clip; width:100%; height:200px;">
    <div style="position:absolute; width:100%;">
      <div style="height:200px; background:green;"></div>
      <div style="height:100px; background:red;"></div>
      <div style="break-before:column; height:2000px; background:red;"></div>
    </div>
  </div>
</div>
