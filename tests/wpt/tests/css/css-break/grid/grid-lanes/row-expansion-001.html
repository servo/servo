<!DOCTYPE html>
<title>Expanded row offsets preserve row gaps and item block margins</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-expansion-001-ref.html">
<style>
  .multicol { columns: 2; column-gap: 0; column-fill: auto; width: 160px; height: 100px; background: lightgray; }
  .lanes { display: grid-lanes; grid-template-rows: auto 20px; row-gap: 10px; width: 80px; }
</style>
<div class="multicol">
  <div class="lanes">
    <div style="grid-row: 1; width: 40px; margin-block: 5px; background: orange;">
      <div style="height: 20px;"></div>
      <div style="height: 20px; break-before: column;"></div>
    </div>
    <div style="grid-row: 1; width: 40px; background: teal;"></div>
    <div style="grid-row: 2; width: 80px; background: purple;"></div>
  </div>
</div>
