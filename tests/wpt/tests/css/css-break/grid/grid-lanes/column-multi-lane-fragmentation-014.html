<!DOCTYPE html>
<title>
  Multi-lane column grid-lanes fragmentation with multiple spanners of varying size.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 5;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: repeat(4, 5px);
    height: 500px;
    width: 20px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="grid-column: 1 / span 2; height: 150px;"></div>
    <div style="grid-column: 3 / span 2; height: 100px;"></div>
    <div style="grid-column: 3 / span 2; height: 50px;"></div>
    <div style="grid-column: 2 / span 3; height: 200px;"></div>
    <div style="height: 200px;"></div>
    <div style="grid-column: 1 / span 4; height: 100px;"></div>
    <div style="grid-column: 1 / span 2; height: 50px;"></div>
    <div style="grid-column: 3 / span 2; height: 50px;"></div>
  </div>
</div>
