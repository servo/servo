<!DOCTYPE html>
<title>Multi-lane row grid-lanes fragmentation with simultaneously fragmenting densely packed spanners</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-multi-lane-fragmentation-019-ref.html">
<style>
  .multicol {
    column-count: 2;
    column-fill: auto;
    column-gap: 0;
    height: 50px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    flow-tolerance: 0;
    grid-auto-flow: dense;
    grid-lanes-pack: dense;
    grid-template-rows: repeat(4, 25px);
    width: 50px;
  }
  .outer-1 {
    background: #20b2aa;
    grid-row: 1;
    width: 30px;
  }
  .outer-2 {
    background: #87cefa;
    grid-row: 4;
    width: 30px;
  }
  .parent-1 {
    background: #90ee90;
    grid-row: 1 / span 2;
    width: 20px;
  }
  .parent-2 {
    background: #dda0dd;
    grid-row: 3 / span 2;
    width: 20px;
  }
  .packed-1 {
    background: #ffd700;
    grid-row: 2 / span 2;
    width: 10px;
  }
  .packed-2 {
    background: #ff8c00;
    grid-row: 2 / span 2;
    width: 10px;
  }
</style>
<p>Test passes if the two rectangles are identical.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div class="outer-1"></div>
    <div class="outer-2"></div>
    <div class="parent-1"></div>
    <div class="parent-2"></div>
    <div class="packed-1"></div>
    <div class="packed-2"></div>
  </div>
</div>
