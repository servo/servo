<!DOCTYPE html>
<title>Multi-lane column grid-lanes fragmentation with multiple densely packed spanners</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    flow-tolerance: 0;
    grid-auto-flow: dense;
    grid-lanes-pack: dense;
    grid-template-columns: repeat(4, 12.5px);
    width: 50px;
  }
  .outer-1 {
    grid-column: 1;
    height: 120px;
  }
  .outer-2 {
    grid-column: 4;
    height: 120px;
  }
  .parent-1 {
    grid-column: 1 / span 2;
    height: 80px;
  }
  .parent-2 {
    grid-column: 3 / span 2;
    height: 80px;
  }
  .packed-1 {
    grid-column: 2 / span 2;
    height: 60px;
  }
  .packed-2 {
    grid-column: 2 / span 2;
    height: 60px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div class="outer-1"></div>
    <div class="outer-2"></div>
    <div class="parent-1"></div>
    <div class="parent-2"></div>
    <div class="packed-1"></div>
    <div class="packed-2"></div>
  </div>
</div>
