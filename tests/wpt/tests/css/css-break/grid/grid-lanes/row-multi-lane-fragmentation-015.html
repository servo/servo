<!DOCTYPE html>
<title>
  Multi-lane row grid-lanes fragmentation with multiple spanners of varying size.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 5;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: 75px 125px 60px 140px 50px 50px;
    width: 20px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="width: 12px;"></div>
    <div style="grid-row: 1; width: 8px;"></div>
    <div style="grid-row: 2 / span 2; width: 14px;"></div>
    <div style="grid-row: 2 / span 2; width: 6px;"></div>
    <div style="grid-row: 4 / span 3; width: 20px;"></div>
  </div>
</div>
