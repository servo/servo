<!DOCTYPE html>
<title>Row grid-lanes honor break-after avoidance by selecting an earlier row</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-early-breaks-001-ref.html">
<style>
  .multicol { columns: 2; column-gap: 0; column-fill: auto; width: 160px; height: 100px; background: lightgray; }
  .lanes { display: grid-lanes; grid-template-rows: repeat(3, 40px); width: 80px; }
  .lanes > div { width: 80px; }
</style>
<div class="multicol">
  <div class="lanes">
    <div style="grid-row: 1; background: orange;"></div>
    <div style="grid-row: 2; background: teal; break-after: avoid;"></div>
    <div style="grid-row: 3; background: purple; break-inside: avoid;"></div>
  </div>
</div>
