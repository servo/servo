<!DOCTYPE html>
<title>
  Column grid-lanes OOF static position with padding and alignment.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: green;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    position: relative;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: 25px 25px;
    height: 190px;
    padding-top: 10px;
    position: relative;
    width: 50px;
  }
  .grid-lanes > div {
    background: green;
    height: 100px;
    width: 25px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="position: absolute; align-self: center; width: 50px; padding-top: 10px;"></div>
    <div style="height: 45px;"></div>
    <div style="height: 45px;"></div>
    <div style="background: red;"></div>
    <div style="background: red;"></div>
    <div style="height: 45px;"></div>
    <div style="height: 45px;"></div>
  </div>
</div>
