<!DOCTYPE html>
<title>Nested flex fragmentation expands an auto grid-lanes row</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-expansion-003-ref.html">
<style>
  .multicol { columns: 2; column-gap: 0; column-fill: auto; width: 160px; height: 100px; background: lightgray; }
  .lanes { display: grid-lanes; grid-template-rows: auto auto; width: 80px; }
  .lanes > div { width: 40px; }
</style>
<div class="multicol">
  <div class="lanes">
    <div style="grid-row: 1; display: flex; flex-direction: column; background: orange;">
      <div style="flex: none; height: 60px;"></div>
      <div style="flex: none; height: 60px; break-before: column;"></div>
    </div>
    <div style="grid-row: 1; background: teal;"></div>
    <div style="grid-row: 2; width: 80px; height: 20px; background: purple;"></div>
  </div>
</div>
