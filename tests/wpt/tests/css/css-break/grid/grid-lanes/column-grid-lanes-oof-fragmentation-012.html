<!DOCTYPE html>
<title>
  Column grid lanes fragmentation: OOF static position with alignment and expansion.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: 50px;
    position: relative;
    width: 50px;
  }
  .grid-lanes > div {
    width: 50px;
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; columns: 2; column-fill: auto; column-gap: 0;">
  <div class="grid-lanes">
    <div style="position: absolute; align-self: center; height: 100px; background: green;"></div>
    <div style="height: 50px;">
      <div style="height: 50px;"></div>
      <div style="height: 50px; background: red;"></div>
    </div>
    <div style="height: 50px; break-before: column; background: red;"></div>
    <div style="height: 50px;"></div>
  </div>
</div>
