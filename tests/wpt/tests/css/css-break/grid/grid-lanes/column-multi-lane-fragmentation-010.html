<!DOCTYPE html>
<title>
  Multi-lane column grid-lanes fragmentation with unequal item counts before a spanner.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 25px);
    height: 200px;
    width: 50px;
    position: relative;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="position: absolute; top: 30px; height: 50px; width: 25px;"></div>
    <div style="height: 30px;"></div>
    <div style="height: 80px;"></div>
    <div style="grid-column: 1 / span 2; height: 70px;"></div>
    <div style="height: 50px;"></div>
    <div style="height: 50px;"></div>
  </div>
</div>
