<!DOCTYPE html>
<title>Multi-lane row grid-lanes fragmentation with fill-reverse and track-reverse dense packing</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="row-multi-lane-fragmentation-021-ref.html">
<style>
  .multicol {
    column-count: 3;
    column-fill: auto;
    column-gap: 0;
    height: 30px;
    width: 150px;
  }
  .grid-lanes {
    display: grid-lanes;
    flow-tolerance: 0;
    grid-auto-flow: dense;
    grid-lanes-direction: row fill-reverse track-reverse;
    grid-lanes-pack: dense;
    grid-template-rows: 4px 43px 43px;
    width: 50px;
  }
  .first {
    background: #20b2aa;
    width: 30px;
  }
  .parent {
    background: #87cefa;
    grid-row: 2 / span 2;
    width: 20px;
  }
  .packed-1 {
    background: #ffd700;
    grid-row: 2;
    width: 18px;
  }
  .packed-2 {
    background: #ff8c00;
    grid-row: 2;
    width: 12px;
  }
</style>
<p>Test passes if the two rectangles are identical.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div class="first"></div>
    <div class="parent"></div>
    <div class="packed-1"></div>
    <div class="packed-2"></div>
  </div>
</div>
