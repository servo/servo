<!DOCTYPE html>
<title>Reference for two expanded grid-lanes rows</title>
<style>
  .columns { position: relative; width: 240px; height: 100px; background: lightgray; }
  .columns > div { position: absolute; width: 40px; }
</style>
<div class="columns">
  <div style="left: 0; top: 0; height: 100px; background: orange;"></div>
  <div style="left: 40px; top: 0; height: 100px; background: teal;"></div>
  <div style="left: 80px; top: 0; height: 60px; background: orange;"></div>
  <div style="left: 120px; top: 0; height: 60px; background: teal;"></div>
  <div style="left: 80px; top: 60px; height: 40px; background: purple;"></div>
  <div style="left: 120px; top: 60px; height: 40px; background: blue;"></div>
  <div style="left: 160px; top: 0; height: 10px; background: purple;"></div>
  <div style="left: 200px; top: 0; height: 10px; background: blue;"></div>
</div>
