<!DOCTYPE html>
<title>
  Multi-lane column fragmentation with stacking-axis stretch above a spanner.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#alignment">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    align-items: stretch;
    display: grid-lanes;
    grid-template-columns: repeat(2, 25px);
    height: 200px;
    width: 50px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="height: 150px;"></div>
    <!-- The spanner opens 100px of extra alignment space for the auto-height item. -->
    <div>
      <div style="height: 50px;"></div>
    </div>
    <div style="grid-column: 1 / span 2; height: 50px;"></div>
  </div>
</div>
