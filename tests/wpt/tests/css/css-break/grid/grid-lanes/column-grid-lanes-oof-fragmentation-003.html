<!DOCTYPE html>
<title>
  OOF static pos in fragmented column grid-lanes container, with align end.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 4;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
    position: relative;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: 25px;
    height: 400px;
    width: 25px;
  }
  .grid-lanes > div {
    background: green;
    height: 100px;
    width: 25px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="position: absolute; align-self: end;"></div>
    <div></div>
    <div></div>
    <div></div>
    <div style="background: red;"></div>
  </div>
</div>
