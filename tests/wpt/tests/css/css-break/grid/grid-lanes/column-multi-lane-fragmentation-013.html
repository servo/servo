<!DOCTYPE html>
<title>
  Multi-lane column grid-lanes fragmentation with fragmented overflowing content inside a spanner.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 25px);
    height: 200px;
    width: 50px;
  }
  .spanner {
    grid-column: 1 / span 2;
    height: 100px;
  }
  .spanner > div {
    background: green;
    height: 50px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div class="spanner">
      <div style="height: 100px;"></div>
      <div style="background: red;"></div>
      <div></div>
    </div>
    <div class="spanner">
      <div></div>
    </div>
  </div>
</div>
