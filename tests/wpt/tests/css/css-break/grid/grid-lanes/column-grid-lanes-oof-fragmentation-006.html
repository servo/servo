<!DOCTYPE html>
<title>
  OOFs positioned in a fragmented column grid-lanes container.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .abs {
    background: green;
    position: absolute;
    height: 200px;
    width: 25px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="columns: 4; column-gap: 0px; column-fill: auto; width: 100px; height: 100px;">
  <div style="display: grid-lanes; grid-template-columns: 25px; height: 400px; position: relative;">
    <div style="height: 100px; width: 25px; background: red;"></div>
    <div style="width: 25px; background: red;">
      <div style="height: 100px; width: 25px;"></div>
      <div class="abs" style="top: 0;"></div>
      <div style="height: 100px; width: 25px;"></div>
    </div>
    <div style="height: 100px; width: 25px; background: red;"></div>
    <div class="abs" style="bottom: 0;"></div>
  </div>
</div>
