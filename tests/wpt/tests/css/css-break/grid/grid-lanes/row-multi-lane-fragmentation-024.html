<!DOCTYPE html>
<title>
  Row fragmentation with a stretched spanner before another spanner.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#alignment">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 4;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: repeat(4, 100px);
    height: 400px;
    justify-items: stretch;
    width: 25px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <!-- This two-row spanner must stretch from 5px to 15px in the inline axis. -->
    <div style="grid-row: 1 / span 2; height: 200px;">
      <div style="height: 50px; width: 5px;"></div>
    </div>
    <div style="grid-row: 3 / span 2; height: 200px; width: 15px;"></div>
    <div style="grid-row: 1 / span 4; width: 10px;"></div>
  </div>
</div>
