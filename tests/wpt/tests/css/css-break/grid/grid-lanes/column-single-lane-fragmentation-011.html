<!DOCTYPE html>
<title>
  Tests that expansion due to fragmentation accumulates across reordered grid-lanes items.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; columns: 4; column-gap: 0; column-fill: auto; background: red;">
  <div style="display: grid-lanes; grid-template-columns: 25px;">
    <div style="background: green;">
      <div style="contain: size; width: 25px; height: 60px;"></div>
      <div style="contain: size; width: 25px; height: 30px;"></div>
    </div>
    <div style="background: green; order: -1;">
      <div style="contain: size; width: 25px; height: 80px;"></div>
      <div style="contain: size; width: 25px; height: 30px;"></div>
    </div>
    <div style="background: green; height: 170px;"></div>
  </div>
</div>
