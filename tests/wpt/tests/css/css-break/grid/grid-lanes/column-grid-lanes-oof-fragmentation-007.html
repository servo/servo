<!DOCTYPE html>
<title>
  Nested OOFs in multi-lane column grid-lanes fragmentation.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 5;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: 10px 10px;
    height: 500px;
    width: 20px;
    position: relative;
  }
  .grid-lanes > div {
    height: 500px;
    width: 10px;
  }
  .abs {
    background: green;
    position: absolute;
    width: 10px;
    bottom: 0;
    top: 0;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div>
      <div class="abs"></div>
    </div>
    <div style="position: relative;">
      <div class="abs"></div>
    </div>
  </div>
</div>
