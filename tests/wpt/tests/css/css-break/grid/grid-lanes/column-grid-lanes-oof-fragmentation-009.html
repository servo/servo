<!DOCTYPE html>
<title>
  Column grid-lanes OOF alignment uses the intrinsic block size.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .abs {
    align-self: end;
    background: green;
    height: 100px;
    position: absolute;
    width: 50px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="columns: 2; column-gap: 0px; column-fill: auto; width: 100px; height: 100px;">
  <div style="display: grid-lanes; grid-template-columns: 50px; position: relative;">
    <div class="abs"></div>
    <div style="height: 100px; width: 50px; background: green;"></div>
    <div style="height: 100px; width: 50px; background: red;"></div>
  </div>
</div>
