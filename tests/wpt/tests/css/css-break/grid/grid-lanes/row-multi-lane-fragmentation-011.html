<!DOCTYPE html>
<title>
  Multi-lane row grid-lanes fragmentation with unequal item counts before a spanner.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: repeat(2, 100px);
    height: 200px;
    width: 50px;
    position: relative;
  }
  .grid-lanes > div {
    background: green;
    width: 10px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="position: absolute; left: 10px; width: 20px; height: 100px;"></div>
    <div></div>
    <div style="width: 30px;"></div>
    <div style="grid-row: 1 / span 2;"></div>
    <div></div>
    <div></div>
  </div>
</div>
