<!DOCTYPE html>
<title>Column grid-lanes dense-packed items above an early break are not repeated</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-break/#breaking-rules">
<link rel="match" href="column-early-breaks-010-ref.html">
<style>
  .multicol {
    background: green;
    columns: 2;
    column-fill: auto;
    column-gap: 0;
    width: 80px;
    height: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 20px);
    grid-lanes-pack: dense;
    width: 40px;
  }
  .grid-lanes > div {
    break-inside: avoid;
  }
</style>
<p>The colored rectangles on the green background must match the reference.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="grid-column: 1; height: 20px;"></div>
    <div style="grid-column: span 2; height: 40px; background: blue;"></div>
    <div style="grid-column: 1; height: 60px; background: orange; break-before: avoid;"></div>
    <div style="grid-column: 2; height: 20px; background: purple;"></div>
  </div>
</div>
