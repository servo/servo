<!DOCTYPE html>
<title>
  Tests that grid-lanes items in multiple lanes get pushed down due to a previous
  item expanding as a result of fragmentation with margin-top.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; columns: 5; column-gap: 0; column-fill: auto; background: red;">
  <div style="display: grid-lanes; grid-template-columns: repeat(2, 10px);">
    <div style="grid-column: 1; background: green; width: 10px;">
      <div style="contain: size; width: 10px; height: 80px;"></div>
      <div style="contain: size; width: 10px; height: 30px;"></div>
    </div>
    <div style="grid-column: 1; position: relative; background: green; width: 10px;">
      <div style="contain: size; width: 10px; height: 70px;"></div>
      <div style="contain: size; width: 10px; height: 40px;"></div>
      <div style="position: absolute; width: 10px; height: 60px; background: green;"></div>
    </div>
    <div style="grid-column: 1; margin-top: 10px; background: green; width: 10px;">
      <div style="contain: size; width: 10px; height: 80px;"></div>
      <div style="contain: size; width: 10px; height: 40px;"></div>
    </div>
    <div style="grid-column: 1; height: 100px; background: green; width: 10px;"></div>
    <div style="grid-column: 2; height: 60px; background: green; width: 10px;"></div>
    <div style="grid-column: 2; margin-top: 10px; position: relative; background: green; width: 10px;">
      <div style="position: absolute; top: -10px; width: 10px; height: 10px; background: green;"></div>
      <div style="contain: size; width: 10px; height: 30px;"></div>
      <div style="contain: size; width: 10px; height: 80px;"></div>
      <div style="position: absolute; width: 10px; height: 20px; background: green;"></div>
    </div>
    <div style="grid-column: 2; background: green; width: 10px;">
      <div style="contain: size; width: 10px; height: 40px;"></div>
      <div style="contain: size; width: 10px; height: 70px;"></div>
    </div>
    <div style="grid-column: 2; position: relative; background: green; width: 10px;">
      <div style="contain: size; width: 10px; height: 30px;"></div>
      <div style="contain: size; width: 10px; height: 80px;"></div>
      <div style="contain: size; width: 10px; height: 40px;"></div>
      <div style="position: absolute; bottom: 0px; left: -10px; width: 20px; height: 40px; background: white;"></div>
    </div>
  </div>
</div>
