<!DOCTYPE html>
<title>Column grid-lanes forced breaks during the initial balancing pass</title>
<meta name="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com" />
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-break/#breaking-rules">
<link rel="match" href="column-early-breaks-013-ref.html">
<style>
  .frame {
    background: green;
    width: 80px;
    height: 100px;
  }
  .multicol {
    columns: 2;
    column-fill: balance;
    column-gap: 0;
    width: 80px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 20px);
    width: 40px;
  }
  .grid-lanes > div {
    break-inside: avoid;
  }
</style>
<p>The colored rectangles on the green background must match the reference.</p>
<div class="frame">
  <div class="multicol">
    <div class="grid-lanes">
      <div style="grid-column: 1; height: 20px;"></div>
      <div style="grid-column: 1; height: 40px; background: orange; break-before: column;"></div>
      <div style="grid-column: 1; height: 20px; background: purple;"></div>
    </div>
  </div>
</div>
