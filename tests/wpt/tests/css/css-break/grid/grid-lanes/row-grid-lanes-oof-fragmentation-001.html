<!DOCTYPE html>
<title>
  Row grid-lanes fragmentation: OOF static position with align end.
</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: 100px 100px;
    position: relative;
    width: 50px;
  }
  .grid-lanes > div {
    background: green;
    height: 100px;
    width: 50px;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div style="position: absolute; align-self: end;"></div>
    <div style="grid-row: 1;"></div>
    <div style="grid-row: 2; background: red;"></div>
  </div>
</div>
