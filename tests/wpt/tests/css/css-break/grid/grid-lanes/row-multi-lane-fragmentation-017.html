<!DOCTYPE html>
<title>Multi-lane row grid-lanes fragmentation with densely packed items</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<style>
  .multicol {
    background: red;
    column-count: 2;
    column-fill: auto;
    column-gap: 0;
    height: 100px;
    width: 100px;
  }
  .grid-lanes {
    display: grid-lanes;
    flow-tolerance: 0;
    grid-auto-flow: dense;
    grid-lanes-pack: dense;
    grid-template-rows: 50px 50px 100px;
    width: 50px;
  }
  .item-1 {
    width: 20px;
  }
  .item-2 {
    width: 20px;
  }
  .item-3 {
    width: 40px;
  }
  .parent {
    grid-row: span 3;
    width: 10px;
  }
  .packed {
    grid-row: span 2;
    width: 20px;
  }
  .grid-lanes > div {
    background: green;
  }
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div class="multicol">
  <div class="grid-lanes">
    <div class="item-1"></div>
    <div class="item-2"></div>
    <div class="item-3"></div>
    <div class="parent"></div>
    <div class="packed"></div>
  </div>
</div>
