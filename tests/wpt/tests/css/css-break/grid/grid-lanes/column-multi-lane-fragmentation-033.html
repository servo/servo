<!DOCTYPE html>
<title>Multi-lane column grid-lanes fragmentation where an expanding densely packed item pushes a spanner</title>
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#pagination">
<link rel="match" href="../../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; columns: 2; column-gap: 0; column-fill: auto; background: red;">
  <div style="display: grid-lanes; grid-template-columns: repeat(2, 25px); width: 50px; fit-tolerance: 0; grid-auto-flow: dense; grid-lanes-pack: dense;">
    <div style="height: 110px; position: relative; background: green;">
      <div style="position: absolute; top: 110px; width: 25px; height: 20px; background: green;"></div>
    </div>
    <div style="height: 40px; background: green;"></div>
    <div style="grid-column: span 2; height: 70px; background: green;"></div>
    <div style="grid-column: 2; line-height: 0; background: green;">
      <div style="display: inline-block; width: 25px; height: 40px;"></div>
      <div style="display: inline-block; width: 25px; height: 30px;"></div>
    </div>
  </div>
</div>
