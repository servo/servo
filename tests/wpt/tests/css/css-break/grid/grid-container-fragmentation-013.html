<title>CSS Grid: alignment overflowing fragmentainer</title>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="width: 100px; height: 100px; overflow: hidden; columns: 2; column-gap: 0; background: red;">
  <div style="display: grid; height: 200px; align-content: center;">
    <div style="height: 300px; background: green;"></div>
  </div>
</div>
