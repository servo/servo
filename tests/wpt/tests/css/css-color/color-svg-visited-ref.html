<!DOCTYPE html>
<html>
<meta charset="utf-8">
<title>SVG effects should render with visited information</title>
<style>
  #unvisited {
    color: green;
  }
  #visited {
    color: red;
  }
</style>
<span id="unvisited">
  <svg width="100px" height="100px">
    <defs>
      <filter id="flood-unvisited" x="0" y="0" width="100%" height="100%">
        <feFlood flood-color="currentColor" flood-opacity="0.1" />
      </filter>
      <filter id="lighting-unvisited" x="0" y="0" width="100%" height="100%">
        <feDiffuseLighting in="SourceGraphic" lighting-color="currentColor" surfaceScale="4">
          <fePointLight x="100" y="100" z="100" />
        </feDiffuseLighting>
      </filter>
      <linearGradient id="stop-unvisited" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="white" />
        <stop offset="100%" stop-color="currentColor" />
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="50" height="50" filter="url(#lighting-unvisited)"/>
    <rect x="50" y="0" width="50" height="50" filter="url(#flood-unvisited)"/>
    <rect x="0" y="50" width="50" height="50" fill="url(#stop-unvisited)"/>
  </svg>
</span>
<span id="visited">
  <svg width="100px" height="100px">
    <defs>
      <filter id="flood-visited" x="0" y="0" width="100%" height="100%">
        <feFlood flood-color="currentColor" flood-opacity="0.1" />
      </filter>
      <filter id="lighting-visited" x="0" y="0" width="100%" height="100%">
        <feDiffuseLighting in="SourceGraphic" lighting-color="currentColor" surfaceScale="4">
          <fePointLight x="100" y="100" z="100" />
        </feDiffuseLighting>
      </filter>
      <linearGradient id="stop-visited" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="white" />
        <stop offset="100%" stop-color="currentColor" />
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="50" height="50" filter="url(#lighting-visited)"/>
    <rect x="50" y="0" width="50" height="50" filter="url(#flood-visited)"/>
    <rect x="0" y="50" width="50" height="50" fill="url(#stop-visited)"/>
  </svg>
</span>
