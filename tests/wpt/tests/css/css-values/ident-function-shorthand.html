<!DOCTYPE html>
<title>CSS Values: The ident() function in shorthands</title>
<link rel="help" href="https://drafts.csswg.org/css-values-5/#ident">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/shorthand-testcommon.js"></script>
<div id="t1"></div>
<script>
  test_shorthand_value('animation', 'ident("--pa" "ss") 2s', {
    'animation-delay': '',
    'animation-direction': '',
    'animation-duration': '',
    'animation-fill-mode': '',
    'animation-iteration-count': '',
    'animation-name': '',
    'animation-play-state': '',
    'animation-range-end': '',
    'animation-range-start': '',
    'animation-timeline': '',
    'animation-timing-function': ''
  });

  test(() => {
    t1.style.animation = 'ident("--pa" "ss") 2s';
    const t1_style = getComputedStyle(t1);
    assert_equals(t1_style.animationName, '--pass');
    assert_equals(t1_style.animationDuration, '2s');
  }, 'ident() function in animation shorthand for animation-name');
</script>
