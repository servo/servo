<!DOCTYPE html>
<title>CSS Values: round() of a percentage inside calc() on background-size</title>
<link rel="help" href="https://drafts.csswg.org/css-values-4/#round-func">
<link rel="help" href="https://drafts.csswg.org/css-values-4/#calc-type-checking">
<link rel="match" href="../reference/ref-filled-green-100px-square.xht">
<meta name="assert" content="The percentage inside round() resolves against the height of the background positioning area, not against an assumed size.">
<style>
#target {
  width: 100px;
  height: 400px;
  background: linear-gradient(green, green) no-repeat;
  /* round(up, 400px / 110px) = 4, so the image is 400px / 4 = 100px tall. */
  background-size: 100% calc(100% / round(up, 100% / 110px));
}
</style>
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div id="target"></div>
