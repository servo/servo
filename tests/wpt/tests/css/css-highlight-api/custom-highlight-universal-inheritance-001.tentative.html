<!DOCTYPE html>
<meta charset="UTF-8">
<title>Custom Highlight: ::highlight(*) on :root reaches a named highlight on a descendant</title>
<link rel="author" href="mailto:seokho@chromium.org">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/9091">
<link rel="match" href="custom-highlight-universal-inheritance-001.tentative-ref.html">
<meta name="assert" value="A named highlight with no rule on its ancestors inherits from the ancestor's ::highlight(*) style.">
<style>
  :root::highlight(*) {
    background-color: pink;
  }
  div::highlight(foo) {
    color: green;
  }
</style>
<body>
<div>One two three…</div>
<script>
  let div = document.querySelector("div");
  let r = new Range();
  r.setStart(div.firstChild, 0);
  r.setEnd(div.firstChild, 8);

  CSS.highlights.set("foo", new Highlight(r));
</script>
