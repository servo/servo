<!DOCTYPE html>
<title>backface visibility: hidden on an untransformed element in a 3D rendering context hides its descendants</title>
<link rel="help" href="https://drafts.csswg.org/css-transforms-2/#propdef-backface-visibility">
<link rel="match" href="backface-visibility-hidden-003-ref.html">

<p>The test passes if there is a green rectangle and no red.</p>
<style>
.background {
  width: 100px;
  height: 100px;
  background-color: green;
}

.flipper {
  width: 100px;
  height: 100px;
  margin-top: -100px;
  transform-style: preserve-3d;
  transform: rotateY(180deg);
}

.hidden {
  backface-visibility: hidden;
}

.inner {
  width: 100px;
  height: 100px;
  background-color: red;
}

</style>

<div class="background"></div>
<div class="flipper">
  <div class="hidden">
    <div class="inner"></div>
  </div>
</div>
