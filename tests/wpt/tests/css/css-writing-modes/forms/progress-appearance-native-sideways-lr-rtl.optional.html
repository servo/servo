<!DOCTYPE html>
<link rel="author" title="Anne van Kesteren" href="mailto:annevk@annevk.nl">
<link rel="help" href="https://html.spec.whatwg.org/#the-progress-element-2">
<link rel="help" href="https://drafts.csswg.org/css-writing-modes-4/#valdef-writing-mode-sideways-lr">
<title>Progress appearance native writing mode sideways-lr & RTL direction</title>
<meta charset="utf-8">
<link rel="match" href="progress-appearance-native-sideways-lr-rtl-ref.html">
<link rel="mismatch" href="progress-appearance-native-sideways-lr-ref.html">

<!-- The start is on the inline-start side, which is the top here. The match reference has the same
     inline and block flow directions, using vertical-lr; the mismatch reference has the opposite
     inline direction. -->
<p>The progress element below should match the correct writing mode.</p>
<progress value="70" min="0" max="100" style="writing-mode: sideways-lr; direction: rtl"></progress>
