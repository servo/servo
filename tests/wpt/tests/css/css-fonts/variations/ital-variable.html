<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: Variable fonts with an italic axis</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-prop">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="match" href="ital-variable-ref.html">
<meta name="assert" content="The italic keyword activates the ital axis, while oblique uses the slnt axis">
<!-- Fonts used in this test are authored by Stephen Nixon. More information:
https://arrowtype.github.io/vf-slnt-test/index.html -->
<style>
  @font-face {
    font-family: "ital test font";
    src: url("resources/FontStyleTest-ital-VF.woff2");
    font-style: italic;
  }

  @font-face {
    font-family: "ital and slnt italic test font";
    src: url("resources/FontStyleTest-slnt_ital-VF.woff2");
    font-style: italic;
  }

  @font-face {
    font-family: "ital and slnt oblique test font";
    src: url("resources/FontStyleTest-slnt_ital-VF.woff2");
    font-style: oblique 0deg 15deg;
  }

  .test {
    font-size: 3em;
  }

  .ital {
    font-family: "ital test font";
    font-style: italic;
  }

  .ital-and-slnt-italic {
    font-family: "ital and slnt italic test font";
    font-style: italic;
  }

  .ital-and-slnt-oblique {
    font-family: "ital and slnt oblique test font";
    font-style: oblique;
  }
</style>

<p class="test ital">varfont</p>
<p class="test ital-and-slnt-italic">varfont</p>
<p class="test ital-and-slnt-oblique">varfont</p>
