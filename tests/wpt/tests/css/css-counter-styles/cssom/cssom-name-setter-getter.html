<!DOCTYPE html>
<title>CSSCounterStyleRule name setter updates the name getter and cssText</title>
<link rel="help" href="https://www.w3.org/TR/css-counter-styles-3/#the-csscounterstylerule-interface">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
function getRule() {
  const style = document.createElement('style');
  style.textContent = '@counter-style foo { system: fixed; symbols: A B C; }';
  document.head.appendChild(style);
  const rule = style.sheet.cssRules[0];
  assert_equals(rule.constructor.name, 'CSSCounterStyleRule');
  return rule;
}

test(() => {
  const rule = getRule();
  assert_equals(rule.name, 'foo');
  rule.name = 'bar';
  assert_equals(rule.name, 'bar');
}, 'Setting name is reflected by the name getter');

test(() => {
  const rule = getRule();
  rule.name = 'bar';
  assert_true(rule.cssText.startsWith('@counter-style bar {'), rule.cssText);
}, 'Setting name is reflected in cssText');

test(() => {
  const rule = getRule();
  rule.name = 'bar';
  rule.name = 'baz';
  assert_equals(rule.name, 'baz');
}, 'Setting name repeatedly is reflected by the name getter');

test(() => {
  const rule = getRule();
  rule.name = '123';
  rule.name = 'none';
  rule.name = '';
  assert_equals(rule.name, 'foo');
  assert_true(rule.cssText.startsWith('@counter-style foo {'), rule.cssText);
}, 'Setting an invalid name leaves the name unchanged');
</script>
