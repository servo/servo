<!-- Required range, for contrast with the rows below -->
<div>&#x96f6;</div>
<div>&#x4e00;</div>
<div>&#x4e5d;</div>
<div>&#x5341;</div>
<div>&#x5341;&#x4e00;</div>

<div>&#x4e8c;&#x5341;</div>
<div>&#x767e;</div>

<div>&#x767e;&#x5341;</div>
<div>&#x5343;</div>
<div>&#x5343;&#x4e00;</div>
<div>&#x5343;&#x5341;</div>
<div>&#x5343;&#x767e;</div>
<div>&#x4e5d;&#x5343;&#x4e5d;&#x767e;&#x4e5d;&#x5341;&#x4e5d;</div>

<!-- Second group marker, and the digit markers inside that group -->
<div>&#x842c;</div>
<div>&#x842c; &#x4e00;</div>
<div>&#x842c; &#x5341;</div>
<div>&#x842c; &#x767e;</div>

<div>&#x4e5d;&#x842c; &#x4e5d;&#x5343;&#x4e5d;&#x767e;&#x4e5d;&#x5341;&#x4e5d;</div>

<!-- Third group marker, and zeros collapsing across groups -->
<div>&#x767e;&#x842c;</div>
<div>&#x4e00;&#x5104;</div>
<div>&#x4e00;&#x5104; &#x4e00;</div>
<div>&#x4e00;&#x5104; &#x5341;&#x842c;</div>
<div>&#x4e00;&#x5104; &#x5343;&#x842c;</div>
<div>&#x4e00;&#x5104; &#x4e8c;&#x5343;&#x4e09;&#x767e;&#x56db;&#x5341;&#x4e94;&#x842c; &#x516d;&#x5343;&#x4e03;&#x767e;&#x516b;&#x5341;&#x4e5d;</div>
<div>&#x4e5d;&#x5104; &#x4e5d;&#x5343;&#x4e5d;&#x767e;&#x4e5d;&#x5341;&#x4e5d;&#x842c; &#x4e5d;&#x5343;&#x4e5d;&#x767e;&#x4e5d;&#x5341;&#x4e5d;</div>

<!-- The top of the range a counter value can reach -->
<div>&#x5341;&#x5104;</div>
<div>&#x4e8c;&#x5341;&#x4e00;&#x5104; &#x56db;&#x5343;&#x4e03;&#x767e;&#x56db;&#x5341;&#x516b;&#x842c; &#x4e09;&#x5343;&#x516d;&#x767e;&#x56db;&#x5341;&#x516d;</div>
<div>&#x4e8c;&#x5341;&#x4e00;&#x5104; &#x56db;&#x5343;&#x4e03;&#x767e;&#x56db;&#x5341;&#x516b;&#x842c; &#x4e09;&#x5343;&#x516d;&#x767e;&#x56db;&#x5341;&#x4e03;</div>
