<!DOCTYPE html>
<meta charset="UTF-8">
<title>CSS Test: symbols function, used in counter()</title>
<link rel="author" title="Xidorn Quan" href="https://www.upsuper.org/">
<link rel="help" href="https://drafts.csswg.org/css-counter-styles-3/#symbols-function">
<link rel="match" href="used-in-counter-ref.html">
<link rel="stylesheet" href="../counter-style-at-rule/support/test-common.css">
<style>
  .counter {
    list-style-type: none;
    counter-reset: a;
  }
  .counter li {
    counter-increment: a;
    padding-right: .5em;
  }
  .counter li::after {
    content: counter(a, symbols('*'));
  }
</style>
<ol class="counter">
  <li><li><li><li><li>
</ol>
