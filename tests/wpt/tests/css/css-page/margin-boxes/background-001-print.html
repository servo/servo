<!DOCTYPE html>
<html class="reftest-wait">
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-page-3/#painting">
<meta name="assert" content="Test background image">
<link rel="match" href="background-001-print-ref.html">
<script src="/common/reftest-wait.js"></script>

<!--
  Wait for the preloaded image before taking the reftest snapshot, since the
  image is otherwise only referenced in the @page margin box rule.
-->
<link rel="preload" as="image" href="/images/green.png" onload="takeScreenshot()">

<style>
  @page {
    margin: 4em;

    @top-center {
      content: "";
      background: url(/images/green.png);
    }
  }
  :root {
    print-color-adjust: exact;
  }
  body {
    margin: 0;
  }
</style>
The background of the top page margin area should be lime.
