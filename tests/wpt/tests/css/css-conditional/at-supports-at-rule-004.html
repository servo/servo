<!doctype html>
<title>CSS Conditional Test: @supports at-rule() with non-existent at-rule</title>
<link rel="help" href="https://drafts.csswg.org/css-conditional/#support-definition-at-rules">
<link rel="match" href="at-supports-001-ref.html">
<style>
  div {
    background-color:green;
    height:100px;
    width:100px;
  }
  @supports at-rule(@doesnotexist) {
    div { background: red };
  }
</style>
<p>Test passes if there is a <strong>filled green square</strong> and <strong>no red</strong>.</p>
<div></div>
