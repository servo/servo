<!DOCTYPE html>
<title>CSS Conditional Test: size container change applying ::first-letter from outside of container </title>
<link rel="help" href="https://drafts.csswg.org/css-conditional-5/#container-queries">
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#first-letter-pseudo">
<link rel="match" href="/css/reference/pass_if_letter_uppercase.html">
<style>
  #container {
    container-type: inline-size;
    width: 500px;
  }
  #outer::first-letter {
    text-transform: uppercase;
  }
  @container (width > 400px) {
    #inner::first-letter {
      text-transform: lowercase;
    }
  }
</style>
<p>Test passes if the letter "F" in the words "Filler Text" below is in upper-case.</p>
<div id="outer">
  <div id="container">
    <div id="inner">filler Text</div>
  </div>
</div>
<script>
  container.offsetTop;
  container.style.width = "200px";
</script>
