<!DOCTYPE html>
<link rel="author" title="Andrew Martinez" href="https://github.com/AndrewJMart">
<link rel="help" href="https://drafts.csswg.org/css-sizing-4/#sizing-properties">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
<script>
  // min-size is a shorthand for min-width and min-height. test_invalid_value()
  // specifies values outside the min-width grammar, which should be invalid.
  // none belongs to the max dimensions, so min-size does not accept it.
  test_invalid_value("min-size", "none");
  test_invalid_value("min-size", "none none");
  test_invalid_value("min-size", "complex");
  // Negative and unitless lengths are invalid in either dimension.
  test_invalid_value("min-size", "-10px");
  test_invalid_value("min-size", "10px -20px");
  test_invalid_value("min-size", "60");
  // min-size accepts at most two values.
  test_invalid_value("min-size", "10px 20px 30px");
  test_invalid_value("min-size", "auto auto auto");
  // available and border-box come from the obsolete css-box-3 definition of
  // min-width, and were never part of the shorthand's grammar.
  test_invalid_value("min-size", "available");
  test_invalid_value("min-size", "10px border-box");
</script>
