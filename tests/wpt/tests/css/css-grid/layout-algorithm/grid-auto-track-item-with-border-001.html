<!DOCTYPE html>
<meta charset="utf-8">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#algo-content">
<link rel="help" href="https://drafts.csswg.org/css-grid-1/#item-margins">
<link rel="match" href="grid-auto-track-item-with-border-001-ref.html">
<meta name="assert" content="An auto track is sized to the border-box of its item, with a different border on each side.">
<link rel="stylesheet" href="/fonts/ahem.css">
<html>
<head>
<style>
.grid {
    display: grid;
    grid-template-columns: auto 50px;
    grid-template-rows: auto 40px;
}
.borderedItem {
    grid-row: 1 / 2;
    grid-column: 1 / 2;
    border-width: 13px 27px 31px 9px;
    border-style: solid;
    font: 20px/1 Ahem;
}
.filler {
    grid-row: 2 / 3;
    grid-column: 2 / 3;
}
</style>
</head>
<body>
<div class="grid">
    <div class="borderedItem">xx</div>
    <div class="filler"></div>
</div>
</body>
</html>
