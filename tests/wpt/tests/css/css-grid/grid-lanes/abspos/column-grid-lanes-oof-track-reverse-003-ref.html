<!DOCTYPE html>
<meta charset="utf-8">
<style>
  html, body {
    font: 16px/1 monospace;
    background: white;
  }
  .container {
    width: 200px;
    height: 200px;
    outline: 1px solid black;
    position: relative;
  }
  .oof {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    right: 0;
    width: 20px;
    height: 20px;
    background: red;
  }
</style>
<div class="container">
  <div class="oof" style="top: 0;">1</div>
  <div class="oof" style="top: 90px;">2</div>
  <div class="oof" style="bottom: 0;">3</div>
</div>
