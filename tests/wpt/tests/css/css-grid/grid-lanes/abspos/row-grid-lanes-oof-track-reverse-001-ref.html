<!DOCTYPE html>
<meta charset="utf-8">
<style>
  html, body {
    font: 16px/1 monospace;
    background: white;
  }
  .container {
    height: 200px;
    outline: 1px solid black;
    position: relative;
  }
  .item {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 80px;
    top: 0;
    background: lightblue;
  }
  .oof {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 20px;
    background: red;
  }
</style>
<div class="container">
  <div class="item" style="left: 0;">1</div>
  <div class="item" style="left: 50px;">2</div>
  <div class="item" style="left: 100px;">3</div>
  <div class="oof" style="left: 0;"></div>
  <div class="oof" style="left: 50px;"></div>
  <div class="oof" style="right: 0;"></div>
</div>
