<!DOCTYPE html>
<meta charset="utf-8">
<style>
  html, body {
    font: 16px/1 monospace;
    background: white;
  }
  .container {
    width: 200px;
    height: 90px;
    outline: 1px solid black;
    position: relative;
  }
  .item {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 40px;
    background: lightblue;
  }
  .oof {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
  }
</style>
<div class="container">
  <div class="item" style="left: 90px; top: 0;">1</div>
  <div class="item" style="left: 0; top: 0;">2</div>
  <div class="item" style="left: 90px; top: 50px;">3</div>
  <div class="item" style="left: 0; top: 50px;">4</div>
  <div class="oof" style="left: 180px; top: 0;"></div>
  <div class="oof" style="left: 150px; top: 35px;"></div>
  <div class="oof" style="left: 60px; top: 70px;"></div>
</div>
