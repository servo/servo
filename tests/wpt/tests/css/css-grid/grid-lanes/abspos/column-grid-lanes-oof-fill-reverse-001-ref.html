<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .container {
      width: 200px;
      height: 140px;
      outline: 1px solid black;
      position: relative;
    }

    .item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 40px;
      left: 0;
      background: lightblue;
    }

    .oof {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item" style="top: 100px;">1</div>
    <div class="item" style="top: 50px;">2</div>
    <div class="item" style="top: 0px;">3</div>
    <div class="oof" style="top: 120px; left: 0px;"></div>
    <div class="oof" style="top: 120px; left: 90px;"></div>
    <div class="oof" style="top: 120px; right: 0px;"></div>
  </div>
</body>
</html>
