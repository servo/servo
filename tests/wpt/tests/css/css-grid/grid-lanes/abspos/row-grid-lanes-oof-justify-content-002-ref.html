<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .wrapper {
      width: 200px;
    }

    .container {
      height: 80px;
      outline: 1px solid black;
      position: relative;
    }

    .item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 80px;
      top: 0;
      background: lightblue;
    }

    .oof {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
    }
  </style>
</head>
<body>
  <!-- justify-content: end -->
  <div class="wrapper">
    <div class="container">
      <div class="item" style="left: 60px;">1</div>
      <div class="item" style="left: 110px;">2</div>
      <div class="item" style="left: 160px;">3</div>
      <div class="oof" style="top: 0px; left: 0px;"></div>
      <div class="oof" style="top: 30px; left: 0px;"></div>
      <div class="oof" style="bottom: 0px; left: 0px;"></div>
    </div>
  </div>

  <!-- justify-content: center -->
  <div class="wrapper">
    <div class="container">
      <div class="item" style="left: 30px;">1</div>
      <div class="item" style="left: 80px;">2</div>
      <div class="item" style="left: 130px;">3</div>
      <div class="oof" style="top: 0px; left: 0px;"></div>
      <div class="oof" style="top: 30px; left: 0px;"></div>
      <div class="oof" style="bottom: 0px; left: 0px;"></div>
    </div>
  </div>
</body>
</html>
