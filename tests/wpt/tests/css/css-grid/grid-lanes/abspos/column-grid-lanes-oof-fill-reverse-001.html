<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: fill-reverse accounts for OOF static positions in column grid-lanes with indefinite block size</title>
  <link rel="author" title="Celeste Pan" href="mailto:celestepan@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
  <link rel="match" href="column-grid-lanes-oof-fill-reverse-001-ref.html">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    /*
     * The OOF item's static position must be reversed by the same amount as the content.
     */
    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: column fill-reverse;
      grid-template-columns: 80px;
      gap: 10px;
      width: 200px;
      outline: 1px solid black;
      position: relative;
    }

    item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      background: lightblue;
    }

    .oof {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
    }
  </style>
</head>
<body>
  <!-- column fill-reverse, height auto -->
  <div class="grid-lanes">
    <item>1</item>
    <item>2</item>
    <item>3</item>
    <div class="oof" style="left: 0px;"></div>
    <div class="oof" style="left: 90px;"></div>
    <div class="oof" style="right: 0px;"></div>
  </div>
</body>
</html>
