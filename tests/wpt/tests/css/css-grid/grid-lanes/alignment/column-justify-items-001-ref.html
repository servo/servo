<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-template-columns: repeat(2, 80px);
      width: 200px;
      height: 100px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    .fill-reverse {
      grid-lanes-direction: column fill-reverse;
    }

    .track-reverse {
      grid-lanes-direction: column track-reverse;
    }

    item {
      display: block;
      width: 40px;
      height: 26px;
      background: green;
      color: white;
    }
  </style>
</head>
<body>
  <div class="label">column fill-reverse: justify-items: flow-start</div>
  <div class="grid-lanes fill-reverse" style="justify-items: start;">
    <item style="grid-column: 1;">1</item>
    <item style="grid-column: 1;">2</item>
    <item style="grid-column: 2;">3</item>
    <item style="grid-column: 2;">4</item>
  </div>

  <div class="label">column track-reverse: justify-items: flow-start</div>
  <div class="grid-lanes track-reverse" style="justify-items: end;">
    <item style="grid-column: 1;">1</item>
    <item style="grid-column: 1;">2</item>
    <item style="grid-column: 2;">3</item>
    <item style="grid-column: 2;">4</item>
  </div>
</body>
</html>
