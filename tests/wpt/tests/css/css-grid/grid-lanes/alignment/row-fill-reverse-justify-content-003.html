<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: `flow-start` and `flow-end` behave like `end` and `start` for `justify-content` when `fill-reverse` is applied to rows</title>
  <link rel="author" title="Celeste Pan" href="mailto:celestepan@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#alignment">
  <link rel="match" href="row-fill-reverse-justify-content-003-ref.html">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: row fill-reverse;
      grid-template-rows: repeat(2, 70px);
      gap: 4px;
      width: 320px;
      height: 170px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    item {
      display: block;
      width: 56px;
      height: 26px;
      color: white;
      background: #2ca02c;
    }
  </style>
</head>
<body>
  <div class="label">justify-content: flow-start</div>
  <div class="grid-lanes" style="justify-content: flow-start;">
    <item>1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>

  <div class="label">justify-content: flow-end</div>
  <div class="grid-lanes" style="justify-content: flow-end;">
    <item>1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>
</body>
</html>
