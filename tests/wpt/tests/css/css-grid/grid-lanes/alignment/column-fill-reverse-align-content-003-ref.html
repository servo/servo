<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: column fill-reverse;
      grid-template-columns: repeat(2, 80px);
      gap: 4px;
      width: 200px;
      height: 180px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    item {
      display: block;
      width: 40px;
      height: 20px;
      color: white;
      background: #2ca02c;
    }

    item:nth-of-type(2) { height: 26px; }
    item:nth-of-type(3) { height: 34px; }
    item:nth-of-type(4) { height: 44px; }
  </style>
</head>
<body>
  <div class="label">align-content: flow-start</div>
  <div class="grid-lanes" style="align-content: end;">
    <item>1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>

  <div class="label">align-content: flow-end</div>
  <div class="grid-lanes" style="align-content: start;">
    <item>1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>
</body>
</html>
