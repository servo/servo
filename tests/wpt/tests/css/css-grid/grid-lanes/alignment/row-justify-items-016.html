<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: `flow-start` and `flow-end` behave like `end` and `start` for `justify-items` and `justify-self` when `fill-reverse` is applied to rows</title>
  <link rel="author" title="Celeste Pan" href="mailto:celestepan@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#alignment">
  <link rel="match" href="row-justify-items-016-ref.html">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: row fill-reverse;
      grid-template-rows: repeat(2, 50px);
      gap: 4px;
      width: 180px;
      height: 110px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    item {
      display: block;
      width: 38px;
      height: 32px;
      color: white;
      background: #2ca02c;
    }

    .wide {
      width: 78px;
      background: #1f77b4;
    }
  </style>
</head>
<body>
  <div class="label">justify-items: flow-start</div>
  <div class="grid-lanes" style="justify-items: flow-start;">
    <item class="wide">1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>

  <div class="label">justify-items: flow-end</div>
  <div class="grid-lanes" style="justify-items: flow-end;">
    <item class="wide">1</item>
    <item>2</item>
    <item>3</item>
    <item>4</item>
  </div>

  <div class="label">justify-self: flow-start (item 3)</div>
  <div class="grid-lanes">
    <item class="wide">1</item>
    <item>2</item>
    <item style="justify-self: flow-start;">3</item>
    <item>4</item>
  </div>

  <div class="label">justify-items: flow-end; justify-self: flow-start (item 3)</div>
  <div class="grid-lanes" style="justify-items: flow-end;">
    <item class="wide">1</item>
    <item>2</item>
    <item style="justify-self: flow-start;">3</item>
    <item>4</item>
  </div>
</body>
</html>
