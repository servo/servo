<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: `flow-start` and `flow-end` behave like `end` and `start` for `align-content` when `track-reverse` is applied to rows</title>
  <link rel="author" title="Celeste Pan" href="mailto:celestepan@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#alignment">
  <link rel="match" href="row-track-reverse-align-content-001-ref.html">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: row track-reverse;
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
      width: 60px;
      height: 200px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    item {
      display: block;
      width: 40px;
      height: 26px;
      color: white;
      background: #2ca02c;
    }
  </style>
</head>
<body>
  <div class="label">align-content: flow-start</div>
  <div class="grid-lanes" style="align-content: flow-start;">
    <item>1</item>
    <item>2</item>
  </div>

  <div class="label">align-content: flow-end</div>
  <div class="grid-lanes" style="align-content: flow-end;">
    <item>1</item>
    <item>2</item>
  </div>
</body>
</html>
