<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      color: black; background-color: white; font: 12.8px/1 monospace; padding: 0; margin: 0;
    }

    .row {
      font-size: 0;
    }

    .container {
      width: 80px;
      height: 80px;
      border: 1px solid black;
      margin: 4px;
      vertical-align: top;
    }

    item {
      display: block;
      width: 20px;
      height: 20px;
      background: green;
    }

    .lanes-column {
      display: inline grid-lanes;
      grid-lanes-direction: column;
      grid-template-columns: 40px;
    }

    .lanes-row {
      display: inline grid-lanes;
      grid-lanes-direction: row;
      grid-template-rows: auto;
    }
  </style>
</head>
<body>
<div class="row">
  <div class="container lanes-column" style="align-content: flex-start"><item></item></div>
  <div class="container lanes-column" style="align-content: flex-end"><item></item></div>
  <div class="container lanes-column" style="align-items: flex-start"><item></item></div>
  <div class="container lanes-column" style="align-items: flex-end"><item></item></div>
  <div class="container lanes-column"><item style="align-self: flex-start"></item></div>
  <div class="container lanes-column"><item style="align-self: flex-end"></item></div>
</div>
<div class="row">
  <div class="container lanes-row" style="align-content: flex-start"><item></item></div>
  <div class="container lanes-row" style="align-content: flex-end"><item></item></div>
  <div class="container lanes-row" style="align-items: flex-start"><item></item></div>
  <div class="container lanes-row" style="align-items: flex-end"><item></item></div>
  <div class="container lanes-row"><item style="align-self: flex-start"></item></div>
  <div class="container lanes-row"><item style="align-self: flex-end"></item></div>
</div>
</body>
</html>
