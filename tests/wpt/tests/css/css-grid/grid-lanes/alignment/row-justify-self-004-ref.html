<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .preview {
      position: relative;
      width: 100px;
      height: 150px;
      margin-bottom: 8px;
    }

    .preview > div {
      position: absolute;
    }

    .item-1 {
      top: 0;
      height: 100px;
      background: #fbc4c4;
    }

    .item-2 {
      left: 0;
      top: 100px;
      width: 100px;
      height: 50px;
      background: #bae0fd;
    }

    .item-3 {
      left: 60px;
      top: 0;
      width: 10px;
      height: 150px;
      background: #fde8a0;
    }

    .end .item-1 {
      left: 80px;
      width: 20px;
    }

    .center .item-1 {
      left: 40px;
      width: 20px;
    }

    .stretch .item-1 {
      left: 0;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="preview end">
    <div class="item-1">1</div>
    <div class="item-2">2</div>
    <div class="item-3">3</div>
  </div>
  <div class="preview center">
    <div class="item-1">1</div>
    <div class="item-2">2</div>
    <div class="item-3">3</div>
  </div>
  <div class="preview stretch">
    <div class="item-1">1</div>
    <div class="item-2">2</div>
    <div class="item-3">3</div>
  </div>
</body>
</html>
