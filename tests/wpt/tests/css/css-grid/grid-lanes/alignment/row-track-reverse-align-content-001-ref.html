<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      font: 16px/1 monospace;
      background: white;
    }

    .label {
      font: 16px/1 monospace;
    }

    .grid-lanes {
      display: grid-lanes;
      grid-lanes-direction: row track-reverse;
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
      width: 60px;
      height: 200px;
      border: 1px solid;
      margin-bottom: 4px;
    }

    item {
      display: block;
      width: 40px;
      height: 26px;
      color: white;
      background: #2ca02c;
    }
  </style>
</head>
<body>
  <div class="label">align-content: flow-start</div>
  <div class="grid-lanes" style="align-content: end;">
    <item>1</item>
    <item>2</item>
  </div>

  <div class="label">align-content: flow-end</div>
  <div class="grid-lanes" style="align-content: start;">
    <item>1</item>
    <item>2</item>
  </div>
</body>
</html>
