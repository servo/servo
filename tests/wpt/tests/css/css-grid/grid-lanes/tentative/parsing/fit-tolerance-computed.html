<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Grid Lanes: fit-tolerance getComputedStyle()</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-3">
<link rel="author" title="Sam Davis Omekara Jr." href="mailto:samomekarajr@microsoft.com">
<meta name="assert" content="fit-tolerance computed value is as specified.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
</head>
<body>
<div id="target"></div>
<style>
  #target {
    font-size: 40px;
  }
</style>
<script>
test_computed_value("fit-tolerance", "normal");
test_computed_value("fit-tolerance", "infinite");

test_computed_value("fit-tolerance", "10px");
test_computed_value("fit-tolerance", "20%");
test_computed_value("fit-tolerance", "calc(20% + 10px)");

test_computed_value("fit-tolerance", "calc(-0.5em + 10px)", "0px");
test_computed_value("fit-tolerance", "calc(0.5em + 10px)", "30px");
</script>
</body>
</html>
