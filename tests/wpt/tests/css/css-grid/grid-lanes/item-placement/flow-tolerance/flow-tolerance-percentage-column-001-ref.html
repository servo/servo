<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes: Column percentage basis reference</title>
  <style>
    .grid {
      background: gray;
      block-size: 150px;
      box-sizing: content-box;
      display: grid;
      grid-template-columns: repeat(2, 50px);
      inline-size: 100px;
      padding-inline: 25px;
    }

    .calculated {
      margin-block-start: 10px;
    }

    .lane {
      display: flex;
      flex-direction: column;
    }

    .item-one {
      background: lightcoral;
    }

    .item-two {
      background: lightgreen;
    }

    .item-three {
      background: lightskyblue;
    }

    .percentage .item-one {
      block-size: 50px;
    }

    .percentage .item-two,
    .percentage .item-three {
      block-size: 25px;
    }

    .calculated .item-one {
      block-size: 40px;
    }

    .calculated .item-two,
    .calculated .item-three {
      block-size: 25px;
    }
  </style>
</head>
<body>
  <div class="grid percentage">
    <div class="lane">
      <div class="item-one"></div>
    </div>
    <div class="lane">
      <div class="item-two"></div>
      <div class="item-three"></div>
    </div>
  </div>
  <div class="grid calculated">
    <div class="lane">
      <div class="item-one"></div>
      <div class="item-three"></div>
    </div>
    <div class="lane">
      <div class="item-two"></div>
    </div>
  </div>
</body>
</html>
