<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes: Intrinsic row flow-tolerance percentage basis reference</title>
  <style>
    .grid {
      background: gray;
      display: grid;
      grid-template-rows: repeat(2, 200px);
      inline-size: 150px;
    }

    .lane {
      display: flex;
    }

    .item-one {
      background: lightcoral;
      inline-size: 60px;
    }

    .item-two {
      background: lightgreen;
      inline-size: 30px;
    }

    .item-three {
      background: lightskyblue;
      inline-size: 20px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="lane">
      <div class="item-one"></div>
      <div class="item-three"></div>
    </div>
    <div class="lane">
      <div class="item-two"></div>
    </div>
  </div>
</body>
</html>
