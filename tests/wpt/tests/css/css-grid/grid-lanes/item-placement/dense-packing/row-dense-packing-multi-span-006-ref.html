<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    #preview {
      position: relative;
      height: 316px;
      width: 120px;
    }

    #preview > div {
      position: absolute;
    }

    #preview .item-1 {
      left: 0;
      top: 0;
      width: 60px;
      height: 100px;
      background: #fbc4c4;
    }

    #preview .item-2 {
      left: 0;
      top: 108px;
      width: 120px;
      height: 100px;
      background: #bae0fd;
    }

    #preview .item-3 {
      left: 0;
      top: 216px;
      width: 80px;
      height: 100px;
      background: #d4b8f0;
    }

    #preview .item-4 {
      left: 68px;
      top: 0;
      width: 15px;
      height: 208px;
      background: #fde8a0;
    }

    #preview .item-5 {
      left: 68px;
      top: 0;
      width: 20px;
      height: 100px;
      background: #b5ead7;
    }
  </style>
</head>
<body>
  <div id="preview">
    <div class="item-1">1</div>
    <div class="item-2">2</div>
    <div class="item-3">3</div>
    <div class="item-4">4</div>
    <div class="item-5">5</div>
  </div>
</body>
</html>
