<!DOCTYPE HTML>
<html><head>
  <meta charset="utf-8">
  <style>
    html,body {
      color:black; background-color:white; font:10px/1 monospace; padding:0; margin:0;
    }

    grid {
      display: inline grid;
      grid-template-columns: 40px 30px 20px;
      gap: 4px;
      padding: 1px 3px 5px 7px;
      border: solid;
      border-width: 3px 5px 1px 1px;
      background: lightgrey content-box;
    }
    item {
      background: grey;
      width: 3ch;
      position: relative;
    }
    grid > item:nth-child(2n) { background:purple; width:auto; }
    grid > item:nth-child(1) {
      border: solid;
      border-width: 3px 5px 1px 1px;
      margin: 7px 1px 5px 3px;
    }
    subgrid {
      display: grid;
      grid-template-columns: subgrid;
      grid-template-rows: auto;
      gap: 4px;
      grid-row: auto/span 2;
      grid-column: auto/span 2;
      background: yellow;
    }
    subgrid > item.alt { background:purple; width:auto; }
    subgrid > item.first {
      border: solid;
      border-width: 3px 5px 1px 1px;
      margin: 7px 1px 5px 3px;
    }
  </style>
</head>
<body>
<grid>
  <item style="height: 24px">1</item>
  <item style="height: 40px">2</item>
  <item style="height: 40px">3</item>
  <subgrid style="height: calc(30px + 4px + 20px)">
    <item class="first" style="height: 13px">4a</item>
    <item class="alt" style="height: 29px">4b</item>
    <item style="height: 19px">4c</item>
  </subgrid>
  <item style="height: 30px">5</item>
</grid>
</body>
</html>
