<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: verify correct sizing of flex tracks when using a grid-lanes subgrid in a grid container</title>
  <link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
  <link rel="match" href="grid-lanes-subgrid-flex-ref.html">
  <style>
    grid {
      display: inline grid;
      grid-template-columns: 1fr 2fr 3fr;
      border: 1px solid;
      background: lightgrey;
    }

    subgrid {
      display: grid-lanes;
      grid-template-columns: subgrid;
      grid-column: 2 / span 2;
      background: lightblue;
    }
  </style>
</head>

<body>

<grid>
  <item>1</item>
  <subgrid>
    <item>2</item>
    <item style="width: 3ch">3</item>
    <item>4</item>
  </subgrid>
  <item>5</item>
</grid>
</body>
</html>
