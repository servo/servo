<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Inherited row line names from repeat()</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-line-names-002-ref.html">
<meta name="assert" content="A grid-lanes subgrid resolves positive and negative occurrences of row line names inherited from a parent repeat().">
<style>
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: 20px repeat(3, [a] 30px [b] 50px) [a] 70px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-template-rows: subgrid;
    grid-row: 2 / span 6;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .subgrid > div { width: 24px; }
  .first { grid-row: a / b; background: green; }
  .second { grid-row: a 2 / a 3; background: blue; }
  .third { grid-row: b -1 / a -1; background: orange; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
  </div>
</div>
