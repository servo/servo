<!DOCTYPE html>
<meta charset="utf-8">
<style>
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: 20px 40px 60px 80px 100px 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid;
    grid-column: 2 / span 4;
    gap: 4px;
    background: yellow;
  }
  .start { grid-template-columns: subgrid [a]; }
  .internal { grid-template-columns: subgrid [] [a] [a]; }
  .end { grid-template-columns: subgrid [a] [a] [a] [a] [a]; }
  .subgrid > div { height: 24px; background: green; }
  .start > div { grid-column: 1 / 2; }
  .internal > div { grid-column: 3 / 4; }
  .end > div { grid-column: 4 / 5; }
</style>
<div class="grid-lanes">
  <div class="subgrid start"><div></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid internal"><div></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid end"><div></div></div>
</div>
