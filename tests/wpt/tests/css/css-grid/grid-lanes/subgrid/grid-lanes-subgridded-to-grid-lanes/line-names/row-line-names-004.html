<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Merged parent and subgrid row line names</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-line-names-004-ref.html">
<meta name="assert" content="A grid-lanes subgrid merges its own row line names with inherited names when resolving named occurrences.">
<style>
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: 20px [a] 40px 60px [b] 80px 100px [a] 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-template-rows: subgrid [local] [b] [] [] [b];
    grid-row: 2 / span 4;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .subgrid > div { width: 24px; }
  .first { grid-row: local / b; background: green; }
  .second { grid-row: b / b 2; background: blue; }
  .third { grid-row: b -2 / b -1; background: orange; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
  </div>
</div>
