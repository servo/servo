<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Local row names at subgrid endpoints</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-line-names-006-ref.html">
<meta name="assert" content="A negative named row index uses the last matching local line, and placement starting at the subgrid's final line is clamped to its last track.">
<style>
  body { display: flex; align-items: flex-start; gap: 4px; }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: 20px 40px 60px 80px 100px 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-row: 2 / span 4;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .start { grid-template-rows: subgrid [a]; }
  .internal { grid-template-rows: subgrid [] [a] [a]; }
  .end { grid-template-rows: subgrid [a] [a] [a] [a] [a]; }
  .subgrid > div { grid-row: a -1; width: 24px; background: green; }
</style>
<div class="grid-lanes">
  <div class="subgrid start"><div></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid internal"><div></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid end"><div></div></div>
</div>
