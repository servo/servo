<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Horizontal auto scrollbars update explicit subgrids' inherited rows</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-subgrid-with-scrollbar-001-ref.html">
<style>
  body {
    margin: 0;
  }

  ::-webkit-scrollbar {
    height: 16px;
    width: 16px;
  }

  .root {
    background: lightgrey;
    border: 2px solid black;
    display: grid-lanes;
    grid-template-rows: 100px 200px 300px;
    width: 80px;
  }

  .subgrid {
    display: grid-lanes;
    grid-template-rows: subgrid;
  }

  .outer, .inner {
    grid-row: 1 / -1;
  }

  .middle {
    border: 2px solid orange;
    grid-row: 2;
    overflow: auto;
    width: 80px;
  }

  .leaf {
    aspect-ratio: 1 / 4;
    background: green;
    grid-row: 1;
    min-height: 0;
    min-width: 0;
  }

  .marker {
    background: blue;
    grid-row: 1;
    width: 10px;
  }

  .overflow {
    grid-row: 1;
    height: 0;
    width: 210px;
  }

  ::-webkit-scrollbar-track {
    background: silver;
  }

  ::-webkit-scrollbar-thumb {
    background: grey;
  }

  .outer {
    border: 2px solid purple;
  }

  .inner {
    border: 2px solid cyan;
  }
</style>
<div class="root">
  <div class="subgrid outer">
    <div class="subgrid middle">
      <div class="subgrid inner">
        <div class="leaf"></div>
        <div class="marker"></div>
        <div class="overflow"></div>
      </div>
    </div>
  </div>
</div>
