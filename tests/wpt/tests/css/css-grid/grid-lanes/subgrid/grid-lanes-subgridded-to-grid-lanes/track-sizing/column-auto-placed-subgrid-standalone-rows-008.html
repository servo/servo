<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Auto-placed ancestors update explicit descendants' inherited columns</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="column-auto-placed-subgrid-standalone-rows-001-ref.html">
<style>
  body {
    margin: 0;
  }

  .root {
    background: lightgrey;
    border: 2px solid black;
    display: grid-lanes;
    fit-tolerance: 0;
    grid-template-columns: 100px 200px 300px;
    width: 600px;
  }

  .subgrid {
    display: grid-lanes;
    fit-tolerance: 0;
    grid-template-columns: subgrid;
  }

  .outer {
    border: 2px solid purple;
    grid-column: 1 / -1;
  }

  .root-blocker {
    background: dimgray;
    grid-column: 1;
    height: 40px;
    width: 8px;
  }

  .outer-blocker {
    background: steelblue;
    grid-column: 1;
    height: 20px;
    width: 8px;
  }

  .inner {
    border: 2px solid cyan;
    grid-column: 1 / -1;
  }

  .leaf {
    aspect-ratio: 1;
    background: green;
    grid-column: 1;
    min-height: 0;
    min-width: 0;
  }

  .marker {
    background: blue;
    grid-column: 1;
    height: 10px;
  }

  .middle {
    border: 2px solid orange;
  }
</style>
<div class="root">
  <div class="root-blocker"></div>
  <div class="subgrid outer">
    <div class="outer-blocker"></div>
    <div class="subgrid middle">
      <div class="subgrid inner">
        <div class="leaf"></div>
        <div class="marker"></div>
      </div>
    </div>
  </div>
</div>
