<!DOCTYPE HTML>
<html><head>
  <meta charset="utf-8">
  <style>
    html,body {
      color:black; background-color:white; font:10px/1 monospace; padding:0; margin:0;
    }

    grid-lanes {
      display: inline grid-lanes;
      grid-template-columns: 40px 30px 20px;
      gap: 4px;
      padding: 1px 3px 5px 7px;
      border: solid;
      border-width: 3px 5px 1px 1px;
      background: lightgrey content-box;
    }
    item {
      background: grey;
      width: 3ch;
      position: relative;
    }
    item:nth-child(2n) { background:purple; width:auto; }
    item:nth-child(1) {
      border: solid;
      border-width: 3px 5px 1px 1px;
      margin: 7px 1px 5px 3px;
    }
    subgrid {
      display: grid;
      grid-column: auto/span 2;
      grid-template-columns: subgrid;
      grid-template-rows: 13px 19px;
      gap: 4px;
      background: yellow;
    }
  </style>
</head>
<body>
<grid-lanes>
  <item style="height: 24px;">1</item>
  <item style="height: 40px;">2</item>
  <item style="height: 40px;">3</item>
  <subgrid style="height: calc(30px + 4px + 20px);">
    <item style="grid-column: 1; height: 13px;">4a</item>
    <item style="grid-column: 2; height: 29px;">4b</item>
    <item style="grid-column: 1; height: 19px;">4c</item>
  </subgrid>
  <item style="height: 30px;">5</item>
</grid-lanes>
</body>
</html>
