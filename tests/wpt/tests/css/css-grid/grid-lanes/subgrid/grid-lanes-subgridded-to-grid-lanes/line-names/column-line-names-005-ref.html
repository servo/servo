<!DOCTYPE html>
<meta charset="utf-8">
<style>
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: [outside] 20px 40px [a] 60px 80px [a] 100px 120px [outside];
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 2 / span 4;
    gap: 4px;
    background: yellow;
  }
  .subgrid > div { height: 24px; background: green; }
  .missing-forward { grid-column: 4 / 5; }
  .missing-backward { grid-column: 1 / 2; }
  .far-forward { grid-column: 4 / 5; }
  .far-backward { grid-column: 1 / 2; }
  .forward-span { grid-column: 2 / 5; }
  .backward-span { grid-column: 1 / 4; }
  .outside-name { grid-column: 4 / 5; }
</style>
<div class="grid-lanes">
  <div class="subgrid"><div class="missing-forward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="missing-backward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="far-forward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="far-backward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="forward-span"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="backward-span"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="outside-name"></div></div>
</div>
