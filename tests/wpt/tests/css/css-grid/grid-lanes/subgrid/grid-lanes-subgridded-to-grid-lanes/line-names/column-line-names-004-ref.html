<!DOCTYPE html>
<meta charset="utf-8">
<style>
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-columns: 20px [a] 40px 60px [b] 80px 100px [a] 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid;
    grid-template-columns: subgrid [local] [b] [] [] [b];
    grid-column: 2 / span 4;
    gap: 4px;
    background: yellow;
  }
  .subgrid > div { height: 24px; }
  .first { grid-column: 1 / 2; background: green; }
  .second { grid-column: 2 / 3; background: blue; }
  .third { grid-column: 3 / 5; background: orange; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
  </div>
</div>
