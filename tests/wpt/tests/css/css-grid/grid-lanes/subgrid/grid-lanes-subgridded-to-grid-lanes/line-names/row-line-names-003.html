<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Row line names through nested subgrids</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-line-names-003-ref.html">
<meta name="assert" content="Nested grid-lanes subgrids inherit row line names relative to each subgrid's span.">
<style>
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: 20px [a] 40px 60px [a] 80px 100px [a] 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-template-rows: subgrid;
    grid-row: 2 / span 4;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .nested {
    display: grid-lanes;
    grid-template-rows: subgrid;
    grid-row: 2 / span 3;
    gap: 4px;
    fit-tolerance: 0;
    background: purple;
  }
  .nested > div { width: 24px; }
  .first { grid-row: 1 / a; background: green; }
  .second { grid-row: a / a -1; background: blue; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="nested">
      <div class="first"></div>
      <div class="second"></div>
    </div>
  </div>
</div>
