<!DOCTYPE HTML>
<html><head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: explicitly placed column-axis grid-lanes subgrid in a grid-lanes container</title>
  <link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
  <link rel="match" href="grid-lanes-subgrid-001a-ref.html">
  <style>
    html,body {
      color:black; background-color:white; font:16px/1 monospace; padding:0; margin:0;
    }

    grid-lanes {
      display: inline grid-lanes;
      grid-template-columns: 50px 80px 40px;
      gap: 4px;
      padding: 1px 3px 5px 7px;
      border: solid;
      border-width: 3px 5px 1px 1px;
      background: lightgrey content-box;
    }
    item {
      background: grey;
      width: 3ch;
      position: relative;
    }
    item:nth-child(2n) { background:purple; width:auto; }
    item:nth-child(1) {
      border: solid;
      border-width: 3px 13px 1px 1px;
      margin: 7px 1px 5px 3px;
    }
    subgrid {
      display: grid-lanes;
      grid-template-columns: subgrid;
      grid-column: 2 / span 2;
      gap: 4px;
      background: yellow;
      flow-tolerance: 0px;
    }
  </style>
</head>
<body>
<grid-lanes>
  <item>1</item>
  <item>2</item>
  <item>3</item>
  <subgrid>
    <item>4a</item>
    <item>4b</item>
    <item>4c</item>
  </subgrid>
  <item>5</item>
</grid-lanes>
</body>
</html>
