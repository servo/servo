<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Repeated inherited column line names</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="column-line-names-001-ref.html">
<meta name="assert" content="A grid-lanes subgrid resolves named spans and negative named column indices within its inherited span.">
<style>
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-columns: 20px [a] 40px 60px [a] 80px 100px [a] 120px;
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-template-columns: subgrid;
    grid-column: 2 / span 4;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .subgrid > div { height: 24px; }
  .first { grid-column: a / span a; background: green; }
  .second { grid-column: span a / a -1; background: blue; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="first"></div>
    <div class="second"></div>
  </div>
</div>
