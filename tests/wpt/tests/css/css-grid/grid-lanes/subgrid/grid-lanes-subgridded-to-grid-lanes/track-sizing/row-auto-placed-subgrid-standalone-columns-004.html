<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Orthogonal auto-placement updates descendant standalone columns</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="row-auto-placed-subgrid-standalone-columns-001-ref.html">
<style>
  body {
    margin: 0;
  }

  .root {
    background: lightgrey;
    border: 2px solid black;
    display: grid-lanes;
    fit-tolerance: 0;
    grid-template-rows: 100px 200px 300px;
    width: max-content;
  }

  .subgrid {
    display: grid-lanes;
    fit-tolerance: 0;
  }

  .outer {
    border: 2px solid purple;
    grid-row: 1 / -1;
    grid-template-rows: subgrid;
  }

  .root-blocker {
    background: dimgray;
    grid-row: 1;
    height: 8px;
    width: 40px;
  }

  .outer-blocker {
    background: steelblue;
    grid-row: 1;
    height: 8px;
    width: 20px;
  }

  .inner {
    border: 2px solid cyan;
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: auto 10px;
    grid-template-rows: subgrid;
    writing-mode: horizontal-tb;
  }

  .leaf {
    aspect-ratio: 1;
    background: green;
    grid-column: 1;
    grid-row: 1;
    min-height: 0;
    min-width: 0;
  }

  .marker {
    background: blue;
    grid-column: 2;
    grid-row: 1;
  }

  .middle {
    border: 2px solid orange;
    grid-template-columns: subgrid;
    writing-mode: vertical-lr;
  }
</style>
<div class="root">
  <div class="root-blocker"></div>
  <div class="subgrid outer">
    <div class="outer-blocker"></div>
    <div class="subgrid middle">
      <div class="subgrid inner">
        <div class="leaf"></div>
        <div class="marker"></div>
      </div>
    </div>
  </div>
</div>
