<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
  body {
    margin: 0;
  }

  .root {
    background: lightgrey;
    border: 2px solid black;
    display: grid-lanes;
    fit-tolerance: 0;
    grid-template-columns: 100px 200px 300px;
    width: 600px;
  }

  .subgrid {
    display: grid;
    grid-template-columns: subgrid;
  }

  .outer {
    border: 2px solid purple;
    grid-column: 1 / -1;
  }

  .root-blocker {
    background: dimgray;
    grid-column: 1;
    height: 40px;
    width: 8px;
  }

  .outer-blocker {
    background: steelblue;
    grid-column: 1;
    height: 20px;
    width: 8px;
  }

  .inner {
    border: 2px solid cyan;
    display: grid;
    grid-column: 1 / -1;
    grid-template-rows: auto 10px;
  }

  .leaf {
    aspect-ratio: 1;
    background: green;
    grid-column: 1;
    grid-row: 1;
    min-height: 0;
    min-width: 0;
  }

  .marker {
    background: blue;
    grid-column: 1;
    grid-row: 2;
  }

  .wrapping .leaf {
    aspect-ratio: auto;
    font: 20px/20px Ahem;
  }

  .middle {
    border: 2px solid orange;
    grid-column: 2;
  }
</style>
<div class="root wrapping">
  <div class="root-blocker"></div>
  <div class="subgrid outer">
    <div class="outer-blocker"></div>
    <div class="subgrid middle">
      <div class="subgrid inner">
        <div class="leaf">XX XX XX XX XX XX</div>
        <div class="marker"></div>
      </div>
    </div>
  </div>
</div>
