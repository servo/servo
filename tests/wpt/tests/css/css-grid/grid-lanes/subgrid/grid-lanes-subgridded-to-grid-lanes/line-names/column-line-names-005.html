<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Column named-line resolution at subgrid boundaries</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="column-line-names-005-ref.html">
<meta name="assert" content="Missing column names, out-of-range named occurrences, and named spans are clamped to the grid-lanes subgrid's inherited tracks.">
<style>
  .grid-lanes {
    display: grid-lanes;
    grid-template-columns: [outside] 20px 40px [a] 60px 80px [a] 100px 120px [outside];
    width: max-content;
    gap: 4px;
    fit-tolerance: 0;
    padding: 8px;
    border: 2px solid black;
    background: lightgrey;
  }
  .subgrid {
    display: grid-lanes;
    grid-template-columns: subgrid;
    grid-column: 2 / span 4;
    gap: 4px;
    fit-tolerance: 0;
    background: yellow;
  }
  .subgrid > div { height: 24px; background: green; }
  .missing-forward { grid-column: missing / span 2; }
  .missing-backward { grid-column: missing -1 / span 2; }
  .far-forward { grid-column: a 8 / span 2; }
  .far-backward { grid-column: span 2 / a -8; }
  .forward-span { grid-column: 2 / span a 8; }
  .backward-span { grid-column: span a 8 / 4; }
  .outside-name { grid-column: outside / span 2; }
</style>
<div class="grid-lanes">
  <div class="subgrid"><div class="missing-forward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="missing-backward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="far-forward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="far-backward"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="forward-span"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="backward-span"></div></div>
</div>
<div class="grid-lanes">
  <div class="subgrid"><div class="outside-name"></div></div>
</div>
