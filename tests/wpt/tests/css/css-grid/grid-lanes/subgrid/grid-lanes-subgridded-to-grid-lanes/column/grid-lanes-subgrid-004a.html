<!DOCTYPE HTML>
<html><head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: clamp child columns to the inherited subgrid tracks</title>
  <link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
  <link rel="match" href="grid-lanes-subgrid-004a-ref.html">
  <meta name="assert" content="A grid-lanes subgrid clamps out-of-range child placements and oversized automatic spans to its inherited columns before mapping them into the parent, including opposite writing directions.">
  <style>
    body { margin: 0; }
    grid-lanes {
      display: grid-lanes;
      grid-template-columns: 40px 60px 100px 40px;
      gap: 4px;
      width: 252px;
      background: lightgrey;
    }
    subgrid {
      display: grid-lanes;
      grid-template-columns: subgrid;
      grid-column: 2 / span 2;
      gap: 4px;
    }
    item {
      display: block;
      height: 20px;
      background: green;
    }
    subgrid:nth-child(2) > item { background: royalblue; }
    subgrid:nth-child(3) > item { background: orange; }
    subgrid:nth-child(4) > item { background: purple; }
    subgrid:nth-child(5) > item { background: teal; }
    subgrid:nth-child(6) > item { background: crimson; }
  </style>
</head>
<body>
<grid-lanes>
  <subgrid><item style="grid-column: 3"></item></subgrid>
  <subgrid><item style="grid-column: -5"></item></subgrid>
  <subgrid style="direction: rtl"><item style="grid-column: -4 / 2"></item></subgrid>
  <subgrid style="direction: rtl"><item style="grid-column: 2 / 5"></item></subgrid>
  <subgrid><item style="grid-column: -4 / 5"></item></subgrid>
  <subgrid><item style="grid-column: span 4"></item></subgrid>
</grid-lanes>
</body>
</html>
