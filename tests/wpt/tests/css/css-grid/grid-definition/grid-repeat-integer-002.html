<!DOCTYPE html>
<title>CSS Grid: repeat() with an integer count in grid-template-rows</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid/#repeat-notation">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="repeat(4, 25px) in grid-template-rows creates four 25px row tracks.">
<style>
.grid {
    display: grid;
    width: 100px;
    height: 100px;
    background: red;
    grid-template-columns: 100px;
    grid-template-rows: repeat(4, 25px);
}
.grid > div {
    background: green;
}
</style>
<p>Test passes if there is a filled green square.</p>
<div class="grid">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</div>
