<!DOCTYPE html>
<title>CSS Grid: Line-based placement into repeat() tracks and implicit tracks after them</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid/#repeat-notation">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="Positive and negative line numbers count each track expanded from repeat(), and implicit tracks come after the expanded explicit grid.">
<style>
.grid {
    display: grid;
    width: 100px;
    height: 100px;
    background: red;
    grid-template-columns: repeat(2, 30px) 40px;
    grid-template-rows: repeat(1, 50px);
    grid-auto-rows: 50px;
}
.grid > div {
    background: green;
}
</style>
<p>Test passes if there is a filled green square.</p>
<div class="grid">
    <div style="grid-column: -2 / -1; grid-row: 1;"></div>
    <div style="grid-column: 3 / 4; grid-row: 2;"></div>
    <div style="grid-column: 1 / 2; grid-row: 2;"></div>
    <div style="grid-column: 1 / 2; grid-row: 1;"></div>
    <div style="grid-column: 2 / 3; grid-row: 2;"></div>
    <div style="grid-column: 2 / 3; grid-row: 1;"></div>
</div>
