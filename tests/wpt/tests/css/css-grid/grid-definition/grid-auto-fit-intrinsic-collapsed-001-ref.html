<!DOCTYPE html>
<meta charset="utf-8">
<style>
.container {
    position: relative;
    height: 50px;
    margin-bottom: 10px;
    background: lightgray;
}
.item {
    position: absolute;
    top: 0;
    height: 50px;
    background: green;
}
</style>
<div class="container" style="width: 110px">
    <div class="item" style="left: 0px; width: 50px"></div>
    <div class="item" style="left: 60px; width: 50px"></div>
</div>
<div class="container" style="width: 70px">
    <div class="item" style="left: 0px; width: 30px"></div>
    <div class="item" style="left: 40px; width: 30px"></div>
</div>
