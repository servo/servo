<!DOCTYPE html>
<title>CSS Grid: repeat() with a multi-track pattern mixed with other tracks</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid/#repeat-notation">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="A repeated multi-track pattern is expanded in place between the tracks around it.">
<style>
.grid {
    display: grid;
    width: 100px;
    height: 100px;
    background: red;
    grid-template-columns: 10px repeat(2, 20px 15px) 20px;
    grid-template-rows: repeat(2, 50px);
}
.grid > div {
    background: green;
}
</style>
<p>Test passes if there is a filled green square.</p>
<div class="grid">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</div>
