<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Basic User Interface: outline: auto on the SVG g element</title>
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#outline-style">
<link rel="match" href="outline-svg-container-auto-001-ref.html">
<meta name="assert" content="outline-style: auto set on the SVG g element is painted around its content, like on a shape.">
<style>
  .outline { outline: auto 4px green; }
</style>
<svg width="100" height="100">
  <g class="outline"><rect x="20" y="20" width="60" height="60" fill="lightgreen"/></g>
</svg>
