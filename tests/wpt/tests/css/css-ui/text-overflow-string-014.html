<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Basic User Interface Test: text-overflow - string</title>
<link rel="author" title="Minseong Kim" href="mailto:jja08111@gmail.com">
<link rel="help" href="https://drafts.csswg.org/css-overflow-4">
<link rel="match" href="reference/text-overflow-string-014-ref.html">
<meta name="assert" content="Test checks that a line feed in text-overflow string
is converted to a space when one side is an RTL character">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  @font-face {
    font-family: "mplus-test";
    src: url("/fonts/mplus-1p-regular.woff");
  }
  div {
    font-family: "mplus-test", monospace;
    font-size: 10px;
    overflow: hidden;
    text-overflow: "שלום\0A你好";
    /* 120px for four Ahem glyphs + (24px + 2ic) for the ellipsis string "שלום 你好"
       + 1px margin. */
    width: calc(120px + 24px + 2ic + 1px);
  }
  span {
    font-family: Ahem;
    font-size: 30px;
  }
</style>
<body>
  <p>Test passes if there is an <strong>שלום 你好</strong> after a black rectangle below.</p>
  <div>
    <span>TestChecksThatTheBrokenContentRepalcedByTextOverflow</span>
  </div>
</body>
