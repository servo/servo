<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Basic User Interface: outline on the SVG a element</title>
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#outline">
<link rel="match" href="outline-svg-container-001-ref.html">
<meta name="assert" content="outline applies to all elements, so an outline set on the SVG a element is painted around its content.">
<style>
  .outline { outline: 4px solid green; }
</style>
<svg width="100" height="100">
  <a class="outline" href="#"><rect x="20" y="20" width="60" height="60" fill="lightgreen"/></a>
</svg>
