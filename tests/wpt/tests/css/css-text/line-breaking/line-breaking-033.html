<!doctype html>
<html>
<meta charset="utf-8">
<title>CSS Text — line breaking before punctuation after a space</title>
<meta name=assert content="A punctuation character that follows a space offers a soft wrap opportunity before it, so the min-content size of 'x / y' is the width of 'x' rather than the width of 'x /'.">
<link rel=help href="https://drafts.csswg.org/css-text-3/#line-break-details">
<link rel=match href="reference/line-breaking-033-ref.html">
<link rel=author title="Euclid Ye" href="mailto:yezhizhenjiakang@gmail.com">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.test {
    width: min-content;
    height: 1em;
    line-height: 1em;
    font-family: Ahem;
    font-size: 20px;
    color: transparent;
    background: green;
}
</style>
<body>
<div class="test">x / y</div>
<div class="test">x ] y</div>
<div class="test">x ! y</div>
<div class="test">x ; y</div>
<div class="test">x } y</div>
</body>
</html>
