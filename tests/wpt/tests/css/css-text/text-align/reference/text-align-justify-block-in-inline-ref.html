<style>
.container {
  font: 20px/1 Ahem;
  width: 200px;
}

.justified-word-spacing {
  display: inline-block;

}
</style>
<div class="container">

<div>XX<span class="justified-word-spacing"></span>XX<span class="justified-word-spacing"></span>XX</div>
<div>XX XX</div>
<div>XXX</div>
<div>XX XX</div>
</div>
