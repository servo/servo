<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Text Module Test: parsing white-space-trim with valid values</title>
<link rel="help" href="https://drafts.csswg.org/css-text-4/#white-space-trim">
<meta name="assert" content="white-space-trim supports the grammar 'none | discard-before || discard-after || discard-inner'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_valid_value("white-space-trim", "none");

test_valid_value("white-space-trim", "discard-before");
test_valid_value("white-space-trim", "discard-after");
test_valid_value("white-space-trim", "discard-inner");

test_valid_value("white-space-trim", "discard-before discard-after");
test_valid_value("white-space-trim", "discard-before discard-inner");
test_valid_value("white-space-trim", "discard-after discard-inner");
test_valid_value("white-space-trim", "discard-before discard-after discard-inner");

// Order is normalized to the canonical grammar order.
test_valid_value("white-space-trim", "discard-after discard-before", "discard-before discard-after");
test_valid_value("white-space-trim", "discard-inner discard-before", "discard-before discard-inner");
test_valid_value("white-space-trim", "discard-inner discard-after discard-before", "discard-before discard-after discard-inner");
</script>
</body>
</html>
