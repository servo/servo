<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reference: white-space-trim next to atomic inlines</title>
<style>
  .box { display: inline-block; width: 8px; height: 8px; background: green; vertical-align: baseline; }
</style>
</head>
<body>
<p>Test passes if it matches the reference.</p>
<div>a<span class="box"></span><span>b</span>c</div>
<div>a<span>b</span><span class="box"></span>c</div>
<div>a <span class="box"></span><span>b</span>c</div>
</body>
</html>
