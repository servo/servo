<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reference: white-space-trim interaction with white-space</title>
</head>
<body>
<p>This test passes if it renders identically to the reference.</p>
<div style="white-space:pre">a <span>b</span></div>
<div style="white-space:pre">a   <span>b</span></div>
<div style="white-space:pre"><span>a</span> b</div>
<div style="white-space:pre-wrap">a <span>b</span></div>
<div>a<span style="white-space:pre">b</span>c</div>
<div style="white-space:nowrap">a<span>b</span>c</div>
</body>
</html>
