<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>white-space-trim does not affect preserved (break-spaces) white space</title>
<link rel="help" href="https://drafts.csswg.org/css-text-4/#white-space-trim">
<link rel="match" href="reference/white-space-trim-break-spaces-ref.html">
<meta name="assert" content="discard-before/discard-after only affect collapsible white space; with white-space-collapse: break-spaces the adjacent white space is preserved and must be left intact.">
<style>
  div { white-space-collapse: break-spaces; }
  .db { white-space-trim: discard-before; }
  .da { white-space-trim: discard-after; }
</style>
</head>
<body>
<p>Test passes if the preserved spaces are kept (identical to the reference).</p>
<div>a <span class="db">b</span></div>
<div><span class="da">a</span> b</div>
</body>
</html>
