<!DOCTYPE html>
<meta charset="utf-8">
<title>wrap-inside: avoid does not propagate into an inline-table child</title>
<link rel="help" href="https://drafts.csswg.org/css-text-4/#wrap-inside">
<link rel="match" href="wrap-inside-avoid-inline-table-child-ref.html">
<meta name="assert" content="The 'avoid' effect of an inline box does not propagate across a formatting context boundary: an inline-table child does not inherit the effective avoid, so the content of its cell wraps normally and only its explicit inner avoid box is kept together.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
    div { width: 110px; font: 20px/20px Ahem; color: green; }
</style>
<!--
    Inside the table cell, "WW XX" (100px) fits within 110px. If the outer avoid propagated into the inline-table,
    "WW" would also be avoid and the whole thing would break inside as a last resort: "WW XX" / "YY". Since avoid does
    not cross the inline-table boundary, "WW" is a normal wrap opportunity and only the inner "XX YY" box is kept
    together, so the line breaks before it: "WW" / "XX YY".
-->
<div><span style="wrap-inside: avoid"><span style="display: inline-table"><div>WW <span style="wrap-inside: avoid">XX YY</span></div></span></span></div>
