<!DOCTYPE html>
<title>
  CSS Gap Decorations: overlap-join makes column rules meet at the row gutter
  center without overlapping when no row rule paints.
</title>
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#junction-segment-endpoint">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#valdef-inset-value-overlap-join">
<link rel="match" href="grid-gap-decorations-081-ref.html">
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
body {
  margin: 0;
}
.container {
  display: grid;
  grid-template: repeat(2, 100px) / repeat(3, 100px);
  gap: 20px;
  column-rule: 6px solid rgba(128 0 0 / 0.5);
  rule-inset: overlap-join;
  padding: 10px;
  rule-break: intersection;
}
.item {
  background: rgba(192 192 192 / 0.75);
}
</style>
<div class="container">
  <div class="item">A</div>
  <div class="item">B</div>
  <div class="item">C</div>
  <div class="item">D</div>
  <div class="item">E</div>
  <div class="item">F</div>
</div>
