<!DOCTYPE html>
<title>CSS Gap Decorations: a column rule does not paint over fragmented block-start padding.</title>
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="match" href="grid-gap-decorations-fragmentation-040-ref.html">
<link rel="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-col {
    columns: 3;
    column-fill: auto;
    column-gap: 10px;
    width: 320px;
    height: 10px;
    background: lightgray;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: 10px;
    column-gap: 10px;
    column-rule: 6px solid blue;
    padding-block-start: 20px;
  }
  .grid-item {
    background: skyblue;
  }
</style>
<div class="multi-col">
  <div class="grid-container">
    <div class="grid-item"></div>
    <div class="grid-item"></div>
  </div>
</div>
