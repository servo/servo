<!DOCTYPE html>
<title>CSS Gap Decorations: column rules account for block-start padding in a fragmented grid.</title>
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="match" href="grid-gap-decorations-fragmentation-038-ref.html">
<link rel="author" title="Kurt Catti-Schmidt" href="mailto:kschmi@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-col {
    columns: 2;
    column-fill: auto;
    column-gap: 10px;
    width: 210px;
    height: 100px;
    background: lightgray;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 80px);
    column-gap: 10px;
    column-rule: 6px solid blue;
    padding-block-start: 20px;
  }
  .grid-item {
    background: skyblue;
  }
</style>
<div class="multi-col">
  <div class="grid-container">
    <div class="grid-item"></div>
    <div class="grid-item"></div>
    <div class="grid-item"></div>
    <div class="grid-item"></div>
  </div>
</div>
