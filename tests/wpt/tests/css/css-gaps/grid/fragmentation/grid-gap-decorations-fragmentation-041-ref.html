<!DOCTYPE html>
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<style>
  body {
    margin: 0;
  }
  .multi-col {
    position: relative;
    columns: 3;
    column-fill: auto;
    column-gap: 10px;
    width: 320px;
    height: 100px;
    background: lightgray;
  }
  .spacer {
    height: 90px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 80px);
    column-gap: 10px;
    padding-block-start: 20px;
  }
  .grid-item {
    background: skyblue;
  }
  .column-rule {
    position: absolute;
    width: 6px;
    background: blue;
  }
</style>
<div class="multi-col">
  <div class="spacer"></div>
  <div class="grid-container">
    <div class="grid-item"></div>
    <div class="grid-item"></div>
    <div class="grid-item"></div>
    <div class="grid-item"></div>
  </div>
  <div class="column-rule" style="left: 157px; top: 10px; height: 90px;"></div>
  <div class="column-rule" style="left: 267px; top: 0; height: 70px;"></div>
</div>
