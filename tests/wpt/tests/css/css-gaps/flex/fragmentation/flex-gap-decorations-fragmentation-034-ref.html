<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-column {
    position: relative;
    columns: 2;
    column-width: 190px;
    column-gap: 10px;
    height: 50px;
    width: 390px;
    background: lightgray;
    column-fill: auto;
  }
  #flexbox {
    display: flex;
    flex-direction: row-reverse;
    flex-wrap: wrap;
    border: 1px solid black;
    width: 190px;
    column-gap: 10px;
  }
  .item {
    flex: none;
    width: 40px;
    height: 40px;
    background: cornflowerblue;
  }
  .tall {
    height: 80px;
  }
  .column-rule {
    position: absolute;
    top: 0;
    width: 10px;
  }
</style>
<div class="multi-column">
  <div class="column-rule" style="top: 1px; left: 41px; height: 49px; background: blue;"></div>
  <div class="column-rule" style="top: 1px; left: 91px; height: 49px; background: lime;"></div>
  <div class="column-rule" style="top: 1px; left: 141px; height: 49px; background: red;"></div>

  <div class="column-rule" style="left: 291px; height: 31px; background: lime;"></div>

  <div id="flexbox">
    <div class="item"></div>
    <div class="item tall"></div>
    <div class="item"></div>
    <div class="item tall"></div>
  </div>
</div>
