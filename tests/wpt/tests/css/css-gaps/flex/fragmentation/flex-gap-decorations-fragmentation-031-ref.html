<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-column {
    position: relative;
    columns: 2;
    column-width: 110px;
    column-gap: 10px;
    height: 120px;
    width: 230px;
    background: lightgray;
  }
  #flexbox {
    display: flex;
    flex-wrap: wrap-reverse;
    border: 1px solid black;
    width: 110px;
    row-gap: 10px;
    column-gap: 10px;
  }
  .items {
    background-color: cornflowerblue;
    width: 50px;
    height: 50px;
  }
  .row-rule {
    position: absolute;
    width: 110px;
    height: 10px;
  }
  .col-rule {
    position: absolute;
    width: 10px;
    height: 50px;
    background: purple;
  }
</style>
<div class="multi-column">
  <div class="row-rule" style="top: 51px; left: 1px; background: blue;"></div>
  <div class="col-rule" style="top: 1px; left: 51px;"></div>
  <div class="col-rule" style="top: 61px; left: 51px;"></div>

  <div class="row-rule" style="top: 50px; left: 121px; background: red;"></div>
  <div class="col-rule" style="top: 0; left: 171px;"></div>
  <div class="col-rule" style="top: 60px; left: 171px;"></div>

  <div id="flexbox">
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
  </div>
</div>
