<!DOCTYPE html>
<title>CSS Gap Decorations: a fragmented row-reverse flex line retains complete-line column-gap placement indices</title>
<meta name="assert" content="In a fragmented row-reverse flex container, the column gap at fragment-local index 0 after a flex line partially resumes uses complete-line geometric and placement index 1, so a non-repeating column-rule-color list does not restart.">
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#assigning">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#fragmentation">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#flex-direction-property">
<link rel="match" href="flex-gap-decorations-fragmentation-034-ref.html">
<style>
  body {
    margin: 0;
  }
  .multi-column {
    columns: 2;
    column-width: 190px;
    column-gap: 10px;
    height: 50px;
    width: 390px;
    background: lightgray;
    column-fill: auto;
  }
  #flexbox {
    display: flex;
    flex-direction: row-reverse;
    flex-wrap: wrap;
    border: 1px solid black;
    width: 190px;
    column-gap: 10px;
    column-rule-style: solid;
    column-rule-width: 10px;
    column-rule-color: red, lime, blue;
  }
  .item {
    flex: none;
    width: 40px;
    height: 40px;
    background: cornflowerblue;
  }
  .tall {
    height: 80px;
  }
</style>
<div class="multi-column">
  <div id="flexbox">
    <div class="item"></div>
    <div class="item tall"></div>
    <div class="item"></div>
    <div class="item tall"></div>
  </div>
</div>
