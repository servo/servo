<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-column {
    position: relative;
    columns: 2;
    column-width: 170px;
    column-gap: 10px;
    height: 175px;
    width: 350px;
    background: lightgray;
    column-fill: auto;
  }
  #flexbox {
    display: flex;
    flex-direction: column;
    flex-wrap: wrap-reverse;
    border: 1px solid black;
    width: 170px;
    height: 290px;
    row-gap: 10px;
    column-gap: 10px;
  }
  .items {
    background-color: cornflowerblue;
    width: 50px;
  }
  .row-rule {
    position: absolute;
    width: 50px;
    height: 10px;
  }
  .col-rule {
    position: absolute;
    width: 10px;
    background: gray;
  }
</style>
<div class="multi-column">
  <div class="row-rule" style="top: 51px; left: 1px; background: cyan;"></div>
  <div class="row-rule" style="top: 61px; left: 61px; background: blue;"></div>
  <div class="row-rule" style="top: 131px; left: 61px; background: yellow;"></div>
  <div class="row-rule" style="top: 81px; left: 121px; background: red;"></div>
  <div class="col-rule" style="top: 1px; left: 51px; height: 174px;"></div>
  <div class="col-rule" style="top: 1px; left: 111px; height: 174px;"></div>

  <div class="row-rule" style="top: 26px; left: 241px; background: magenta;"></div>
  <div class="col-rule" style="top: 0; left: 231px; height: 116px;"></div>
  <div class="col-rule" style="top: 0; left: 291px; height: 116px;"></div>

  <div id="flexbox">
    <div class="items" style="height: 80px;"></div>
    <div class="items" style="height: 80px;"></div>
    <div class="items" style="height: 80px;"></div>
    <div class="items" style="height: 60px;"></div>
    <div class="items" style="height: 60px;"></div>
    <div class="items" style="height: 60px;"></div>
    <div class="items" style="height: 60px;"></div>
    <div class="items" style="height: 50px;"></div>
    <div class="items" style="height: 40px;"></div>
  </div>
</div>
