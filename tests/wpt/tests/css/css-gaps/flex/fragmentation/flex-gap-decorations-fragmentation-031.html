<!DOCTYPE html>
<title>
  CSS Gap Decorations: wrap-reverse assigns fragmented flex row-rule
  decorations in global placement order.
</title>
<meta name="assert" content="In a fragmented row flex container with wrap-reverse, row-rule values are assigned by globally reversing the complete unfragmented row-rule sequence; a gap suppressed at a fragment break still consumes its value.">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#assigning">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#fragmentation">
<link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#flex-wrap-property">
<link rel="match" href="flex-gap-decorations-fragmentation-031-ref.html">
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body {
    margin: 0;
  }
  .multi-column {
    columns: 2;
    column-width: 110px;
    column-gap: 10px;
    height: 120px;
    width: 230px;
    background: lightgray;
  }
  #flexbox {
    display: flex;
    flex-wrap: wrap-reverse;
    border: 1px solid black;
    width: 110px;
    row-gap: 10px;
    column-gap: 10px;
    row-rule-style: solid;
    row-rule-width: 10px;
    row-rule-color: red, lime, blue;
    column-rule-style: solid;
    column-rule-width: 10px;
    column-rule-color: purple;
  }
  .items {
    background-color: cornflowerblue;
    width: 50px;
    height: 50px;
  }
</style>
<div class="multi-column">
  <div id="flexbox">
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
    <div class="items"></div>
  </div>
</div>
