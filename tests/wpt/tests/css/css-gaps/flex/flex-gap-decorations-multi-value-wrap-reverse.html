<!DOCTYPE html>
<title>
    CSS Gap Decorations: Flex gap decoration colors with multiple values are
    assigned in cross-axis placement direction when flex-wrap is
    wrap-reverse.
</title>
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#gap-decorations">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14156">
<link rel="match" href="flex-gap-decorations-multi-value-wrap-reverse-ref.html">
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
    body {
        margin: 0px;
    }
    .flex {
        display: flex;
        gap: 10px;
        width: 50px;
        height: 230px;
        row-rule-color: red, green, blue;
        row-rule-style: solid;
        row-rule-width: 10px;
        margin-bottom: 20px;
    }
    .flex > * {
        background: lightgray;
        width: 50px;
        height: 50px;
    }
</style>
<div class="flex" style="flex-wrap: wrap;">
    <div></div><div></div><div></div><div></div>
</div>
<div class="flex" style="flex-wrap: wrap-reverse;">
    <div></div><div></div><div></div><div></div>
</div>
