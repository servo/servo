<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(5, 60px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 60px;
    background: #5b8def;
  }
  .first { grid-column: 1; }
  .third { grid-column: 3; }
  .col-rule { position: absolute; top: 0; width: 0; height: 60px; border-left: 4px solid blue; }
</style>
<div class="case">
  <div class="lanes">
    <div class="first"></div>
    <div class="third"></div>
  </div>
  <div class="col-rule" style="left: 68px;"></div>
  <div class="col-rule" style="left: 148px;"></div>
  <div class="col-rule" style="left: 228px;"></div>
  <div class="col-rule" style="left: 308px;"></div>
</div>
