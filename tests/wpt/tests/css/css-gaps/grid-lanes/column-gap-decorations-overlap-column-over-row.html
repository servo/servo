<!DOCTYPE html>
<title>CSS Gap Decorations: explicit column-over-row paints grid-axis rules over overlapping stacking-axis rules in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/#overlap">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="column-gap-decorations-overlap-column-over-row-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 80px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
    row-rule-inset-junction-start: -20px;
    row-rule-inset-junction-end: -20px;
    rule-overlap: column-over-row;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-column: 1; height: 60px; }
  .b { grid-column: 1; height: 40px; }
  .c { grid-column: 2; height: 100px; }
  .d { grid-column: 2; height: 40px; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
</div>
