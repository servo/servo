<!DOCTYPE html>
<title>CSS Gap Decorations: with rule-break normal, the grid-axis rule between tracks that contain only a spanner stops before the spanner and resumes after it in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#geometry">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="column-gap-decorations-spanner-after-empty-lanes-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 80px);
    gap: 20px;
    background: #cdd5e0;
    width: max-content;
    column-rule: 4px solid blue;
    rule-break: normal;
  }
  .lanes > div { grid-column: 1; height: 60px; background: #5b8def; }
  .lanes > div.span { grid-column: 1 / -1; background: #8a6df0; }
</style>
<div class="lanes">
  <div></div>
  <div class="span"></div>
  <div></div>
</div>
