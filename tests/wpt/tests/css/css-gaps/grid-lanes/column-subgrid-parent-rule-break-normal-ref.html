<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<style>
  body {
    margin: 0;
  }
  .scene {
    height: 180px;
    position: relative;
    width: 190px;
  }
  .lanes {
    background: lightgray;
    column-gap: 20px;
    display: grid-lanes;
    grid-template-columns: repeat(3, 50px);
    height: 180px;
    row-gap: 20px;
    width: 190px;
  }
  .before,
  .after,
  .side {
    background: purple;
  }
  .before,
  .after {
    height: 30px;
  }
  .before-one,
  .after-one {
    grid-column: 1;
  }
  .before-two,
  .after-two {
    grid-column: 2;
  }
  .side {
    grid-column: 3;
    height: 180px;
  }
  .subgrid {
    display: grid;
    grid-column: 1 / span 2;
    grid-template-columns: subgrid;
    grid-template-rows: repeat(2, 30px);
    row-gap: 20px;
  }
  .cell {
    background: teal;
  }
  .column-rule {
    background: blue;
    position: absolute;
    width: 6px;
  }
  .first-before {
    height: 30px;
    left: 57px;
    top: 0;
  }
  .first-after {
    height: 30px;
    left: 57px;
    top: 150px;
  }
  .second {
    height: 180px;
    left: 127px;
    top: 0;
  }
</style>
<div class="scene">
  <div class="lanes">
    <div class="before before-one"></div>
    <div class="before before-two"></div>
    <div class="side"></div>
    <div class="subgrid">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
    <div class="after after-one"></div>
    <div class="after after-two"></div>
  </div>
  <div class="column-rule first-before"></div>
  <div class="column-rule first-after"></div>
  <div class="column-rule second"></div>
</div>
