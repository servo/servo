<!DOCTYPE html>
<title>CSS Gap Decorations: grid-axis rule values follow track placement order with track-reverse in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="column-gap-decorations-list-track-reverse-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(4, 60px);
    grid-lanes-direction: column track-reverse;
    gap: 10px;
    width: max-content;
    background: #cdd5e0;
    column-rule-width: 4px;
    column-rule-style: solid;
    column-rule-color: blue, gold, purple;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t3 { grid-column: 3; }
  .t4 { grid-column: 4; }
</style>
<div class="lanes">
  <div class="t1"></div>
  <div class="t2"></div>
  <div class="t3"></div>
  <div class="t4"></div>
</div>
