<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segments">
<style>
  body { margin: 0; }
  .case {
    position: relative;
    width: max-content;
  }
  .lanes {
    background: #cdd5e0;
    display: grid-lanes;
    gap: 20px;
    grid-lanes-direction: row;
    grid-template-rows: repeat(3, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    width: 40px;
  }
  .first-lane { grid-row: 1; }
  .lanes > .middle-lane {
    grid-row: 2;
    width: 70px;
  }
  .last-lane { grid-row: 3; }
  .lanes > .long { width: 100px; }
  .lanes > .medium { width: 60px; }
  .lanes > .middle-end { width: 60px; }
  .row-rule {
    border-top: 4px solid blue;
    height: 0;
    position: absolute;
  }
</style>
<div class="case">
  <div class="lanes">
    <div class="first-lane"></div>
    <div class="middle-lane"></div>
    <div class="last-lane long"></div>
    <div class="first-lane long"></div>
    <div class="middle-lane middle-end"></div>
    <div class="last-lane"></div>
    <div class="first-lane"></div>
    <div class="last-lane medium"></div>
    <div class="first-lane"></div>
    <div class="last-lane"></div>
  </div>
  <div class="row-rule" style="top: 68px; left: 0; width: 40px;"></div>
  <div class="row-rule" style="top: 68px; left: 60px; width: 10px;"></div>
  <div class="row-rule" style="top: 68px; left: 90px; width: 70px;"></div>
  <div class="row-rule" style="top: 148px; left: 0; width: 70px;"></div>
  <div class="row-rule" style="top: 148px; left: 90px; width: 10px;"></div>
  <div class="row-rule" style="top: 148px; left: 120px; width: 40px;"></div>
</div>
