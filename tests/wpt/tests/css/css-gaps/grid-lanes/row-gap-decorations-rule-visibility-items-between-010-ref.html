<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    background: #cdd5e0;
    display: grid;
    gap: 20px;
    grid-template-rows: repeat(2, 60px);
    grid-template-columns: repeat(4, 40px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-row: 1;
    grid-column: 1;
  }
  .lanes > .other-lane { grid-row: 2; }
  .lanes > .second { grid-column: 2; }
  .lanes > .spanner {
    background: #8a6df0;
    grid-row: 1 / -1;
    grid-column: 3;
  }
  .lanes > .tail { grid-row: 2; grid-column: 4; }
  .lanes > .packed { background: #1f9d6b; grid-column: 2; width: 30px; }
  .row-rule {
    border-top: 4px solid blue;
    height: 0;
    position: absolute;
    top: 68px;
    width: 40px;
  }
</style>
<div class="case">
  <div class="lanes">
    <div></div>
    <div class="other-lane"></div>
    <div class="other-lane second"></div>
    <div class="spanner"></div>
    <div class="tail"></div>
    <div class="packed"></div>
  </div>
  <div class="row-rule" style="left: 0;"></div>
  <div class="row-rule" style="left: 60px;"></div>
</div>
