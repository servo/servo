<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14489">
<style>
  body { margin: 0; }
  .cases {
    display: flex;
    gap: 12px;
  }
  .stage {
    position: relative;
    width: 120px;
    height: 540px;
  }
  .lanes {
    display: grid-lanes;
    grid-lanes-direction: row;
    grid-template-rows: repeat(auto-fit, 60px) 60px 60px;
    gap: 20px;
    width: 120px;
    height: 540px;
    background: #cdd5e0;
  }
  .lanes > div {
    width: 40px;
    background: #5b8def;
  }
  .lanes > .span {
    grid-row: 1 / 3;
    background: #8a6df0;
  }
  .t1 { grid-row: 1; }
  .t2 { grid-row: 2; }
  .t4 { grid-row: 4; }
  .col-rule {
    position: absolute;
    left: 48px;
    width: 0;
    height: 60px;
    border-left: 4px solid blue;
  }
  .row-rule {
    position: absolute;
    left: 0;
    width: 120px;
    height: 0;
    border-top: 4px solid gold;
  }
  .row-rule.blocked {
    left: 60px;
    width: 60px;
  }
</style>
<div class="cases">
  <div class="stage">
    <div class="lanes">
      <div class="span"></div>
      <div class="t1"></div>
      <div class="t2"></div>
      <div class="t4"></div>
      <div class="t4"></div>
    </div>
    <div class="col-rule" style="top: 0;"></div>
