<!DOCTYPE html>
<title>CSS Gap Decorations: around row rule visibility per segment with dense packing and a spanner</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segments">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-dense-packing">
<link rel="match" href="row-gap-decorations-rule-visibility-items-around-005-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    display: grid-lanes;
    flow-tolerance: 0;
    gap: 20px;
    grid-lanes-direction: row;
    grid-lanes-pack: dense;
    grid-template-rows: repeat(2, 60px);
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: around;
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-row: 1;
    width: 40px;
  }
  .lanes > .tall {
    grid-row: 2;
    width: 100px;
  }
  .lanes > .spanner {
    background: #8a6df0;
    grid-row: 1 / -1;
  }
  .lanes > .packed { background: #1f9d6b; }
</style>
<div class="lanes">
  <div></div>
  <div class="tall"></div>
  <div class="spanner"></div>
  <div class="packed"></div>
  <div></div>
</div>
