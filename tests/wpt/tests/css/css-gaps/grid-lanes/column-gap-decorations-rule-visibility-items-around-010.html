<!DOCTYPE html>
<title>CSS Gap Decorations: around column rule visibility with a centered fourth item after a spanner in two dense lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-dense-packing">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-self-alignment">
<link rel="match" href="column-gap-decorations-rule-visibility-items-around-010-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    column-rule: 4px solid blue;
    column-rule-break: intersection;
    column-rule-visibility-items: around;
    display: grid-lanes;
    flow-tolerance: 0;
    gap: 20px;
    grid-lanes-direction: column;
    grid-lanes-pack: dense;
    grid-template-columns: repeat(2, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    color: white;
    font: 600 12px/1 sans-serif;
    grid-column: 1;
    height: 40px;
  }
  .lanes > .second-lane { grid-column: 2; }
  .lanes > .medium { height: 60px; }
  .lanes > .tall { height: 140px; }
  .lanes > .spanner {
    background: #8a6df0;
    grid-column: 1 / -1;
  }
  .lanes > .centered {
    align-self: center;
    background: #1f9d6b;
    height: 20px;
  }
</style>
<div class="lanes">
  <div>1</div>
  <div class="second-lane">A</div>
  <div class="spanner">2</div>
  <div>3</div>
  <div class="centered">4</div>
  <div class="second-lane">B</div>
  <div class="second-lane medium">C</div>
  <div class="second-lane tall">D</div>
</div>
