<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14489">
<style>
  body {
    margin: 0;
  }
  .stage {
    position: relative;
    width: 540px;
    height: 120px;
    margin-bottom: 12px;
  }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 60px) 60px 60px;
    gap: 20px;
    width: 540px;
    height: 120px;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
    color: white;
    font: 600 12px/1 sans-serif;
  }
  .lanes > .span {
    grid-column: 1 / 3;
    background: #8a6df0;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t4 { grid-column: 4; }
  .col-rule {
    position: absolute;
    width: 0;
    border-left: 4px solid blue;
  }
  .row-rule {
    position: absolute;
    height: 0;
    border-top: 4px solid gold;
  }
</style>
<div class="stage">
  <div class="lanes">
    <div class="span">all</div>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t4"></div>
    <div class="t4"></div>
  </div>
  <div class="col-rule" style="left: 68px; top: 60px; height: 60px;"></div>
  <div class="col-rule" style="left: 148px; top: 0; height: 120px;"></div>
  <div class="col-rule" style="left: 228px; top: 0; height: 120px;"></div>
  <div class="col-rule" style="left: 308px; top: 0; height: 120px;"></div>
  <div class="row-rule" style="left: 0; top: 48px; width: 60px;"></div>
  <div class="row-rule" style="left: 80px; top: 48px; width: 60px;"></div>
  <div class="row-rule" style="left: 160px; top: 48px; width: 60px;"></div>
</div>
<div class="stage">
  <div class="lanes">

    <div class="t4"></div>

</div>
