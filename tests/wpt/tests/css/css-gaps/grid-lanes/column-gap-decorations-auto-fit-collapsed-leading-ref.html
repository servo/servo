<!DOCTYPE html>
<link rel="author" title="Javier Contreras"
      href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<style>
  body { margin: 0; }
  .stage {
    position: relative;
    width: 350px;
    height: 90px;
  }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 50px);
    gap: 10px;
    width: 350px;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .t3 { grid-column: 3; }
  .t4 { grid-column: 4; }
  .t5 { grid-column: 5; }
  .t6 { grid-column: 6; }
  .col-rule {
    position: absolute;
    top: 0;
    width: 0;
    height: 90px;
  }
  .row-rule {
    position: absolute;
    top: 43px;
    width: 50px;
    height: 0;
    border-top: 4px solid gold;
  }
</style>
<div class="stage">
  <div class="lanes">
    <div class="t3"></div>
    <div class="t3"></div>
    <div class="t4"></div>
    <div class="t4"></div>
    <div class="t5"></div>
    <div class="t5"></div>
    <div class="t6"></div>
    <div class="t6"></div>
  </div>
  <div class="col-rule"
       style="left: 53px; border-left: 4px solid red;"></div>
  <div class="col-rule"
       style="left: 113px; border-left: 4px solid blue;"></div>
  <div class="col-rule"
       style="left: 173px; border-left: 4px solid green;"></div>
  <div class="row-rule" style="left: 0;"></div>
  <div class="row-rule" style="left: 60px;"></div>
  <div class="row-rule" style="left: 120px;"></div>
  <div class="row-rule" style="left: 180px;"></div>
</div>
