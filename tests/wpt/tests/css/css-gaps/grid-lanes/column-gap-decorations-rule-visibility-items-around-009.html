<!DOCTYPE html>
<title>CSS Gap Decorations: around column rule visibility with centered dense backfill, fill-reverse, and track-reverse</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-dense-packing">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-self-alignment">
<link rel="match" href="column-gap-decorations-rule-visibility-items-around-009-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    column-rule: 4px solid blue;
    column-rule-break: intersection;
    column-rule-visibility-items: around;
    display: grid-lanes;
    flow-tolerance: 0;
    gap: 20px;
    grid-lanes-direction: column fill-reverse track-reverse;
    grid-lanes-pack: dense;
    grid-template-columns: repeat(3, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    color: white;
    font: 600 12px/1 sans-serif;
    height: 40px;
  }
  .lanes > .tall { height: 200px; }
  .lanes > .spanner {
    background: #8a6df0;
    grid-column: 1 / -1;
  }
  .lanes > .centered {
    align-self: center;
    background: #1f9d6b;
    height: 20px;
  }
  .left { align-self: start; grid-column: 1; }
  .tail { grid-column: 3; }
</style>
<div class="lanes">
  <div class="tall">1</div>
  <div>2</div>
  <div>3</div>
  <div class="spanner">4</div>
  <div class="centered">5</div>
  <div class="left">6</div>
  <div class="left">7</div>
  <div class="tail">8</div>
</div>
