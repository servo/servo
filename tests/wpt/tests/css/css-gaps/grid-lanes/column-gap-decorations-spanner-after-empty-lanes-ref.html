<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#geometry">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 80px);
    gap: 20px;
    background: #cdd5e0;
    width: max-content;
  }
  .lanes > div { grid-column: 1; height: 60px; background: #5b8def; }
  .lanes > div.span { grid-column: 1 / -1; background: #8a6df0; }
  .col-rule { position: absolute; width: 0; border-left: 4px solid blue; }
</style>
<div class="lanes">
  <div></div>
  <div class="span"></div>
  <div></div>
</div>
<div class="col-rule" style="left: 88px; top: 0; height: 60px;"></div>
<div class="col-rule" style="left: 88px; top: 160px; height: 60px;"></div>
<div class="col-rule" style="left: 188px; top: 0; height: 60px;"></div>
<div class="col-rule" style="left: 188px; top: 160px; height: 60px;"></div>
