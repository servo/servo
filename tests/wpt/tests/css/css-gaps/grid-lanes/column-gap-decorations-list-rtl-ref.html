<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#assigning">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: 60px 60px 60px 60px;
    grid-lanes-direction: column;
    direction: rtl;
    writing-mode: horizontal-tb;
    gap: 10px;
    width: 270px;
    height: 40px;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t3 { grid-column: 3; }
  .t4 { grid-column: 4; }
  .rule {
    position: absolute;
    top: 0;
    width: 4px;
    height: 40px;
  }
</style>
<div class="lanes">
  <div class="t1"></div>
  <div class="t2"></div>
  <div class="t3"></div>
  <div class="t4"></div>
</div>
<div class="rule" style="left: 203px; background: blue;"></div>
<div class="rule" style="left: 133px; background: gold;"></div>
<div class="rule" style="left: 63px; background: purple;"></div>
