<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 60px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    width: 60px;
    height: 40px;
    background: #5b8def;
  }
  .track-one { grid-column: 1; }
  .lanes > .zero-height { grid-column: 2; height: 0; }
  .col-rule {
    position: absolute;
    top: 0;
    left: 68px;
    width: 0;
    height: 40px;
    border-left: 4px solid blue;
  }
</style>
<div class="case">
  <div class="lanes">
    <div class="track-one"></div>
    <div class="zero-height"></div>
  </div>
  <div class="col-rule"></div>
</div>
