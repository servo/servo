<!DOCTYPE html>
<html class="reftest-wait">
<title>CSS Gap Decorations: dense insertion shows an earlier row rule while a one-sided tail stays hidden with between</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segments">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-dense-packing">
<link rel="match" href="row-gap-decorations-rule-visibility-items-between-010-ref.html">
<script src="/common/rendering-utils.js"></script>
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: between;
    display: grid-lanes;
    flow-tolerance: 0;
    gap: 20px;
    grid-lanes-direction: row;
    grid-lanes-pack: dense;
    grid-template-rows: repeat(2, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-row: 1;
    width: 40px;
  }
  .lanes > .other-lane { grid-row: 2; }
  .lanes > .spanner { background: #8a6df0; grid-row: 1 / -1; }
  .lanes > .tail { grid-row: 2; }
  .lanes > .packed { background: #1f9d6b; width: 30px; }
</style>
<div class="lanes" id="lanes">
  <div></div>
  <div class="other-lane"></div>
  <div class="other-lane"></div>
  <div class="spanner"></div>
  <div class="tail"></div>
</div>
<script>
  waitForAtLeastOneFrame().then(async () => {
    const item = document.createElement("div");
    item.className = "packed";
    document.getElementById("lanes").appendChild(item);
    await waitForAtLeastOneFrame();
    document.documentElement.classList.remove("reftest-wait");
  });
</script>
