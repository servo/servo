<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    row-gap: 10px;
    column-gap: 20px;
    align-content: space-between;
    height: 300px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-row: 1; width: 60px; }
  .b { grid-row: 1; width: 40px; }
  .c { grid-row: 2; width: 100px; }
  .d { grid-row: 3; width: 60px; }
  .e { grid-row: 3; width: 40px; }
  .col-rule { position: absolute; width: 0; border-left: 4px solid blue; }
  .row-rule { position: absolute; height: 0; border-top: 4px solid gold; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
  <div class="e"></div>
</div>
<div class="col-rule" style="left: 68px; top: 0; height: 45px;"></div>
<div class="col-rule" style="left: 68px; top: 255px; height: 45px;"></div>
<div class="row-rule" style="top: 88px; left: 0; width: 50px;"></div>
<div class="row-rule" style="top: 88px; left: 90px; width: 30px;"></div>
<div class="row-rule" style="top: 208px; left: 0; width: 50px;"></div>
<div class="row-rule" style="top: 208px; left: 90px; width: 30px;"></div>
