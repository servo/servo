<!DOCTYPE html>
<title>CSS Gap Decorations: a spanner's preceding column rule takes independent per-lane values assigned from placement start in row grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14156">
<link rel="match" href="row-gap-decorations-list-stacking-axis-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(2, 40px);
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
    column-rule-width: 4px;
    column-rule-style: solid;
    column-rule-color: blue, gold;
  }
  .lanes > div {
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.a { grid-row: 1; width: 30px; }
  .lanes > div.c { grid-row: 2; width: 50px; }
  .lanes > div.b { grid-row: 1; width: 30px; }
  .lanes > div.d { grid-row: 1; width: 30px; }
  .lanes > div.span {
    grid-row: 1 / span 2;
    width: 30px;
    background: #8a6df0;
  }
</style>
<div class="lanes">
  <div class="a">1</div>
  <div class="c">2</div>
  <div class="b">3</div>
  <div class="d">4</div>
  <div class="span">5</div>
</div>
