<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .lanes > .spanner {
    grid-column: 2 / span 2;
    height: 60px;
    background: #2a4f8f;
  }
  .lane-one { grid-column: 1; }
  .lane-three { grid-column: 3; }
  .col-rule {
    position: absolute;
    width: 0;
    border-left: 4px solid blue;
  }
</style>
<div class="case">
  <div class="lanes">
    <div class="spanner"></div>
    <div class="lane-three"></div>
    <div class="lane-three"></div>
    <div class="lane-three"></div>
    <div class="lane-one"></div>
    <div class="lane-one"></div>
    <div class="lane-one"></div>
    <div class="lane-one"></div>
    <div class="lane-one"></div>
  </div>
  <div class="col-rule" style="left: 68px; top: 0; height: 280px;"></div>
  <div class="col-rule" style="left: 148px; top: 60px; height: 220px;"></div>
</div>
