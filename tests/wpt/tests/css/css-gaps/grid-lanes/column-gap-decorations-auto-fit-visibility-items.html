<!DOCTYPE html>
<title>CSS Gap Decorations: rule-visibility-items uses adjacent track occupancy only for grid-axis decorations in grid lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14489">
<link rel="match" href="column-gap-decorations-auto-fit-visibility-items-ref.html">
<style>
  body { margin: 0; }
  .stage {
    width: 540px;
    height: 120px;
    margin-bottom: 12px;
  }
  /* Five auto-fit tracks fit. Tracks 1, 2, and 4 are occupied, so tracks 3
     and 5 collapse. */
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 60px) 60px 60px;
    gap: 20px;
    width: 540px;
    height: 120px;
    background: #cdd5e0;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
    color: white;
    font: 600 12px/1 sans-serif;
  }
  .lanes > .span {
    grid-column: 1 / 3;
    background: #8a6df0;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t4 { grid-column: 4; }
</style>
<div class="stage">
  <div class="lanes" style="rule-visibility-items: all">
    <div class="span">all</div>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t4"></div>
    <div class="t4"></div>
  </div>
</div>
<div class="stage">
  <div class="lanes" style="rule-visibility-items: normal">
    <div class="span">normal</div>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t4"></div>
    <div class="t4"></div>
  </div>
</div>
<div class="stage">
  <div class="lanes" style="rule-visibility-items: around">
    <div class="span">around</div>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t4"></div>
    <div class="t4"></div>
  </div>
</div>
<div class="stage">
  <div class="lanes" style="rule-visibility-items: between">
    <div class="span">between</div>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t4"></div>
    <div class="t4"></div>
  </div>
</div>
