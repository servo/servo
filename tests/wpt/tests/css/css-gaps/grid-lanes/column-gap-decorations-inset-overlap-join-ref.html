<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 80px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-column: 1; height: 60px; }
  .b { grid-column: 2; height: 60px; }
  .span { grid-column: 1 / -1; height: 60px; background: #8a6df0; }
  .col-rule { position: absolute; width: 0; border-left: 8px solid blue; }
  .row-rule { position: absolute; height: 0; border-top: 12px solid gold; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="span"></div>
</div>
<div class="row-rule" style="left: 0; top: 64px; width: 94px;"></div>
<div class="row-rule" style="left: 86px; top: 64px; width: 94px;"></div>
<div class="col-rule" style="left: 86px; top: 0; height: 76px;"></div>
