<!DOCTYPE html>
<title>CSS Gap Decorations: stacking-axis rule values are assigned from each lane's placement start with fill-reverse in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14156">
<link rel="match" href="column-gap-decorations-list-fill-reverse-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 60px);
    grid-lanes-direction: column fill-reverse;
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
    row-rule-width: 4px;
    row-rule-style: solid;
    row-rule-color: blue, gold;
  }
  .lanes > div {
    height: 30px;
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.t1 { grid-column: 1; }
  .lanes > div.t2 { grid-column: 2; }
</style>
<div class="lanes">
  <div class="t1">1</div>
  <div class="t1">2</div>
  <div class="t1">3</div>
  <div class="t2">4</div>
  <div class="t2">5</div>
</div>
