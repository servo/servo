<!DOCTYPE html>
<title>CSS Gap Decorations: a grid-axis rule color list assigns one value per gutter from grid-axis placement start in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14156">
<link rel="match" href="column-gap-decorations-list-grid-axis-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
    column-rule-width: 4px;
    column-rule-style: solid;
    column-rule-color: blue, gold, purple;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.t1 { grid-column: 1; }
  .lanes > div.t2 { grid-column: 2; }
  .lanes > div.t3 { grid-column: 3; }
  .lanes > div.t4 { grid-column: 4; }
</style>
<div class="lanes">
  <div class="t1">1</div>
  <div class="t2">2</div>
  <div class="t3">3</div>
  <div class="t4">4</div>
</div>
