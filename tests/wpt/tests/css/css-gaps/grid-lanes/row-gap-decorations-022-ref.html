<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#break">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(2, 60px);
    row-gap: 20px;
    column-gap: 20px;
    background: #cdd5e0;
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
  }
  .lanes > div.a { grid-row: 1; width: 40px; }
  .lanes > div.b { grid-row: 1; width: 40px; }
  .lanes > div.c { grid-row: 1; width: 100px; }
  .lanes > div.d { grid-row: 2; width: 40px; }
  .lanes > div.e { grid-row: 2; width: 100px; }
  .lanes > div.f { grid-row: 2; width: 40px; }
  .row-rule { position: absolute; height: 0; border-top: 4px solid gold; }
  .col-rule { position: absolute; width: 0; border-left: 4px solid blue; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="d"></div>
  <div class="b"></div>
  <div class="e"></div>
  <div class="c"></div>
  <div class="f"></div>
</div>
<div class="row-rule" style="top: 68px; left: 0; width: 40px;"></div>
<div class="row-rule" style="top: 68px; left: 60px; width: 40px;"></div>
<div class="row-rule" style="top: 68px; left: 120px; width: 40px;"></div>
<div class="row-rule" style="top: 68px; left: 180px; width: 40px;"></div>
<div class="col-rule" style="left: 48px; top: 0; height: 60px;"></div>
<div class="col-rule" style="left: 108px; top: 0; height: 60px;"></div>
<div class="col-rule" style="left: 48px; top: 80px; height: 60px;"></div>
<div class="col-rule" style="left: 168px; top: 80px; height: 60px;"></div>
