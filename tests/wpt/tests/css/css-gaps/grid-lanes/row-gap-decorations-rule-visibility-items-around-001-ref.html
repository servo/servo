<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(5, 60px);
    grid-lanes-direction: row;
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    width: 60px;
    background: #5b8def;
  }
  .first { grid-row: 1; }
  .third { grid-row: 3; }
  .row-rule { position: absolute; left: 0; width: 60px; height: 0; border-top: 4px solid gold; }
</style>
<div class="case">
  <div class="lanes">
    <div class="first"></div>
    <div class="third"></div>
  </div>
  <div class="row-rule" style="top: 68px;"></div>
  <div class="row-rule" style="top: 148px;"></div>
  <div class="row-rule" style="top: 228px;"></div>
</div>
