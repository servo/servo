<!DOCTYPE html>
<title>CSS Gap Decorations: a percentage junction inset on a grid-axis rule resolves against the union of overlapping stacking-axis gutters in row grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="row-gap-decorations-inset-overlapping-gutters-percentage-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(2, 80px);
    grid-lanes-direction: row;
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    row-rule: 4px solid blue;
    column-rule: 4px solid gold;
    row-rule-break: intersection;
    row-rule-inset-junction-start: 50%;
    row-rule-inset-junction-end: 50%;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-row: 1; width: 60px; }
  .b { grid-row: 1; width: 60px; }
  .c { grid-row: 2; width: 70px; }
  .d { grid-row: 2; width: 50px; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
</div>
