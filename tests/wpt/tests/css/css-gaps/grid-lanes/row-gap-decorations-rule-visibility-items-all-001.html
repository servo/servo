<!DOCTYPE html>
<title>CSS Gap Decorations: rule-visibility-items all applies to grid-axis row rules only in grid lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<link rel="match" href="row-gap-decorations-rule-visibility-items-all-001-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    grid-lanes-direction: row;
    gap: 20px;
    background: #cdd5e0;
    width: max-content;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
    rule-break: none;
    rule-visibility-items: all;
  }
  .lanes > div {
    grid-row: 1;
    background: #5b8def;
  }
  .first { width: 60px; }
  .second { width: 40px; }
</style>
<div class="lanes">
  <div class="first"></div>
  <div class="second"></div>
</div>
