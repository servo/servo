<!DOCTYPE html>
<title>CSS Gap Decorations: between hides a row rule segment beside a partial opening before a grid-lanes spanner</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#gutters">
<link rel="match" href="row-gap-decorations-rule-visibility-items-between-008-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: between;
    display: grid-lanes;
    gap: 20px;
    grid-lanes-direction: row;
    grid-template-rows: repeat(2, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-row: 2;
    width: 40px;
  }
  .lanes > .first { grid-row: 1; width: 30px; }
  .lanes > .spanner {
    background: #8a6df0;
    grid-row: 1 / -1;
  }
</style>
<div class="lanes">
  <div class="first"></div>
  <div></div>
  <div></div>
  <div class="spanner"></div>
</div>
