<!DOCTYPE html>
<title>CSS Gap Decorations: between row rule segments with a middle grid lane ending before its neighbors</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segments">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="match" href="row-gap-decorations-rule-visibility-items-between-005-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    display: grid-lanes;
    gap: 20px;
    grid-lanes-direction: row;
    grid-template-rows: repeat(3, 60px);
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: between;
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    width: 40px;
  }
  .first-lane { grid-row: 1; }
  .lanes > .middle-lane {
    grid-row: 2;
    width: 70px;
  }
  .last-lane { grid-row: 3; }
  .lanes > .long { width: 100px; }
  .lanes > .medium { width: 60px; }
  .lanes > .middle-end { width: 60px; }
</style>
<div class="lanes">
  <div class="first-lane"></div>
  <div class="middle-lane"></div>
  <div class="last-lane long"></div>
  <div class="first-lane long"></div>
  <div class="middle-lane middle-end"></div>
  <div class="last-lane"></div>
  <div class="first-lane"></div>
  <div class="last-lane medium"></div>
  <div class="first-lane"></div>
  <div class="last-lane"></div>
</div>
