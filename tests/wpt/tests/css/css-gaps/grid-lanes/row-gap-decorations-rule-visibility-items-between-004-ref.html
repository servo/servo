<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid;
    grid-template-rows: repeat(3, 60px);
    grid-template-columns: repeat(5, 40px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    width: 40px;
    height: 60px;
    background: #5b8def;
  }
  .track-one { grid-row: 1; }
  .track-two { grid-row: 2; }
  .row-rule { position: absolute; left: 0; width: 280px; height: 0; border-top: 4px solid blue; }
</style>
<div class="case">
  <div class="lanes">
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-two"></div>
  </div>
  <div class="row-rule" style="top: 68px;"></div>
</div>
