<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    column-gap: 10px;
    row-gap: 20px;
    justify-content: space-between;
    width: 300px;
    background: #cdd5e0;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-column: 1; height: 60px; }
  .b { grid-column: 1; height: 40px; }
  .c { grid-column: 2; height: 100px; }
  .d { grid-column: 3; height: 60px; }
  .e { grid-column: 3; height: 40px; }
  .col-rule { position: absolute; width: 0; border-left: 4px solid blue; }
  .row-rule { position: absolute; height: 0; border-top: 4px solid gold; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
  <div class="e"></div>
</div>
<div class="col-rule" style="left: 88px; top: 0; height: 50px;"></div>
<div class="col-rule" style="left: 88px; top: 90px; height: 30px;"></div>
<div class="col-rule" style="left: 208px; top: 0; height: 50px;"></div>
<div class="col-rule" style="left: 208px; top: 90px; height: 30px;"></div>
<div class="row-rule" style="top: 68px; left: 0; width: 45px;"></div>
<div class="row-rule" style="top: 68px; left: 255px; width: 45px;"></div>
