<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/#lists-repeat">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    gap: 10px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 30px;
    background: #5b8def;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t3 { grid-column: 3; }
  .row-rule { position: absolute; height: 0; width: 60px; }
</style>
<div class="lanes">
  <div class="t1"></div>
  <div class="t1"></div>
  <div class="t1"></div>
  <div class="t1"></div>
  <div class="t1"></div>
  <div class="t2"></div>
  <div class="t2"></div>
  <div class="t2"></div>
  <div class="t3"></div>
  <div class="t3"></div>
  <div class="t3"></div>
  <div class="t3"></div>
  <div class="t3"></div>
  <div class="t3"></div>
  <div class="t3"></div>
</div>
<div class="row-rule" style="left: 0; top: 33px; border-top: 4px solid blue;"></div>
<div class="row-rule" style="left: 0; top: 73px; border-top: 4px solid gold;"></div>
<div class="row-rule" style="left: 0; top: 113px; border-top: 4px solid purple;"></div>
<div class="row-rule" style="left: 0; top: 153px; border-top: 4px solid gold;"></div>
