<!DOCTYPE html>
<title>CSS Gap Decorations: between row rule visibility with an item partially occupying an adjacent segment in grid lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<link rel="match" href="row-gap-decorations-rule-visibility-items-between-004-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    grid-lanes-direction: row;
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: between;
  }
  .lanes > div {
    width: 40px;
    height: 60px;
    background: #5b8def;
  }
  .track-one { grid-row: 1; }
  .lanes > .track-two { grid-row: 2; width: 70px; }
</style>
<div class="lanes">
  <div class="track-one"></div>
  <div class="track-one"></div>
  <div class="track-one"></div>
  <div class="track-one"></div>
  <div class="track-one"></div>
  <div class="track-two"></div>
</div>
