<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
  }
  .lanes > div {
    grid-column: 2 / span 2;
    height: 44px;
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.full { grid-column: 1 / -1; }
  .row-rule { position: absolute; height: 0; border-top: 4px solid gold; }
</style>
<div class="lanes">
  <div class="full">1 (span 4)</div>
  <div>2 (span 2)</div>
  <div class="full">3 (span 4)</div>
</div>
<div class="row-rule" style="top: 47px; left: 70px; width: 60px;"></div>
<div class="row-rule" style="top: 47px; left: 140px; width: 60px;"></div>
<div class="row-rule" style="top: 101px; left: 0; width: 60px;"></div>
<div class="row-rule" style="top: 101px; left: 70px; width: 60px;"></div>
<div class="row-rule" style="top: 101px; left: 140px; width: 60px;"></div>
<div class="row-rule" style="top: 101px; left: 210px; width: 60px;"></div>
