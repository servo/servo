<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<style>
  body { margin: 0; }
  .stage {
    position: relative;
    width: 490px;
    height: 70px;
  }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 40px);
    gap: 10px;
    width: 490px;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 30px;
    background: #5b8def;
  }
  .t1 { grid-column: 1; }
  .t4 { grid-column: 4; }
  .t5 { grid-column: 5; }
  .t8 { grid-column: 8; }
  .t9 { grid-column: 9; }
  .t10 { grid-column: 10; }
  .col-rule {
    position: absolute;
    top: 0;
    width: 0;
    height: 70px;
  }
  .row-rule {
    position: absolute;
    top: 33px;
    width: 40px;
    height: 0;
    border-top: 4px solid gold;
  }
</style>
<div class="stage">
  <div class="lanes">
    <div class="t1"></div>
    <div class="t1"></div>
    <div class="t4"></div>
    <div class="t4"></div>
    <div class="t5"></div>
    <div class="t5"></div>
    <div class="t8"></div>
    <div class="t8"></div>
    <div class="t9"></div>
    <div class="t9"></div>
    <div class="t10"></div>
    <div class="t10"></div>
  </div>
  <div class="col-rule"
       style="left: 43px; border-left: 4px solid blue;"></div>
  <div class="col-rule"
       style="left: 93px; border-left: 4px solid purple;"></div>
  <div class="col-rule"
       style="left: 143px; border-left: 4px solid blue;"></div>
  <div class="col-rule"
       style="left: 193px; border-left: 4px solid purple;"></div>
  <div class="col-rule"
       style="left: 243px; border-left: 4px solid blue;"></div>
  <div class="row-rule" style="left: 0;"></div>
  <div class="row-rule" style="left: 50px;"></div>
  <div class="row-rule" style="left: 100px;"></div>
  <div class="row-rule" style="left: 150px;"></div>
  <div class="row-rule" style="left: 200px;"></div>
  <div class="row-rule" style="left: 250px;"></div>
</div>
