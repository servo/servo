<!DOCTYPE html>
<title>CSS Gap Decorations: between hides a column rule segment beside a partial opening above a grid-lanes spanner</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segment-endpoints">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#gutters">
<link rel="match" href="column-gap-decorations-rule-visibility-items-between-008-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    column-rule: 4px solid blue;
    column-rule-break: intersection;
    column-rule-visibility-items: between;
    display: grid-lanes;
    gap: 20px;
    grid-template-columns: repeat(2, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-column: 2;
    height: 40px;
  }
  .lanes > .first { grid-column: 1; height: 30px; }
  .lanes > .spanner {
    background: #8a6df0;
    grid-column: 1 / -1;
  }
</style>
<div class="lanes">
  <div class="first"></div>
  <div></div>
  <div></div>
  <div class="spanner"></div>
</div>
