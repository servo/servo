<!DOCTYPE html>
<title>CSS Gap Decorations: stacking-axis color, style and width lists each restart in every lane in grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/14156">
<link rel="match" href="column-gap-decorations-list-stacking-types-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
    row-rule-width: 4px, 8px;
    row-rule-style: solid, double;
    row-rule-color: blue, gold, purple;
  }
  .lanes > div {
    height: 30px;
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.t1 { grid-column: 1; }
  .lanes > div.t2 { grid-column: 2; }
  .lanes > div.t3 { grid-column: 3; }
</style>
<div class="lanes">
  <div class="t1">1</div>
  <div class="t1">2</div>
  <div class="t1">3</div>
  <div class="t1">4</div>
  <div class="t2">5</div>
  <div class="t2">6</div>
  <div class="t2">7</div>
  <div class="t3">8</div>
  <div class="t3">9</div>
</div>
