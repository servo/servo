<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(4, 60px);
    grid-lanes-direction: column track-reverse;
    gap: 10px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .t1 { grid-column: 1; }
  .t2 { grid-column: 2; }
  .t3 { grid-column: 3; }
  .t4 { grid-column: 4; }
  .col-rule { position: absolute; top: 0; width: 0; height: 40px; }
</style>
<div class="lanes">
  <div class="t1"></div>
  <div class="t2"></div>
  <div class="t3"></div>
  <div class="t4"></div>
</div>
<div class="col-rule" style="left: 63px; border-left: 4px solid purple;"></div>
<div class="col-rule" style="left: 133px; border-left: 4px solid gold;"></div>
<div class="col-rule" style="left: 203px; border-left: 4px solid blue;"></div>
