<!DOCTYPE html>
<title>CSS Gap Decorations: intersection row rules use between visibility per segment in unequal-length fill-reverse grid lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#break">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<link rel="match" href="row-gap-decorations-rule-visibility-items-between-012-ref.html">
<style>
  body { margin: 0; }
  .case { position: relative; width: max-content; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    grid-lanes-direction: row fill-reverse;
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    row-rule: 4px solid blue;
    row-rule-break: intersection;
    row-rule-visibility-items: between;
  }
  .lanes > div {
    width: 40px;
    height: 60px;
    background: #5b8def;
  }
  .track-one { grid-row: 1; }
  .lanes > .track-two {
    grid-row: 2;
    width: 80px;
  }
</style>
<div class="case">
  <div class="lanes">
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-one"></div>
    <div class="track-two"></div>
  </div>
</div>
