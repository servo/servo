<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    gap: 10px;
    background: #cdd5e0;
    width: max-content;
  }
  .lanes > div {
    height: 30px;
    background: #5b8def;
    color: #fff;
    font: 600 12px/1 sans-serif;
  }
  .lanes > div.t1 { grid-column: 1; }
  .lanes > div.t2 { grid-column: 2; }
  .lanes > div.t3 { grid-column: 3; }
  .row-rule { position: absolute; height: 0; width: 60px; }
</style>
<div class="lanes">
  <div class="t1">1</div>
  <div class="t1">2</div>
  <div class="t1">3</div>
  <div class="t1">4</div>
  <div class="t1">5</div>
  <div class="t2">6</div>
  <div class="t2">7</div>
  <div class="t2">8</div>
  <div class="t3">9</div>
  <div class="t3">10</div>
  <div class="t3">11</div>
  <div class="t3">12</div>
  <div class="t3">13</div>
  <div class="t3">14</div>
</div>
<div class="row-rule" style="top: 33px; left: 0; border-top: 4px solid blue;"></div>
<div class="row-rule" style="top: 73px; left: 0; border-top: 4px solid gold;"></div>
<div class="row-rule" style="top: 113px; left: 0; border-top: 4px solid purple;"></div>
<div class="row-rule" style="top: 153px; left: 0; border-top: 4px solid orange;"></div>
<div class="row-rule" style="top: 33px; left: 70px; border-top: 4px solid blue;"></div>
<div class="row-rule" style="top: 73px; left: 70px; border-top: 4px solid orange;"></div>
<div class="row-rule" style="top: 33px; left: 140px; border-top: 4px solid blue;"></div>
<div class="row-rule" style="top: 73px; left: 140px; border-top: 4px solid gold;"></div>
<div class="row-rule" style="top: 113px; left: 140px; border-top: 4px solid purple;"></div>
<div class="row-rule" style="top: 153px; left: 140px; border-top: 4px solid gold;"></div>
<div class="row-rule" style="top: 193px; left: 140px; border-top: 4px solid orange;"></div>
