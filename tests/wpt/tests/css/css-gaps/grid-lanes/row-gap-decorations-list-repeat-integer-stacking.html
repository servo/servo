<!DOCTYPE html>
<title>CSS Gap Decorations: stacking-axis integer repeat() values restart in every lane in row grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://www.w3.org/TR/css-gaps-1/#lists-repeat">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="row-gap-decorations-list-repeat-integer-stacking-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    grid-lanes-direction: row;
    gap: 10px;
    width: max-content;
    background: #cdd5e0;
    column-rule-width: 4px;
    column-rule-style: solid;
    column-rule-color: blue, repeat(2, gold, purple), orange;
  }
  .lanes > div {
    width: 30px;
    background: #5b8def;
  }
  .r1 { grid-row: 1; }
  .r2 { grid-row: 2; }
  .r3 { grid-row: 3; }
</style>
<div class="lanes">
  <div class="r1"></div>
  <div class="r1"></div>
  <div class="r1"></div>
  <div class="r1"></div>
  <div class="r1"></div>
  <div class="r2"></div>
  <div class="r2"></div>
  <div class="r2"></div>
  <div class="r3"></div>
  <div class="r3"></div>
  <div class="r3"></div>
  <div class="r3"></div>
  <div class="r3"></div>
  <div class="r3"></div>
  <div class="r3"></div>
</div>
