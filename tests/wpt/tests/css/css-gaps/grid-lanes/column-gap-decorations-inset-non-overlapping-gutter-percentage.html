<!DOCTYPE html>
<title>CSS Gap Decorations: a percentage junction inset resolves against one non-overlapping stacking-axis gutter in column grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/">
<link rel="match" href="column-gap-decorations-inset-non-overlapping-gutter-percentage-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 80px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
    column-rule-break: intersection;
    column-rule-inset-junction-start: 50%;
    column-rule-inset-junction-end: 50%;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-column: 1; height: 60px; }
  .b { grid-column: 1; height: 60px; }
  .c { grid-column: 2; height: 140px; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
</div>
