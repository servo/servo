<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(2, 80px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
  }
  .lanes > div { background: #5b8def; }
  .t1 { grid-column: 1; height: 60px; }
  .t2 { grid-column: 2; height: 20px; }
  .span { grid-column: 1 / -1; height: 60px; background: #8a6df0; }
  .col-rule { position: absolute; width: 0; border-left: 8px solid rgba(0, 0, 255, 0.5); }
  .row-rule { position: absolute; height: 0; }
</style>
<div class="lanes">
  <div class="t1"></div>
  <div class="t2"></div>
  <div class="t2"></div>
  <div class="span"></div>
</div>
<div class="row-rule" style="left: 0; top: 68px; width: 94px; border-top: 4px solid gold;"></div>
<div class="row-rule" style="left: 86px; top: 28px; width: 94px; border-top: 4px solid gold;"></div>
<div class="row-rule" style="left: 86px; top: 64px; width: 94px; border-top: 12px solid gold;"></div>
<div class="col-rule" style="left: 86px; top: 0; height: 76px;"></div>
