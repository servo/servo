<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#segments">
<style>
  body { margin: 0; }
  .case {
    position: relative;
    width: max-content;
  }
  .lanes {
    background: #cdd5e0;
    display: grid-lanes;
    gap: 20px;
    grid-template-columns: repeat(3, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    height: 40px;
  }
  .first-lane { grid-column: 1; }
  .lanes > .middle-lane {
    grid-column: 2;
    height: 70px;
  }
  .last-lane { grid-column: 3; }
  .lanes > .long { height: 100px; }
  .lanes > .medium { height: 60px; }
  .lanes > .middle-end { height: 60px; }
  .col-rule {
    border-left: 4px solid blue;
    position: absolute;
    width: 0;
  }
</style>
<div class="case">
  <div class="lanes">
    <div class="first-lane"></div>
    <div class="middle-lane"></div>
    <div class="last-lane long"></div>
    <div class="first-lane long"></div>
    <div class="middle-lane middle-end"></div>
    <div class="last-lane"></div>
    <div class="first-lane"></div>
    <div class="last-lane medium"></div>
    <div class="first-lane"></div>
    <div class="last-lane"></div>
  </div>
  <div class="col-rule" style="left: 68px; top: 0; height: 40px;"></div>
  <div class="col-rule" style="left: 68px; top: 60px; height: 10px;"></div>
  <div class="col-rule" style="left: 68px; top: 90px; height: 70px;"></div>
  <div class="col-rule" style="left: 148px; top: 0; height: 70px;"></div>
  <div class="col-rule" style="left: 148px; top: 90px; height: 10px;"></div>
  <div class="col-rule" style="left: 148px; top: 120px; height: 40px;"></div>
</div>
