<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#inset">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: 80px 80px;
    grid-lanes-direction: row;
    gap: 40px;
    background-color: #cdd5e0;
    background-image: linear-gradient(blue, blue), linear-gradient(blue, blue);
    background-repeat: no-repeat;
    background-position: 0 98px, 115px 98px;
    background-size: 65px 4px, 65px 4px;
    width: max-content;
    height: 200px;
  }
  .lanes > div { background: #5b8def; }
  .a { grid-row: 1; width: 40px; }
  .b { grid-row: 2; width: 70px; }
  .p { grid-row: 1; width: 20px; }
  .c { grid-row: 1; width: 40px; }
  .d { grid-row: 2; width: 70px; }
</style>
<div class="lanes">
  <div class="a"></div>
  <div class="b"></div>
  <div class="p"></div>
  <div class="c"></div>
  <div class="d"></div>
</div>
