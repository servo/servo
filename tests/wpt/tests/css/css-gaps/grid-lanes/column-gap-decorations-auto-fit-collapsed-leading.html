<!DOCTYPE html>
<title>
  CSS Gap Decorations: rules skip leading collapsed auto-fit tracks in grid
  lanes
</title>
<link rel="author" title="Javier Contreras"
      href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<link rel="match"
      href="column-gap-decorations-auto-fit-collapsed-leading-ref.html">
<style>
  body { margin: 0; }
  .stage {
    position: relative;
    width: 350px;
    height: 90px;
  }
  /* Six tracks fit; tracks 3-6 are occupied, so tracks 1-2 collapse. */
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 50px);
    gap: 10px;
    width: 350px;
    background: #cdd5e0;
    column-rule-width: 4px;
    column-rule-style: solid;
    column-rule-color: red, blue, green;
    row-rule: 4px solid gold;
  }
  .lanes > div {
    height: 40px;
    background: #5b8def;
  }
  .t3 { grid-column: 3; }
  .t4 { grid-column: 4; }
  .t5 { grid-column: 5; }
  .t6 { grid-column: 6; }
</style>
<div class="stage">
  <div class="lanes">
    <div class="t3"></div>
    <div class="t3"></div>
    <div class="t4"></div>
    <div class="t4"></div>
    <div class="t5"></div>
    <div class="t5"></div>
    <div class="t6"></div>
    <div class="t6"></div>
  </div>
</div>
