<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Flexible Box Layout Module Level 1: getComputedStyle().order</title>
<link rel="help" href="https://drafts.csswg.org/css-flexbox/#propdef-order">
<meta name="assert" content="order computed value is the specified integer.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
</head>
<body>
<div id="target"></div>
<script>
test_computed_value("order", "0");
test_computed_value("order", "123");
test_computed_value("order", "-45");
// Large integers must serialize as plain decimal, not in scientific notation
// (<integer> is exempt from the <number> 6-significant-figure/scinot rules).
test_computed_value("order", "1234567");
test_computed_value("order", "999999999");
test_computed_value("order", "2147483647");
test_computed_value("order", "-1234567");
</script>
</body>
</html>
