<!DOCTYPE html>
<html class=reftest-wait>
<title>View transitions: old image includes ink overflow of a transformed descendant</title>
<link rel="help" href="https://drafts.csswg.org/css-view-transitions-1/#capture-the-image">
<link rel="match" href="content-with-transformed-child-ref.html">
<meta name="fuzzy" content="maxDifference=0-1; totalPixels=0-400">

<script src="/common/reftest-wait.js"></script>
<style>
.target {
  position: relative;
  width: 100px;
  height: 100px;
  background: green;
  view-transition-name: target;
}

.child {
  position: absolute;
  top: 25px;
  left: 0;
  width: 50px;
  height: 50px;
  background: blue;
  transform: translateX(150px);
}

.hidden {
  contain: paint;
  width: 10px;
  height: 10px;
  background: grey;
  view-transition-name: hidden;
}

html::view-transition-group(hidden) { animation-duration: 300s; }
html::view-transition-image-pair(hidden) { animation: unset; opacity: 0; }

html::view-transition-old(target) {
  animation: unset;
  opacity: 1;
}
html::view-transition-new(target) { animation: unset; opacity: 0; }
</style>

<div class="target">
  <div class="child"></div>
</div>
<div id=hidden class=hidden></div>

<script>
failIfNot(document.startViewTransition, "Missing document.startViewTransition");

async function runTest() {
  document.startViewTransition(() => {
    requestAnimationFrame(() => requestAnimationFrame(takeScreenshot));
  });
}
onload = () => requestAnimationFrame(runTest);
</script>
