<!DOCTYPE html>
<html class="reftest-wait">
<title>View transitions: an iframe scrolled into view during update callback displays all of its old paint</title>
<link rel="help" href="https://drafts.csswg.org/css-view-transitions-1/">
<link rel="match" href="paint-holding-in-iframe-scrolled-into-view-ref.html">
<script src="/common/reftest-wait.js"></script>
<script src="/common/rendering-utils.js"></script>
<style>
  body {
    margin: 0;
  }
  #scroller {
    width: 200px;
    height: 200px;
    overflow: hidden;
  }
  #spacer {
    height: 150px;
  }
  iframe {
    display: block;
    width: 200px;
    height: 200px;
    border: none;
  }
</style>

<div id="scroller">
  <div id="spacer"></div>
  <iframe id="inner" srcdoc="
    <style>
      body {
        margin: 0;
      }
      div {
        height: 100px;
      }
    </style>
    <div id='top' style='background: blue'></div>
    <div id='bottom' style='background: yellow'></div>
  "></iframe>
</div>
<script>
async function runTest() {
  await waitForAtLeastOneFrame();

  let contentDocument = inner.contentDocument;

  contentDocument.startViewTransition(async () => {
    contentDocument.getElementById("top").style.background = "green";
    contentDocument.getElementById("bottom").style.background = "green";
    scroller.scrollTop = 150;

    takeScreenshot();
    return new Promise((resolve) => {});
  });
}
onload = runTest;
</script>
</html>
