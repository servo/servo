<!DOCTYPE html>
<html class="reftest-wait">
<title>View transitions: SVG filters on pseudo-elements are not applied to cross-origin frame content</title>
<link rel="help" href="https://drafts.csswg.org/css-view-transitions-1/#sec">
<link rel="author" href="mailto:vmpstr@chromium.org">
<link rel="match" href="iframe-cross-origin-svg-filter-ref.tentative.html">
<meta name="assert" content="SVG reference filters on ::view-transition-old() and ::view-transition-new() are not applied to the snapshot or the live content of a cross-origin frame.">
<script src="/common/reftest-wait.js"></script>
<script src="/common/rendering-utils.js"></script>
<style>
:root { view-transition-name: none; }
body { margin: 0; }
iframe {
  position: absolute;
  left: 20px;
  top: 20px;
  width: 100px;
  height: 100px;
  border: none;
  view-transition-name: frame;
}
/* Keep the old snapshot and the new live content of the cross-origin frame on
   screen, both with an SVG filter, for the duration of the test. The background
   ensures that the screenshot is taken during the transition. */
::view-transition { background: lightblue; }
::view-transition-group(frame) { animation-duration: 300s; }
::view-transition-old(frame),
::view-transition-new(frame) {
  animation: unset;
  filter: url(#blur);
}
</style>
<svg width="0" height="0" display="none">
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</svg>
<script>
failIfNot(document.startViewTransition, "Missing document.startViewTransition");

const frameRendered = new Promise(resolve => {
  addEventListener("message", e => {
    if (e.data === "rendered")
      resolve();
  });
});

onload = async () => {
  // Make sure that the cross-origin frame's content is in the old snapshot.
  await frameRendered;
  await waitForAtLeastOneFrame();
  await document.startViewTransition().ready;
  await waitForAtLeastOneFrame();
  takeScreenshot();
};
</script>
<iframe src="https://{{hosts[alt][]}}:{{ports[https][0]}}/css/css-view-transitions/support/iframe-cross-origin-svg-filter-child.html"></iframe>
</html>
