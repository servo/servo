<!DOCTYPE html>
<html class=reftest-wait>
<title>View transitions: inline with a block child captures the new state as a single element</title>
<link rel="help" href="https://drafts.csswg.org/css-view-transitions-1/#capture-old-state-algorithm">
<link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1999336">
<link rel="author" href="mailto:emilio@crisal.io">
<link rel="match" href="inline-with-block-child-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<script src="/common/reftest-wait.js"></script>
<style>
:root {
  font: 20px/1 Ahem;
}

#wrapper {
  width: 250px;
  visibility: hidden;
}
span {
  border: 2px solid black;
  background: lightblue;
  view-transition-name: target;
  visibility: visible;
}
.block {
  background: green;
  width: 100px;
}

.hidden {
  view-transition-name: hidden;
}

html::view-transition-group(hidden) { animation-duration: 300s; }
html::view-transition-image-pair(hidden) { animation: unset; opacity: 0; }
html::view-transition-group(root) { visibility: hidden; }

html::view-transition-group(target) {
  animation: unset;
}

html::view-transition-old(target) {
  animation: unset;
  opacity: 0;
}

html::view-transition-new(target) {
  animation: unset;
  opacity: 1;
}

html::view-transition {
  background: pink;
}
</style>

<div id="wrapper">
  FILLER<span>Before<div class="block">Block</div>After</span>
</div>

<div class="hidden"></div>

<script>
failIfNot(document.startViewTransition, "Missing document.startViewTransition");

async function runTest() {
  let transition = document.startViewTransition();
  transition.ready.then(takeScreenshot);
}
onload = () => requestAnimationFrame(() => requestAnimationFrame(runTest));
</script>
