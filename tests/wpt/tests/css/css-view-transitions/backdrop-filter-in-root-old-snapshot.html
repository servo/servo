<!DOCTYPE html>
<html class="reftest-wait">
<title>View transitions: backdrop filter of an element that isn't captured on its own is part of the old root snapshot</title>
<link rel="help" href="https://drafts.csswg.org/css-view-transitions-1/">
<link rel="match" href="backdrop-filter-in-root-old-snapshot-ref.html">
<script src="/common/reftest-wait.js"></script>
<style>
body {
  margin: 0;
  background: green;
}
#filter {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 100px;
  height: 100px;
  backdrop-filter: invert(1);
}

html::view-transition-group(*) { animation-duration: 300s; }
html::view-transition-new(*) { animation: unset; opacity: 0; }
html::view-transition-old(*) { animation: unset; opacity: 1; }
</style>
<div id="filter"></div>
<script>
failIfNot(document.startViewTransition, "Missing document.startViewTransition");

addEventListener("TestRendered", () => {
  document.startViewTransition().ready.then(takeScreenshot);
});
</script>
</html>
