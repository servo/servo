<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Anchor Positioning Test: Computed position-visibility</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#position-visibility">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
<script src="/css/support/inheritance-testcommon.js"></script>
<div id="container">
  <div id="target"></div>
</div>
<script>
  test_computed_value("position-visibility", "always");
  test_computed_value("position-visibility", "anchor-valid");
  test_computed_value("position-visibility", "anchor-visible");
  test_computed_value("position-visibility", "no-overflow");

  test_computed_value("position-visibility", "initial", "anchor-visible");

  test_computed_value("position-visibility", "anchor-valid anchor-visible");
  test_computed_value("position-visibility", "anchor-valid no-overflow");
  test_computed_value("position-visibility", "anchor-visible anchor-valid", "anchor-valid anchor-visible");
  test_computed_value("position-visibility", "anchor-visible no-overflow");
  test_computed_value("position-visibility", "no-overflow anchor-valid", "anchor-valid no-overflow");
  test_computed_value("position-visibility", "no-overflow anchor-visible", "anchor-visible no-overflow");

  test_computed_value("position-visibility", "anchor-valid anchor-visible no-overflow");
  test_computed_value("position-visibility", "anchor-valid no-overflow anchor-visible", "anchor-valid anchor-visible no-overflow");
  test_computed_value("position-visibility", "anchor-visible anchor-valid no-overflow", "anchor-valid anchor-visible no-overflow");
  test_computed_value("position-visibility", "anchor-visible no-overflow anchor-valid", "anchor-valid anchor-visible no-overflow");
  test_computed_value("position-visibility", "no-overflow anchor-valid anchor-visible", "anchor-valid anchor-visible no-overflow");
  test_computed_value("position-visibility", "no-overflow anchor-visible anchor-valid", "anchor-valid anchor-visible no-overflow");

  assert_not_inherited("position-visibility", "anchor-visible", "no-overflow");
</script>
