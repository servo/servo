<!DOCTYPE html>
<html dir=rtl>
<title>Reference: position-area unsafe overflow alignment against viewport - non-overflowing RTL root</title>
<style>
.anchor {
  border: solid orange 20px;
  position: absolute;
  margin: auto;
  top: 50%;
  left: 50%;
}
.above, .below, .left, .right {
  border: solid blue 3px;
  padding: 2px;
  position: absolute;
  width: 0;
  height: 0;
}
.above { bottom: 50%; left: 50%;    height: 60vh;  margin-left:   25px; }
.below { top: 50%;    left: 50%;    height: 60vh;  margin-top:    40px; margin-left: 5px; }
.left  { right: 50%;  top: 50%;     width:  60vw;  margin-top:    25px; }
.right { left: 50%;   top: 50%;     width:  60vw;  margin-top:     5px; margin-left: 40px; }

html { overflow: hidden; }
</style>

<div class=anchor></div>
<div class=above></div>
<div class=below></div>
<div class=left></div>
<div class=right></div>
