<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Anchor Positioning: 'position-anchor: match-parent' reacts to changes of the parent's default anchor element</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#valdef-position-anchor-match-parent">
<link rel="author" href="mailto:jeroen.zwartepoorte@gmail.com">
<link rel="match" href="position-anchor-match-parent-dynamic-ref.html">
<script src="/common/rendering-utils.js"></script>
<script src="/common/reftest-wait.js"></script>
<style>
.cases {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 642px;
}

.case {
  position: relative;
  box-sizing: border-box;
  width: 122px;
  height: 102px;
  border: 1px solid silver;
}

.anchor {
  position: absolute;
  anchor-name: --a;
  left: 20px;
  top: 20px;
  width: 50px;
  height: 20px;
  background: silver;
}

.parent {
  position: fixed;
  inset: 0;
}

.probe {
  position: fixed;
  position-anchor: match-parent;
  left: anchor(right, 20px);
  top: anchor(bottom, 70px);
  width: 20px;
  height: 20px;
  background: green;
}
</style>

<div class="cases">
  <!-- Parent gains a default anchor element. -->
  <div class="case">
    <div class="anchor"></div>
    <div class="parent" id="gains" style="position-anchor: none">
      <div class="probe"></div>
    </div>
  </div>

  <!-- Parent loses its default anchor element. -->
  <div class="case">
    <div class="anchor"></div>
    <div class="parent" id="loses" style="position-anchor: --a">
      <div class="probe"></div>
    </div>
  </div>
</div>

<script>
(async () => {
  await waitForAtLeastOneFrame();
  document.getElementById('gains').style.positionAnchor = '--a';
  document.getElementById('loses').style.positionAnchor = 'none';
  await waitForAtLeastOneFrame();
  takeScreenshot();
})();
</script>
