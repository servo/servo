<!DOCTYPE html>
<meta charset="utf-8" />
<title>CSS Selectors Invalidation: :hover and :active pseudo-classes in the subject when an ancestor changes</title>
<link rel="author" title="Daniil Sakhapov" href="mailto:sakhapov@chromium.org">
<link rel="help" href="https://drafts.csswg.org/selectors/#useraction-pseudos">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  .t-hover :hover { color: rgb(255, 165, 0); }
  .t-active :hover:active { color: rgb(165, 42, 42); }
  #hoverme, #unhoverme { width: 50px; height: 50px; }
</style>
<div id="hover-container">
  <div id="unhoverme">No :hover</div>
  <div id="hoverme">Hover me</div>
</div>
<script>
  const black = "rgb(0, 0, 0)";

  promise_test(async t => {
    const hoverme = document.getElementById("hoverme");
    const unhoverme = document.getElementById("unhoverme");
    const container = document.getElementById("hover-container");
    t.add_cleanup(() => new test_driver.Actions().pointerUp().send());

    await new test_driver.Actions().pointerMove(0, 0, {origin: hoverme}).send();
    assert_true(hoverme.matches(":hover"), "#hoverme is hovered");
    assert_equals(getComputedStyle(hoverme).color, black, "no rule matches before the class change");

    container.classList.add("t-hover");
    assert_equals(getComputedStyle(hoverme).color, "rgb(255, 165, 0)", "hovered descendant is restyled");
    assert_equals(getComputedStyle(unhoverme).color, black, "unhovered descendant is unchanged");

    await new test_driver.Actions().pointerMove(0, 0, {origin: unhoverme}).send();
    assert_equals(getComputedStyle(hoverme).color, black, "previously hovered descendant is restyled");
    assert_equals(getComputedStyle(unhoverme).color, "rgb(255, 165, 0)", "newly hovered descendant is restyled");

    container.classList.remove("t-hover");
    assert_equals(getComputedStyle(unhoverme).color, black, "hovered descendant is restyled on class removal");

    await new test_driver.Actions().pointerMove(0, 0, {origin: hoverme}).pointerDown().send();
    assert_true(hoverme.matches(":active"), "#hoverme is active");
    container.classList.add("t-active");
    assert_equals(getComputedStyle(hoverme).color, "rgb(165, 42, 42)", "hovered and active descendant is restyled");
    assert_equals(getComputedStyle(unhoverme).color, black, "inactive descendant is unchanged");

    await new test_driver.Actions().pointerUp().pointerMove(0, 0, {origin: unhoverme}).send();
    assert_equals(getComputedStyle(hoverme).color, black, "released descendant is restyled");
  }, "Descendant :hover and :hover:active when an ancestor class changes");
</script>
