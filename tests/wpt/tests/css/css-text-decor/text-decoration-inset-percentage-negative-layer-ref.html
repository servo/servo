<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a negative percentage inset is not clipped by a composited layer (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 80px; }
div { will-change: transform; width: max-content; }
u {
  font: 20px/2 Ahem;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
</style>

<div><u style="text-decoration-inset: -50px">abcdefghij</u></div>
