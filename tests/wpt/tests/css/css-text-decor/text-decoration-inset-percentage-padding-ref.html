<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a percentage inset resolves against the decorating box including its padding (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 20px; }
u {
  font: 20px/2 Ahem;
  padding: 0 40px;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
  text-decoration-inset: 60px;
}
b { font-weight: normal; }
</style>

<!-- 25% of the 240px decorating box is 60px. -->

<div><u>aaaa<b>bbbb</b></u></div>
