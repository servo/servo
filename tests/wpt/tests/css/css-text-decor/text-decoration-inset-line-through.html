<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: text-decoration-inset applies to line-through</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-line-through-ref.html">
<meta name="assert" content="text-decoration-inset adjusts the line-through endpoints; a large inset trims the line-through away.">
<style>body { margin: 20px; font: 40px/1.5 monospace; } span { text-decoration-line: line-through; }</style>
<p><span style="text-decoration-inset: 1000px">abcdef</span></p>
