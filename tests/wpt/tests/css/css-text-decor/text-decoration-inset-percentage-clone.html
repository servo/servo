<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: with box-decoration-break: clone a percentage inset resolves per fragment</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="help" href="https://drafts.csswg.org/css-break-4/#propdef-box-decoration-break">
<link rel="match" href="text-decoration-inset-percentage-clone-ref.html">
<meta name="assert" content="For box-decoration-break: clone each fragment is a complete box, so a percentage inset resolves against that fragment's own inline size and both endpoints are inset on every line. Uses -webkit-box-decoration-break because WebKit does not support the unprefixed property.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 20px; }
div { width: 100px; font: 20px/2 Ahem; }
u {
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
</style>

<!-- Each of the two lines is a 100px fragment, so 20% trims 20px from both ends of each line
     independently: "abcde" keeps only "bcd", and "fghij" keeps only "ghi". -->

<div><u style="text-decoration-inset: 20%; -webkit-box-decoration-break: clone">abcde fghij</u></div>
