<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a negative percentage inset is not clipped by a composited layer</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-percentage-negative-layer-ref.html">
<meta name="assert" content="A composited layer is sized from the content's ink overflow, so the overhang of a negative percentage inset must be included in that overflow and painted, exactly as an equivalent negative length is.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 80px; }
div { will-change: transform; width: max-content; }
u {
  font: 20px/2 Ahem;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
</style>

<!-- The <u> is 10ch = 200px wide, so -25% extends each endpoint outward by 50px. -->

<div><u style="text-decoration-inset: -25%">abcdefghij</u></div>
