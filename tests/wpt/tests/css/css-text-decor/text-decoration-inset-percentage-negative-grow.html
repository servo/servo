<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>CSS Text Decoration: growing a negative percentage inset re-expands the ink overflow</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-percentage-negative-grow-ref.html">
<meta name="assert" content="Changing a negative percentage text-decoration-inset to a larger one must recompute the ink overflow, so the newly extended part of the underline is painted rather than clipped to the previous overhang.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 80px; }
div { will-change: transform; width: max-content; }
u {
  font: 20px/2 Ahem;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
  text-decoration-inset: -5%;
}
</style>

<!-- The <u> is 10ch = 200px wide. It is laid out with a -5% (10px) overhang and then changed to
     -25% (50px), which must grow the ink overflow of the composited layer accordingly. -->

<div><u id="target">abcdefghij</u></div>

<script>
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById("target").style.textDecorationInset = "-25%";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.documentElement.classList.remove("reftest-wait");
  }));
}));
</script>
</html>
