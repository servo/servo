<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a negative percentage inset extends a decoration that propagates to a descendant</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-percentage-negative-propagated-ref.html">
<meta name="assert" content="text-decoration-inset is not inherited, so an inset on the box that originates the decoration applies even when the text is inside a descendant inline box. The outward overhang of a negative percentage must be painted rather than clipped, which requires reading the inset off the originating box rather than off the text's immediate parent.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 120px 200px; }
div {
  font: 20px/2 Ahem;
  width: max-content;
  will-change: transform;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
  text-decoration-inset: -50%;
}
</style>

<!-- The decoration originates on the div; the text sits inside a span, so the text box's immediate
     parent is not the box carrying the inset. The div is 10ch = 200px, so -50% extends each endpoint
     outward by 100px. The composited layer means an ink overflow that missed the inset would clip it. -->

<div><span>abcdefghij</span></div>
