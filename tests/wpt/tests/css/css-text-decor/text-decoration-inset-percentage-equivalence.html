<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a percentage text-decoration-inset matches the equivalent length</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-percentage-equivalence-ref.html">
<meta name="assert" content="On a single-fragment decorating box of known inline size, a percentage inset resolves against that inline size, so '25%' of a 200px box paints identically to '50px'.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
body { margin: 20px; }
u {
  font: 20px/2 Ahem;
  text-decoration-line: underline;
  text-decoration-color: blue;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
</style>

<!-- The <u> is exactly 10ch = 200px wide, so 25% resolves to 50px at each endpoint. -->

<p><u style="text-decoration-inset: 25%">abcdefghij</u></p>
