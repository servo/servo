<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: a single text-decoration-inset value applies to both endpoints</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-one-value-ref.html">
<meta name="assert" content="A single <length> applies to both the start and end endpoints, i.e. '12px' == '12px 12px'.">
<style>body { margin: 20px; font: 40px/1.5 monospace; }</style>
<p><u style="text-decoration-inset: 12px">wwwwwwww</u></p>
