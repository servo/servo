<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: text-decoration-inset: auto trims the underline</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="mismatch" href="text-decoration-inset-auto-notref.html">
<meta name="assert" content="text-decoration-inset: auto insets the endpoints by a UA-chosen amount, so the underline differs from an un-inset one.">
<style>body { margin: 20px; font: 40px/1.5 monospace; }</style>
<p><u style="text-decoration-inset: auto">abcdef</u></p>
