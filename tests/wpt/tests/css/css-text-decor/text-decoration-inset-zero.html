<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Text Decoration: text-decoration-inset: 0 does not change the decoration</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property">
<link rel="match" href="text-decoration-inset-zero-ref.html">
<meta name="assert" content="text-decoration-inset: 0 (the initial value) leaves the underline unchanged.">
<style>body { margin: 20px; font: 40px/1.5 monospace; }</style>
<p><u style="text-decoration-inset: 0">abcdef</u></p>
