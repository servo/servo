<!DOCTYPE html>
<title>CSS Borders Test: outline-style: inset follows border-shape</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#border-shape">
<link rel="help" href="https://drafts.csswg.org/css-ui/#outline">
<link rel="match" href="border-shape-outline-inset-ref.html">
<meta name="assert" content="An inset outline on an element with border-shape
must be painted along the border-shape path using the darkened inset shade.">
<style>
body { margin: 0; }
.container { padding: 30px; }
.target {
  width: 100px;
  height: 100px;
  background: lightblue;
  border-shape: circle(50px at 50px 50px);
  outline: 10px inset green;
}
</style>
<div class="container">
  <div class="target"></div>
</div>
