<!DOCTYPE html>
<title>CSS Borders Test: outline-style: groove follows border-shape</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#border-shape">
<link rel="help" href="https://drafts.csswg.org/css-ui/#outline">
<link rel="match" href="border-shape-outline-groove-ref.html">
<meta name="assert" content="A groove outline on an element with border-shape
must be painted along the border-shape path as a darkened outer half and a
lightened inner half.">
<meta name="fuzzy" content="maxDifference=0-100;totalPixels=0-1300">
<style>
body { margin: 0; }
.container { padding: 30px; }
.target {
  width: 100px;
  height: 100px;
  background: lightblue;
  border-shape: circle(50px at 50px 50px);
  outline: 10px groove green;
}
</style>
<div class="container">
  <div class="target"></div>
</div>
