<!DOCTYPE html>
<meta charset="utf-8">
<title>color-scheme affects border-image</title>
<link rel="author" href="https://mozilla.com" title="Mozilla">
<link rel="author" href="mailto:emilio@crisal.io" title="Emilio Cobos Álvarez">
<link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=2058496">
<link rel="help" href="https://drafts.csswg.org/css-color-adjust/#color-scheme-resolution">
<link rel="match" href="border-image-color-scheme-ref.html">
<style>
  div {
    box-sizing: border-box;
    width: 100px;
    height: 100px;
    border: 10px solid red;
    border-image-source: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'\
  style='color-scheme: light dark'><rect fill='light-dark(purple, blue)' width='10' height='10' /></svg>"
      );
    border-image-repeat: round;
    border-image-slice: 25% 25% fill;
  }
</style>
<div style="color-scheme: light"></div>
<div style="color-scheme: dark"></div>
