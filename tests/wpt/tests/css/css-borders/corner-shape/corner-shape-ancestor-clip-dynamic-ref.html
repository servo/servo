<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Borders and Box Decorations 4: reference for corner-shape-ancestor-clip-dynamic</title>
<style>
    body {
        margin: 0;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        overflow: hidden;
    }

    .shape {
        width: 240px;
        height: 270px;
        border-radius: 80px;
        background-color: green;
    }
</style>
</head>
<body>
    <div class="shape" style="corner-shape: notch"></div>
    <div class="shape" style="corner-shape: scoop"></div>
    <div class="shape" style="corner-shape: bevel"></div>
    <div class="shape" style="corner-shape: round"></div>
    <div class="shape" style="corner-shape: square"></div>
</body>
</html>
