<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Borders and Box Decorations 4 Test: Computed values of 'corner-top-left'</title>
<link rel="author" title="Chromium" href="https://chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shorthand">
<meta name="assert" content="This test checks that the computed value of 'corner-top-left' is correct.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>

<div id="target"></div>

<script>
test_computed_value("corner-top-left", "0px round", "0px");
test_computed_value("corner-top-left", "round", "0px");
test_computed_value("corner-top-left", "4px", "4px");
test_computed_value("corner-top-left", "bevel", "superellipse(0)");
test_computed_value("corner-top-left", "4px round", "4px");
test_computed_value("corner-top-left", "2% notch", "superellipse(-infinity) 2%");
test_computed_value("corner-top-left", "4px 2% squircle", "superellipse(2) 4px 2%");
test_computed_value("corner-top-left", "superellipse(-0.5) 30% 10px", "superellipse(-0.5) 30% 10px");
test_computed_value("corner-top-left", "10px / 5px notch", "superellipse(-infinity) 10px 5px");

// 0% is not the initial radius, so the radius component is not omitted.
test_computed_value("corner-top-left", "0% bevel", "superellipse(0) 0%");
</script>
