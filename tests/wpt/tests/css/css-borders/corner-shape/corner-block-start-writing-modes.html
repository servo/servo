<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Borders and Box Decorations 4 Test: logical corner shorthands in writing mode variants</title>
<link rel="author" title="Chromium" href="https://chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shorthand">
<meta name="assert" content="This test checks that 'corner-block-start' and 'corner-inline-start' map to the correct physical corners.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<div id="target"></div>

<script>
function runVariant(name, writingMode, direction, property, value, expectations) {
  test(() => {
    const target = document.getElementById('target');
    target.style.cssText = '';
    target.style.writingMode = writingMode;
    target.style.direction = direction;
    target.style.setProperty(property, value);

    assert_equals(target.style.getPropertyValue(property), value,
                  'specified value');

    const computed = getComputedStyle(target);
    for (const [longhand, expected] of Object.entries(expectations)) {
      assert_equals(computed.getPropertyValue(longhand), expected, longhand);
    }
  }, name);
}

runVariant('corner-block-start in horizontal-tb ltr',
           'horizontal-tb', 'ltr', 'corner-block-start', 'bevel 10px 20px', {
  'border-top-left-radius': '10px',
  'border-top-right-radius': '20px',
  'corner-top-left-shape': 'superellipse(0)',
  'corner-top-right-shape': 'superellipse(0)',
});
runVariant('corner-block-start in horizontal-tb rtl',
           'horizontal-tb', 'rtl', 'corner-block-start', 'bevel 10px 20px', {
  'border-top-right-radius': '10px',
  'border-top-left-radius': '20px',
  'corner-top-right-shape': 'superellipse(0)',
  'corner-top-left-shape': 'superellipse(0)',
});
runVariant('corner-block-start in vertical-rl ltr',
           'vertical-rl', 'ltr', 'corner-block-start', 'bevel 10px 20px', {
  'border-top-right-radius': '10px',
  'border-bottom-right-radius': '20px',
  'corner-top-right-shape': 'superellipse(0)',
  'corner-bottom-right-shape': 'superellipse(0)',
});
runVariant('corner-inline-start in horizontal-tb ltr',
           'horizontal-tb', 'ltr', 'corner-inline-start', 'scoop 10px 20px', {
  'border-top-left-radius': '10px',
  'border-bottom-left-radius': '20px',
  'corner-top-left-shape': 'superellipse(-1)',
  'corner-bottom-left-shape': 'superellipse(-1)',
});
runVariant('corner-inline-start in horizontal-tb rtl',
           'horizontal-tb', 'rtl', 'corner-inline-start', 'scoop 10px 20px', {
  'border-top-right-radius': '10px',
  'border-bottom-right-radius': '20px',
  'corner-top-right-shape': 'superellipse(-1)',
  'corner-bottom-right-shape': 'superellipse(-1)',
});
</script>
