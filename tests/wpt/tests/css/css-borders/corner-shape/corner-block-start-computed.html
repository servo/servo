<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Borders and Box Decorations 4 Test: Computed values of 'corner-block-start'</title>
<link rel="author" title="Chromium" href="https://chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shorthand">
<meta name="assert" content="This test checks that the computed value of 'corner-block-start' is correct across writing mode variants.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>

<div id="target"></div>

<script>
test_computed_value("corner-block-start", "0px round", "0px");
test_computed_value("corner-block-start", "round", "0px");
test_computed_value("corner-block-start", "bevel", "superellipse(0)");
test_computed_value("corner-block-start", "10px bevel", "superellipse(0) 10px");
test_computed_value("corner-block-start", "4px 2% squircle", "superellipse(2) 4px 2%");
test_computed_value("corner-block-start", "1em scoop", "superellipse(-1) 16px");
test_computed_value("corner-block-start", "10px 20px / 5px bevel scoop",
    "superellipse(0) superellipse(-1) 10px 20px / 5px");
</script>
