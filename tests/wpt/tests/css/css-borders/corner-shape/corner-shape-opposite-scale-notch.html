<!DOCTYPE html>
<head>
<title>CSS Borders and Box Decorations 4: notch radii are reduced by the opposite-corner scale factor</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shape-constrain-radii">
<link rel="match" href="corner-shape-opposite-scale-notch-ref.html">
<meta name="assert" content="Notch corners on one diagonal are reduced by the opposite-corner scale factor. A notch collapses two hull vertices onto the corner centre, leaving a hull edge with no normal. The other two corners have radius 0, so the adjacent-corner factor stays 1.">
<style>
    body { margin: 0; }
    .target {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 240px;
        height: 240px;
        background: green;
        border-top-left-radius: 220px;
        corner-top-left-shape: notch;
        border-bottom-right-radius: 220px;
        corner-bottom-right-shape: notch;
    }
</style>
</head>
<div class=target></div>
