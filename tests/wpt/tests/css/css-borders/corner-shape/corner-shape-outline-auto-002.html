<!DOCTYPE html>
<meta charset="utf-8">
<title>'outline: auto' follows 'corner-shape' with positive 'outline-offset'</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shape-rendering">
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#outline-style">
<meta name="assert" content="Checks that 'outline: auto' follows the element's outer contour shaped by 'corner-shape', offset by a positive 'outline-offset'">
<link rel="match" href="corner-shape-outline-auto-002-ref.html">
<style>
  #container {
    position: relative;
    width: 400px;
    height: 400px;
    background-color: gray;
  }

  #target {
    position: absolute;
    top: 100px;
    left: 100px;

    width: 200px;
    height: 200px;
    border-radius: 100px;

    corner-shape: bevel notch squircle scoop;
    outline: 3px auto red;
    outline-offset: 50px;
  }

  svg {
    position: absolute;
  }
</style>
<div id="container">
  <div id="target"></div>

      0-50-50H50v-70.71z"
      fill="none" stroke="green" stroke-width="16" />
  </svg>
</div>
