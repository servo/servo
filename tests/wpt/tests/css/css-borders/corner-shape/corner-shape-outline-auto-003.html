<!DOCTYPE html>
<meta charset="utf-8">
<title>'outline: auto' follows 'corner-shape' with negative 'outline-offset'</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shape-rendering">
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#outline-style">
<meta name="assert" content="Checks that 'outline: auto' follows the element's outer contour shaped by 'corner-shape', offset by a negative 'outline-offset'">
<link rel="match" href="corner-shape-outline-auto-003-ref.html">
<style>
  #container {
    position: relative;
    width: 400px;
    height: 400px;
    background-color: gray;
  }

  #target {
    position: absolute;
    top: 100px;
    left: 100px;

    width: 200px;
    height: 200px;
    border-radius: 100px;

    corner-shape: bevel notch squircle square;
    outline: 3px auto red;
    outline-offset: -20px;
  }

  svg {
    position: absolute;
  }
</style>
<div id="container">
  <div id="target"></div>

  <svg width="400" height="400">
    <path d="M120 208.284V280h82.86c33.393-.004 51.922-.238 64.412-12.728
      10.168-10.168 12.214-24.338 12.625-47.272H180v-71.717z"
      fill="none" stroke="green" stroke-width="16" />
  </svg>
</div>
