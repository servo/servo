<!DOCTYPE html>
<meta charset="utf-8">
<title>'outline: auto' follows 'corner-shape'</title>
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shape-rendering">
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#outline-style">
<meta name="assert" content="Checks that 'outline: auto' follows the element's outer contour shaped by 'corner-shape'.">
<link rel="match" href="corner-shape-outline-auto-001-ref.html">
<style>
  #container {
    position: relative;
    width: 400px;
    height: 400px;
    background-color: gray;
  }

  #target {
    position: absolute;
    top: 100px;
    left: 100px;

    width: 200px;
    height: 200px;
    border-radius: 100px;

    corner-shape: bevel notch squircle scoop;
    outline: 3px auto red;
  }

  svg {
    position: absolute;
  }
</style>
<div id="container">
  <div id="target"></div>

  <svg width="400" height="400">
    <path d="M200 100h0v100h100c0 44.005.142 68.037-15.91 84.09C268.037
      300.142 244.005 300 200 300h0a100 100 0 0 0-100-100h0z"
      fill="none" stroke="green" stroke-width="16" />
  </svg>
</div>
