<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Borders and Box Decorations 4 Test: Computed values of 'corner'</title>
<link rel="author" title="Sebastian Zartner" href="mailto:sebastianzartner@gmail.com">
<link rel="help" href="https://drafts.csswg.org/css-borders-4/#corner-shorthand">
<meta name="assert" content="This test checks that the computed value of 'corner' is correct.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>

<div id="target"></div>

<script>
test_computed_value("corner", "0px round", "0px");
test_computed_value("corner", "round", "0px");
test_computed_value("corner", "10px", "10px");
test_computed_value("corner", "bevel", "superellipse(0)");
test_computed_value("corner", "round 3px", "3px");
test_computed_value("corner", "4px 5% round", "4px 5%");
test_computed_value("corner", "scoop 100%", "superellipse(-1) 100%");
test_computed_value("corner", "30px superellipse(0.4)", "superellipse(0.4) 30px");
test_computed_value("corner", "3% 5rem superellipse(0.4)", "superellipse(0.4) 3% 80px");
test_computed_value("corner", "round 5px / 3px", "5px / 3px");
test_computed_value("corner", "2% notch", "superellipse(-infinity) 2%");
test_computed_value("corner", "0px notch", "superellipse(-infinity)");
test_computed_value("corner", "1em squircle", "superellipse(2) 16px");
test_computed_value("corner", "square bevel bevel square 10px / 50%",
    "superellipse(infinity) superellipse(0) superellipse(0) superellipse(infinity) 10px / 50%");
test_computed_value("corner", "bevel 0 5px 5px 0 / 0 50% 50% 0",
    "superellipse(0) 0px 5px 5px 0px / 0px 50% 50% 0px");
test_computed_value("corner", "bevel scoop 2px", "superellipse(0) superellipse(-1) 2px");

// 0% is not the initial radius, so the radius component is not omitted.
test_computed_value("corner", "0% bevel", "superellipse(0) 0%");
</script>
