<!DOCTYPE html>
<title>Block inside inline, trim block-start, self-collapsing block after content keeps its margins</title>
<link rel="author" title="Claudio Saavedra" href="mailto:csaavedra@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-box-4/#margin-trim">
<link rel="match" href="../../reference/ref-filled-green-100px-square.xht">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<div style="position:relative; width:100px; height:100px; background:red;">
  <div style="position:absolute; top:50px; width:100px; height:30px; background:green;"></div>
  <div style="display:flow-root; background:red;">
    <div style="margin-trim:block-start;">
      <span>
        <div style="margin-top:30px; height:50px; background:green;"></div>
        <div style="margin:30px 0;"></div>
        <div style="height:20px; background:green;"></div>
      </span>
    </div>
  </div>
</div>
