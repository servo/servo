<!DOCTYPE html>
<html>
<head>
<title>margin-trim: block-container dynamic block</title>
<link rel="author" title="Tiaan Louw" href="mailto:tlouw@mozilla.com">
<link rel="help" href="https://drafts.csswg.org/css-box-4/#margin-trim-block">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="Setting margin-trim: block after layout trims the child's block-start and block-end margins.">
<style>
.container {
    background-color: green;
    width: min-content;
}
.outer {
    background-color: green;
    width: 100px;
    height: 50px;
}
.child {
    margin-top: 50px;
    margin-bottom: 50px;
    width: 100px;
    height: 50px;
}
</style>
</head>
<body>
    <p>Test passes if there is a filled green square.</p>
    <div class="container">
        <div class="child"></div>
    </div>
    <div class="outer"></div>
</body>
<script>
// Force an initial layout with margin-trim:none, then turn it on. Both of the
// child's block-axis margins must be trimmed in response for the two green
// boxes to form a filled 100x100 square.
document.body.offsetHeight;
document.querySelector(".container").style["margin-trim"] = "block";
</script>
</html>
