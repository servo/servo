<!DOCTYPE html>
<title>CSS Scroll Snap: Single-axis scrolling prioritizes the scrolled axis under scroll-snap-type: pair</title>
<link rel="help" href="https://drafts.csswg.org/css-scroll-snap-1/#snap-axis"/>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .scroller {
    width: 200px;
    height: 200px;
    overflow: scroll;
    position: relative;
    scroll-snap-type: pair mandatory;
    scrollbar-width: none;
    background: #fafafa;
    border: 2px solid #333;
  }
  .space {
    width: 2000px;
    height: 2000px;
    position: absolute;
  }
  .target {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 4px;
    scroll-snap-align: start start;
  }
  #origin {
    left: 0px;
    top: 0px;
    background: #6c757d;
    border: 2px solid #545b62;
  }
  #target-x {
    left: 600px;
    top: 0px;
    background: #28a745;
    border: 2px solid #1e7e34;
  }
  #target-y {
    left: 0px;
    top: 600px;
    background: #007bff;
    border: 2px solid #0056b3;
  }
</style>

<div id="scroller" class="scroller">
  <div class="space"></div>
  <div id="origin" class="target"></div>
  <div id="target-x" class="target"></div>
  <div id="target-y" class="target"></div>
</div>

<script>
test(t => {
  const scroller = document.getElementById("scroller");
  // Ensure we start at origin (0, 0)
  scroller.scrollTo(0, 0);
  assert_equals(scroller.scrollLeft, 0);
  assert_equals(scroller.scrollTop, 0);

  // Scroll purely along the X axis towards target-x (600, 0)
  scroller.scrollTo(500, 0);
  assert_equals(scroller.scrollLeft, 600, "scrollLeft should snap to target-x on X axis");
  assert_equals(scroller.scrollTop, 0, "scrollTop should remain at target-x's Y offset");
}, "Single-axis scroll prioritizes candidates along the scrolled axis without jumping axes");
</script>
