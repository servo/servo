<!DOCTYPE html>
<html class="reftest-wait">
<title>CSS Content Visibility: SVG gradient in content-visibility: hidden subtree</title>
<link rel="help" href="https://drafts.csswg.org/css-contain/#content-visibility">
<link rel="match" href="/css/reference/blank.html">
<script src="/common/reftest-wait.js"></script>
<div id="locked" style="color: red">
  <svg width="0" height="0">
    <linearGradient id="g">
      <stop id="gradientStop" stop-color="currentColor"/>
    </linearGradient>
  </svg>
</div>
<svg width="100" height="100">
  <rect width="100" height="100" fill="url(#g)"/>
</svg>
<script>
  onload = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    locked.style.contentVisibility = 'hidden';
    gradientStop.setAttribute('stop-color', 'green');
    takeScreenshot();
  }));
</script>
</html>
