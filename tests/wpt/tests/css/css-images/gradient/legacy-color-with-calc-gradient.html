<!DOCTYPE html>
<html>
 <head>
  <title>Legacy color with calc() channels gradient interpolation</title>
  <meta name="fuzzy" content="maxDifference=0-2;totalPixels=0-96000">
  <link rel="author" title="Matt Woodrow" href="mailto:mattwoodrow@apple.com">
  <link rel="help" href="https://www.w3.org/TR/css-color-4/#interpolation">
  <meta name="assert" content="Legacy colors are interpolated in sRGB color space, also when their channels use a calc() that is only resolved with style.">
  <link rel="match" href="legacy-color-with-calc-gradient-ref.html">
  <style>
   .test {
       width: 480px;
       height: 50px;
   }
   #rgb-legacy { background: linear-gradient(to right, rgb(calc(255 * sign(1em)), 0, 0), rgb(0, 255, 0)); }
   #rgb-modern { background: linear-gradient(to right, rgb(calc(255 * sign(1em)) 0 0), rgb(0, 255, 0)); }
   #hsl-legacy { background: linear-gradient(to right, rgb(255, 0, 0), hsl(calc(120 * sign(1em)), 100%, 50%)); }
   #hsl-modern { background: linear-gradient(to right, rgb(255, 0, 0), hsl(calc(120 * sign(1em)) 100% 50%)); }
 </style>
 </head>
 <body>
  <div class="test" id="rgb-legacy"></div>
  <div class="test" id="rgb-modern"></div>
  <div class="test" id="hsl-legacy"></div>
  <div class="test" id="hsl-modern"></div>
 </body>
</html>
