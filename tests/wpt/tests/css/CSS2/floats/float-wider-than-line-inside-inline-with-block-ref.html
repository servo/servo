<!DOCTYPE html>
<html>
<head>
<title>CSS Reference: A float wider than the line, inside an inline box that also contains a block-level box</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
html {
    width: 200px;
    padding-inline-end: 160px;
    font: 20px/1 Ahem;
    color: green;
}

div {
    height: 20px;
    background: green;
}
</style>
</head>
<body>
<div style="width: 40px"></div>
<div style="width: 40px"></div>
<div style="width: 40px"></div>
<div style="width: 40px"></div>
<div style="width: 100px"></div>
<div style="width: 20px"></div>
<div style="width: 20px"></div>
</body>
</html>
