rules:
- background-006.xht: [background-image, background]
- background-006a.xht: [background-image, background]
- background-0*: [background]
- background-1*: [background]
- background-2*: [background]
- background-3*: [background]
- background-alpha-*: [background]
- background-animated-001.xht: [background]
- background-applies-to-*: [background]
- background-body-*: [background]
- background-cover-*: [background]
- background-html-body-001.xht: [background]
- background-iframes-001.xht: [background]
- background-intrinsic-*: [background]
- background-reset-001.xht: [background]
- background-root-003.xht: [background-color]
- background-root-*: [background]
- background-transparency-001.xht: [background]
- background-attachment-*: [background-attachment]
