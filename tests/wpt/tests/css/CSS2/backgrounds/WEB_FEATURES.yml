# The following pattern matches a `background-image-cover-003.xht` which does
# not use the `background-image` property but which nonetheless test relevant
# semantics via the `background` shorthand:
- background-image-*: [background-image]
# The following pattern matches a `background-position-203.xht` which does not
# use the `background-position` property but which nonetheless test relevant
# semantics via the `background` shorthand:
- background-position-*: [background-position]
# The following pattern matches tests which do not use the
# `background-position` property but which nonetheless test relevant semantics
# via the `background` shorthand:
- background-bg-pos-*: [background-position]
- background-repeat-*: [background-repeat]
