<!DOCTYPE html>
<title>Multicol inside a fit-content ancestor keeps its content-driven max-content inline size</title>
<link rel="author" title="Helmut Januschka" href="mailto:helmut@januschka.com">
<link rel="help" href="https://drafts.csswg.org/css-multicol/#cw">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/4952">
<link rel="help" href="https://crbug.com/587743393">
<meta name="assert" content="A multicol whose content max-content inline size exceeds column-width is not clamped to column-width inside a fit-content ancestor.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
.parent {
  width: fit-content;
}
.multicol {
  column-width: 60px;
  column-gap: 20px;
  font: 20px/1 Ahem;
  background: blue;
  color: white;
}
</style>

<!-- "aa bb cc dd" in 20px Ahem: max-content 4*40 + 3*20 = 220. -->
<div class="parent">
  <div class="multicol" data-expected-width="220">
    aa bb cc dd
  </div>
</div>

<script>
document.fonts.ready.then(() => checkLayout('[data-expected-width]'));
</script>
