<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Multi-column Layout: ink overflow of a line doesn't affect column breaks after a spanner</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-multicol-1/#column-span">
<link rel="help" href="https://drafts.csswg.org/css-overflow-3/#ink">
<link rel="match" href="column-break-ink-overflow-after-spanner-001-ref.html">
<meta name="assert" content="A line that doesn't fit at the end of a column moves to the next column, even when its ink overflow is taller than the column. Ink overflow doesn't affect layout.">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
#columns {
    columns: 2;
    column-gap: 0;
    column-fill: auto;
    width: 200px;
    height: 90px;
    font: 20px/20px Ahem;
    orphans: 1;
    widows: 1;
}
.spanner {
    column-span: all;
    height: 10px;
}
.shadow {
    text-shadow: 0 100px transparent;
}
</style>
<div id="columns">
    <div>X<br>X<br>X</div>
    <div class="spanner"></div>
    <div style="height: 10px"></div>
    <div>X<br><span class="shadow">X</span><br>X</div>
</div>
