<!DOCTYPE html>
<title>text-box-trim trims the first line to the larger font-size set by ::first-line, not the block's own font</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#root-inline-box">
<link rel="help" href="https://drafts.csswg.org/css-pseudo-4/#first-line-styling">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<link rel="match" href="text-box-trim-first-line-pseudo-001-ref.html">

<style>
.spacer {
  background: lightgray;
  block-size: 60px;
}
.target {
  font: 20px/2 Ahem;
  text-box: trim-start text;
}
.target::first-line {
  font-size: 200%;
}
</style>

<div class="spacer"></div>
<div class="target">Line1<br>Line2</div>
<div class="spacer"></div>
