<!DOCTYPE html>
<title>text-box-trim trims the last line when ::first-line is present and the last line follows a forced line break</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<link rel="match" href="text-box-trim-first-line-pseudo-004-ref.html">

<style>
.spacer {
  background: lightgray;
  block-size: 60px;
}
.target {
  font: 20px/2 Ahem;
  text-box: trim-end text;
}
.target::first-line {
  color: blue;
}
</style>

<div class="spacer"></div>
<div class="target">AAAA<br>BBBB</div>
<div class="spacer"></div>
