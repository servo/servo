<!DOCTYPE html>
<title>text-box-trim trims the last line when it consists of a fragmented inline (due to wrapping)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />

<style>
.spacer {
  background: lightgray;
  block-size: 60px;
}
.target {
  font: 20px/2 Ahem;
  text-box: trim-end text;
  width: 80px;
}
</style>

<div class="spacer"></div>
<div class="target">AAAA BBBB CCCC</div>
<div class="spacer"></div>
