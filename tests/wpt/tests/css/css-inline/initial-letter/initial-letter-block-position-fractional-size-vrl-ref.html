<!DOCTYPE html>
<title>Tests initial letter whose non-integer size is greater than its sink in vertical-rl</title>
<link rel="author" title="ChangSeok Oh" href="mailto:changseok@chromium.org">
<meta name="flags" content="ahem">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" >
<style>
.sample {
    border: solid 1px green;
    font-family: Ahem;
    font-size: 20px;
    height: 230px;
    line-height: 32px;
    writing-mode: vertical-rl;
}

/* The letter spans `size` lines from the first line, and the text moves
   down by (size - sink) lines. */
.fake-initial-letter {
    background: lime;
    float: left;
    height: 80px;
    width: 80px;
}

#sink-2 { padding-right: 16px; }
#raise { padding-right: 48px; }
</style>
<div class="sample">
<div class="fake-initial-letter"></div>
<div id="sink-2">bc<br>def<br>ghi<br>jkl<br>mno<br></div>
</div>
<div class="sample">
<div class="fake-initial-letter"></div>
<div id="raise">bc<br>def<br>ghi<br>jkl<br>mno<br></div>
</div>
