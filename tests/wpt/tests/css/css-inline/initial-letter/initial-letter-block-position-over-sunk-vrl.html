<!DOCTYPE html>
<title>Tests initial letter whose size is smaller than its sink in vertical-rl</title>
<link rel="author" title="ChangSeok Oh" href="mailto:changseok@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-inline/#initial-letter-block-position">
<link rel="help" href="https://drafts.csswg.org/css-inline/#initial-letter-box-size">
<meta name="assert" content="An initial letter whose size is smaller than its sink is positioned to satisfy its over alignment, and the lines it sinks into are shortened.">
<meta name="flags" content="ahem">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" >
<link rel="match" href="initial-letter-block-position-over-sunk-vrl-ref.html">
<style>
.sample {
    border: solid 1px green;
    font-family: Ahem;
    font-size: 20px;
    height: 230px;
    line-height: 24px;
    writing-mode: vertical-rl;
}

.initial-letter::first-letter {
    color: lime;
    font-size: 100px;   /* should be ignored in rendering */
    line-height: 50px;  /* should be ignored in rendering */
}

#size-2::first-letter { initial-letter: 2 3; }
#size-3::first-letter { initial-letter: 3 4; }
</style>
<div class="sample initial-letter" id="size-2">
Abc<br>def<br>ghi<br>jkl<br>mno<br>
</div>
<div class="sample initial-letter" id="size-3">
Abc<br>def<br>ghi<br>jkl<br>mno<br>
</div>
