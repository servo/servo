<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker skips an out-of-flow first child (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is aligned with the "second" text.</p>

<ul><li><div style="position: absolute">first out of flow</div><div>second</div></li></ul>
