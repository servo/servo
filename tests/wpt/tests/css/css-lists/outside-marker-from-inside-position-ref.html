<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: a marker changing from inside to outside gets a first formatted line (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is outside the list item, level with the "x".</p>

<ul><li style="list-style-position: outside"><div>x</div></li></ul>
