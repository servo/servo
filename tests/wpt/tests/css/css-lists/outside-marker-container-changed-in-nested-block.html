<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker follows its first formatted line into a nested block</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-container-changed-in-nested-block-ref.html">
<meta name="assert" content="Text inserted into an empty grandchild block gives it the first line, which becomes the marker's first formatted line.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is aligned with the "x" on the first line.</p>

<ul><li><div><div id="nested"></div></div><div>y</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("nested").appendChild(document.createTextNode("x"));
  document.body.offsetHeight;
</script>
