<title>CSS Lists: the outside marker aligns with the first formatted line following an empty writing mode root (reference)</title>

<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
  div { width: 100px; height: 60px; }
</style>

<ul><li><div></div>x</li></ul>
