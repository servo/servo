<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker keeps its first formatted line when the list item becomes a multi-column container</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-list-item-becomes-multicol-ref.html">
<meta name="assert" content="The block holding the marker's first formatted line is moved into a multi-column flow thread, and the marker still aligns with that line.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; width: 200px; }
</style>

<p>The test passes if the bullet is aligned with the upper "x".</p>

<ul><li id="item"><div>x</div><div>x</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("item").style.columns = "2";
  document.body.offsetHeight;
</script>
