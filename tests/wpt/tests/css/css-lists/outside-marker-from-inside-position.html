<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: a marker changing from inside to outside gets a first formatted line</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-from-inside-position-ref.html">
<meta name="assert" content="An inside marker has no first formatted line of its own; changing to outside gives it one.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is outside the list item, level with the "x".</p>

<ul><li id="item" style="list-style-position: inside"><div>x</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("item").style.listStylePosition = "outside";
  document.body.offsetHeight;
</script>
