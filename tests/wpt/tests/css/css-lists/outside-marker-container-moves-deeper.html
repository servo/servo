<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker follows its first formatted line into a nested block</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-container-moves-deeper-ref.html">
<meta name="assert" content="Moving the content one level down makes the nested block, not its parent, hold the marker's first formatted line.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is aligned with the "x".</p>

<ul><li><div id="outer">x</div></li></ul>
<script>
  document.body.offsetHeight;
  const inner = document.createElement("div");
  const outer = document.getElementById("outer");
  inner.appendChild(outer.firstChild);
  outer.appendChild(inner);
  document.body.offsetHeight;
</script>
