<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker finds a new first formatted line when its container is removed</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-container-removed-ref.html">
<meta name="assert" content="Removing the block that holds the marker's first formatted line moves the marker onto the next block's line.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is aligned with the "x".</p>

<ul><li><div id="first">x</div><div>x</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("first").remove();
  document.body.offsetHeight;
</script>
