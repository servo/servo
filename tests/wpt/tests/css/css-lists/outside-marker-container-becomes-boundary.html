<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker falls back when its container becomes a table</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-container-becomes-boundary-ref.html">
<meta name="assert" content="A table is not a block container, so no line inside it can hold the marker: the marker goes to the list item's content edge.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is on the first line, level with the upper "x".</p>

<ul><li><div id="first">x</div><div>x</div></li></ul>
<script>
  document.body.offsetHeight;
  document.getElementById("first").style.display = "table";
  document.body.offsetHeight;
</script>
