<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker follows its first formatted line into a nested block (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is aligned with the "x" on the first line.</p>

<ul><li><div><div>x</div></div><div>y</div></li></ul>
