<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker is placed at the line's inline start in a right to left list (reference)</title>
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px monospace; }
</style>

<p>The test passes if the bullet is to the right of "foo", at the right edge of the list.</p>

<ul style="direction: rtl"><li>foo</li></ul>
