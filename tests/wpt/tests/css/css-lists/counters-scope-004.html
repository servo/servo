<!doctype html>
<title>CSS Lists and Counters: counters scope</title>
<link rel="help" href="https://drafts.csswg.org/css-lists/#inheriting-counters">
<link rel="match" href="counters-scope-004-ref.html">
<meta name="assert" content="counters are not inherited from the ancestor, when can be inherited from the previous sibling">
<style type="text/css">
.reset { counter-reset: c; }
.rb::before { counter-reset: c; content: "R"; }
.use { counter-increment: c; }
.use::before { content: counters(c, ".") " "; }
</style>
<p>The following two lines should be the same:</p>
<!-- The first span with class "use" inside "rb" inherits the counter created -->
<!-- by its preceding sibling, rb::before. Its increment produces 1.1: the -->
<!-- outer counter from the second "reset" is 1, and the inner counter is 1. -->
<div>
  <span class="reset"></span>
  <span class="use"></span>
  <span class="reset"></span>
  <span class="use"></span>
  <span class="rb">
    <span class="use"></span>
    <span class="reset"></span>
    <span class="use"></span>
  </span>
</div>
<div>1 1 R 1.1 1.1</div>
