<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker falls back when its container becomes a table (reference)</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
</style>

<p>The test passes if the bullet is on the first line, level with the upper "x".</p>

<ul><li><div style="display: table">x</div><div>x</div></li></ul>
