<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Lists: the outside marker aligns with the first formatted line following an empty writing mode root</title>
<link rel="help" href="https://drafts.csswg.org/css-lists-3/#list-style-position-outside">
<link rel="match" href="outside-marker-after-empty-writing-mode-root-ref.html">
<meta name="assert" content="An empty preceding block establishing a different writing mode holds no line of its own, so the first formatted line is the one after it and the marker aligns with that.">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  ul { margin: 0; padding: 0 0 0 40px; }
  li { font: 20px/20px Ahem; }
  div { width: 100px; height: 60px; }
</style>

<p>The test passes if the bullet is aligned with the "x".</p>

<ul><li><div style="writing-mode: vertical-rl"></div>x</li></ul>
