<!DOCTYPE html>
<html class="reftest-wait">
<title>CSS Backgrounds: Background image using blob URL stays rendered after revokeObjectURL</title>
<link rel="help" href="https://drafts.csswg.org/css-backgrounds-3/#the-background-image">
<link rel="match" href="background-image-blob-url-revoke-ref.html">
<style>
  iframe {
    border: none;
    width: 200px;
    height: 200px;
  }
</style>
<body>
<script>
  (async () => {
    const res = await fetch("/images/green.png");
    const blob = await res.blob();
    const objectURL = URL.createObjectURL(blob);

    window.revoke = () => {
      URL.revokeObjectURL(objectURL);
    };

    const iframe = document.createElement("iframe");
    iframe.onload = () => {
      requestAnimationFrame(() => {
        document.documentElement.classList.remove("reftest-wait");
      });
    };

    iframe.srcdoc = `<!DOCTYPE html><style>body { margin: 0; }</style><div id="target" style="width: 100px; height: 100px; background-image: url('${objectURL}');"></div><script>document.getElementById("target").getBoundingClientRect(); parent.revoke();<\/script>`;

    document.body.appendChild(iframe);
  })();
</script>
</body>
</html>
