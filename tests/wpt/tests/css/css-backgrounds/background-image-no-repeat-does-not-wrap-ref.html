<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Backgrounds: background-repeat: no-repeat paints the image only once</title>
  <style>
    body { margin: 0; background: white; }
    .clip {
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
        height: 100px;
        background: #008000;
    }
  </style>
</head>
<body>
  <div class="clip"></div>
</body>
</html>
