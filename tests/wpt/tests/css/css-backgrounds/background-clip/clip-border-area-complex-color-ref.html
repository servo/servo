<!DOCTYPE html>
<meta charset="utf-8">
<title>Complex green borders</title>
<style>
  .box {
    display: inline-block;
    width: 100px;
    height: 100px;
    margin: 10px;
    border: 20px dashed green;
  }
  .dotted { border-style: dotted; border-radius: 40px; }
  .double { border-style: double; }
</style>
<div class="box"></div>
<div class="box dotted"></div>
<div class="box double"></div>
