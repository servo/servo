<!DOCTYPE html>
<title>CSS Text: box-shadow on inline fragmented due to block-level content</title>
<link rel="author" title="Oriol Brufau" href="obrufau@igalia.com">
<link rel="help" href="https://www.w3.org/TR/css-backgrounds-3/#box-shadow">
<link rel="help" href="https://www.w3.org/TR/css-break-3/#break-decoration">
<link rel="help" href="https://github.com/servo/servo/issues/46095">
<link rel="match" href="block-in-inline-fragmentation-001-ref.html">
<meta name="assert" content="The fragment of the inline that contains
  the block-level shouldn't paint any box shadow.">

<div style="margin-left: 20px; line-height: 150px">
  <span style="box-shadow: 0 0 0 15px cyan; box-decoration-break: clone">
    before
    <div style="width: 50px; height: 50px; background: orange"></div>
    after
  </span>
</div>
