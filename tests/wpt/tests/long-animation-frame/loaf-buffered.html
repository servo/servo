<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Long Animation Frame Timing: basic</title>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/utils.js"></script>

<body>
<h1>Long Animation Frame: buffered</h1>
<div id="log"></div>
<script>
promise_test(async t => {
    busy_wait(very_long_frame_duration);
    await new Promise(resolve => t.step_timeout(resolve, 0));
    const result = await new Promise(resolve => {
        new PerformanceObserver(t.step_func(entries => {
            for (const e of entries.getEntries()) {
                if (e.duration >= very_long_frame_duration)
                    resolve("entry-found");
            }
        })).observe({type: 'long-animation-frame', buffered: true});
        t.step_timeout(() => resolve("timeout"), waiting_for_long_frame_timeout);
    });
    assert_equals(result, "entry-found");
}, 'PerformanceObserver with buffered flag can see previous long-animation-frame entries.');

promise_test(async t => {
    const MAX_BUFFER_SIZE = 200;
    while (performance.getEntriesByType("long-animation-frame").length < MAX_BUFFER_SIZE) {
        await new Promise(resolve => t.step_timeout(() => {
            busy_wait(55);
            resolve();
        }, 0));
    }
    assert_equals(performance.getEntriesByType("long-animation-frame").length, MAX_BUFFER_SIZE);

    for (let i = 0; i < 5; ++i) {
        await new Promise(resolve => t.step_timeout(() => {
            busy_wait(55);
            resolve();
        }, 0));
    }
    assert_equals(performance.getEntriesByType("long-animation-frame").length, MAX_BUFFER_SIZE,
        "Buffer size for long-animation-frame entries should be capped at 200");
}, 'Performance timeline buffer for long-animation-frame is capped at 200 entries.');
</script>
</body>
