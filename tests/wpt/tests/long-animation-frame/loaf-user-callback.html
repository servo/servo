<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Long Animation Frame Timing: basic</title>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/utils.js"></script>

<body>
<h1>Long Animation Frame: user callbacks</h1>
<div id="log"></div>
<script>

test_self_user_callback((t, busy_wait) =>
    t.step_timeout(() => busy_wait()), "TimerHandler:setTimeout");

test_self_user_callback((t, busy_wait) => {
    const interval = setInterval(() => {
        busy_wait();
        clearInterval(interval);
    }, 10);
}, "TimerHandler:setInterval");
test_self_user_callback((t, busy_wait) =>
    requestAnimationFrame(() => busy_wait()), "FrameRequestCallback");

test_self_user_callback((t, busy_wait) => {
    const element = document.createElement("div");
        document.body.appendChild(element);
        t.add_cleanup(() => element.remove());
        new ResizeObserver((entries, observer) => {
            busy_wait(very_long_frame_duration);
            observer.disconnect();
        }).observe(element);
}, "ResizeObserverCallback");

test_self_user_callback((t, busy_wait) => {
    const element = document.createElement("div");
    element.innerText = "123";
    t.add_cleanup(() => element.remove());
    new IntersectionObserver((entries, observer) => {
        busy_wait(very_long_frame_duration);
        observer.disconnect();
    }).observe(element);
    document.body.appendChild(element);
}, "IntersectionObserverCallback");

test_self_user_callback((t, busy_wait) =>
    scheduler.postTask(() => busy_wait()), "SchedulerPostTaskCallback");

  test_self_user_callback((t, busy_wait) => {
    new PerformanceObserver(() => busy_wait()).observe(
      {type: "navigation", buffered: true});
}, "PerformanceObserverCallback");

test_self_user_callback((t, busy_wait) =>
    requestIdleCallback(() => busy_wait()), "IdleRequestCallback");

test_self_user_callback((t, busy_wait) => {
    requestIdleCallback(() => busy_wait(), {timeout: 10});
    t.step_timeout(() => {
        const deadline = performance.now() + 15;
        while (performance.now() < deadline) {}
    });
}, "IdleRequestCallback",
    "requestIdleCallback with timeout");

promise_test(async t => {
    const [entry, script] = await expect_long_frame_with_script(() => {
        setTimeout("window.generate_loaf_now()", 0);
    }, s => s.invoker === "TimerHandler:setTimeout" && s.invokerType === "user-callback", t);

    assert_true(!!entry, "Entry detected");
    assert_equals(script.sourceURL, "");
    assert_equals(script.sourceFunctionName, "");
    assert_equals(script.sourceCharPosition, -1);
    assert_equals(script.sourceLine, -1);
    assert_equals(script.sourceColumn, -1);
}, "LoAF string TimerHandler:setTimeout has empty source location");
</script>
</body>
