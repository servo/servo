<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Range.cloneContents() should work when the range container is a ShadowRoot</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

addEventListener("load", () => {
  function innerHTMLOfDocumentFragment(docFlag) {
    const div = document.createElement("div");
    div.appendChild(docFlag.cloneNode(true));
    return div.innerHTML;
  }
  test(t => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    const shadowRoot = host.attachShadow({mode: "open"});
    const range = document.createRange();
    range.setStart(shadowRoot, 0);
    let docFlag;
    try {
      docFlag = range.cloneContents();
    } catch (e) {
      assert_true(
        false,
        `${t.name}: range.cloneContents() shouldn't throw exception: ${e}`
      );
    }
    assert_equals(
      innerHTMLOfDocumentFragment(docFlag),
      "",
      `${t.name}: range.cloneContents() should return empty DocumentFragment`
    );
  }, 'Range.cloneContents() when "<div><shadow-root>{}</shadow-root></div>"');

  test(t => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    const shadowRoot = host.attachShadow({mode: "open"});
    shadowRoot.innerHTML = "<span>ABC</span>";
    const range = document.createRange();
    range.setStart(shadowRoot, 0);
    range.setEnd(shadowRoot, 1);
    let docFlag;
    try {
      docFlag = range.cloneContents();
    } catch (e) {
      assert_true(
        false,
        `${t.name}: range.cloneContents() shouldn't throw exception: ${e}`
      );
    }
    assert_equals(
      innerHTMLOfDocumentFragment(docFlag),
      "<span>ABC</span>",
      `${
        t.name
      }: range.cloneContents() should return a DocumentFragment which contains the clone of the selected element in the ShadowRoot`
    );
  }, 'Range.cloneContents() when "<div><shadow-root>{<span>ABC</span>}</shadow-root></div>"');

  test(t => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    const shadowRoot = host.attachShadow({mode: "open"});
    shadowRoot.innerHTML = "<span>ABC</span><span>DEF</span>";
    const range = document.createRange();
    range.setStart(shadowRoot, 0);
    range.setEnd(shadowRoot, 1);
    let docFlag;
    try {
      docFlag = range.cloneContents();
    } catch (e) {
      assert_true(
        false,
        `${t.name}: range.cloneContents() shouldn't throw exception: ${e}`
      );
    }
    assert_equals(
      innerHTMLOfDocumentFragment(docFlag),
      "<span>ABC</span>",
      `${
        t.name
      }: range.cloneContents() should return a DocumentFragment which contains the clone of the selected element in the ShadowRoot`
    );
  }, 'Range.cloneContents() when "<div><shadow-root>{<span>ABC</span>}<span>DEF</span></shadow-root></div>"');

  test(t => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    const shadowRoot = host.attachShadow({mode: "open"});
    shadowRoot.innerHTML = "<span>ABC</span><span>DEF</span>";
    const range = document.createRange();
    range.setStart(shadowRoot, 1);
    range.setEnd(shadowRoot, 2);
    let docFlag;
    try {
      docFlag = range.cloneContents();
    } catch (e) {
      assert_true(
        false,
        `${t.name}: range.cloneContents() shouldn't throw exception: ${e}`
      );
    }
    assert_equals(
      innerHTMLOfDocumentFragment(docFlag),
      "<span>DEF</span>",
      `${
        t.name
      }: range.cloneContents() should return a DocumentFragment which contains the clone of the selected element in the ShadowRoot`
    );
  }, 'Range.cloneContents() when "<div><shadow-root><span>ABC</span>{<span>DEF</span>}</shadow-root></div>"');
}, {once: true});
</script>
</head>
<body></body>
</html>
