<!DOCTYPE html>
<title>document.contentType is lowercase when the Content-Type header is in uppercase</title>
<link rel="help" href="https://mimesniff.spec.whatwg.org/#parsing-a-mime-type">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id=log></div>
<script>
async_test(function() {
  var iframe = document.createElement('iframe');
  iframe.addEventListener('load', this.step_func_done(function() {
    assert_equals(iframe.contentDocument.contentType, "text/xml");
  }), false);
  iframe.src = "../support/contenttype_setter.py?type=TEXT&subtype=XML";
  document.body.appendChild(iframe);
});
</script>
