<!DOCTYPE html>
<title>Reference for WebVTT rendering, ::cue, text-wrap-style does not apply</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
html { overflow:hidden }
body { margin:0 }
.video {
    display: inline-block;
    width: 320px;
    height: 180px;
    position: relative;
}
.cue {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font: 50px/1 Ahem;
    color: green;
}
.cue > span {
    background: rgba(0,0,0,1);
}
</style>
<div class="video"><div class="cue"><span>XXX</span><br><span>XX XX</span></div></div>
