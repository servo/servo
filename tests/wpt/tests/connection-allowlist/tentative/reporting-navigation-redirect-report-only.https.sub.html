<!DOCTYPE html>
<html>
  <head>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/common/get-host-info.sub.js"></script>
    <script src="/reporting/resources/report-helper.js"></script>
  </head>
  <body>
    <script>
      const { HTTPS_ORIGIN, HTTPS_REMOTE_ORIGIN } = get_host_info();
      const endpoint = "/reporting/resources/report.py";
      const reportID = 'fb99a3c0-37d9-43af-8d01-a08880629a45';

      promise_test(async t => {
          const iframe = document.createElement('iframe');
          const loaded_promise = new Promise((resolve) => {
              window.addEventListener("message", (e) => {
                  if (e.data === "loaded") {
                      resolve();
                  }
              });
          });

          const target_url = `${HTTPS_REMOTE_ORIGIN}/connection-allowlist/tentative/resources/post-message.html`;
          const initial_url = `${HTTPS_ORIGIN}/common/redirect.py?status=302&location=${encodeURIComponent(target_url)}`;
          iframe.src = initial_url;
          document.body.appendChild(iframe);

          await loaded_promise;
          document.body.removeChild(iframe);

          await wait(5000);
          const reports = await pollReports(endpoint, reportID);

          const report = reports.find(r => r.type === 'connection-allowlist' && r.body.connection === initial_url);
          assert_true(!!report, `A report for ${initial_url} should be present.`);
          assert_equals(report.body.disposition, 'report');
      }, 'Connection-Allowlist-Report-Only report is delivered to the reporting endpoint for a report-only navigation redirect.');
    </script>
  </body>
</html>
