<!DOCTYPE html>
<html class="test-wait">
<link rel="help" href="https://github.com/servo/servo/issues/49561">
<title>Don't crash when observing a target inside a hidden iframe</title>
<iframe id="f" hidden></iframe>
<script>
window.addEventListener("load", () => {
  const observer = new IntersectionObserver(() => {
    document.documentElement.className = "";
  });
  observer.observe(f.contentDocument.documentElement);
});
</script>
</html>
