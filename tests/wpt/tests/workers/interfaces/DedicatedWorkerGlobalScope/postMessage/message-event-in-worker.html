<!DOCTYPE html>
<meta charset=utf-8>
<title>'message' event properties in a dedicated worker</title>
<link rel=help href="https://html.spec.whatwg.org/multipage/#dom-worker-postmessage">
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<div id=log></div>
<script>
async_test(function(t) {
  var worker = new Worker("message-event-in-worker.js");
  worker.onmessage = t.step_func_done(function(evt) {
    var props = evt.data;
    assert_equals(props.className, "[object MessageEvent]");
    assert_equals(props.type, "message");
    assert_false(props.bubbles, "bubbles should be false");
    assert_false(props.cancelable, "cancelable should be false");
    assert_equals(props.data, "test");
    assert_equals(props.origin, "", "origin");
    assert_equals(props.lastEventId, "", "lastEventId");
    assert_true(props.sourceIsNull, "source should be null");
    assert_equals(props.portsLength, 0, "ports");
  });
  worker.postMessage("test");
}, "Properties of the 'message' event in a dedicated worker");
</script>
