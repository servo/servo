<!doctype html>
<meta charset="utf-8">
<title>drawBuffers accepts BACK on the default framebuffer</title>
<link rel="author" title="mxmgorin" href="mailto:102797145+mxmgorin@users.noreply.github.com">
<link rel="help" href="https://registry.khronos.org/webgl/specs/latest/2.0/#4.7.11">
<link rel="help" href="https://registry.khronos.org/OpenGL/specs/es/3.0/es_spec_3.0.pdf#nameddest=subsection.4.2.1">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>

test(function() {
    var gl = document.createElement("canvas").getContext("webgl2");
    gl.clearColor(0, 1, 0, 1);
    gl.drawBuffers([gl.NONE]);
    gl.drawBuffers([gl.BACK]);
    gl.clear(gl.COLOR_BUFFER_BIT);
    var pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    assert_array_equals(Array.from(pixel), [0, 255, 0, 255]);
    assert_equals(gl.getError(), gl.NO_ERROR);
}, "drawBuffers([BACK]) re-enables drawing after drawBuffers([NONE])");

</script>
