<!doctype html>
<meta charset="utf-8">
<title>A clearBufferfv of the drawing buffer is presented</title>
<link rel="author" title="mxmgorin" href="mailto:102797145+mxmgorin@users.noreply.github.com">
<link rel="help" href="https://registry.khronos.org/webgl/specs/latest/1.0/#THE_DRAWING_BUFFER">
<link rel="match" href="drawing-buffer-presented-ref.html">
<style>
  body { margin: 0 }
  canvas { display: block }
</style>
<canvas width="100" height="100"></canvas>
<script>
var gl = document.querySelector("canvas").getContext("webgl2");
gl.clearBufferfv(gl.COLOR, 0, [0, 1, 0, 1]);
</script>
