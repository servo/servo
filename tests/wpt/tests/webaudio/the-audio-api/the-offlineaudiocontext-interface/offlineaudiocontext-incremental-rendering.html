<!DOCTYPE html>
<head>
<title>Test OfflineAudioContext incremental rendering</title>
</head>
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<script>
"use strict";
const RENDER_LENGTH = 1000;
const QUANTUM_SIZE = 256;
const CHUNK_SIZE = 300;

promise_test(async () => {
  const context = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: RENDER_LENGTH,
  });

  const buffer = await context.startRendering();
  assert_equals(buffer.length, RENDER_LENGTH,
      'The final buffer should be trimmed to the context length');
  assert_equals(context.state, 'closed',
      'The context should close after rendering its finite length');
  assert_equals(context.length, RENDER_LENGTH,
      'The context length should remain the requested length');
}, 'Finite length and no chunk size returns the remaining length');

promise_test(async () => {
  const context = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: null,
  });

  const buffer = await context.startRendering();
  assert_equals(buffer.length, QUANTUM_SIZE,
      'The default buffer size should be one render quantum');
  assert_equals(context.length, null,
      'Rendering a chunk should not set the context length');
  await context.close();
  assert_equals(context.state, 'closed',
      'The context should be closed after close resolves');
}, 'Null length and no chunk size returns one render quantum');

promise_test(async () => {
  const context = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: null,
  });

  const buffer = await context.startRendering(CHUNK_SIZE);
  assert_equals(buffer.length, 2 * QUANTUM_SIZE,
      'The chunk size should be rounded up to a render quantum boundary');
  assert_equals(context.length, null,
      'Rendering a chunk should not set the context length');
  await context.close();
  assert_equals(context.state, 'closed',
      'The context should be closed after close resolves');
}, 'Null length and a chunk size returns the rounded chunk size');

promise_test(async () => {
  const context = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: RENDER_LENGTH,
  });

  const firstBuffer = await context.startRendering(CHUNK_SIZE);
  assert_equals(firstBuffer.length, 2 * QUANTUM_SIZE,
      'A chunk with available space should use the rounded chunk size');

  const finalBuffer = await context.startRendering(CHUNK_SIZE);
  assert_equals(finalBuffer.length, RENDER_LENGTH - firstBuffer.length,
      'The final chunk should be trimmed to the remaining context length');
  assert_equals(firstBuffer.length + finalBuffer.length, RENDER_LENGTH,
      'The returned buffers should contain exactly the context length');
  assert_equals(context.state, 'closed',
      'The context should close after rendering its finite length');
}, 'Finite length and a chunk size returns rounded chunks and the remainder');

promise_test(async t => {
  const context = new OfflineAudioContext({
    numberOfChannels: 2,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: RENDER_LENGTH,
  });

  const renderPromises = [
    context.startRendering(QUANTUM_SIZE),
    context.startRendering(QUANTUM_SIZE),
    context.startRendering(QUANTUM_SIZE),
    context.startRendering(QUANTUM_SIZE),
  ];
  await promise_rejects_dom(
      t, 'InvalidStateError', context.startRendering(CHUNK_SIZE),
      'Rendering another chunk should reject when all frames are committed');
  const buffers = await Promise.all(renderPromises);
  assert_array_equals(
      buffers.map(buffer => buffer.length),
      [QUANTUM_SIZE, QUANTUM_SIZE, QUANTUM_SIZE,
       RENDER_LENGTH - 3 * QUANTUM_SIZE],
      'Four buffers should contain exactly the context length');
}, 'startRendering rejects when committed frames reach the render length');

promise_test(async () => {
  const context = new OfflineAudioContext({
    numberOfChannels: 1,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: 2 * QUANTUM_SIZE,
  });

  const suspendPromise =
      context.suspend(QUANTUM_SIZE / context.sampleRate);
  await context.startRendering(QUANTUM_SIZE);
  assert_equals(
      context.state, 'running',
      'Reaching a chunk boundary should not suspend without another render');

  const secondRenderPromise = context.startRendering(QUANTUM_SIZE);
  await suspendPromise;
  assert_equals(
      context.state, 'suspended',
      'The next render should suspend before processing its first quantum');

  await context.resume();
  const secondBuffer = await secondRenderPromise;
  assert_equals(secondBuffer.length, QUANTUM_SIZE,
      'The second chunk should complete after rendering resumes');
  assert_equals(context.state, 'closed',
      'The finite context should close after the second chunk completes');
}, 'suspend at a chunk boundary is applied by the next startRendering call');

promise_test(async t => {
  const context = new OfflineAudioContext({
    numberOfChannels: 1,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: 3 * QUANTUM_SIZE,
  });
  // Play an index ramp so every rendered chunk identifies exactly which
  // sample frames it contains.
  const rampBuffer = new AudioBuffer({
    numberOfChannels: 1,
    sampleRate: context.sampleRate,
    length: 3 * QUANTUM_SIZE,
  });
  const rampData = rampBuffer.getChannelData(0);
  for (let i = 0; i < rampData.length; ++i) {
    rampData[i] = i;
  }
  const source = new AudioBufferSourceNode(context, {buffer: rampBuffer});
  source.connect(context.destination);
  source.start(0);

  // Resolving a chunk promise with an AudioBuffer synchronously invokes a
  // 'then' getter on its prototype chain, re-entering startRendering() while
  // the resolved chunk is still being finalized.
  const observedStates = [];
  let secondPromise;
  let thirdPromise;
  t.add_cleanup(() => {
    delete AudioBuffer.prototype.then;
  });
  Object.defineProperty(AudioBuffer.prototype, 'then', {
    configurable: true,
    get() {
      observedStates.push(context.state);
      if (observedStates.length === 1) {
        secondPromise = context.startRendering(QUANTUM_SIZE);
        thirdPromise = context.startRendering(QUANTUM_SIZE);
      }
      return undefined;
    },
  });

  const firstBuffer = await context.startRendering(QUANTUM_SIZE);
  const [secondBuffer, thirdBuffer] =
      await Promise.all([secondPromise, thirdPromise]);

  assert_equals(observedStates.length, 3,
      'Each chunk promise resolution should invoke the then getter once');
  assert_equals(observedStates[0], 'running',
      'The context should still be running while an intermediate chunk ' +
      'promise is being resolved');
  assert_equals(observedStates[1], 'running',
      'The context should still be running while an intermediate chunk ' +
      'promise is being resolved');
  assert_equals(observedStates[2], 'running',
      'The context should still be running while the final chunk promise ' +
      'is being resolved; the close is queued afterwards');
  assert_equals(context.state, 'closed',
      'The context should close after rendering its finite length');
  [firstBuffer, secondBuffer, thirdBuffer].forEach((buffer, index) => {
    assert_equals(buffer.length, QUANTUM_SIZE,
        `Chunk ${index} should contain one render quantum`);
    assert_array_equals(buffer.getChannelData(0),
        Float32Array.from(
            {length: QUANTUM_SIZE}, (_, i) => index * QUANTUM_SIZE + i),
        `Chunk ${index} should contain sample frames ` +
        `${index * QUANTUM_SIZE}..${(index + 1) * QUANTUM_SIZE - 1} ` +
        'exactly once');
  });
}, 'startRendering called synchronously from AudioBuffer.prototype.then');

promise_test(async t => {
  const context = new OfflineAudioContext({
    numberOfChannels: 1,
    sampleRate: 44100,
    renderSizeHint: QUANTUM_SIZE,
    length: null,
  });

  let triggered = false;
  let secondPromise;
  let closePromise;
  t.add_cleanup(() => {
    delete AudioBuffer.prototype.then;
  });
  Object.defineProperty(AudioBuffer.prototype, 'then', {
    configurable: true,
    get() {
      if (!triggered) {
        triggered = true;
        secondPromise = context.startRendering(QUANTUM_SIZE);
        closePromise = context.close();
      }
      return undefined;
    },
  });

  const firstBuffer = await context.startRendering(QUANTUM_SIZE);
  assert_equals(firstBuffer.length, QUANTUM_SIZE,
      'The first chunk should contain one render quantum');
  await promise_rejects_dom(t, 'AbortError', secondPromise,
      'A chunk queued before a synchronous close should reject with ' +
      'AbortError');
  await closePromise;
  assert_equals(context.state, 'closed',
      'The context should be closed after close resolves');
}, 'startRendering and close called synchronously from ' +
   'AudioBuffer.prototype.then');

</script>
</html>
