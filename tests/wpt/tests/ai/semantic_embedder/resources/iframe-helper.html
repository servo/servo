<!DOCTYPE HTML>
<meta charset="utf-8">
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body></body>
<script>
test_driver.set_test_context(parent);

// The embedding space Chrome serves.
const kOptions = {embeddingSpace: 'embeddinggemma-300m'};

window.onmessage = async message => {
  const { id, type } = message.data;
  try {
    switch (type) {
      case 'SemanticEmbedderCreate':
        await test_driver.bless(
            'SemanticEmbedder.create', () => SemanticEmbedder.create(kOptions),
            window);
        parent.postMessage({id, success: 'Success'}, '*');
        break;
      case 'SemanticEmbedderAvailability':
        const availability = await SemanticEmbedder.availability(kOptions);
        parent.postMessage({id, success: availability}, '*');
        break;
    }
  } catch (err) {
    parent.postMessage({id, err: err}, '*');
  }
};
</script>
