<!DOCTYPE html>
<meta charset="utf-8">
<title>mathbackground on a</title>
<link rel="help" href="https://w3c.github.io/mathml-core/#the-a-element">
<link rel="help" href="https://w3c.github.io/mathml-core/#legacy-mathml-style-attributes">
<link rel="help" href="https://w3c.github.io/mathml-core/#text-mtext">
<link rel="match" href="anchor-mathbackground-001-ref.html"/>
<meta name="assert" content="mathbackground on an a element has a visual effect, including when the a element is a link.">
<math xmlns="http://www.w3.org/1998/Math/MathML">
  <a mathbackground="red">
    <mtext>□■□■□■□</mtext>
  </a>
</math>
<math xmlns="http://www.w3.org/1998/Math/MathML">
  <a href="about:blank" mathbackground="red">
    <mtext>□■□■□■□</mtext>
  </a>
</math>
