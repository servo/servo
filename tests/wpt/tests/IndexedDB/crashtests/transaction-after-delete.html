<!DOCTYPE html>
<link rel="help" href="https://github.com/servo/servo/pull/49519">
<script>
const open = indexedDB.open("a", 1);
open.onupgradeneeded = () => open.result.createObjectStore("s");
open.onsuccess = () => {
  const db = open.result;
  indexedDB.deleteDatabase("a");
  setTimeout(() => db.transaction("s"), 300);
};
</script>
