<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <script src='/webcodecs/videoFrame-encode-preserves-input-utils.js'></script>
</head>
<body>
<script>
window.addEventListener('message', e => {
  if (!e.data || !e.data.frame) {
    return;
  }
  const {frame, config} = e.data;
  encode(frame, config).then(
      () => {
        frame.close();
        e.source.postMessage({done: true}, e.origin);
      },
      err => {
        frame.close();
        e.source.postMessage(
            {error: String(err && err.message ? err.message : err)}, e.origin);
      });
});
</script>
</body>
</html>
