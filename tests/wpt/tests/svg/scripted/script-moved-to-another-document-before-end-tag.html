<!doctype html>
<meta charset="utf-8">
<title>An SVG script moved to another document before its end tag doesn't run</title>
<link rel="help" href="https://html.spec.whatwg.org/#scriptForeignEndTag">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<iframe id="parsed"></iframe>
<iframe id="other"></iframe>
<script>
test(t => {
    const doc = document.getElementById("parsed").contentDocument;
    const other = document.getElementById("other").contentDocument;
    window.moved_svg_script_ran = false;
    window.svg_control_ran = false;
    t.add_cleanup(() => {
        delete window.moved_svg_script_ran;
        delete window.svg_control_ran;
    });
    doc.open();
    doc.write("<svg><script>parent.svg_control_ran = true;</" + "script></svg>");
    doc.write("<svg><script id='moved'>");
    other.body.append(doc.getElementById("moved"));
    doc.write("parent.moved_svg_script_ran = true;</" + "script></svg>");
    doc.close();
    assert_true(window.svg_control_ran, "Unmoved SVG <script> during document parsing must execute");
    assert_false(window.moved_svg_script_ran, "Moved SVG <script> during document parsing must not execute");
}, "Document parsing does not execute an SVG <script> moved to another document before its end tag");
</script>
