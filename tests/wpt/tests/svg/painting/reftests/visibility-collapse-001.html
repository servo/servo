<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>visibility: collapse makes SVG graphics elements invisible, like hidden</title>
  <link rel="match" href="visibility-collapse-001-ref.html">
  <link rel="help" href="https://drafts.csswg.org/css-display-4/#visibility">
</head>
<body>
  <p>Test passes if there is a green square and no red.</p>
  <svg width="400" height="100">
    <rect width="100" height="100" fill="green"/>
    <rect x="100" width="100" height="100" fill="red" style="visibility: collapse"/>
    <g style="visibility: collapse">
      <rect x="200" width="100" height="100" fill="red"/>
    </g>
  </svg>
</body>
</html>
