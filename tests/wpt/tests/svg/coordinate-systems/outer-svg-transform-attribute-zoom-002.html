<!DOCTYPE html>
<meta charset="utf-8">
<title>SVG coordinate systems: transform attribute on the outermost svg element and zoom</title>
<link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/struct.html#SVGElement">
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/coords.html#TransformProperty">
<link rel="help" href="https://drafts.csswg.org/css-transforms-1/#transform-property">
<link rel="help" href="https://drafts.csswg.org/css-viewport/#zoom-property">
<link rel="match" href="outer-svg-transform-attribute-zoom-002-ref.html">
<meta name="assert" content="The transform attribute on an outermost svg element is affected by the zoom property, exactly like the CSS transform property.">
<style>
.container { display: flex; zoom: 2; width: 300px; height: 100px; background-color: gold; }
</style>
<div class="container">
  <svg width="100" height="100" viewBox="0 0 20 20" transform="scale(0.5) translate(-50, -25)">
    <rect x="2" y="2" width="16" height="16" fill="green"/>
  </svg>
  <svg width="100" height="100" viewBox="0 0 20 20" transform="rotate(90 0 10)">
    <rect x="2" y="2" width="16" height="6" fill="green"/>
  </svg>
  <svg width="100" height="100" viewBox="0 0 20 20" transform="matrix(1 0 0 1 5 7.5)">
    <rect x="2" y="2" width="16" height="16" fill="green"/>
  </svg>
</div>
