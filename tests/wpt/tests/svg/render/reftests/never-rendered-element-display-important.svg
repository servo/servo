<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" width="100" height="100">
  <title>Never-rendered elements are not rendered when an author !important rule sets display</title>
  <h:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/render.html#TermNeverRenderedElement"/>
  <h:link rel="match" href="never-rendered-element-display-ref.svg"/>
  <h:meta name="assert" content="A never-rendered element is never directly rendered, regardless of the display value, so display: inline !important does not make its children paint. A paint server inside such a defs can still be used."/>
  <style>
    .shown { display: inline !important; }
  </style>
  <defs class="shown">
    <linearGradient id="green" class="shown">
      <stop offset="0" stop-color="green"/>
      <stop offset="1" stop-color="green"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#green)"/>
  <defs class="shown">
    <rect width="100" height="100" fill="red"/>
  </defs>
  <title class="shown">
    <rect width="100" height="100" fill="red"/>
  </title>
  <desc class="shown">
    <rect width="100" height="100" fill="red"/>
  </desc>
  <metadata class="shown">
    <rect width="100" height="100" fill="red"/>
  </metadata>
  <symbol class="shown">
    <rect width="100" height="100" fill="red"/>
  </symbol>
  <marker class="shown">
    <rect width="100" height="100" fill="red"/>
  </marker>
  <pattern class="shown">
    <rect width="100" height="100" fill="red"/>
  </pattern>
</svg>
