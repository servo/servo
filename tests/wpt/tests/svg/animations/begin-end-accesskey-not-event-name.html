<!doctype html>
<meta charset="utf-8">
<title>SVG animation: accessKey() in begin and end is not an event name</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#AccessKeyValueSyntax">
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#EventValueSyntax">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg width="100" height="100">
  <rect id="beginCamel" width="10" height="10">
    <set attributeName="width" to="20" begin="accessKey(a)"/>
    <set attributeName="height" to="20" begin="ref"/>
  </rect>
  <rect id="beginLower" width="10" height="10">
    <set attributeName="width" to="20" begin="accesskey(a)"/>
    <set attributeName="height" to="20" begin="ref"/>
  </rect>
  <rect id="beginOffset" width="10" height="10">
    <set attributeName="width" to="20" begin="accessKey(a) + 2s"/>
    <set attributeName="height" to="20" begin="ref"/>
  </rect>
  <rect id="endCamel" width="10" height="10">
    <set attributeName="width" to="20" begin="0s" end="accessKey(a)" dur="indefinite"/>
    <set attributeName="height" to="20" begin="ref"/>
  </rect>
  <rect id="endLower" width="10" height="10">
    <set attributeName="width" to="20" begin="0s" end="accesskey(a)" dur="indefinite"/>
    <set attributeName="height" to="20" begin="ref"/>
  </rect>
  <rect id="listAfter" width="10" height="10">
    <set attributeName="width" to="20" begin="accessKey(a); 1s"/>
  </rect>
  <rect id="listBefore" width="10" height="10">
    <set attributeName="width" to="20" begin="1s; accesskey(a)"/>
  </rect>
</svg>
<script>
// accessKey(a) is an accessKey-value, not an event-value, so a DOM event
// whose type is the string "accessKey(a)" must not begin or end the
// animation.
//
// The <set> on width is the one tested. The <set> on height begins on an
// event named "ref": dispatching it after the tested event and waiting for its
// beginEvent shows the animations were sampled after the tested event, so a
// beginEvent or endEvent that did not fire really did not happen.

// Wait one task after the load event: an engine may start the animation
// timeline after the load event handlers have run, and an event dispatched
// before that can be lost.
const loaded = new Promise(resolve => window.addEventListener("load", () => step_timeout(resolve, 0), { once: true }));

function nextEvent(target, type) {
  return new Promise(resolve => target.addEventListener(type, resolve, { once: true }));
}

async function dispatchAndWatch(id, eventType, watchedEvent) {
  await loaded;
  const rect = document.getElementById(id);
  const tested = rect.querySelector("set[attributeName=width]");
  const reference = rect.querySelector("set[attributeName=height]");
  let fired = false;
  tested.addEventListener(watchedEvent, () => fired = true, { once: true });
  rect.dispatchEvent(new Event(eventType));
  const sampled = nextEvent(reference, "beginEvent");
  rect.dispatchEvent(new Event("ref"));
  await sampled;
  await new Promise(requestAnimationFrame);
  await new Promise(requestAnimationFrame);
  return { tested, fired };
}

promise_test(async () => {
  const { tested, fired } = await dispatchAndWatch("beginCamel", "accessKey(a)", "beginEvent");
  assert_false(fired, "beginEvent fired");
  assert_throws_dom("InvalidStateError", () => tested.getStartTime());
}, "begin='accessKey(a)' does not begin on a script event named 'accessKey(a)'");

promise_test(async () => {
  const { tested, fired } = await dispatchAndWatch("beginLower", "accesskey(a)", "beginEvent");
  assert_false(fired, "beginEvent fired");
  assert_throws_dom("InvalidStateError", () => tested.getStartTime());
}, "begin='accesskey(a)' does not begin on a script event named 'accesskey(a)'");

promise_test(async () => {
  const { tested } = await dispatchAndWatch("beginOffset", "accessKey(a)", "beginEvent");
  assert_throws_dom("InvalidStateError", () => tested.getStartTime());
}, "begin='accessKey(a) + 2s' gets no begin time from a script event named 'accessKey(a)'");

promise_test(async () => {
  const { tested, fired } = await dispatchAndWatch("endCamel", "accessKey(a)", "endEvent");
  assert_false(fired, "endEvent fired");
  assert_equals(tested.getStartTime(), 0);
}, "end='accessKey(a)' does not end on a script event named 'accessKey(a)'");

promise_test(async () => {
  const { tested, fired } = await dispatchAndWatch("endLower", "accesskey(a)", "endEvent");
  assert_false(fired, "endEvent fired");
  assert_equals(tested.getStartTime(), 0);
}, "end='accesskey(a)' does not end on a script event named 'accesskey(a)'");

promise_test(async () => {
  await loaded;
  assert_equals(document.querySelector("#listAfter > set").getStartTime(), 1);
}, "begin='accessKey(a); 1s' keeps the 1s begin time");

promise_test(async () => {
  await loaded;
  assert_equals(document.querySelector("#listBefore > set").getStartTime(), 1);
}, "begin='1s; accesskey(a)' keeps the 1s begin time");
</script>
