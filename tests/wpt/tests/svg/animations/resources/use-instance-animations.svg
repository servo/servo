<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="parent-target">
    <rect width="100" height="100" fill="red">
      <set attributeName="fill" to="green"/>
    </rect>
  </symbol>
  <symbol id="href-target">
    <rect id="target" width="100" height="100" fill="red"/>
    <set href="#target" attributeName="fill" to="green"/>
  </symbol>
</svg>
