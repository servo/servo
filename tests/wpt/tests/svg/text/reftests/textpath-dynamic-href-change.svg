<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" class="reftest-wait">
  <title>Changing href to another existing path renders the text along the new path</title>
  <metadata>
    <html:link rel="author" title="Nikolas Zimmermann" href="mailto:nzimmermann@igalia.com"/>
    <html:link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/text.html#TextPathElementHrefAttribute"/>
    <html:link rel="match" href="textpath-dynamic-target-ref.svg"/>
  </metadata>
  <defs>
    <path id="line" d="M 10 180 H 390"/>
    <path id="curve" d="M 10 100 Q 100 20 200 100 T 390 100"/>
  </defs>
  <text font-size="24">
    <textPath id="textPath" href="#line">Text along a quadratic curve</textPath>
  </text>
  <script>
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    document.getElementById("textPath").setAttribute("href", "#curve");
    document.documentElement.classList.remove("reftest-wait");
  });
});
  </script>
</svg>
