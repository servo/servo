<!DOCTYPE html>
<link rel=help href="https://bugzilla.mozilla.org/show_bug.cgi?id=2065136">
<style>
#outer {
  position: relative;
}
text::before {
  position: absolute;
  content: "FOO";
}
</style>
<div id="outer">
  <svg width=100 height=100>
    <text x=0 y=50 fill=red>ABC</text>
  </svg>
</div>
<script>
  let svg = document.querySelector("svg");
  svg.getBoundingClientRect();
  svg.remove();
</script>
