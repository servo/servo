<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>link-parameters: changing an feImage's parameters after load updates the filter</title>
<link rel="author" title="Sam Weinig" href="mailto:sam@webkit.org">
<link rel="help" href="https://drafts.csswg.org/css-link-params/#propdef-link-parameters">
<link rel="help" href="https://drafts.csswg.org/filter-effects/#feImageElement">
<link rel="match" href="link-parameters-feimage-ref.html">
<svg width="100" height="100">
  <filter id="filter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <feImage id="target" style="link-parameters: param(--bg, red)" href="resources/solid.svg"/>
  </filter>
  <rect width="100" height="100" fill="red" filter="url(#filter)"/>
</svg>
<script>
window.onload = function() {
    requestAnimationFrame(function() {
        document.getElementById("target").style.linkParameters = "param(--bg, green)";
        requestAnimationFrame(function() {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
};
</script>
</html>
