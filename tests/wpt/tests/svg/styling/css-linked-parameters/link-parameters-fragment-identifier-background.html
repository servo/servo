<!DOCTYPE html>

<link rel="help" href="https://drafts.csswg.org/css-link-params/#url-frag">

<link rel="match" href="link-parameters-fragment-identifier-ref.html">
<meta name="assert" content="A CSS image URL whose fragment has both an element id and a link parameter directive targets that element and passes the parameter.">

  body { margin: 0; }
  div { width: 100px; height: 100px; background-image: url("resources/target.svg#box:~:param(--bg, green)"); }
