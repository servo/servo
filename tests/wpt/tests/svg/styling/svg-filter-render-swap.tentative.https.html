<!DOCTYPE html>
<html class="reftest-wait">
<head>
<link rel="match" href="svg-filter-render-swap-ref.tentative.html">
<style type="text/css">
    iframe {
        border: none;
    }
    .css-filter {
        filter: blur(1px);
    }
    .svg-filter {
        filter: url(#svg-filter);
    }
    .will-change {
        padding: 1px;
        will-change: transform;
    }
</style>
<script src="/common/reftest-wait.js"></script>
<script src="/svg/styling/support/svg-filter-render-util.js"></script>
<script>
    onload = async () => {
        await waitForRender(() => {});
        document.getElementById('swap-to-css').classList.replace('svg-filter', 'css-filter');
        document.getElementById('swap-to-svg').classList.replace('css-filter', 'svg-filter');
        await waitForRender(takeScreenshot);
    };
</script>
</head>
<body>
    <svg width="0" height="0" display="none">
        <filter id="svg-filter">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
        </filter>
    </svg>
    <div>
        SVG filter security test: this test passes if there is no svg filter effect applied to either frame after the swaps.
    </div>
    <br />
    <div id="swap-to-css" class="will-change svg-filter">
        <iframe sandbox width="100px" height="100px" src="/svg/styling/support/svg-filter-render-iframe.html"></iframe>
    </div>
    <div id="swap-to-svg" class="will-change css-filter">
        <iframe sandbox width="100px" height="100px" src="/svg/styling/support/svg-filter-render-iframe.html"></iframe>
    </div>
</body>
</html>
