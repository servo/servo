<!doctype html>
<meta charset=utf-8>
<meta http-equiv="Content-Security-Policy" content="img-src 'none'">
<link rel="stylesheet" href="shared-stylesheet-image-cache-bypass.css">
<body style="margin:0">
  <div class="bypass-image"></div>
  <script>
    'use strict';
    // Wait for style/layout to resolve the (shared) background image before
    // telling the parent we are ready to be captured.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      parent.postMessage('ready', '*');
    }));
  </script>
</body>
