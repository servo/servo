<!DOCTYPE html>
<head>
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'nonce-secret-script'">
  <script nonce="secret-script" src="/resources/testharness.js"></script>
  <script nonce="secret-script" src="/resources/testharnessreport.js"></script>
</head>
<body>
  <!-- https://w3c.github.io/webappsec-csp/#is-element-nonceable
       Similar to non-nonceable-elements.html but checks attribute names rather
       than values. -->
  <script nonce="secret-script">
    var scriptTest0 = false;
    var scriptTest1 = false;
    var scriptTest2 = false;
    var scriptTest3 = false;
    var scriptTest4 = false;
    var scriptTest5 = false;
    var scriptTest6 = false;
    var scriptTest7 = false;
    var scriptTest8 = false;
    var scriptTest9 = false;
  </script>

  <script nonce="secret-script">
    scriptTest0 = true;
  </script>
  <script <script nonce="secret-script">
    scriptTest1 = true;
  </script>
  <script <sCRIpt nonce="secret-script">
    scriptTest2 = true;
  </script>
  <script <style nonce="secret-script">
    scriptTest3 = true;
  </script>
  <script <stYlE nonce="secret-script">
    scriptTest4 = true;
  </script>
  <script <link nonce="secret-script">
    scriptTest5 = true;
  </script>
  <script <LinK nonce="secret-script">
    scriptTest6 = true;
  </script>
  <script aaa<sCripTbb nonce="secret-script">
    scriptTest7 = true;
  </script>
  <script aa<sTylEbbb nonce="secret-script">
    scriptTest8 = true;
  </script>
  <script cc<lInKddd nonce="secret-script">
    scriptTest9 = true;
  </script>

  <script nonce="secret-script">
    test(t =>
      assert_true(
        scriptTest0,
        "<script> element with no special attributes should execute"),
      "Nonceable script element 0");
    test(t =>
      assert_false(
        scriptTest1,
        "<script> element with an attribute named '<script' should not execute"),
      "Non-nonceable script element 1");
    test(t =>
      assert_false(
        scriptTest2,
        "<script> element with an attribute named '<sCRIpt' should not execute"),
      "Non-nonceable script element 2");
    test(t =>
      assert_false(
        scriptTest3,
        "<script> element with an attribute named '<style' should not execute"),
      "Non-nonceable script element 3");
    test(t =>
      assert_false(
        scriptTest4,
        "<script> element with an attribute named '<stYlE' should not execute"),
      "Non-nonceable script element 4");
    test(t =>
      assert_false(
        scriptTest5,
        "<script> element with an attribute named '<link' should not execute"),
      "Non-nonceable script element 5");
    test(t =>
      assert_false(
        scriptTest6,
        "<script> element with an attribute named '<LinK' should not execute"),
      "Non-nonceable script element 6");
    test(t =>
      assert_false(
        scriptTest7,
        "<script> element with an attribute named 'aaa<sCripTbb' should not execute"),
      "Non-nonceable script element 7");
    test(t =>
      assert_false(
        scriptTest8,
        "<script> element with an attribute named 'aa<sTylEbbb' should not execute"),
      "Non-nonceable script element 8");
    test(t =>
      assert_false(
        scriptTest9,
        "<script> element with an attribute named 'cc<lInKddd' should not execute"),
      "Non-nonceable script element 9");
 </script>
</body>
