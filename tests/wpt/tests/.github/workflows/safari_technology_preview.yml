name: "All Tests: Safari Technology Preview"

# We never interact with the GitHub API, thus we can simply disable all
# permissions the GitHub token would have.
permissions: {}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - epochs
    types:
      - completed
  push:
    branches:
      - epochs/three_hourly
      - triggers/safari_preview

jobs:
  check-workflow-run:
    name: Check for appropriate epochs
    uses: ./.github/workflows/check-workflow-run.yml
    with:
      check-refs: '["refs/heads/epochs/three_hourly"]'
    permissions:
      actions: read

  generate-matrix:
    name: Generate test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        run: echo "matrix=$(./wpt generate-matrix --browser safari)" >> $GITHUB_OUTPUT

  safari-technology-preview-results:
    name: "All Tests: Safari Technology Preview"
    needs: [check-workflow-run, generate-matrix]
    if: |
      github.event_name != 'workflow_run' || fromJSON(needs.check-workflow-run.outputs.updated-refs)['refs/heads/epochs/three_hourly'] != null
    uses: ./.github/workflows/safari-wptrunner.yml
    with:
      artifact-name: safari-technology-preview-results
      safari-technology-preview: true
      safaridriver-diagnose: false
      matrix: ${{ needs.generate-matrix.outputs.matrix }}
      extra-options: --no-fail-on-unexpected
      fetch-ref: ${{ fromJSON(needs.check-workflow-run.outputs.updated-refs || '{}')['refs/heads/epochs/three_hourly'] }}
