<!DOCTYPE html>
<meta charset=utf-8>
<title>MediaSourceHandle cannot be transferred to shared and service workers</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/service-workers/service-worker/resources/test-helpers.sub.js"></script>
<script src="mediasource-message-util.js"></script>
<script>
const WORKER = 'mediasource-worker-handle-transfer-to-shared-and-service-workers-helper.js';
const SCOPE = 'mediasource-worker-handle-transfer-to-shared-and-service-workers-scope/';

function postToSharedWorker(t, value, transfer = []) {
  const worker = new SharedWorker(WORKER, { name: `${t.name}` });
  const result = new Promise(resolve => worker.port.onmessage = e => resolve(e.data));
  worker.port.postMessage(value, transfer);
  return result;
}

async function postToServiceWorker(t, value, transfer = []) {
  const registration = await service_worker_unregister_and_register(t, WORKER, SCOPE);
  t.add_cleanup(() => registration.unregister());
  await wait_for_state(t, registration.installing, 'activated');
  const result = new Promise(resolve => navigator.serviceWorker.onmessage = e => resolve(e.data));
  registration.active.postMessage(value, transfer);
  return result;
}

function getHandle(t) {
  assert_implements(MediaSource.canConstructInDedicatedWorker, 'MediaSource in a dedicated worker is supported');
  const worker = new Worker('mediasource-worker-handle-transfer-to-main.js');
  t.add_cleanup(() => worker.terminate());
  return new Promise(resolve => worker.onmessage = t.step_func(e => {
    assert_equals(e.data.subject, messageSubject.HANDLE);
    resolve(e.data.info);
  }));
}

const workers = [
  { name: 'shared worker', post: postToSharedWorker },
  { name: 'service worker', post: postToServiceWorker },
];

for (const worker of workers) {
  promise_test(async t => {
    assert_equals(await worker.post(t, { value: 1 }), 'message');
  }, `A plain object can be posted to a ${worker.name}`);

  promise_test(async t => {
    const handle = await getHandle(t);
    assert_equals(await worker.post(t, handle, [handle]), 'messageerror');
  }, `MediaSourceHandle cannot be transferred to a ${worker.name}`);
}
</script>
