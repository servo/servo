<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Container Timing: an image inside a containertimingignore inside a containertiming root</title>
<body>
<style>
body {
  margin: 0;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/container-timing/resources/container-timing-helpers.js"></script>
<script>
  promise_test(async t => {
    assert_implements(window.PerformanceContainerTiming, "PerformanceContainerTiming is not implemented");
    const div1 = addContainerRoot(document.body, 'div1_ct');

    // Intermediate ignore should block paint events
    const div2 = addElement(div1, 'div', {containertimingignore: ''});
    const img = addSquare100Image(div2, {id: 'img_id'});
    await img.decode();
    const entries = await getContainerEntries(t, 0);

    assert_equals(entries.length, 0,
        'No entry is expected for an image under containertimingignore');
  }, 'Paint of the image child of container timing with ignore in the middle is not reported.');
</script>

</body>
