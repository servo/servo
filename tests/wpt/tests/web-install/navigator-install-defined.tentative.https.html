<!DOCTYPE html>
<title>navigator.install() is defined</title>
<link rel="help" href="https://github.com/MicrosoftEdge/MSEdgeExplainers/blob/main/WebInstall/explainer.md">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(function() {
  assert_true(isSecureContext, 'The test must run in a secure context');
  assert_true('install' in navigator, 'navigator.install should be present');
  assert_equals(typeof navigator.install, 'function',
      'navigator.install should be a function');
}, 'navigator.install() is defined.');
</script>
</body>
