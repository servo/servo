<!doctype html>
<meta charset=utf-8>
<title>RTCPeerConnection negotiation of unknown media types</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="../RTCPeerConnection-helper.js"></script>
<script src="../third_party/sdp/sdp.js"></script>
<script>
'use strict';

// An unknown media type can name a protocol which has to be reproduced along
// with the rest of the m= line.
// This is a real RFC 7850 protocol, just not one we normally offer.
// https://www.rfc-editor.org/rfc/rfc7850.html
const kUnknownTypeProtocol = 'TCP/DTLS/RTP/SAVPF';

function switchProtocol(protocol) {
  const kKnownTypeProtocolChoices = [
    'TCP/DTLS/SCTP',
    'TCP/DTLS/RTP/SAVP',
  ];
  for (const choice of kKnownTypeProtocolChoices) {
    if (choice !== protocol) {
      return choice;
    }
  }
  return protocol;
}

// Negotiates a session whose only m= section has a media type that neither
// endpoint knows, which the answerer must reject by setting the port to zero
// ([RFC9429] section 5.3.1). Rejected m= sections are reproduced in subsequent
// offers, so the answerer ends up offering a media type it does not itself
// understand.
//
// Returns that answerer, with the re-offer applied as its local description,
// along with an answer to the re-offer generated by a third endpoint.
async function offerRejectedUnknownMediaType(t) {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  const reanswerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());
  t.add_cleanup(() => reanswerer.close());

  offerer.addTransceiver('audio');
  const offer = await offerer.createOffer();
  await answerer.setRemoteDescription({
    type: 'offer',
    sdp: offer.sdp.replace(/^m=audio (\d+) \S+/m,
                           `m=unicorns $1 ${kUnknownTypeProtocol}`)
  });
  await answerer.setLocalDescription(await answerer.createAnswer());

  assert_equals(answerer.getTransceivers().length, 0,
                'a rejected unknown m= section gets no transceiver');

  const reoffer = await answerer.createOffer();
  assert_true(reoffer.sdp.includes(`m=unicorns 0 ${kUnknownTypeProtocol} `),
              'the re-offer includes the rejected m= section and its protocol');
  await answerer.setLocalDescription(reoffer);
  await reanswerer.setRemoteDescription(reoffer);

  return [answerer, await reanswerer.createAnswer()];
}

// Negotiates a session where the second of two offered m= sections has a media
// type neither endpoint knows, so the answerer rejects that one, and then adds
// a transceiver, which the next offer has to find an m= section for.
//
// Returns the index and mid of the rejected m= section along with the offer
// generated after the transceiver was added.
async function rejectUnknownMediaTypeThenAddTransceiver(t) {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  offerer.addTransceiver('video');
  const offer = await offerer.createOffer();

  const oldProtocol = offer.sdp.match(/^m=video \d+ (\S+)/m)[1];
  const newProtocol = switchProtocol(oldProtocol);

  await answerer.setRemoteDescription({
    type: 'offer',
    sdp: offer.sdp.replace(/^m=video (\d+) \S+/m,
                           `m=unicorns $1 ${newProtocol}`)
  });

  const answer = await answerer.createAnswer();
  assert_true(answer.sdp.includes('m=unicorns 0 '),
              'the unknown media type is rejected in the answer');
  await answerer.setLocalDescription(answer);

  const sections = SDPUtils.getMediaSections(answer.sdp);
  const level =
      sections.findIndex(section => SDPUtils.getKind(section) === 'unicorns');
  assert_greater_than(level, -1, 'the answer keeps the unknown media type');
  const rejectedMid = SDPUtils.getMid(sections[level]);
  assert_not_equals(rejectedMid, undefined,
                    'the rejected m= section has a mid');
  assert_equals(sections[level].match(/^m=unicorns \d+ (\S+)/m)[1], newProtocol,
                'the rejected m= section has the new protocol');

  // This needs an m= section that the rejected one cannot supply, either by
  // recycling the rejected section or by adding another one.
  answerer.addTransceiver('video');
  return {level, rejectedMid, reoffer: await answerer.createOffer()};
}

// [RFC9429] section 5.8.3 requires the media type of every m= section in an
// answer to exactly match the media type of the corresponding m= section in
// the offer, and says nothing that would exempt media types the endpoints do
// not recognize. One unknown media type therefore cannot stand in for another.
promise_test(async t => {
  // Control: the answer is accepted while the media type is left alone, so a
  // rejection below can only be caused by the changed media type.
  const [control, controlAnswer] = await offerRejectedUnknownMediaType(t);
  await control.setRemoteDescription(controlAnswer);

  const [pc, answer] = await offerRejectedUnknownMediaType(t);
  await promise_rejects_dom(t, 'InvalidAccessError', pc.setRemoteDescription({
    type: 'answer',
    sdp: answer.sdp.replace('m=unicorns ', 'm=dragons ')
  }));
}, 'An answer may not substitute one unknown media type for another');

// [RFC9429] section 5.2.1 generates "a=mid" lines as specified in [RFC5888]
// section 4, which requires the value to be unique within the session
// description. An m= section that was rejected because its media type was
// unknown is still using its mid, so that value is not available for another
// m= section.
promise_test(async t => {
  const {reoffer} = await rejectUnknownMediaTypeThenAddTransceiver(t);

  const mids = SDPUtils.getMediaSections(reoffer.sdp)
                   .map(section => SDPUtils.getMid(section));
  assert_equals(new Set(mids).size, mids.length,
                `each m= section needs its own mid, got ${mids.join(', ')}`);
}, 'A mid used by a rejected unknown m= section is not given to another m= section');

// [RFC9429] section 5.2.2 requires an m= section with a zero port to be
// recycled for an added transceiver, at the same index and "including a new MID
// value". The mid the rejected m= section was using is therefore not available
// to the m= section that replaces it either.
promise_test(async t => {
  const {level, rejectedMid, reoffer} =
      await rejectUnknownMediaTypeThenAddTransceiver(t);

  const recycled = SDPUtils.getMediaSections(reoffer.sdp)[level];
  assert_not_equals(SDPUtils.getKind(recycled), 'unicorns',
                    'the rejected m= section is recycled for the transceiver');
  assert_not_equals(SDPUtils.getMid(recycled), rejectedMid,
                    'the recycled m= section is given a new mid');
}, 'A recycled m= section does not reuse the mid of the m= section it replaced');

// Negotiates audio plus a media type neither endpoint knows, which the answerer
// has to reject with a zero port, leaving it stable with that m= section
// rejected in its local description and offered in its remote description.
//
// Returns the answerer and the offer it was given.
async function rejectUnknownMediaType(t) {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  offerer.addTransceiver('video');
  const offer = await offerer.createOffer();
  const sdp = offer.sdp.replace('m=video ', 'm=unicorns ');
  await answerer.setRemoteDescription({type: 'offer', sdp});
  await answerer.setLocalDescription(await answerer.createAnswer());
  return [answerer, sdp];
}

// [RFC9429] section 5.2.2 lets an offerer recycle an m= section that has a zero
// port in the current local or the current remote description, generating it
// afresh with a new MID value, which means the media type at that index can
// change. An m= section rejected because its media type was unknown is rejected
// in the answerer's local description, so the offerer may reuse it.
promise_test(async t => {

  // Recycling an m= section means generating it afresh, so give it a new mid
  // and carry that through the bundle group, as an offerer would.
  const recycleAs = (sdp, media) => {
    const sections = SDPUtils.getMediaSections(sdp);
    const oldMid = SDPUtils.getMid(
        sections.find(section => SDPUtils.getKind(section) === 'unicorns'));
    const newMid = 'recycled';
    assert_false(sections.some(section => SDPUtils.getMid(section) === newMid),
                 'the new mid is not already in use');
    return sdp.replace('m=unicorns ', `m=${media} `)
        .replace(`a=mid:${oldMid}\r\n`, `a=mid:${newMid}\r\n`)
        .replace(/^a=group:BUNDLE[^\r\n]*/m,
                 group => group.split(' ')
                              .map(token => token === oldMid ? newMid : token)
                              .join(' '));
  };

  // Control: the same m= sections offered again are accepted.
  const [control, controlSdp] = await rejectUnknownMediaType(t);
  await control.setRemoteDescription({type: 'offer', sdp: controlSdp});

  // Recycled for a media type we do know.
  const [known, knownSdp] = await rejectUnknownMediaType(t);
  await known.setRemoteDescription(
      {type: 'offer', sdp: recycleAs(knownSdp, 'audio')});

  // Recycled for another media type we do not know.
  const [unknown, unknownSdp] = await rejectUnknownMediaType(t);
  await unknown.setRemoteDescription(
      {type: 'offer', sdp: recycleAs(unknownSdp, 'dragons')});
}, 'An m= section rejected for an unknown media type may be recycled by the offerer');

// setLocalDescription has to be given the description that was generated, and
// WebRTC-PC rejects a modified one with InvalidModificationError. Renaming an
// unknown media type is such a modification, even though both names are media
// types the endpoint knows nothing about.
promise_test(async t => {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());

  offerer.addTransceiver('audio');
  const offer = await offerer.createOffer();
  await answerer.setRemoteDescription({
    type: 'offer',
    sdp: offer.sdp.replace('m=audio ', 'm=unicorns ')
  });

  const answer = await answerer.createAnswer();
  await promise_rejects_dom(
      t, 'InvalidModificationError', answerer.setLocalDescription({
        type: 'answer',
        sdp: answer.sdp.replace('m=unicorns ', 'm=dragons ')
      }));
}, 'A local description may not substitute one unknown media type for another');

// Test that when endpoints have an asymmetric comprehension of unknown media
// types, we can still negotiate with them.
// Introduce a disagreement by rewriting the offer on its way to the answerer
// and the answer on its way back.
// The offerer sees it offered video and had it rejected, while the
// answerer sees an unknown media type.
// The m= section they do agree on still has to connect.
promise_test(async t => {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());
  exchangeIceCandidates(offerer, answerer);

  const stream = await getNoiseStream({audio: true});
  t.add_cleanup(() => stream.getTracks().forEach(track => track.stop()));
  offerer.addTrack(stream.getTracks()[0], stream);
  offerer.addTransceiver('video');

  const offer = await offerer.createOffer();
  await offerer.setLocalDescription(offer);
  await answerer.setRemoteDescription(
      {type: 'offer', sdp: offer.sdp.replace('m=video ', 'm=unicorns ')});

  const answer = await answerer.createAnswer();
  assert_true(answer.sdp.includes('m=unicorns 0 '),
              'the unknown media type is rejected in the answer');
  await answerer.setLocalDescription(answer);
  await offerer.setRemoteDescription(
      {type: 'answer', sdp: answer.sdp.replace('m=unicorns ', 'm=video ')});

  await listenToConnected(offerer);
  await listenToConnected(answerer);

  // The answerer knows the mid the rejected m= section is using, so it
  // needs to be the re-offerer.
  const reoffer = await answerer.createOffer();
  assert_true(reoffer.sdp.includes('m=unicorns 0 '),
              'the re-offer reproduces the rejected m= section');
  await answerer.setLocalDescription(reoffer);
  await offerer.setRemoteDescription(
      {type: 'offer', sdp: reoffer.sdp.replace('m=unicorns ', 'm=video ')});

  const reanswer = await offerer.createAnswer();
  await offerer.setLocalDescription(reanswer);
  await answerer.setRemoteDescription(
      {type: 'answer', sdp: reanswer.sdp.replace('m=video ', 'm=unicorns ')});

  assert_equals(offerer.connectionState, 'connected');
  assert_equals(answerer.connectionState, 'connected');
}, 'Endpoints disagreeing about a media type can still connect and renegotiate');

// Appends an m= section with a media type neither endpoint knows. It is left
// out of the BUNDLE group. The transport parameters are taken from the first
// m= section.
function appendUnknownMediaSection(sdp, mid) {
  const [first] = SDPUtils.getMediaSections(sdp);
  const transport = ['a=ice-ufrag:', 'a=ice-pwd:', 'a=fingerprint:', 'a=setup:']
                        .flatMap(prefix => SDPUtils.matchPrefix(first, prefix));
  return sdp + [
    'm=unicorns 9 UDP/TLS/RTP/SAVPF 96',
    'c=IN IP4 0.0.0.0',
    `a=mid:${mid}`,
    'a=sendrecv',
    'a=rtcp-mux',
    ...transport,
  ].join('\r\n') + '\r\n';
}

// Removes the m= sections appended by appendUnknownMediaSection.
function removeUnknownMediaSections(sdp) {
  return [
    SDPUtils.getDescription(sdp),
    ...SDPUtils.getMediaSections(sdp).filter(
        section => SDPUtils.getKind(section) !== 'unicorns'),
  ].join('');
}

// Answer is provided an extra media section with an unknown media type.
// This m-section is hidden from the offerer, so it is never rejected.
// After initial negotiation only the answerer has it in its descriptions.
// An m= section is never removed from later offers, even once it has been
// rejected.
// So when the roles are reversed the re-offer brings it to the original offerer, after which both endpoints have it in
// both descriptions.
promise_test(async t => {
  const offerer = new RTCPeerConnection();
  const answerer = new RTCPeerConnection();
  t.add_cleanup(() => offerer.close());
  t.add_cleanup(() => answerer.close());
  exchangeIceCandidates(offerer, answerer);

  const stream = await getNoiseStream({audio: true});
  t.add_cleanup(() => stream.getTracks().forEach(track => track.stop()));
  offerer.addTrack(stream.getTracks()[0], stream);

  const offer = await offerer.createOffer();
  await offerer.setLocalDescription(offer);
  // The offerer has already set a local description, now we add an unknown
  // media section to the answerer's remote description
  await answerer.setRemoteDescription(
      {type: 'offer', sdp: appendUnknownMediaSection(offer.sdp, 'unicorns')});

  const answer = await answerer.createAnswer();
  assert_true(answer.sdp.includes('m=unicorns 0 '),
              'the extra m= section is rejected in the answer');
  await answerer.setLocalDescription(answer);
  // The answerer has a local description containing the unknown media section,
  // so we remove it before setting the offerer's remote description.
  await offerer.setRemoteDescription(
      {type: 'answer', sdp: removeUnknownMediaSections(answer.sdp)});

  await listenToConnected(offerer);
  await listenToConnected(answerer);

  // In the second round, the answerer becomes the offerer and vice versa.
  const reoffer = await answerer.createOffer();
  assert_true(reoffer.sdp.includes('m=unicorns 0 '),
              'the re-offer reproduces the rejected m= section');
  await answerer.setLocalDescription(reoffer);
  await offerer.setRemoteDescription(reoffer);

  // Make sure the new answer has the unknown media section and that it is
  // rejected.
  const reanswer = await offerer.createAnswer();
  assert_true(reanswer.sdp.includes('m=unicorns 0 '),
              'the original offerer rejects the m= section as well');
  await offerer.setLocalDescription(reanswer);
  await answerer.setRemoteDescription(reanswer);

  // Make sure that the unknown media section is appears in all descriptions
  // and that it is rejected.
  assert_true(offerer.localDescription.sdp.includes('m=unicorns 0 '),
              "the offerer's local description has the rejected m= section");
  assert_true(offerer.remoteDescription.sdp.includes('m=unicorns 0 '),
              "the offerer's remote description has the rejected m= section");
  assert_true(answerer.localDescription.sdp.includes('m=unicorns 0 '),
              "the answerer's local description has the rejected m= section");
  assert_true(answerer.remoteDescription.sdp.includes('m=unicorns 0 '),
              "the answerer's remote description has the rejected m= section");
  assert_equals(offerer.connectionState, 'connected');
  assert_equals(answerer.connectionState, 'connected');
}, 'Once negotiated with a rejected unknown media type both endpoints have it in both descriptions');
</script>
