<!doctype html>
<html>
<head>
<title>DOMParser: script already started</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#dom-domparser-parsefromstring">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// The DOMParser parserFromString method wants an XML parser with
// XML scripting support disabled. This test tests that various
// parseFromString-parsed script elements are inactive ("already started").
//
// See:
//   https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#dom-domparser-parsefromstring
//   step 3, "Otherwise: [...] "with XML scripting support disabled."
test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<div><script>window.mark = 1;</sc" + "ript></div>", "text/html");
  document.body.appendChild(d.body);
  assert_equals(window.mark, 0);
}, "parseFromString as HTML, appendChild");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<div><script>window.mark = 1;</sc" + "ript></div>", "text/html");
  document.body.appendChild(document.importNode(d.body, true));
  assert_equals(window.mark, 0);
}, "parseFromString as HTML, append importNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg><script>window.mark = 1;</sc" + "ript></svg>", "text/html");
  document.body.appendChild(d.body);
  assert_equals(window.mark, 0);
}, "parseFromString as HTML, svg script, appendChild");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg><script>window.mark = 1;</sc" + "ript></svg>", "text/html");
  document.body.appendChild(document.importNode(d.body, true));
  assert_equals(window.mark, 0);
}, "parseFromString as HTML, svg script, append importNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg xmlns='http://www.w3.org/2000/svg'><script>window.mark = 1;</sc" + "ript></svg>", "text/xml");
  document.body.appendChild(d.rootElement);
  assert_equals(window.mark, 0);
}, "parseFromString as XML, svg script, appendChild");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg xmlns='http://www.w3.org/2000/svg'><script>window.mark = 1;</sc" + "ript></svg>", "text/xml");
  document.body.appendChild(document.importNode(d.rootElement, true));
  assert_equals(window.mark, 0);
}, "parseFromString as XML, svg script, append importNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<xx:svg xmlns:xx='http://www.w3.org/2000/svg'><xx:script>window.mark = 1;</xx:script></xx:svg>", "text/xml");
  document.body.appendChild(document.importNode(d.rootElement, true));
  assert_equals(window.mark, 0);
}, "parseFromString as XML, svg script, append importNode result, but with namespace prefix");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg xmlns='http://www.w3.org/2000/svg'><script>window.mark = 1;</sc" + "ript></svg>", "text/xml");
  document.body.appendChild(document.adoptNode(d.rootElement));
  assert_equals(window.mark, 0);
}, "parseFromString as XML, svg script, append adoptNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<svg xmlns='http://www.w3.org/2000/svg'><script>window.mark = 1;</sc" + "ript></svg>", "text/xml");
  document.body.appendChild(d.rootElement.cloneNode(true));
  assert_equals(window.mark, 0);
}, "parseFromString as XML, svg script, append cloneNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<html xmlns='http://www.w3.org/1999/xhtml'><body><script>window.mark = 1;</sc" + "ript></body></html>", "application/xhtml+xml");
  document.body.appendChild(document.importNode(d.documentElement, true));
  assert_equals(window.mark, 0);
}, "parseFromString as XHTML, whole root, append importNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<html xmlns='http://www.w3.org/1999/xhtml'><body><script>window.mark = 1;</sc" + "ript></body></html>", "application/xhtml+xml");
  const script = d.getElementsByTagNameNS("http://www.w3.org/1999/xhtml", "script")[0];
  document.body.appendChild(document.importNode(script, true));
  assert_equals(window.mark, 0);
}, "parseFromString as XHTML, script, append importNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<html xmlns='http://www.w3.org/1999/xhtml'><body><script>window.mark = 1;</sc" + "ript></body></html>", "application/xhtml+xml");
  const script = d.getElementsByTagNameNS("http://www.w3.org/1999/xhtml", "script")[0];
  document.body.appendChild(document.adoptNode(script));
  assert_equals(window.mark, 0);
}, "parseFromString as XHTML, script, append adoptNode result");

test(_ => {
  window.mark = 0;
  const d = new DOMParser().parseFromString(
    "<html xmlns='http://www.w3.org/1999/xhtml'><body><script>window.mark = 1;</sc" + "ript></body></html>", "application/xhtml+xml");
  const script = d.getElementsByTagNameNS("http://www.w3.org/1999/xhtml", "script")[0];
  document.body.appendChild(script.cloneNode(true));
  assert_equals(window.mark, 0);
}, "parseFromString as XHTML, script, append cloneNode result");
</script>
</body>
</html>
