<!doctype html>
<meta charset="utf-8" />
<title>Streamed defer, async, and module scripts</title>
<link rel="help" href="https://html.spec.whatwg.org/#html-streaming-methods" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="placeholder"></div>
<script>
  // Fails instead of stalling the rest of the file if the promise never settles.
  function failOnTimeout(promise, ms = 3000) {
    return Promise.race([promise, new Promise((resolve, reject) => step_timeout(() => reject(new Error("timed out")), ms))]);
  }

  for (const method of ["streamAppendHTMLUnsafe", "streamHTMLUnsafe"]) {
    promise_test(async (t) => {
      window.events = [];
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();
      window.defer_resolver = Promise.withResolvers();
      window.async_resolver = Promise.withResolvers();
      window.module_resolver = Promise.withResolvers();
      window.immediate_resolver = Promise.withResolvers();
      window.immediate_2_resolver = Promise.withResolvers();
      function write_script(script, {defer, async, type} = {}) {
        const script_element = document.createElement("script");
        if (type)
          script_element.type = type;
        if (defer)
          script_element.defer = true;
        if (async)
          script_element.async = true;
        script_element.src = `data:text/javascript,${script};{let cache_buster=${Math.random()}}`;
        return writer.write(script_element.outerHTML);
      }
      await write_script("window.events.push('defer'); window.defer_resolver.resolve();", {defer: true});
      assert_array_equals(window.events, []);
      await write_script("window.events.push('immediate'); window.immediate_resolver.resolve();");
      await failOnTimeout(window.immediate_resolver.promise);
      assert_array_equals(window.events, ["immediate"]);
      await write_script("window.events.push('module');window.module_resolver.resolve();", {type: "module"});
      assert_array_equals(window.events, ["immediate"]);
      await write_script("window.events.push('async'); window.async_resolver.resolve();", {async: true});
      await failOnTimeout(window.async_resolver.promise);
      assert_array_equals(window.events, ["immediate", "async"]);
      await write_script("window.events.push('immediate-2'); window.immediate_2_resolver.resolve();");
      await failOnTimeout(window.immediate_2_resolver.promise);
      assert_array_equals(window.events, ["immediate", "async", "immediate-2"]);
      await writer.close();
      assert_array_equals(window.events, ["immediate", "async", "immediate-2"],
        "the close promise does not wait for defer/module scripts");
      await failOnTimeout(Promise.all([window.defer_resolver.promise, window.module_resolver.promise]));
      assert_array_equals(window.events, [
        "immediate",
        "async",
        "immediate-2",
        "defer",
        "module"
      ]);
    }, `element.${method} with defer/async scripts`);

    promise_test(async (t) => {
      window.events = [];
      window.done_resolver = Promise.withResolvers();
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();

      function write_script(script, {defer, type} = {}) {
        const script_element = document.createElement("script");
        if (type)
          script_element.type = type;
        if (defer)
          script_element.defer = true;
        script_element.src = `data:text/javascript,${encodeURIComponent(script)};{let cache_buster=${Math.random()}}`;
        return writer.write(script_element.outerHTML);
      }

      await write_script(
        "window.events.push('d1'); Promise.resolve().then(() => window.events.push('d1-microtask'));",
        { defer: true }
      );
      await write_script(
        "window.events.push('d2'); Promise.resolve().then(() => window.events.push('d2-microtask'));",
        { defer: true }
      );
      await write_script(
        "window.events.push('module'); Promise.resolve().then(() => { window.events.push('module-microtask'); window.done_resolver.resolve(); });",
        { type: "module" }
      );

      // Give data: scripts time to finish fetching before close() so they are ready at close() time.
      await new Promise(resolve => t.step_timeout(resolve, 20));
      assert_array_equals(window.events, [], "Defer and module scripts must not run before close()");

      await writer.close();
      assert_array_equals(window.events, [], "Defer and module scripts must run in tasks queued after close() resolves");

      await failOnTimeout(window.done_resolver.promise);
      assert_array_equals(window.events, [
        "d1",
        "d1-microtask",
        "d2",
        "d2-microtask",
        "module",
        "module-microtask",
      ]);
    }, `element.${method}: defer and module scripts run after close() resolves, one per task`);

    promise_test(async (t) => {
      window.events = [];
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();

      await writer.write(
        `<script type="importmap">{"imports":{}}<` + `/script>` +
        `<script type="speculationrules">{"prefetch":[{"source":"list","urls":["/"]}]}<` + `/script>` +
        `<script defer>window.events.push("inline-defer");<` + `/script>`
      );
      assert_array_equals(window.events, ["inline-defer"], "Inline script with defer attribute runs synchronously");
      await writer.close();
    }, `element.${method}: inline defer, importmap, and speculationrules scripts`);

    promise_test(async (t) => {
      const iframe = document.createElement("iframe");
      t.add_cleanup(() => iframe.remove());
      iframe.srcdoc = "<!doctype html><body><div id='target'></div></body>";
      await new Promise((resolve) => {
        iframe.addEventListener("load", resolve, { once: true });
        document.body.appendChild(iframe);
      });

      const done = Promise.withResolvers();
      iframe.contentWindow.done = done;
      const target = iframe.contentDocument.getElementById("target");
      const writer = target[method]({ runScripts: true }).getWriter();
      const moduleUrl = "data:text/javascript,export const value = 'from-importmap';";

      await writer.write(
        `<script type="importmap">{"imports":{"#streamed-dep":"${moduleUrl}"}}<` + `/script>` +
        `<script type="module">import { value } from "#streamed-dep"; window.mapped = value; window.done.resolve();<` + `/script>`
      );
      await writer.close();
      await failOnTimeout(done.promise);

      assert_equals(iframe.contentWindow.mapped, "from-importmap", "Streamed importmap resolves bare/hash specifier in subsequent streamed module");
    }, `element.${method}: streamed importmap registers and resolves specifiers for streamed module scripts`);

    promise_test(async (t) => {
      window.events = [];
      window.slow_async = Promise.withResolvers();
      window.fast_async = Promise.withResolvers();
      window.on_slow = () => window.slow_async.resolve();
      t.add_cleanup(() => { delete window.on_slow; });
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();

      await writer.write(
        `<script async src="resources/slow.js?pipe=trickle(d0.3)&async_slow=${method}"><` + `/script>` +
        `<script async src="data:text/javascript,window.events.push('fast-async');window.fast_async.resolve();"><` + `/script>` +
        `<p id="after-async">after</p>` +
        `<script>window.events.push('sync-inline');<` + `/script>`
      );

      assert_not_equals(placeholder.querySelector("#after-async"), null, "Async scripts must not block subsequent DOM parsing");
      assert_true(window.events.includes("sync-inline"), "Inline script runs without waiting for async script");

      await failOnTimeout(window.fast_async.promise);
      assert_equals(window.events[0], "sync-inline");
      assert_equals(window.events[1], "fast-async");

      await writer.close();
      await failOnTimeout(window.slow_async.promise);
      assert_array_equals(window.events, ["sync-inline", "fast-async", "slow"]);
    }, `element.${method}: async scripts do not block parsing and run in load order`);

    promise_test(async (t) => {
      window.events = [];
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();

      function write_script(script, {defer, type} = {}) {
        const script_element = document.createElement("script");
        if (type)
          script_element.type = type;
        if (defer)
          script_element.defer = true;
        script_element.src = `data:text/javascript,${script};{let cache_buster=${Math.random()}}`;
        return writer.write(script_element.outerHTML);
      }

      await write_script("window.events.push('defer');", {defer: true});
      await write_script("window.events.push('module');", {type: "module"});
      assert_array_equals(window.events, []);

      await writer.abort();

      // Control: defer and module scripts streamed and closed now run within a few tasks, so
      // scripts wrongly kept by the aborted parser would have run by then too.
      window.control_ran = Promise.withResolvers();
      t.add_cleanup(() => { delete window.control_ran; });
      const control = document.createElement("div");
      placeholder.append(control);
      const controlWriter = control[method]({ runScripts: true }).getWriter();
      await controlWriter.write(
        `<script defer src="data:text/javascript,window.events.push('control-defer');"></` + `script>` +
        `<script type="module" src="data:text/javascript,window.events.push('control-module');window.control_ran.resolve();{let cache_buster=${Math.random()}}"></` + `script>`
      );
      await controlWriter.close();
      await failOnTimeout(window.control_ran.promise);
      assert_array_equals(window.events, ["control-defer", "control-module"]);
    }, `element.${method} with defer/module scripts should not execute on abort`);

    promise_test(async (t) => {
      let readystatechange_fired = false;
      const listener = () => { readystatechange_fired = true; };
      document.addEventListener("readystatechange", listener);
      t.add_cleanup(() => document.removeEventListener("readystatechange", listener));

      const initial_ready_state = document.readyState;
      const placeholder = document.getElementById("placeholder");
      const writable = placeholder[method]({ runScripts: true });
      const writer = writable.getWriter();
      await writer.write("<p>content</p>");
      await writer.close();

      assert_equals(document.readyState, initial_ready_state);
      assert_false(readystatechange_fired);
    }, `element.${method} should not modify Document readyState`);
  }

  promise_test(async (t) => {
    window.events = [];
    const placeholder = document.getElementById("placeholder");
    const container = document.createElement("div");
    const ref = document.createElement("span");
    container.append(ref);
    placeholder.append(container);
    t.add_cleanup(() => container.remove());

    const writer = container.streamPrependHTMLUnsafe({ runScripts: true }).getWriter();
    // The trailing "<" is only emitted, together with EOF, when the stream is closed.
    await writer.write(
      `<script defer src="data:text/javascript,window.events.push('defer');{let cache_buster=${Math.random()}}"></` + `script><`
    );
    ref.remove();
    // Inserting the "<" before the removed reference child errors the stream and aborts the
    // parser, but EOF is still processed.
    await promise_rejects_dom(t, "HierarchyRequestError", writer.close());
    assert_equals(container.textContent, "", "the trailing '<' is not inserted");

    // Control: a defer script streamed and closed now runs within a few tasks, so the defer script
    // of the aborted parser would have run by then too.
    window.control_ran = Promise.withResolvers();
    t.add_cleanup(() => { delete window.control_ran; });
    const control = document.createElement("div");
    container.append(control);
    const controlWriter = control.streamAppendHTMLUnsafe({ runScripts: true }).getWriter();
    await controlWriter.write(
      `<script defer src="data:text/javascript,window.events.push('control-defer');window.control_ran.resolve();{let cache_buster=${Math.random()}}"></` + `script>`
    );
    await controlWriter.close();
    await failOnTimeout(window.control_ran.promise);
    assert_array_equals(window.events, ["control-defer"]);
  }, "element.streamPrependHTMLUnsafe: defer scripts do not run if the reference child is removed before a trailing '<' is flushed by close()");
</script>
