<!doctype html>
<meta charset="utf-8" />
<title>HTML partial updates - stream insertion logic</title>
<link rel="help" href="https://github.com/WICG/declarative-partial-updates" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
  <script>
    function get_method_name(method, safe) {
      return `stream${method}HTML${safe ? "" : "Unsafe"}`;
    }

    // Regardless of the method, the insertion point is going to be before the ref_node.
    function create_stream(method, safe, parent, ref_node) {
      const method_name = get_method_name(method, safe);
      switch (method) {
        case "Before":
          return ref_node[method_name]();
        case "After":
          return ref_node.previousSibling[method_name]();
        case "ReplaceWith":
          const placeholder = document.createElement("div");
          parent.insertBefore(placeholder, ref_node);
          return placeholder[method_name]();
        case "Append":
        case "Prepend":
          return parent[method_name]();
      }
    }

    async function stream_insert_before(
      method,
      safe,
      parent,
      ref_node,
      new_html,
    ) {
      const writable = create_stream(method, safe, parent, ref_node);
      assert_true(
        writable instanceof WritableStream,
        `node.streamInsertBefore() returns a writable stream`,
      );
      const writer = writable.getWriter();
      await writer.write(new_html);
      await writer.close();
      return true;
    }

    for (const safe of [true, false]) {
      for (const method of ["Append", "Prepend"]) {
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            await stream_insert_before(method, safe, parent, null, "A");
            assert_equals(parent.innerHTML, "A");
          },
          `${get_method_name(method, safe)} without a ref node`,
        );
      }

      for (const method of ["Before", "ReplaceWith", "After"]) {
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            parent.innerHTML = "<p>X</p>";
            const ref_node = document.createElement("span");
            parent.appendChild(ref_node);
            await stream_insert_before(method, safe, parent, ref_node, "A");
            assert_equals(parent.innerHTML, "<p>X</p>A<span></span>");
          },
          `${get_method_name(method, safe)} with a ref_node at end`,
        );
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            parent.innerHTML = "<p>a</p><p>b</p><p>c</p>";
            const ref_node = parent.firstChild.nextSibling;
            await stream_insert_before(
              method,
              safe,
              parent,
              ref_node,
              "<p>X</p>",
            );
            assert_equals(parent.innerHTML, "<p>a</p><p>X</p><p>b</p><p>c</p>");
          },
          `${get_method_name(method, safe)} with a ref_node in the middle`,
        );
      }
      for (const method of ["Before", "ReplaceWith", "Prepend"]) {
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createElement("span");
            parent.appendChild(ref_node);
            await stream_insert_before(method, safe, parent, ref_node, "A");
            assert_equals(parent.innerHTML, "A<span></span>");
          },
          `${get_method_name(method, safe)} with a ref_node at start`,
        );

        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createElement("span");
            parent.appendChild(ref_node);
            const stream = create_stream(method, safe, parent, ref_node);
            const writer = stream.getWriter();
            await writer.write("A");
            ref_node.remove();
            await promise_rejects_dom(
              t,
              "HierarchyRequestError",
              writer.write("<p>B</p>"),
              "DOMException",
            );
          },
          `${get_method_name(method, safe)} should reject if ref node is removed`,
        );

        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createElement("span");
            parent.appendChild(ref_node);
            const stream = create_stream(method, safe, parent, ref_node);
            const writer = stream.getWriter();
            await writer.write("A");
            document.body.append(ref_node);
            t.add_cleanup(() => ref_node.remove());
            await promise_rejects_dom(
              t,
              "HierarchyRequestError",
              writer.write("<p>B</p>"),
              "DOMException",
            );
          },
          `${get_method_name(method, safe)} should reject if ref node is no longer child of the same parent`,
        );
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createComment("ref");
            parent.appendChild(ref_node);
            if (await stream_insert_before(method, safe, parent, ref_node, "A"))
              assert_equals(parent.innerHTML, "A<!--ref-->");
          },
          `${get_method_name(method, safe)} with a comment ref_node`,
        );

        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createTextNode("ref");
            parent.appendChild(ref_node);
            await stream_insert_before(method, safe, parent, ref_node, "A");
            assert_equals(parent.firstChild.data, "A");
            assert_equals(parent.lastChild.data, "ref");
            assert_equals(parent.textContent, "Aref");
          },
          `${get_method_name(method, safe)} with a text ref_node`,
        );
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const shadow = parent.attachShadow({ mode: "open" });
            const ref_node = document.createElement("span");
            shadow.appendChild(ref_node);
            await stream_insert_before(method, safe, shadow, ref_node, "A");
            assert_equals(shadow.innerHTML, "A<span></span>");
          },
          `${get_method_name(method, safe)} in a ShadowRoot`,
        );

        // B6: toString that removes the ref makes the write reject with HierarchyRequestError
        promise_test(
          async (t) => {
            const parent = document.createElement("div");
            const ref_node = document.createElement("span");
            parent.appendChild(ref_node);
            const stream = create_stream(method, safe, parent, ref_node);
            const writer = stream.getWriter();
            await writer.write("<p>A</p>");
            await promise_rejects_dom(
              t,
              "HierarchyRequestError",
              writer.write({
                toString() {
                  ref_node.remove();
                  return "<p>B</p>";
                },
              }),
            );
            assert_equals(parent.innerHTML, "<p>A</p>");
          },
          `${get_method_name(method, safe)}: chunk toString() removing ref_node rejects with HierarchyRequestError`,
        );
      }
    }

    // E1, E2, E3: Reference child displaced mid-chunk and target removed mid-stream
    for (const method of ["Before", "ReplaceWith", "Prepend"]) {
      const method_name = `stream${method}HTMLUnsafe`;

      function create_unsafe_stream(parent, ref_node, options = { runScripts: true }) {
        switch (method) {
          case "Before":
            return ref_node[method_name](options);
          case "ReplaceWith": {
            const placeholder = document.createElement("div");
            parent.insertBefore(placeholder, ref_node);
            return placeholder[method_name](options);
          }
          case "Prepend":
            return parent[method_name](options);
        }
      }

      promise_test(async (t) => {
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        t.add_cleanup(() => parent.remove());
        const ref_node = document.createElement("span");
        ref_node.id = "displaced-ref";
        parent.appendChild(ref_node);

        const other_parent = document.createElement("div");
        const other_text = document.createTextNode("unrelated");
        other_parent.appendChild(other_text);

        window.displace_ref = () => {
          // Move ref_node right after other_text in other_parent to verify
          // FlushPendingText does not merge into an unrelated Text sibling.
          other_parent.appendChild(ref_node);
        };
        t.add_cleanup(() => { delete window.displace_ref; });

        const writer = create_unsafe_stream(parent, ref_node).getWriter();
        await writer.write(
          "before<script>window.displace_ref();<" + "/script><p><b>x</b></p>t<!--c-->"
        );
        // The write resolves even though ref_node was displaced mid-chunk;
        // nodes after displacement are dropped, and close() resolves.
        await writer.close();

        assert_equals(parent.querySelector("p"), null, "Dropped element must not be in parent");
        assert_equals(parent.querySelector("b"), null, "Dropped subtree must not be in parent");
        assert_equals(other_parent.querySelector("p"), null, "Dropped element must not be in other_parent");
        assert_equals(other_text.data, "unrelated", "Pending text must not merge into unrelated Text node");
        assert_equals(parent.innerHTML, "before<script>window.displace_ref();<" + "/script>");
      }, `${method_name}: displacing ref_node mid-chunk drops subsequent nodes/subtrees/text/comments and close() resolves`);

      promise_test(async (t) => {
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        t.add_cleanup(() => parent.remove());
        const ref_node = document.createElement("span");
        parent.appendChild(ref_node);

        window.remove_ref = () => ref_node.remove();
        t.add_cleanup(() => { delete window.remove_ref; });

        const writer = create_unsafe_stream(parent, ref_node, {
          runScripts: true,
          sanitizer: {
            removeElements: ["i"],
            replaceWithChildrenElements: ["section"],
          },
        }).getWriter();
        await writer.write(
          "before<section><em>kept</em><script>window.remove_ref();<" + "/script><p><b>x</b></p>t<!--c--></section><p>after</p>"
        );
        assert_equals(parent.querySelector("p"), null, "Sanitizer path must drop (not append) when ref_node is displaced, including inside replaceWithChildrenElements");
        assert_equals(parent.innerHTML, "before<em>kept</em><script>window.remove_ref();<" + "/script>");

        await promise_rejects_dom(
          t,
          "HierarchyRequestError",
          writer.write("<p>next</p>"),
          "Subsequent write after ref_node displacement must reject with HierarchyRequestError",
        );
      }, `${method_name}: displacing ref_node mid-chunk with sanitizer and replaceWithChildrenElements drops nodes and rejects next write`);

      promise_test(async (t) => {
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        t.add_cleanup(() => parent.remove());
        const ref_node = document.createElement("span");
        parent.appendChild(ref_node);

        window.remove_ref = () => ref_node.remove();
        t.add_cleanup(() => { delete window.remove_ref; });

        const writer = create_unsafe_stream(parent, ref_node).getWriter();
        await writer.write("A<script>window.remove_ref();<" + "/script><p>dropped</p>");
        assert_equals(parent.querySelector("p"), null);

        // E2: Move ref_node back into parent before the next write
        parent.appendChild(ref_node);
        await writer.write("<p>kept</p>");
        await writer.close();

        assert_not_equals(parent.querySelector("p"), null);
        assert_equals(parent.querySelector("p").textContent, "kept");
        assert_equals(parent.lastChild, ref_node);
      }, `${method_name}: moving ref_node back into parent before next write allows stream to continue`);
    }

    // E3: Target removed with runScripts: nodes still go into target; scripts don't run
    for (const method of ["streamHTMLUnsafe", "streamAppendHTMLUnsafe", "streamPrependHTMLUnsafe"]) {
      promise_test(async (t) => {
        const target = document.createElement("div");
        document.body.appendChild(target);
        t.add_cleanup(() => target.remove());

        window.remove_target = () => target.remove();
        window.script_after_remove_ran = false;
        t.add_cleanup(() => {
          delete window.remove_target;
          delete window.script_after_remove_ran;
        });

        const writer = target[method]({ runScripts: true }).getWriter();
        await writer.write(
          "<script>window.remove_target();<" + "/script>" +
          "<p id='inserted-after-remove'>still inserted</p>" +
          "<script>window.script_after_remove_ran = true;<" + "/script>"
        );
        await writer.write("<em id='second-write'>more</em>");
        await writer.close();

        assert_false(target.isConnected);
        assert_not_equals(target.querySelector("#inserted-after-remove"), null);
        assert_equals(target.querySelector("#inserted-after-remove").textContent, "still inserted");
        assert_not_equals(target.querySelector("#second-write"), null);
        assert_false(window.script_after_remove_ran, "Scripts must not run after target is disconnected");
      }, `${method}: disconnecting target mid-stream continues inserting nodes into target without running scripts`);
    }
  </script>
</body>
