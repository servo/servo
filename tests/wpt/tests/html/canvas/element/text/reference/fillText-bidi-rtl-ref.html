<!DOCTYPE html>
<meta charset="utf-8">
<title>HTML Canvas Reference: fillText reorders bidirectional text in a right-to-left paragraph</title>
<style>
canvas {
    margin: 10px;
}
</style>

<canvas id="canvas" width="400" height="120"></canvas>

<script>
const context = canvas.getContext("2d");
context.font = "20px sans-serif";
context.textAlign = "left";

// Draw each directional run on its own, left to right in visual order.
function drawVisualRuns(runs, y) {
    let x = 10;
    for (const run of runs) {
        context.direction = run.direction;
        context.fillText(run.text, x, y);
        x += context.measureText(run.text).width;
    }
}

drawVisualRuns([
    { text: "abc", direction: "ltr" },
    { text: "אבג ", direction: "rtl" },
], 40);
drawVisualRuns([
    { text: " דהו", direction: "rtl" },
    { text: "123", direction: "ltr" },
    { text: "אבג ", direction: "rtl" },
], 90);
</script>
