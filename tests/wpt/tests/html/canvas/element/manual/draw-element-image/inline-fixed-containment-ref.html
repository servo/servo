<!DOCTYPE html>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  #canvas {
    width: 300px;
    height: 200px;
    background: #ccc;
    position: relative;
  }
  #inline {
    position: absolute;
    top: 50px;
    left: 100px;

  }
</style>
<div id="canvas">
  <div id="inline">X<span id="fixed"></span></div>
