<!DOCTYPE html>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
  #canvas {
    width: 200px;
    height: 200px;
    background: #ccc;
    position: relative;
  }
  #child {
    font: 25px/1 Ahem;
    width: 2em;
    height: 2em;
    background: lightblue;
  }
  #pre {
    color: blue;
  }
  #inline-placeholder {
    color: transparent;
  }
  #inline-actual {
    font: 25px/1 Ahem;
    width: 2em;
    position: absolute;
    top: 100px;
    left: 100px;
    color: green;
  }
  #inline-actual-spacer {
    color: transparent;
  }
</style>
<div id="canvas">
  <div id="child"><span id="pre">X</span><span id="inline-placeholder">X XX</span></div>
  <div id="inline-actual"><span id="inline-actual-spacer">X</span>X XX</div>
</div>
