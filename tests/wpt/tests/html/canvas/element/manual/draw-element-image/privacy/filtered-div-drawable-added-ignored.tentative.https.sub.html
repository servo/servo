<!DOCTYPE HTML>
<html>
<head>
  <title>drawElementImage does not use cross-origin feImage content when drawable is added to a contain:paint ancestor</title>
  <link rel="help" href="https://github.com/WICG/html-in-canvas">
  <script src='/resources/testharness.js'></script>
  <script src='/resources/testharnessreport.js'></script>
  <script src='/html/canvas/resources/canvas-tests.js'></script>
  <script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
  <style>
    .wrapper {
      width: 100px;
      height: 100px;
      contain: paint;
    }
    .filtered {
      width: 100px;
      height: 100px;
    }
    #filtered-same {
      filter: url('#filter-same');
    }
    #filtered-cross {
      filter: url('#filter-cross');
    }
    .child {
      width: 100px;
      height: 100px;
      background: green;
      backdrop-filter: invert(0);
      overflow: hidden;
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="100" height="200" content="drawable">
    <svg width="0" height="0">
      <filter id="filter-same" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
        <feImage href="https://{{location[host]}}/images/green-100x100.png" />
      </filter>
      <filter id="filter-cross" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
        <feImage href="https://{{hosts[alt][www]}}:{{ports[https][0]}}/images/red-100x100.png"/>
      </filter>
    </svg>
    <div id="wrapper-same" class="wrapper">
      <div id="filtered-same" class="filtered">
        <div id="child-same" class="child"></div>
      </div>
    </div>
    <div id="wrapper-cross" class="wrapper">
      <div id="filtered-cross" class="filtered">
        <div id="child-cross" class="child"></div>
      </div>
    </div>
  </canvas>

  <script>
    window.onload = () => {
      promise_test(async function(t) {
        await waitForCanvasPaint(canvas);

        const wrapperSame = document.getElementById("wrapper-same");
        const wrapperCross = document.getElementById("wrapper-cross");
        wrapperSame.setAttribute("drawable", "");
        wrapperCross.setAttribute("drawable", "");
        document.getElementById("child-same").style.borderRadius = "2px";
        document.getElementById("child-cross").style.borderRadius = "2px";

        await waitForCanvasPaint(canvas);
        const context = canvas.getContext("2d");
        context.drawElementImage(wrapperSame, 0, 0);
        context.drawElementImage(wrapperCross, 0, 100);

        // Fetch all pixel data once to avoid multiple slow readbacks.
        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);

        let pixel = _getPixelFromImageData(imgData, 50, 50);
        assert_array_equals(pixel, [0, 255, 0, 255], "Same origin should draw");

        // Ignored filter is not applied at all
        pixel = _getPixelFromImageData(imgData, 50, 150);
        assert_array_equals(pixel, [0, 128, 0, 255], "Cross origin should not draw");
      });
    };
  </script>
</body>
</html>
