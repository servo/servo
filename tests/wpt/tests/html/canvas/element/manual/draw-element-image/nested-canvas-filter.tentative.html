<!DOCTYPE html>
<html class="reftest-wait">
<title>drawElementImage with nested canvas inside filtered ancestor</title>
<link rel="help" href="https://github.com/WICG/html-in-canvas">
<link rel="match" href="nested-canvas-filter-ref.html">
<script src="/common/reftest-wait.js"></script>
<script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
<style>
  #canvas {
    width: 200px;
    height: 200px;
    background: #eee;
  }
  #ancestor {
    width: 100px;
    height: 100px;
    filter: invert(100%);
  }
  #target {
    width: 100px;
    height: 100px;
    background: #FF00FF;
  }
</style>

<canvas id="canvas" width="200" height="200" content=drawable>
  <div id="ancestor" drawable>
    <canvas id="inner" width="100" height="100" content=drawable>
      <div id="target" drawable></div>
    </canvas>
  </div>
</canvas>

<script>
  onload = async () => {
    await waitForCanvasPaint(canvas);
    inner.getContext('2d').drawElementImage(target, 0, 0, 100, 100);
    canvas.getContext('2d').drawElementImage(ancestor, 0, 0, 100, 100);
    takeScreenshot();
  };
</script>
</html>
