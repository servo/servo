<!DOCTYPE HTML>
<html>
<head>
  <title>drawElementImage does not paint corss-origin ::after image in ::details-content</title>
  <link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  <script src='/resources/testharness.js'></script>
  <script src='/resources/testharnessreport.js'></script>
  <script src='/html/canvas/resources/canvas-tests.js'></script>
  <script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
  <style>
    details {
      width: 100px;
    }
    ::details-content::after {
      content: url("https://{{hosts[alt][www]}}:{{ports[https][0]}}/images/red-100x100.png");
      width: 100px;
      height: 100px;
      background-color: green;
      display: inline-block;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="100" height="200" layoutsubtree>
    <div id=child>
      <details open>
        <summary>Details</summary>
        <p>A</p>
      </details>
    </div>
  </canvas>

  <script>
    window.onload = () => {
      promise_test(async function(t) {
        await waitForCanvasPaint(canvas);

        var context = canvas.getContext("2d");

        // Draw the element image
        context.drawElementImage(child, 0, 0);

        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);

        // The canvas should NOT paint the background image (red)
        pixel = _getPixelFromImageData(imgData, 50, 80);
        assert_false(pixel[0] > 0, "The canvas should not paint a cross origin image.");
        assert_true(pixel[1] > 0, "The canvas should show the background color.");
      });
    };
  </script>
</body>
</html>
