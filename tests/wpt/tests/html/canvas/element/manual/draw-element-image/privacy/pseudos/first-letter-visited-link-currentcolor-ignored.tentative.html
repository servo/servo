<!DOCTYPE HTML>
<html>
<head>
  <title>drawElementImage does not reveal visited link colors first first-letter</title>
  <link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  <script src='/resources/testharness.js'></script>
  <script src='/resources/testharnessreport.js'></script>
  <script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
  <style>
    p::first-letter {
      color: currentColor;
      background-color: currentColor;
    }
    .link {
      font-family: Ahem;
      font-size: 20px;
      color: green;
      display: block;
    }
    .link:visited {
      color: red;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="100" height="100" layoutsubtree>
    <a id=child class=link href=""><p>Visited first letter.</p></a>
  </canvas>

  <script>
    window.onload = () => {
      promise_test(async function(t) {
        await waitForCanvasPaint(canvas);

        var context = canvas.getContext("2d");

        // Draw the element image
        context.drawElementImage(child, 0, -20);

        // The canvas should NOT reflect the visited state (red), it should paint the unvisited state (green).
        let pixel = context.getImageData(5, 5, 1, 1).data;
        assert_false(pixel[0] > 0, "The canvas should not reflect the visited state.");
        assert_true(pixel[1] > 0, "The canvas should not reflect the visited state.");
      });
    };
  </script>
</body>
</html>
