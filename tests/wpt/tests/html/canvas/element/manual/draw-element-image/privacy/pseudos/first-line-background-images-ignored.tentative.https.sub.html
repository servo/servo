<!DOCTYPE HTML>
<html>
<head>
  <title>drawElementImage does not draw cross-origin background images for first-line</title>
  <script src='/resources/testharness.js'></script>
  <script src='/resources/testharnessreport.js'></script>
  <script src='/html/canvas/resources/canvas-tests.js'></script>
  <script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
  <style>
    div {
      width: 50px;
    }
    *::first-line {
      color: transparent;
      background-color: green;
      background-image: url("https://{{hosts[alt][www]}}:{{ports[https][0]}}/images/red-100x100.png");

    }
  </style>
</head>
<body>
  <canvas id=canvas width="100" height="200" layoutsubtree>
    <div id=child>
      Enough test for several lines of content.
    </div>
  </canvas>

  <script>
    window.onload = () => {
      promise_test(async function(t) {
        await waitForCanvasPaint(canvas);
        const context = canvas.getContext("2d");
        context.drawElementImage(child, 0, 0);

        // Fetch all pixel data once to avoid multiple slow readbacks.
        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);

        pixel = _getPixelFromImageData(imgData, 5, 5);
        assert_array_equals(pixel, [0, 128, 0, 255], "Cross origin should not draw");
      });
    };
  </script>
</body>
</html>
