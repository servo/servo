<!DOCTYPE HTML>
<html>
<head>
  <title>drawElementImage does not reveal visited link colors in ::details-content</title>
  <link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
  <script src='/resources/testharness.js'></script>
  <script src='/resources/testharnessreport.js'></script>
  <script src='/html/canvas/resources/canvas-tests.js'></script>
  <script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
  <style>
    .link {
      color: green;
    }
    .link:visited {
      color: red;
    }
    details {
      width: 100px;
    }
    #details1::details-content {
      font-family: Ahem;
      color: currentColor;
      font-size: 20px;
    }
    #details2::details-content {
      font-family: Ahem;
      background-color: currentColor;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="100" height="100" layoutsubtree>
    <a id=child class=link href="">
      <details id=details1 open>
        <summary>Details</summary>
        <p>A</p>
      </details>
      <details id=details2 open>
        <summary>Details</summary>
        <p>-</p>
      </details>
    </a>
  </canvas>

  <script>
    window.onload = () => {
      promise_test(async function(t) {
        await waitForCanvasPaint(canvas);

        var context = canvas.getContext("2d");

        // Draw the element image
        context.drawElementImage(child, 0, 0);

        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);

        // The canvas should NOT reflect the visited state (red), it should paint the unvisited state (green).
        pixel = _getPixelFromImageData(imgData, 6, 45);
        assert_false(pixel[0] > 0, "The canvas should not reflect the visited state.");
        assert_true(pixel[1] > 0, "The canvas should not reflect the visited state.");

        pixel = _getPixelFromImageData(imgData, 6, 85);
        assert_false(pixel[0] > 0, "The canvas should not reflect the visited state in background.");
        assert_true(pixel[1] > 0, "The canvas should not reflect the visited state in background.");
      });
    };
  </script>
</body>
</html>
