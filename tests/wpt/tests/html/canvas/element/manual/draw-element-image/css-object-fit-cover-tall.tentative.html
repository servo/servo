<!DOCTYPE html>
<html class="reftest-wait">
<title>Canvas.drawElementImage: content draws correct with object-fit: cover in a tall box</title>
<link rel="help" href="https://github.com/WICG/html-in-canvas">
<link rel="author" href="mailto:schenney@chromium.org">
<link rel="match" href="css-object-fit-cover-tall-ref.html">
<meta name=fuzzy content="0-30;0-1600">
<script src="/common/reftest-wait.js"></script>
<script src="/html/canvas/resources/wait-for-canvas-paint.js"></script>
<style>
  #child {
    width: 200px;
    height: 200px;
    background: green;
  }
  #canvas {
    aspect-ratio: 3/4;
    object-fit: cover;
    background-color: gray;
    width: 300px;
  }
</style>

<canvas id=canvas width="300" height="300" content=drawable>
  <div drawable id=child></div>
</canvas>

<script>
onload = async () => {
  await waitForCanvasPaint(canvas);
  canvas.getContext("2d").drawElementImage(child, 45, 45);
  takeScreenshot();
};
</script>
</html>
