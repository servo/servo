<!DOCTYPE html>
<meta charset="utf-8">
<title>Event handlers and event listeners when scripting is disabled for the target</title>
<link rel="help" href="https://html.spec.whatwg.org/#the-event-handler-processing-algorithm">
<link rel="help" href="https://html.spec.whatwg.org/#getting-the-current-value-of-the-event-handler">
<link rel="help" href="https://html.spec.whatwg.org/#concept-n-noscript">
<link rel="help" href="https://dom.spec.whatwg.org/#concept-event-listener-inner-invoke">
<link rel="help" href="https://github.com/whatwg/dom/issues/1084">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";

// Scripting is disabled for objects in a document that is sandboxed without
// allow-scripts, which prevents compiling an event handler content attribute.
// It does not prevent invoking an event handler whose value is already a
// function, or an event listener: a document sandboxed without allow-scripts
// cannot register anything itself, so the listeners and handlers here belong
// to the embedder, and running them does not run any script of the sandboxed
// document.

function addSandboxedFrame(t) {
  const frame = document.createElement("iframe");
  // allow-same-origin without allow-scripts: the embedder can reach into the
  // document, but scripting is disabled for it.
  frame.sandbox = "allow-same-origin";
  frame.srcdoc = "<div id=target></div>";
  const loaded = new Promise(resolve => {
    frame.addEventListener("load", resolve, { once: true });
  });
  t.add_cleanup(() => frame.remove());
  document.body.append(frame);
  return loaded.then(() => frame);
}

promise_test(async t => {
  const frame = await addSandboxedFrame(t);
  const element = frame.contentDocument.getElementById("target");
  assert_not_equals(element, null, "sanity check: the embedder can reach the document");

  let count = 0;
  element.addEventListener("click", () => count++);
  element.dispatchEvent(new Event("click"));
  assert_equals(count, 1);
}, "addEventListener() listener runs for an element in a sandboxed document without allow-scripts");

promise_test(async t => {
  const frame = await addSandboxedFrame(t);
  const element = frame.contentDocument.getElementById("target");

  let count = 0;
  element.onclick = () => count++;
  element.dispatchEvent(new Event("click"));
  assert_equals(count, 1);
}, "Event handler IDL attribute runs for an element in a sandboxed document without allow-scripts");

promise_test(async t => {
  const frame = await addSandboxedFrame(t);
  const element = frame.contentDocument.getElementById("target");
  t.add_cleanup(() => { delete window.sandboxedHandlerRan; });

  element.setAttribute("onclick", "top.sandboxedHandlerRan = true;");
  assert_equals(element.onclick, null, "the content attribute is not compiled");
  element.dispatchEvent(new Event("click"));
  assert_equals(window.sandboxedHandlerRan, undefined);
}, "Event handler content attribute does not run for an element in a sandboxed document without allow-scripts");

promise_test(async t => {
  const frame = await addSandboxedFrame(t);
  const win = frame.contentWindow;

  let count = 0;
  win.addEventListener("click", () => count++);
  win.dispatchEvent(new Event("click"));
  assert_equals(count, 1);
}, "addEventListener() listener runs for the Window of a sandboxed document without allow-scripts");
</script>
