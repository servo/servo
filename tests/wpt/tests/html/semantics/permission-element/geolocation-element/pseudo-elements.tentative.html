<!DOCTYPE html>
<meta charset=utf-8>
<link rel="match" href="pseudo-elements-ref.html">
<link rel="help" href="https://github.com/WICG/PEPC/blob/main/explainer.md#locking-the-pepc-style">
<body>
  <div>
    The geolocation element should not create any pseudo elements.
  </div>

  <style>
    body {
      list-style-position: inside;
      list-style-type: "FAIL";
    }
    geolocation {
      display: inline flow-root list-item;
    }
    geolocation::before, geolocation::after, geolocation::marker { content: "FAIL"; }
  </style>

  <p>You should not see the word FAIL below.</p>

  <geolocation></geolocation>
</body>
</html>
