<!DOCTYPE html>
<html class="reftest-wait">
<meta charset=utf-8>
<link rel="match" href="unbounded-width-with-border-reftest-ref.html">
<link rel="help" href="https://github.com/WICG/PEPC/blob/main/explainer.md#locking-the-pepc-style">
<body>
  <div>
    The usermedia element width is allowed to be unbounded if there is a border which makes the
    bounds of the usermedia element sufficiently clear.
    The border should have enough width, enough contrast with the background-color and no transparency.
  </div>

<style>
  /* This element passes all checks and therefore its width is not limited */
  #unlimited-width {
    font-size: 10px;
    background-color: white;
    border: solid 1px black;
    width: 500px;
  }
  /* This element's border width is too small */
  #no-border-width {
    font-size: 10px;
    background-color: white;
    border: 0px;
    width: 500px;
  }
  /* This element's border color is not sufficiently different from the background-color */
  #no-contrast {
    font-size: 10px;
    background-color: white;
    border: solid 1px yellow;
    width: 500px;
  }
  /* This element's border color has some transparency (alpha < 1) */
  #transparent {
    font-size: 10px;
    background-color: white;
    border: solid 1px #000000ee;
    width: 500px;
  }
  /* This element's border is good except the top part which has insuficient contrast */
  #top-no-contrast {
    font-size: 10px;
    background-color: white;
    border: solid 1px black;
    border-top-color: white;
    width: 500px;
  }
</style>

<div><usermedia id="unlimited-width"></usermedia></div>
<div><usermedia id="no-border-width"></usermedia></div>
<div><geolocation id="no-contrast"></geolocation></div>
<div><usermedia id="transparent"></usermedia></div>
<div><geolocation id="top-no-contrast"></geolocation></div>

  <script>
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('reftest-wait');
    });
  </script>
</body>
