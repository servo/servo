<!doctype html>
<meta charset="utf-8" />
<title>adding checked radio button to a form updates radio buttons in same group</title>
<link rel="author" title="Glenn Skrzypczak" href="mailto:glenn.skrzypczak@gmail.com"/>
<link rel="help" href="https://html.spec.whatwg.org/multipage/#radio-button-state-(type=radio)"/>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>

<form id="form">
  <input type="radio" name="group" id="radio1" checked />
</form>
<input type="radio" name="group" id="radio2" checked />

<script>
  let radio1 = document.getElementById("radio1");
  let radio2 = document.getElementById("radio2");

  test(function () {
    assert_true(radio1.checked);
    assert_true(radio2.checked);
    radio2.setAttribute("form", "form");
    assert_false(radio1.checked);
    assert_true(radio2.checked);
  }, "adding checked radio button to a form updates radio buttons in same group");
</script>
