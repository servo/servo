<!DOCTYPE html>
<meta charset="utf-8">
<title>Input selection is preserved when changing between text and password</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/input.html#input-type-change">
<link rel="help" href="https://html.spec.whatwg.org/multipage/form-control-infrastructure.html#textFieldSelection">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/rendering-utils.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>

<body>
<script>
function assertSelection(input, expectedSelection, description) {
  assert_equals(input.selectionStart, expectedSelection.start,
                `${description}: selection start`);
  assert_equals(input.selectionEnd, expectedSelection.end,
                `${description}: selection end`);
  assert_equals(input.selectionDirection, expectedSelection.direction,
                `${description}: selection direction`);
}

const typeChanges = [
  {from: 'text', to: 'password'},
  {from: 'password', to: 'text'},
];

const selections = [
  {name: 'a caret at offset 4', start: 4, end: 4},
  {name: 'a forward selection from offset 2 to offset 7', start: 2, end: 7,
   direction: 'forward'},
  {name: 'a backward selection from offset 2 to offset 7', start: 2, end: 7,
   direction: 'backward'},
];

for (const typeChange of typeChanges) {
  for (const selection of selections) {
    promise_test(async t => {
      const container = document.createElement('div');
      const input = document.createElement('input');
      const button = document.createElement('button');
      input.type = typeChange.from;
      input.value = '0123456789';
      button.textContent = 'Change type';
      container.append(input, button);
      document.body.append(container);
      t.add_cleanup(() => container.remove());

      input.focus();
      assert_equals(document.activeElement, input,
                    'The input is focused before its selection is set');
      input.setSelectionRange(selection.start, selection.end,
                              selection.direction);

      const expectedSelection = {
        start: selection.start,
        end: selection.end,
        direction: selection.direction ?? input.selectionDirection,
      };
      assertSelection(input, expectedSelection, 'Initial selection');

      button.addEventListener('mousedown', () => {
        // Some browsers do not focus buttons when clicked. Focus it here so
        // the input blurs before the click handler refocuses it.
        button.focus();
      });

      button.addEventListener('click', t.step_func(() => {
        assert_equals(document.activeElement, button,
                      'The button is focused before the input is refocused');
        input.focus();
        input.type = typeChange.to;
      }));

      await test_driver.click(button);

      assert_equals(document.activeElement, input,
                    'The input is focused after the click handler runs');
      assert_equals(input.type, typeChange.to,
                    'The input has the requested type after the click');
      assertSelection(input, expectedSelection,
                      'Selection after the type change');

      await waitForAtLeastOneFrame();
      assertSelection(input, expectedSelection, 'Selection after rendering');
    }, `Changing an input from ${typeChange.from} to ${typeChange.to} during ` +
       `a click preserves ${selection.name}`);
  }
}
</script>
