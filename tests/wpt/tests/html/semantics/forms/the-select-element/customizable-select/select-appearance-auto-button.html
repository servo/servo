<!DOCTYPE html>
<title>The first child button supplies the label and the width of a select with appearance:auto</title>
<link rel=help href="https://html.spec.whatwg.org/multipage/rendering.html#the-select-element-2">
<link rel=help href="https://github.com/whatwg/html/issues/12474">

<p><select><button>Foo</button><option>One</option></select>
<p><select><button><span>Foo</span></button><option>One</option></select>
<p><select><button><img src=/images/blue.png alt="">Foo</button><option>One</option></select>

<p><select><button>Foo&#x20;&#x20;&#x20;Bar</button><option>One</option></select>
<p><select><button><selectedcontent></selectedcontent></button><option>Foo</option><option>Two</option></select>
<p><select><button>Pre <selectedcontent></selectedcontent></button><option>Foo</option><option>Two</option></select>
