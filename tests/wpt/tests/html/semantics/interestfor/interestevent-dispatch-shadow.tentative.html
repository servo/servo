<body>
  <script>
  test((t) => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    document.body.append(host);
    const shadow = host.attachShadow({ mode: "closed" });
    const slot = shadow.appendChild(document.createElement("slot"));
    let childEvent = null;
    let childEventTarget = null;
    let childEventSource = null;
    slot.addEventListener("interest", (e) => {
        childEvent = e;
        childEventTarget = e.target;
        childEventSource = e.source;
      }, { once: true });
    host.addEventListener("interest", (e) => {
        assert_unreached("host should not receive interest event");
      }, { once: true });
    const event = new InterestEvent("interest", {
      bubbles: true,
      source: slot,
      composed: true,
    });
    slot.dispatchEvent(event);
    assert_true(childEvent instanceof InterestEvent, "slot saw interest event");
    assert_equals(childEventTarget, slot, "target is child inside shadow boundary");
    assert_equals(childEventSource, slot, "source is child inside shadow boundary");
    assert_equals(event.source, host, "source is retargeted after dispatch");
  }, "InterestEvent doesn't propagate across shadow boundary when retargeted source == currentTarget");

  promise_test(async (t) => {
    const host = document.createElement("div");
    t.add_cleanup(() => host.remove());
    document.body.append(host);
    const shadow = host.attachShadow({ mode: "open" });
    const button = shadow.appendChild(document.createElement("button"));
    const interestee = host.appendChild(document.createElement("div"));
    button.interestForElement = interestee;
    button.style = "interest-delay: 0s";
    let event = null;
    let eventTarget = null;
    let eventSource = null;
    interestee.addEventListener("interest", (e) => {
        event = e;
        eventTarget = e.target;
        eventSource = e.source;
      },{ once: true });
    await hoverOver(button);
    assert_true(!!event,"InterestEvent gets fired");
    assert_true(event instanceof InterestEvent);
    assert_equals(eventTarget, interestee, "target is interestee");
    assert_equals(eventSource, host, "interestee is host");
  }, "cross shadow InterestEvent retargets interestee to host element");
</script>

<div id=own-host-interestee>
  <template shadowrootmode=open>
    <style>
      button {
        interest-delay: 0s;
      }
    </style>
    <button id=own-host-button>Button</button>
  </template>
</div>

<script>
  promise_test(async (t) => {
    const host = document.getElementById("own-host-interestee");
    const button = host.shadowRoot.getElementById("own-host-button");
    button.interestForElement = host;

    let hostEvent = null;
    let documentEvent = null;
    host.addEventListener("interest", event => {
      hostEvent = event;
    }, {signal: t.get_signal()});
    document.addEventListener("interest", event => {
      if (event.target === host) {
        documentEvent = event;
      }
    }, {capture: true, signal: t.get_signal()});

    await hoverOver(button);

    assert_true(hostEvent instanceof InterestEvent,
        "The host should receive an interest event");
    assert_equals(hostEvent.target, host, "The interest event target");
    assert_equals(hostEvent.source, host,
        "The shadow button should be retargeted to its host");
    assert_equals(documentEvent, hostEvent,
        "The interest event should reach the document during capture");
  }, "InterestEvent can target the source's own shadow host");
</script>
