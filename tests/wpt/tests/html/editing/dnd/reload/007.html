<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reload during drag and drop roundtrip with text/plain data</title>
  <link rel="help" href="https://html.spec.whatwg.org/multipage/dnd.html#drag-and-drop-processing-model">
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/resources/testdriver.js"></script>
  <script src="/resources/testdriver-vendor.js"></script>
  <script src="/resources/testdriver-actions.js"></script>
  <script src="support/drag-reload-test.js"></script>
  <style>
    body { margin: 20px; }
    #source {
      width: 40px;
      min-height: 40px;
      padding: 40px;
      color: white;
      background: navy;
    }
  </style>
  <script>
    function sourceDragStart(event) {
      event.dataTransfer.effectAllowed = 'copy';
      event.dataTransfer.setData('text/plain', ' PASS ');
      location.reload();
    }

    function targetDrop(event) {
      event.preventDefault();
      const data = event.dataTransfer.getData('text/plain');
      event.currentTarget.append(document.createTextNode(data));
    }
  </script>
</head>
<body>
  <div id="source" draggable="true"
    ondragstart="sourceDragStart(event)" ondragenter="event.preventDefault()"
    ondragover="event.preventDefault()" ondrop="targetDrop(event)"></div>
  <script>
    testDragAcrossReload({
      dataType: 'text/plain',
      getExpectedData: () => ' PASS ',
      verifyDrop: target => {
        assert_equals(target.textContent, ' PASS ', 'The block receives the text');
      },
    });
  </script>
</body>
</html>
