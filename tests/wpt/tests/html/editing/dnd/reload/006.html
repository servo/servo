<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reload during link drag and drop roundtrip</title>
  <link rel="help" href="https://html.spec.whatwg.org/multipage/dnd.html#drag-and-drop-processing-model">
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/resources/testdriver.js"></script>
  <script src="/resources/testdriver-vendor.js"></script>
  <script src="/resources/testdriver-actions.js"></script>
  <script src="support/drag-reload-test.js"></script>
  <style>
    body { margin: 20px; }
  </style>
  <script>
    function sourceDragStart(event) {
      event.dataTransfer.effectAllowed = 'copy';
      location.reload();
    }

    function targetDrop(event) {
      event.preventDefault();
      const data = event.dataTransfer.getData('text/uri-list').replace(/\r\n$/, '');
      event.currentTarget.textContent = data === 'data:text/plain,1' ? 'PASS' : 'FAIL';
    }
  </script>
</head>
<body>
  <a id="source" href="data:text/plain,1"
    ondragstart="sourceDragStart(event)" ondragenter="event.preventDefault()"
    ondragover="event.preventDefault()" ondrop="targetDrop(event)">Drag me</a>
  <script>
    testDragAcrossReload({
      dataType: 'text/uri-list',
      getExpectedData: source => source.href,
      verifyDrop: target => {
        assert_equals(target.textContent, 'PASS', 'The target receives the link URL');
      },
    });
  </script>
</body>
</html>
