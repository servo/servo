    function addImage(event) {
      var img = document.createElement('img');
      img.setAttribute('src', event.dataTransfer.getData('text/uri-list').replace(
        /\r\n$/, ''));
      document.querySelector('div').appendChild(img);
    }

<body>
  <p>Drag the canvas (navy/white pattern). During the drag, you should see a green circle drag image
    (not the original navy/white pattern).</p>
  <p>
    <canvas id="dragSource" width="100" height="100" draggable="true"
      ondragstart="sourceDragStart(event)">Canvas</canvas>
  </p>
  <script>
    // Draw navy/white concentric squares on the original canvas
    var canvas = document.querySelector('canvas'),
      c = canvas.getContext('2d');
    for (var x = 0; x != 50; x++) {
      c.fillStyle = (x % 2 == 0) ? 'navy' : 'white';
      c.beginPath();
      c.moveTo(x, x);
      c.lineTo(100 - x, x);
      c.lineTo(100 - x, 100 - x);
      c.lineTo(x, 100 - x);
      c.closePath();
      c.fill();
    }
  </script>
</body>
