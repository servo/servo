<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Removing image element during drag and drop of SVG image</title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/resources/testdriver.js"></script>
  <script src="/resources/testdriver-vendor.js"></script>
  <script src="/resources/testdriver-actions.js"></script>
  <script src="../resources/test-helper.js"></script>
  <script src="support/drag-source-removal.js"></script>
  <style>
    div {
      height: 100px;
      width: 100px;
      padding: 20px;
      background-color: silver;
    }
  </style>
  <script>
    function sourceDragStart(event) {
      event.dataTransfer.effectAllowed = 'copy';
      event.currentTarget.remove();
    }
  </script>
</head>
<body>
  <p>
    <img ondragstart="sourceDragStart(event)"
      src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20version%3D%221.1%22%20width%3D%22100px%22%20height%3D%22100px%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%20fill%3D%22green%22/%3E%3C/svg%3E"
      alt="SVG circle">
  </p>
  <div ondragover="return false" ondrop="addDroppedImage(event)"></div>
  <script>
    testImageSourceRemoval(
      document.querySelector('img'), document.querySelector('div'));
  </script>
</body>
</html>
