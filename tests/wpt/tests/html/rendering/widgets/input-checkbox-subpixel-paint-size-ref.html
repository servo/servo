<!doctype html>
<title>Reference: the same controls at whole-pixel positions</title>
<style>
input {
    position: absolute;
    margin: 0;
    width: 13.4px;
    height: 9.6px;
}
</style>

<input type="checkbox" style="left: 0px; top: 10px">
<input type="checkbox" style="left: 20px; top: 10px">
<input type="checkbox" style="left: 40px; top: 11px">
<input type="checkbox" style="left: 60px; top: 11px">

<input type="radio" style="left: 0px; top: 30px">
<input type="radio" style="left: 20px; top: 30px">
<input type="radio" style="left: 40px; top: 31px">
<input type="radio" style="left: 60px; top: 31px">
