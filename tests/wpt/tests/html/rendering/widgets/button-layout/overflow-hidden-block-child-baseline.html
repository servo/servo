<!DOCTYPE html>
<title>Button baseline with an overflow: hidden last block child</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/rendering.html#button-layout">
<link rel="help" href="https://drafts.csswg.org/css-align-3/#baseline-export">
<link rel="match" href="overflow-hidden-block-child-baseline-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<style>
.title-bar {
    display: flex;
    align-items: center;
    width: 200px;
    height: 60px;
    background-color: lightgray;
    font: 20px/1 Ahem;
}
button {
    height: 40px;
    padding: 0;
    border: 0;
    background-color: green;
    color: green;
    font: 20px/40px Ahem;
}
button::after {
    content: "Details";
    display: block;
    height: 0;
    overflow: hidden;
}
</style>
<p>Test passes if the green box is fully inside the gray box.</p>
<div class="title-bar">
    <div><button>Details</button></div>
</div>
