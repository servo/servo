<!DOCTYPE html>
<meta charset="utf-8">
<title>Declarative Fragment: template src streams progressively into target</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="container">
  <?start name="target">Old<?end>
</div>

<!-- Async template fetch to allow checking progressive rendering -->
<template for="target" src="../resources/chunked-html.py?delay=300&chunk1=%3Cspan%20id='c1'%3EC1%3C/span%3E&chunk2=%3Cspan%20id='c2'%3EC2%3C/span%3E" id="tpl"></template>

<script>
promise_test(async () => {
  const container = document.getElementById('container');

  // Wait for chunk 1 to be rendered
  await new Promise(resolve => {
    if (document.getElementById('c1')) {
      resolve();
      return;
    }
    const observer = new MutationObserver((mutations) => {
      if (document.getElementById('c1')) {
        observer.disconnect();
        resolve();
      }
    });
    observer.observe(container, { childList: true, subtree: true });
  });

  assert_not_equals(document.getElementById('c1'), null, "Chunk 1 should be rendered");
  assert_equals(document.getElementById('c2'), null, "Chunk 2 should not be rendered yet");

  // Wait for chunk 2 to be rendered
  await new Promise(resolve => {
    if (document.getElementById('c2')) {
      resolve();
      return;
    }
    const observer = new MutationObserver((mutations) => {
      if (document.getElementById('c2')) {
        observer.disconnect();
        resolve();
      }
    });
    observer.observe(container, { childList: true, subtree: true });
  });

  assert_not_equals(document.getElementById('c2'), null, "Chunk 2 should be rendered");

  // Wait for template loader to finish finalization task
  await new Promise(resolve => step_timeout(resolve, 50));

  // Verify target innerHTML
  assert_equals(container.innerHTML.trim().replace(/\s+/g, ' '), '<span id="c1">C1</span><span id="c2">C2</span>');
}, "External template src streams progressively into target");
</script>
</body>
