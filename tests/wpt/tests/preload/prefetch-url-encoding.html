<!doctype html>
<meta charset="windows-1252">
<title>Prefetch URL is encoding-parsed using document encoding</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<script>
    async_test((t) => {
        const key = Array.from(crypto.getRandomValues(new Uint8Array(16)))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');

        const link = document.createElement("link");
        link.rel = "prefetch";
        link.href = `resources/stash-url.py?key=${key}&test=\u00DF`;
        document.head.append(link);

        t.step_timeout(async () => {
            try {
                const response = await fetch(`resources/stash-read.py?key=${key}`);
                const recordedUrl = await response.text();

                assert_true(
                    recordedUrl.includes("test=%DF"),
                    "Expected windows-1252 encoding (%DF), got: " + recordedUrl
                );
                t.done();
            } catch (e) {
                t.step(() => { throw e; });
            }
        }, 2000);
    }, "windows-1252 prefetch href");
</script>
