[package]
name = "servo-script-webcrypto"
build = "build.rs"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "script_webcrypto"
path = "lib.rs"

[features]
subtlecrypto = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:aes-kw",
    "dep:argon2",
    "dep:aws-lc-rs",
    "dep:base64ct",
    "dep:cbc",
    "dep:chacha20poly1305",
    "dep:crypto-bigint",
    "dep:cshake",
    "dep:ctr",
    "dep:ctutils",
    "dep:ecdsa",
    "dep:ed25519-dalek",
    "dep:ed448-goldilocks",
    "dep:elliptic-curve",
    "dep:hkdf",
    "dep:itertools",
    "dep:k12",
    "dep:keccak",
    "dep:ml-dsa",
    "dep:ml-kem",
    "dep:ocb3",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:pbkdf2",
    "dep:pkcs8",
    "dep:rsa",
    "dep:rustc-hash",
    "dep:serde_core",
    "dep:servo-base",
    "dep:servo-constellation-traits",
    "dep:sha1",
    "dep:sha2",
    "dep:sha3",
    "dep:sponge-cursor",
    "dep:strum",
    "dep:x-wing",
    "dep:x25519-dalek",
    "dep:x448",
    "dep:zeroize",
    "script_bindings/subtlecrypto",
    "servo-constellation-traits/subtlecrypto",
]

