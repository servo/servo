name: Perf analysis

on:
  workflow_call:
    inputs:
      profile:
        required: false
        default: "release"
        type: string
      build-args:
        required: false
        default: ""
        type: string
      # Commit of https://github.com/servo/perf-analysis-tools to use.
      perf-analysis-tools-rev:
        required: false
        default: "8bc50689c8628e672df0b4141efb91831ff364e8"
        type: string
      force-github-hosted-runner:
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash

jobs:
  # Runs the underlying job ("workload") on a self-hosted runner if available,
  # with the help of a `runner-select` job.
  runner-select:
    runs-on: ubuntu-24.04
    outputs:
      unique-id: ${{ steps.select.outputs.unique-id }}
      selected-runner-label: ${{ steps.select.outputs.selected-runner-label }}
      runner-type-label: ${{ steps.select.outputs.runner-type-label }}
      is-self-hosted: ${{ steps.select.outputs.is-self-hosted }}
    steps:
      - name: Runner select
        id: select
        uses: servo/ci-runners/actions/runner-select@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
        with:
          GITHUB_TOKEN: ${{ github.token }}
          github-hosted-runner-label: ubuntu-22.04
          self-hosted-image-name: servo-ubuntu2204-bench
          # You can disable self-hosted runners globally by creating a repository variable named
          # NO_SELF_HOSTED_RUNNERS with any non-empty value.
          # <https://github.com/servo/servo/settings/variables/actions>
          NO_SELF_HOSTED_RUNNERS: ${{ vars.NO_SELF_HOSTED_RUNNERS }}
          force-github-hosted-runner: ${{ inputs.force-github-hosted-runner }}

  perf-analysis:
    needs:
      - runner-select
    name: Perf analysis [${{ needs.runner-select.outputs.unique-id }}]
    runs-on: ${{ needs.runner-select.outputs.selected-runner-label }}
    timeout-minutes: 240
    steps:
      - uses: servo/ci-runners/actions/checkout@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          sudo apt install -qy --no-install-recommends xvfb zsh jq
          ./mach bootstrap --yes --skip-lints --skip-nextest
      - name: Build Servo (with perfetto tracing)
        # `tracing-perfetto` is required by perf-analysis-tools to produce
        # `servo*.pftrace` traces alongside the HTML profiler traces.
        run: |
          ./mach build --locked --profile ${{ inputs.profile }} \
            --features tracing-perfetto ${{ inputs.build-args }}
      - name: Checkout perf-analysis-tools
        uses: actions/checkout@v6
        with:
          repository: servo/perf-analysis-tools
          ref: ${{ inputs.perf-analysis-tools-rev }}
          path: perf-analysis-tools
      - name: Install Rust 1.81 for perf-analysis-tools
        # Matches perf-analysis-tools' rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81"
      - name: Patch perf-analysis-tools for current servoshell
        run: |
          # `--print-pwm` was removed from servoshell (servo#43209) and is now
          # `-Z progressive-web-metrics`. The PWM metrics are still recorded in
          # the profiler trace regardless of the flag, so drop it until
          # perf-analysis-tools is updated upstream.
          python3 - "$GITHUB_WORKSPACE/perf-analysis-tools" <<'PY'
          import sys
          from pathlib import Path
          tools = Path(sys.argv[1])
          collect = tools / "src" / "collect.rs"
          collect.write_text(collect.read_text().replace('.arg("--print-pwm")\n', ""))
          bench = tools / "benchmark-servo.sh"
          bench.write_text(bench.read_text().replace(" --print-pwm \\\n", " \\\n"))
          PY
      - name: Build perf-analysis-tools
        working-directory: perf-analysis-tools
        run: cargo build --release --locked
      - name: Prepare study
        run: |
          SERVO_BINARY="$GITHUB_WORKSPACE/target/${{ inputs.profile }}/servoshell"
          mkdir -p perf-analysis-tools/studies/ci
          cp etc/ci/perf-analysis/study.toml perf-analysis-tools/studies/ci/study.toml
          sed -i "s|@SERVO_BINARY@|$SERVO_BINARY|" perf-analysis-tools/studies/ci/study.toml
      - name: Collect samples
        working-directory: perf-analysis-tools
        run: xvfb-run -a cargo run --release --locked -- collect studies/ci
      - name: Analyse samples
        working-directory: perf-analysis-tools
        run: cargo run --release --locked -- analyse studies/ci
      - name: Generate report
        working-directory: perf-analysis-tools
        run: cargo run --release --locked -- report studies/ci > studies/ci/report.html
      - name: Upload perf analysis artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-analysis
          path: perf-analysis-tools/studies/ci
          if-no-files-found: warn
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Perf analysis"
            echo ""
            echo "The full HTML report, traces, and summaries are in the *perf-analysis* artifact."
            echo ""
            SUMMARY_TXT=$(find perf-analysis-tools/studies/ci -name summaries.txt | head -n 1)
            if [ -n "$SUMMARY_TXT" ]; then
              echo "<details><summary>summaries.txt</summary>"
              echo ""
              echo '```'
              cat "$SUMMARY_TXT"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
