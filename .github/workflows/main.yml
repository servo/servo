name: Main

on:
  push:
    branches: ["main"]
  pull_request:
    types: ['opened', 'synchronize']
    branches: ["**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# When this is a pull request workflow run , ensure that any previously triggered workflows runs for
# this pull request are canceled to free up runner resources. If this isn't a pull request workflow
# run, ensure that it has a unique group, so nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  decision:
    name: Generate Try Configuration
    runs-on: ubuntu-22.04
    outputs:
      configuration: ${{ steps.configuration.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            python/servo/try_parser.py
            .github/actions/setup-python
            .python-version
            uv.lock
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Get Configuration
        id: configuration
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="linux-unit-tests lint"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS="bencher production-bencher coverage"
          else
            ARGS="fail-fast full"
          fi
          {
            echo 'result<<EOF'
            python ./python/servo/try_parser.py $ARGS
            echo EOF
           } >> $GITHUB_OUTPUT

  build:
    needs: ["decision"]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: ${{ fromJson(needs.decision.outputs.configuration).fail_fast }}
      matrix:
        include: ${{ fromJson(needs.decision.outputs.configuration).matrix }}
    # We need to use `dipatch-workflow.yml` because workflows do not support using: ${}
    uses: ./.github/workflows/dispatch-workflow.yml
    secrets: inherit
    with:
      workflow: ${{ matrix.workflow }}
      wpt: ${{ matrix.wpt }}
      profile: ${{ matrix.profile }}
      unit-tests: ${{ matrix.unit_tests }}
      devtools-tests: ${{ matrix.devtools_tests }}
      build-libservo: ${{ matrix.build_libservo }}
      wpt-args: ${{ matrix.wpt_args }}
      build-args: ${{ matrix.build_args }}
      number-of-wpt-chunks: ${{ matrix.number_of_wpt_chunks }}
      bencher: ${{ matrix.bencher }}
      coverage: ${{ matrix.coverage }}
      capi: ${{ matrix.capi }}

  build-result:
    name: Result
    runs-on: ubuntu-latest
    if: always()
    # needs all build to detect cancellation
    needs:
      - build
    steps:
      - name: Merge build timings
        uses: actions/upload-artifact/merge@v7
        with:
          name: cargo-timings
          pattern: cargo-timings-*
          delete-merged: true
      - name: Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
