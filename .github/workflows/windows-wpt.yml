---
name: Windows WPT Tests
on:
  workflow_call:
    inputs:
      wpt-args:
        default: ""
        required: false
        type: string
      profile:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      wpt-args:
        default: ""
        required: false
        type: string
      profile:
        required: true
        default: "checked-release"
        type: string

env:
  RUST_BACKTRACE: 1
  NAME: windows

jobs:
  windows-wpt:
    name: WPT
    runs-on: windows-2022
    env:
      max_chunk_id: 5
    strategy:
      fail-fast: false
      matrix:
        chunk_id: [1, 2, 3, 4, 5]
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.profile }}-binary-windows-zip
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Extract binary package
        shell: powershell
        run: |
          Expand-Archive -Path ServoShell.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path "target\${{ inputs.profile }}"
          Copy-Item -Recurse -Force "servo\*" "target\${{ inputs.profile }}\"
      - name: Smoketest
        run: .\mach smoketest --profile ${{ inputs.profile }}
      - name: Run tests
        shell: bash
        run: |
          mkdir -p wpt-filtered-logs/${{ env.NAME }}
          mkdir -p wpt-full-logs/${{ env.NAME }}
          ./mach test-wpt \
            --profile ${{ inputs.profile }} --processes 4 --timeout-multiplier 8 \
            --total-chunks ${{ env.max_chunk_id }} --this-chunk ${{ matrix.chunk_id }} \
            --log-raw wpt-full-logs/${{ env.NAME }}/${{ matrix.chunk_id }}.log \
            --log-raw-stable-unexpected wpt-filtered-logs/${{ env.NAME }}/${{ matrix.chunk_id }}.log \
            --filter-intermittents wpt-filtered-logs/${{ env.NAME }}/${{ matrix.chunk_id }}.json \
            ${{ inputs.wpt-args }}
      - name: Archive results (filtered)
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: wpt-filtered-logs-${{ env.NAME }}-${{ matrix.chunk_id }}
          path: wpt-filtered-logs/*/
          if-no-files-found: error
      - name: Archive results (full)
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: wpt-full-logs-${{ env.NAME }}-${{ matrix.chunk_id }}
          path: wpt-full-logs/*/
          if-no-files-found: error

  report-test-results:
    name: Process WPT Results
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: windows-wpt
    steps:
      - name: Merge logs (filtered)
        uses: actions/upload-artifact/merge@v7
        with:
          name: wpt-filtered-logs-${{ env.NAME }}
          pattern: wpt-filtered-logs-${{ env.NAME }}-*
          delete-merged: true
      - name: Merge logs (full)
        uses: actions/upload-artifact/merge@v7
        with:
          name: wpt-full-logs-${{ env.NAME }}
          pattern: wpt-full-logs-${{ env.NAME }}-*
          delete-merged: true
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
        if: ${{ !cancelled() }}
      - uses: actions/download-artifact@v8
        if: ${{ !cancelled() }}
        with:
          name: wpt-filtered-logs-${{ env.NAME }}
          path: results
      - name: Aggregate results
        if: ${{ !cancelled() }}
        run: |
          touch stable-unexpected-results.log
          cat results/${{ env.NAME }}/*.log > stable-unexpected-results.log || true
      - name: Upload aggregated results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: stable-unexpected-results-${{ env.NAME }}
          path: stable-unexpected-results.log
          if-no-files-found: error
